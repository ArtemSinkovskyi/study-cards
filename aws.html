 {"g":"Кешування","t":"API Gateway cache","lit":"","m":"Лише REST, на stage. TTL 300 с (макс 3600), кешує GET. Створення до 4 хв, платно щогодини, без Free Tier.","a":"Щоб різні query-параметри давали різні відповіді, їх треба додати в cache keys. Клієнт може скинути запис заголовком Cache-Control: max-age=0, але лише з правом execute-api:InvalidateCache.","tip":"","q":"Які параметри API Gateway cache?","d":"Кеш відповідей REST API на рівні стадії, за замовчуванням 300 с і лише для GET."},
 {"g":"Кешування","t":"RDS Proxy","lit":"","m":"Пул з'єднань: Lambda масштабується швидко, RDS має обмежені з'єднання. Вхід через IAM, дані в Secrets Manager.","a":"Для розвантаження читань додатково використовують read replicas.","tip":"","q":"Навіщо RDS Proxy?","d":"Керований пул з'єднань перед базою. Як HikariCP, але винесений в окремий сервіс, що спільно обслуговує багато Lambda.","ic":"🏊","cap":"Багато Lambda одночасно відкривають багато з'єднань і можуть перевантажити базу. RDS Proxy тримає спільний пул з'єднань і роздає їх."},
 {"g":"Кешування","t":"Вибір сховища","lit":"","m":"Файли: S3. Ключ-значення: DynamoDB. SQL: RDS/Aurora. Кеш: ElastiCache. Пошук: OpenSearch. SQL по S3: Athena. Спільна ФС: EFS. Диск: EBS.","a":"","tip":"","q":"Яке сховище обрати для файлів, ключ-значення, SQL, кешу, пошуку?"},
 {"g":"Потоки і Step Functions","t":"Kinesis шард","lit":"","m":"Запис 1 МБ/с або 1000 записів/с, читання 2 МБ/с. Запис до 10 МіБ. Retention 24 год - 365 днів.","a":"Помилка ProvisionedThroughputExceededException означає, що вичерпано потужність шарда: повторіть із паузами або додайте шарди (SplitShard).","tip":"","q":"Які ліміти має шард Kinesis?","d":"Шард це одиниця потужності Kinesis, як партиція в Kafka. Він має ліміти на запис і читання.","ex":"aws kinesis put-record --stream-name events \\\n  --partition-key user-42 --data \"aGVsbG8=\""},
 {"g":"Потоки і Step Functions","t":"Kinesis vs SQS","lit":"","m":"Kinesis: повторне читання, порядок у межах шарда, багато незалежних читачів. SQS: один споживач на повідомлення.","a":"Enhanced fan-out дає кожному споживачу власні 2 МБ/с на шард, а не спільні.","tip":"","q":"Чим Kinesis відрізняється від SQS?","d":"Kinesis це журнал, який кілька споживачів читають незалежно й можуть перечитати (як Kafka). SQS це черга, з якої повідомлення забирає й видаляє один споживач.","ic":"🌊📬","cap":"Kinesis це потік даних: записи зберігаються певний час, їх можуть читати кілька незалежних програм, і можна прочитати ще раз. SQS це черга завдань: повідомлення бере одна програма, і воно зникає."},
 {"g":"Потоки і Step Functions","t":"Kafka → Kinesis","lit":"","m":"topic: stream, partition: shard, key: partition key, offset: sequence number.","a":"Поганий partition key дає hot shard: усе йде в один шард.","tip":"","q":"Як терміни Kafka відповідають Kinesis?"},
 {"g":"Потоки і Step Functions","t":"Firehose","lit":"","m":"Доставка потоку в S3, Redshift, OpenSearch, Snowflake, Splunk, HTTP без коду. Буфер 1-128 МБ або 0-900 с.","a":"Firehose не дає перечитати потік. Lambda-трансформація має повернути для кожного запису recordId, result (Ok, Dropped, ProcessingFailed) і data в base64.","tip":"Логи в S3 без коду: Firehose.","q":"Що таке Firehose?","d":"Керована доставка потоку в сховище (S3, OpenSearch тощо) без коду, з буферизацією. Не зберігає потік для повторного читання."},
 {"g":"Потоки і Step Functions","t":"Athena","lit":"","m":"SQL по файлах у S3 без серверів, платите за просканований обсяг.","a":"Формат Parquet і партиції зменшують обсяг сканування, тож дешевше.","tip":"","q":"Що таке Athena?","d":"SQL-запити по файлах у S3 без своїх серверів. Платите за обсяг просканованого."},
 {"g":"Потоки і Step Functions","t":"Step Functions","lit":"","m":"Оркестратор: процес як машина станів (Amazon States Language). Retry і Catch роблять стійкість декларативною.","a":"Щоб оркеструвати кілька Lambda, беруть Step Functions, а не виклик Lambda з Lambda (платите за очікування).","tip":"","q":"Що таке Step Functions?","d":"Оркестратор: процес описується як машина станів (JSON), і сервіс веде кроки, повтори й помилки. Схоже на Spring Statemachine чи Spring Batch, тільки керований.","ex":"\"Retry\": [{\"ErrorEquals\": [\"States.TaskFailed\"], \"MaxAttempts\": 2, \"BackoffRate\": 2}],\n\"Catch\": [{\"ErrorEquals\": [\"States.ALL\"], \"Next\": \"NotifyFailure\"}]","ic":"🎼","cap":"Сервіс, у якому ви описуєте процес по кроках. Він сам запускає кроки по черзі, повторює невдалі й обробляє помилки."},
 {"g":"Потоки і Step Functions","t":"Standard vs Express","lit":"","m":"Standard: до 1 року, exactly-once, історія в консолі. Express: до 5 хв, at-least-once, дешевше, логи в CloudWatch.","a":"Для 100 000 коротких подій за секунду підходить Express.","tip":"","q":"Чим Standard відрізняється від Express у Step Functions?","d":"Два режими Step Functions. Standard для довгих процесів (до року) з історією, Express для великої кількості коротких (до 5 хв), дешевший."},
 {"g":"Потоки і Step Functions","t":"Стійкість","lit":"","m":"Retry з exponential backoff і jitter, circuit breaker, graceful degradation, DLQ, idempotency.","a":"Для ручного кроку (людське підтвердження) використовують .waitForTaskToken: процес чекає зовнішньої події.","tip":"","q":"Які прийоми підвищують стійкість?"},
 {"g":"Контейнери","t":"Task role vs execution role","lit":"","m":"Task role: права вашого коду (S3, DynamoDB). Execution role: права агента ECS (образ з ECR, логи, секрети для запуску).","a":"CannotPullContainerError означає проблему з execution role. AccessDenied у вашому коді означає проблему з task role.","tip":"","q":"Чим task role відрізняється від execution role в ECS?","d":"В ECS дві ролі: task role використовує ваш код (читати S3), execution role використовує агент ECS (тягнути образ, писати логи).","ex":"{\n  \"family\": \"video\",\n  \"taskRoleArn\": \"arn:aws:iam::111122223333:role/video-task\",\n  \"executionRoleArn\": \"arn:aws:iam::111122223333:role/ecsTaskExecutionRole\"\n}","ic":"🚚🧑‍🍳","cap":"В ECS ролей дві. Execution role потрібна самій платформі: завантажити образ і писати логи. Task role потрібна вашому коду, наприклад щоб читати S3."},
 {"g":"Контейнери","t":"ECS ієрархія","lit":"","m":"Cluster, service (desired count, ALB), task, контейнери з task definition.","a":"Fargate вимагає мережевий режим awsvpc.","tip":"","q":"З чого складається ECS?","d":"Cluster містить services, service тримає потрібну кількість tasks, task це запущені контейнери за task definition. Task definition схожий на service у docker-compose."},
 {"g":"Контейнери","t":"Fargate vs EC2","lit":"","m":"Fargate: без серверів, оплата за vCPU і пам'ять (мінімум 1 хв), своя VM на задачу. EC2: GPU, контроль.","a":"Lambda до 15 хв. Довші задачі чи спеціальні бінарники: ECS/Fargate.","tip":"","q":"Чим Fargate відрізняється від EC2?","d":"Два способи запустити контейнери в ECS. Fargate: без серверів, платите за ресурси задачі. EC2: ви керуєте інстансами."},
 {"g":"Контейнери","t":"ECR","lit":"","m":"Приватний реєстр образів: IAM, image scanning (Inspector), реплікація, lifecycle policy, tag immutability.","a":"У проді не використовують тег latest, а версію чи git SHA.","tip":"","q":"Що вміє ECR?","d":"Приватний реєстр образів AWS, як Docker Hub чи GHCR."},
 {"g":"Контейнери","t":"Деплой ECS","lit":"","m":"Rolling update за замовчуванням (minimumHealthyPercent, maximumPercent). Blue/green через CodeDeploy. Circuit breaker.","a":"Масштабування: target tracking за CPU, пам'яттю чи ALBRequestCountPerTarget (кількість запитів на ціль).","tip":"","q":"Як ECS розгортає нову версію і масштабується?"},
 {"g":"Контейнери","t":"EKS","lit":"","m":"Kubernetes: manifests, kubectl apply. IRSA / Pod Identity як task role для подів.","a":"EKS обирають, якщо вже є Kubernetes або потрібна портативність між хмарами.","tip":"","q":"Що таке EKS?","d":"Керований Kubernetes від AWS."},
 {"g":"CI/CD","t":"CodePipeline","lit":"","m":"Stages з actions, мінімум 2 stages, artifacts в S3, Release change, manual approval, transition можна вимкнути.","a":"Помилка в дії зупиняє весь pipeline. Про неї можна отримати сповіщення через EventBridge.","tip":"","q":"Як влаштований CodePipeline?","d":"Оркестратор CI/CD, що з'єднує етапи (source, build, deploy). Як pipeline в Jenkins."},
 {"g":"CI/CD","t":"buildspec.yml","lit":"","m":"У корені. Фази: install, pre_build, build, post_build. env: parameter-store, secrets-manager (маскуються), variables (не для секретів).","a":"Блок finally виконується, навіть якщо команда впала. Параметр on-failure приймає ABORT (зупинити), CONTINUE (продовжити), RETRY (повторити).","tip":"","q":"Що в buildspec.yml?","d":"Файл-рецепт збірки для CodeBuild: фази, змінні, артефакти. Як Jenkinsfile або крок збірки в Maven.","ex":"version: 0.2\nphases:\n  install:\n    commands: [npm ci]\n  build:\n    commands: [npm test, sam build]"},
 {"g":"CI/CD","t":"CodeDeploy: що деплоїть","lit":"","m":"EC2/on-premises, Lambda, ECS. Файл appspec.yml.","a":"На EC2 потрібен встановлений CodeDeploy agent.","tip":"","q":"Що деплоїть CodeDeploy і що потрібно на EC2?"},
 {"g":"CI/CD","t":"CodeDeploy hooks (Lambda)","lit":"","m":"BeforeAllowTraffic і AfterAllowTraffic: функції перевірки до і після зсуву трафіку (не звірено). У SAM це PreTraffic і PostTraffic.","a":"","tip":"","q":"Які hooks CodeDeploy для Lambda?"},
 {"g":"CI/CD","t":"CodeDeploy hooks (EC2)","lit":"","m":"ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, ValidateService (не звірено).","a":"","tip":"","q":"Які hooks CodeDeploy для EC2?"},
 {"g":"CI/CD","t":"Стратегії деплою","lit":"","m":"All at once (простій), Rolling, Rolling with extra batch, Immutable (швидкий відкат), Blue/Green (миттєвий), Canary, Linear.","a":"Canary разом із alarm дає автоматичний відкат, якщо нова версія почала видавати помилки.","tip":"","q":"Які є стратегії деплою?","d":"Способи викочувати нову версію: все одразу, частинами, нові інстанси, дві копії з перемиканням трафіку, canary (малий відсоток спочатку), linear (рівними кроками).","ic":"🐤⛏️","cap":"Canary означає, що нову версію спершу показують лише малій частині користувачів, наприклад 10%. Якщо все гаразд, переходять на всіх, а якщо ні, відкочуються. Назва з шахт: канарка першою відчувала небезпеку."},
 {"g":"CI/CD","t":"AppConfig","lit":"","m":"Feature flags і динамічна конфігурація без деплою. Поступове розгортання, відкат за CloudWatch alarm.","a":"Секрет, який треба ротувати: Secrets Manager. Просте значення: Parameter Store.","tip":"","q":"Що таке AppConfig?","d":"Сервіс для конфігурації та feature flags, яку змінюють без деплою коду, поступово і з відкатом за alarm. Схоже на Spring Cloud Config із refresh.","ic":"🎛️","cap":"Сервіс для налаштувань і перемикачів функцій (feature flags). Їх змінюють без нового деплою, поступово, і можна відкотити, якщо щось пішло не так."},
 {"g":"CI/CD","t":"CDK / CloudFormation / SAM","lit":"","m":"CloudFormation: стеки. SAM: скорочення для serverless. CDK: код, cdk synth/diff/deploy/bootstrap.","a":"Корисні поняття CloudFormation: change set (перегляд змін до застосування), drift detection (чи змінили ресурс вручну), функції !Ref, !GetAtt, !Sub.","tip":"","q":"Чим відрізняються CDK, CloudFormation і SAM?","d":"CloudFormation описує інфраструктуру в YAML/JSON. SAM це скорочений синтаксис для serverless. CDK дозволяє писати те саме на звичайній мові програмування."},
 {"g":"CI/CD","t":"CodeArtifact / Amplify / CloudShell","lit":"","m":"CodeArtifact: приватні npm, Maven, PyPI. Amplify: фронтенд, гілка це середовище. CloudShell: термінал у браузері.","a":"","tip":"","q":"Що таке CodeArtifact, Amplify і CloudShell?"},
 {"g":"SAM і CloudFormation","t":"Transform SAM","lit":"","m":"Transform: AWS::Serverless-2016-10-31 розгортає SAM у CloudFormation. Деплой: change set потім стек.","a":"Основні типи SAM: Function, Api, HttpApi, SimpleTable, LayerVersion, StateMachine, Application, Connector.","tip":"","q":"Що робить Transform у SAM?","d":"Рядок у шаблоні, який каже CloudFormation розгорнути скорочені типи SAM у звичайні ресурси."},
 {"g":"SAM і CloudFormation","t":"AutoPublishAlias і DeploymentPreference","lit":"","m":"AutoPublishAlias публікує версію й веде alias. DeploymentPreference зсуває трафік через CodeDeploy (Canary10Percent5Minutes, Linear10PercentEvery1Minute, AllAtOnce).","a":"Alarms дають автовідкат при спрацюванні. Hooks PreTraffic і PostTraffic це функції перевірки до й після зсуву трафіку.","tip":"","q":"Чим AutoPublishAlias відрізняється від DeploymentPreference?","d":"AutoPublishAlias при кожній зміні коду публікує версію функції й веде alias. DeploymentPreference каже, як поступово зсунути трафік на нову версію.","ex":"AutoPublishAlias: live\nDeploymentPreference:\n  Type: Canary10Percent5Minutes\n  Alarms:\n    - !Ref ErrorsAlarm"},
 {"g":"SAM і CloudFormation","t":"CAPABILITY_IAM","lit":"","m":"Явна згода на створення IAM-ресурсів. CAPABILITY_NAMED_IAM для іменованих ролей.","a":"Без цього прапорця CloudFormation відмовиться створювати IAM-ресурси.","tip":"","q":"Навіщо CAPABILITY_IAM?","d":"Прапорець, яким ви підтверджуєте, що шаблон створює IAM-ресурси. Без згоди CloudFormation відмовить."},
 {"g":"SAM і CloudFormation","t":"Change set без виконання","lit":"","m":"sam deploy --no-execute-changeset створює change set і показує зміни, але не виконує їх. Аналог terraform plan.","a":"Звичайний sam deploy теж сам створює change set і питає підтвердження.","tip":"","q":"Як у SAM побачити зміни без виконання?","ex":"sam deploy --stack-name app --no-execute-changeset"},
 {"g":"SAM і CloudFormation","t":"Edge-optimized REST API","lit":"","m":"Типовий тип REST API (EDGE): вбудований CloudFront, керований AWS. Типи: EDGE, REGIONAL, PRIVATE.","a":"Щоб мати власний CloudFront, роблять API REGIONAL і ставлять свій розподіл. Сертифікат для нього в us-east-1.","tip":"","q":"Який тип endpoint у REST API за замовчуванням?"},
 {"g":"SAM і CloudFormation","t":"Циклічна залежність","lit":"","m":"Функція посилається на alarm, alarm на функцію: !Ref створює цикл. Ім'я функції задають рядком.","a":"","tip":"","q":"Чому ім'я функції в alarm задають рядком?"},
 {"g":"SAM і CloudFormation","t":"Тригер на alias","lit":"","m":"SAM вішає правило EventBridge і дозвіл на alias, а не на $LATEST. Тригер на $LATEST обходив би canary.","a":"Команда get-policy без вказання alias (qualifier) поверне ResourceNotFoundException, бо політика висить на alias, а не на функції.","tip":"","q":"Чому тригер SAM висить на alias?"},
 {"g":"CI, OIDC, секрети","t":"OIDC для CI","lit":"","m":"id-token: write, configure-aws-credentials, AssumeRoleWithWebIdentity. Тимчасові ключі, довгих ключів нема.","a":"У trust policy задають aud = sts.amazonaws.com і sub = repo:ORG/REPO:ref:refs/heads/main (лише цей репозиторій і гілка).","tip":"","q":"Як налаштувати OIDC для CI?","d":"GitHub видає короткоживучий токен, AWS обмінює його на тимчасові ключі ролі. Довгих ключів у CI немає.","ex":"permissions:\n  id-token: write\n\n- uses: aws-actions/configure-aws-credentials@v4\n  with:\n    role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}","ic":"🎫","cap":"Замість збереженого пароля GitHub видає короткочасний токен. AWS перевіряє його й дає тимчасові ключі, тож довгих секретів у CI нема."},
 {"g":"CI, OIDC, секрети","t":"Умова на sub","lit":"","m":"Без неї будь-який репозиторій GitHub міг би взяти роль. sub змінюється для tag, pull_request, environment.","a":"Якщо в репозиторії ввімкнено імутабельний sub, він містить числові ID, і звичайна форма не збігається. Тоді помилка: Not authorized to perform sts:AssumeRoleWithWebIdentity.","tip":"","q":"Навіщо умова на sub у trust policy?","d":"sub це поле токена, що каже, який репозиторій і гілка просять роль. Умова в trust policy дозволяє лише потрібний.","ex":"\"Condition\": {\n  \"StringEquals\": {\n    \"token.actions.githubusercontent.com:aud\": \"sts.amazonaws.com\",\n    \"token.actions.githubusercontent.com:sub\": \"repo:ORG/REPO:ref:refs/heads/main\"\n  }\n}","ic":"🪪","cap":"У правилі довіри ви вказуєте, який саме репозиторій і гілка можуть брати роль. Без цього її міг би взяти будь-який репозиторій на GitHub."},
 {"g":"CI, OIDC, секрети","t":"Що в CI секрет, а що ні","lit":"","m":"Не секрет: ARN ролі, назва бакета, ID акаунта, регіон. Вони самі нічого не дають: роль можна взяти лише з токеном, що проходить trust policy. Секрет: пароль, API-токен, access key, бо хто їх побачить, отримає доступ.","a":"Тест: уявіть значення в публічному репозиторії. Якщо наслідок нульовий, це змінна (Variable), а не Secret.","tip":"З OIDC у CI секретів AWS немає взагалі.","q":"Що в CI секрет, а що ні?"},
 {"g":"CI, OIDC, секрети","t":"GitHub Variable vs Secret","lit":"","m":"Variable: видно, vars.NAME. Secret: зашифрований, маскується *** (лише точний збіг), не передається у fork-PR.","a":"Значення можна задати на рівні environment, repository чи organization. Діє найвужчий рівень.","tip":"","q":"Чим GitHub Variable відрізняється від Secret?"},
 {"g":"CI, OIDC, секрети","t":"Секрет у змінній Lambda","lit":"","m":"KMS-шифрування захищає на диску, але користувач із lambda:GetFunctionConfiguration бачить значення.","a":"Краще Secrets Manager чи SecureString: читайте їх в Init і кешуйте.","tip":"","q":"Чому секрет у змінній Lambda небезпечний?","ex":"secret = secrets.get_secret_value(SecretId=\"prod/db\")[\"SecretString\"]"},
 {"g":"CI, OIDC, секрети","t":"dry_run","lit":"","m":"Створює лише change set і не перевіряє права на створення ресурсів: AccessDenied може вилізти на справжньому деплої (ROLLBACK_COMPLETE).","a":"Причину провалу шукають командою describe-stack-events з фільтром FAILED. Стек у стані ROLLBACK_COMPLETE оновити не можна, його лише видаляють.","tip":"","q":"Чому dry_run не гарантує успішного деплою?"},
 {"g":"CI, OIDC, секрети","t":"Dynamic references","lit":"","m":"{{resolve:ssm:...}} і {{resolve:secretsmanager:id:SecretString:key}}: значення підставляється під час деплою.","a":"Значення потрапляє в конфігурацію ресурсу, тож його видно тому, хто може читати цю конфігурацію.","tip":"","q":"Що таке dynamic references у CloudFormation?","d":"Синтаксис у шаблоні CloudFormation, що підставляє значення з Parameter Store чи Secrets Manager під час деплою.","ex":"DbPassword: \"{{resolve:secretsmanager:prod/db:SecretString:password}}\""},
 {"g":"CloudWatch і CloudTrail","t":"Метрики Lambda","lit":"","m":"Invocations, Errors, Throttles, Duration, ConcurrentExecutions, AsyncEventAge, IteratorAge, DeadLetterErrors.","a":"Throttles не входять в Errors. Метрик пам'яті нема: використання пам'яті дивіться в рядку REPORT логу.","tip":"","q":"Які метрики дає Lambda?","d":"Метрики, які Lambda публікує сама в CloudWatch. Аналог метрик Micrometer, які Spring Boot Actuator віддає в Prometheus."},
 {"g":"CloudWatch і CloudTrail","t":"Стани alarm","lit":"","m":"OK, ALARM, INSUFFICIENT_DATA. TreatMissingData: breaching, notBreaching, ignore, missing.","a":"Для рідких подій ставлять notBreaching. Один alarm стежить лише за однією метрикою.","tip":"","q":"Які стани має alarm і що таке TreatMissingData?","d":"Alarm CloudWatch стежить за метрикою й має три стани. TreatMissingData каже, що вважати за відсутності даних.","ex":"aws cloudwatch put-metric-alarm --alarm-name errors \\\n  --namespace AWS/Lambda --metric-name Errors \\\n  --dimensions Name=FunctionName,Value=my-func \\\n  --statistic Sum --period 60 --evaluation-periods 1 \\\n  --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \\\n  --treat-missing-data notBreaching"},
 {"g":"CloudWatch і CloudTrail","t":"Alarm не листує","lit":"","m":"Підписка SNS не підтверджена (PendingConfirmation), нема AlarmActions або топік під alias/aws/sns.","a":"Перевірити ланцюг alarm → SNS → пошта можна командою set-alarm-state, яка примусово ставить стан.","tip":"","q":"Чому alarm у ALARM не надсилає листа?"},
 {"g":"CloudWatch і CloudTrail","t":"Ціни CloudWatch","lit":"","m":"Перші 10 стандартних alarm безкоштовно (рахується кількість). Дашборди 3 безкоштовно. Логи 5 ГБ. Власні метрики 10 безкоштовно.","a":"Alarm з високою роздільністю коштує 0,30 USD, composite 0,50 USD на місяць (понад безкоштовні).","tip":"","q":"Що з CloudWatch безкоштовне?"},
 {"g":"CloudWatch і CloudTrail","t":"Retention логів","lit":"","m":"Лог-групи, які AWS створює сам, мають Never expire. Видалення після retention до 72 годин.","a":"Описуйте лог-групу в шаблоні й задавайте retention, інакше логи зберігатимуться вічно.","tip":"","q":"Яке retention у лог-груп Lambda?"},
 {"g":"CloudWatch і CloudTrail","t":"Зберігання метрик","lit":"","m":"Менше 60 с: 3 години. 1 хв: 15 днів. 5 хв: 63 дні. 1 год: 455 днів.","a":"Метрики з роздільністю до 1 с (StorageResolution=1) називають high-resolution.","tip":"3 год / 15 / 63 / 455.","q":"Як довго зберігаються метрики CloudWatch?"},
 {"g":"CloudWatch і CloudTrail","t":"Logs Insights / metric filter / subscription filter","lit":"","m":"Insights: запити над логами. Metric filter: патерн у логах як метрика. Subscription filter: пересилає логи в Kinesis, Firehose, Lambda.","a":"","tip":"","q":"Чим Logs Insights, metric filter і subscription filter відрізняються?","d":"Три інструменти над логами. Insights це запити (як Kibana), metric filter робить метрику з патерну, subscription filter пересилає логи далі."},
 {"g":"CloudWatch і CloudTrail","t":"CloudTrail","lit":"","m":"Хто викликав API. Event history 90 днів безкоштовно. Trail: перша копія management-подій безкоштовно. Data events платні й вимкнені.","a":"Щоб зберігати довше за 90 днів, створюють trail. Для запитів до журналу використовують Athena чи CloudTrail Lake.","tip":"CloudWatch як працює, CloudTrail хто.","q":"Що показує CloudTrail?","d":"Журнал аудиту: кожен виклик API акаунта (хто, що, коли). Не про продуктивність, а про дії.","ic":"📹","cap":"CloudTrail записує, хто і що робив в акаунті (виклики API). CloudWatch показує, як працює система (метрики й логи). Це різні питання."},
 {"g":"CloudWatch і CloudTrail","t":"EC2 метрики","lit":"","m":"За замовчуванням раз на 5 хв (detailed monitoring раз на хвилину, платно). Пам'ять і диск лише через CloudWatch Agent.","a":"","tip":"","q":"Як часто EC2 шле метрики і чого немає без агента?"},
 {"g":"X-Ray","t":"Annotations vs metadata","lit":"","m":"Annotations індексовані: пошук (до 50 на трейс). Metadata не індексовані: будь-які об'єкти.","a":"Щоб знайти трейси конкретного користувача, треба annotation, бо лише вони індексуються.","tip":"","q":"Чим annotations відрізняються від metadata в X-Ray?","d":"Обидва додатковий контекст у трейсі X-Ray. Annotations індексуються, тому за ними шукають. Metadata ні, це для довільних даних. Схоже на tags проти baggage в Zipkin/Sleuth.","ex":"tracer.put_annotation(key=\"userId\", value=\"u42\")\ntracer.put_metadata(key=\"payload\", value=body)","ic":"🏷️📝","cap":"Обидва додають дані до запису трасування. Annotation індексується, тому за нею можна шукати. Metadata не індексується, це просто додаткові дані."},
 {"g":"X-Ray","t":"Sampling X-Ray","lit":"","m":"За замовчуванням перший запит кожної секунди плюс 5% решти. Правила можна змінити.","a":"Дані X-Ray зберігаються 30 днів, один сегмент до 64 КБ.","tip":"","q":"Яка в X-Ray вибірка (sampling) за замовчуванням?","d":"X-Ray трейсить не кожен запит, а вибірку, щоб не платити за все.","ic":"🧳","cap":"X-Ray фіксує не всі запити, а вибірку, щоб це не коштувало надто дорого. За замовчуванням перший запит кожної секунди й 5% решти."},
 {"g":"X-Ray","t":"Увімкнення X-Ray","lit":"","m":"Lambda: Tracing Active і xray:PutTraceSegments, PutTelemetryRecords. API Gateway: лише REST. EC2 і контейнери: daemon на UDP 2000 або ADOT.","a":"Заголовок X-Amzn-Trace-Id передає контекст трейсу між сервісами.","tip":"","q":"Як увімкнути X-Ray для Lambda, API Gateway, EC2?","ex":"MyFunction:\n  Type: AWS::Serverless::Function\n  Properties:\n    Tracing: Active"},
 {"g":"X-Ray","t":"Error / Fault / Throttle","lit":"","m":"Error: 4xx. Fault: 5xx. Throttle: 429.","a":"Inferred segment це вузол сервісу (наприклад DynamoDB), який сам не шле даних, але X-Ray виводить його з викликів.","tip":"","q":"Що означають Error, Fault, Throttle в X-Ray?"},
 {"g":"X-Ray","t":"Liveness vs readiness","lit":"","m":"Liveness: процес живий (ні: перезапустити). Readiness: готовий приймати трафік (ні: не слати трафік, але не вбивати).","a":"ALB health check виводить поганий target, ECS замінює task, Route 53 health check перемикає DNS.","tip":"","q":"Чим liveness відрізняється від readiness?","d":"Liveness: чи живий процес (ні, значить перезапустити). Readiness: чи готовий приймати трафік (ні, значить не слати трафік). Як /actuator/health/liveness і /readiness.","ic":"🫀🚦","cap":"Liveness: чи програма жива. Якщо ні, її перезапускають. Readiness: чи готова приймати запити. Якщо ні, їй тимчасово не шлють трафік, але не вбивають."},
 {"g":"CloudWatch і CloudTrail","t":"Dimensions","lit":"","m":"Кожна нова комбінація dimensions це нова метрика.","a":"Не кладіть у dimension змінні значення на кшталт userId: вийдуть тисячі метрик і великий рахунок.","tip":"","q":"Чому не можна класти userId у dimension?","d":"Dimensions це мітки метрики CloudWatch (як tags у Micrometer). Кожна унікальна комбінація стає окремою метрикою."},
 {"g":"X-Ray","t":"Куди дивитись при проблемі","lit":"","m":"Що впало: логи. Скільки: метрики. Де затримка: X-Ray. Хто зробив виклик API: CloudTrail. Деплой не пройшов: CloudFormation events, CodeDeploy.","a":"","tip":"","q":"Який інструмент для якої проблеми: що впало, скільки, де затримка, хто?"},
 {"g":"Різне (лекція 22)","t":"Серіалізація","lit":"","m":"API Gateway proxy: body рядок. Kinesis data в base64. DynamoDB низького рівня з типами {S}, {N}. SQS Body рядок. S3 Body потік.","a":"Бінарні дані в JSON передають через base64, це збільшує розмір приблизно на третину.","tip":"","q":"Як серіалізуються дані в Lambda, API Gateway, Kinesis, DynamoDB, SQS, S3?","d":"Сервіси AWS обмінюються текстом і байтами, тому дані перетворюють на вході й виході. Як Jackson: об'єкт у JSON і назад.","ex":"payload = base64.b64decode(record[\"kinesis\"][\"data\"]).decode()"},
 {"g":"Різне (лекція 22)","t":"Beanstalk: політики деплою","lit":"","m":"All at once (простій, найшвидше), Rolling, Rolling with additional batch (без втрати потужності), Immutable (найбезпечніше), Traffic splitting (canary), Blue/green (swap URL, зміна DNS).","a":"Несумісна нова версія: Blue/green (нове середовище, а потім обмін адресами).","tip":"","q":"Яку політику деплою Beanstalk обрати за вимогою?"},
 {"g":"Різне (лекція 22)","t":"Auto Scaling group","lit":"","m":"Охоплює кілька AZ, не регіони. Політики: target tracking, step, scheduled, predictive. Замінює інстанс без health check.","a":"","tip":"","q":"Що таке Auto Scaling group?","d":"Група EC2-інстансів, якою керують разом: сама додає й прибирає за навантаженням і замінює нездорові."},
 {"g":"Різне (лекція 22)","t":"Multi-AZ vs read replica","lit":"","m":"Multi-AZ: доступність (синхронний резерв). Read replica: масштабування читань, асинхронна. Aurora до 15 реплік.","a":"","tip":"","q":"Чим Multi-AZ відрізняється від read replica?","d":"Multi-AZ це резервна копія бази в іншій зоні для відмовостійкості. Read replica це копія для розвантаження читань.","ic":"🛟👯","cap":"Multi-AZ це запасна копія бази в іншій зоні, на випадок збою. Read replica це копія, з якої читають, щоб розвантажити основну базу."},
 {"g":"Різне (лекція 22)","t":"EBS / EFS / S3","lit":"","m":"EBS: блочний диск одного EC2. EFS: NFS для багатьох EC2, контейнерів, Lambda. S3: об'єкти по HTTP.","a":"","tip":"","q":"Чим відрізняються EBS, EFS і S3?","d":"Три види сховища. EBS це диск одного EC2, EFS це спільна мережева файлова система, S3 це об'єкти по HTTP."},
 {"g":"Різне (лекція 22)","t":"Приватний доступ до сервісів","lit":"","m":"S3 і DynamoDB: gateway endpoint. Інші сервіси (наприклад Bedrock): interface endpoint (PrivateLink).","a":"","tip":"","q":"Як приватно звертатися до S3, DynamoDB та інших сервісів?"},
 {"g":"Різне (лекція 22)","t":"ALB / NLB / Route 53 / WAF","lit":"","m":"ALB: L7, шляхи. NLB: L4, TCP, статичний IP. Route 53: DNS. WAF: SQL injection і XSS на CloudFront, ALB, API Gateway, AppSync.","a":"Rate-based rule у WAF обмежує кількість запитів з однієї IP за 5 хв. Shield поза іспитом.","tip":"","q":"Що таке ALB, NLB, Route 53 і WAF?"},
 {"g":"Різне (лекція 22)","t":"Нове в C03","lit":"","m":"Завдання 2.3 про AI-безпеку, AI-навички, presigned URL, образи контейнерів, деплой контейнерів. Вага Troubleshooting 22%.","a":"Ваги доменів: Development 30%, Security 26%, Deployment 22%, Troubleshooting 22%.","tip":"","q":"Що нового в C03 і які ваги доменів?"}
];

const KEY = "aws_cards_v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
if (!store.streak) store.streak = {};
let mode = 1, group = "all", flipped = false, queue = [], cur = null;

function save() { localStorage.setItem(KEY, JSON.stringify(store)); }
function key(c) { return c.g + "|" + c.t; }
function streak(c) { return store.streak[key(c)] || 0; }
function pool() { return CARDS.filter(c => group === "all" || c.g === group); }
function mastered(c) { return streak(c) >= 2; }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rebuild() { queue = shuffle(pool().filter(c => !mastered(c))); next(); }
function next() { cur = queue.length ? queue.shift() : null; flipped = false; render(); }

function setup() {
  const sel = document.getElementById("group");
  const groups = ["all"].concat([...new Set(CARDS.map(c => c.g))]);
  sel.innerHTML = groups.map(g => "<option value='" + g + "'>" + (g === "all" ? "Усі групи" : gi(g)) + "</option>").join("");
  sel.onchange = () => { group = sel.value; rebuild(); };
  document.getElementById("m1").onclick = () => setMode(1);
  document.getElementById("m2").onclick = () => setMode(2);
}
function setMode(m) {
  mode = m;
  document.getElementById("m1").classList.toggle("on", m === 1);
  document.getElementById("m2").classList.toggle("on", m === 2);
  flipped = false; render();
}

function progress() {
  const p = pool(), n = p.filter(mastered).length;
  document.getElementById("fill").style.width = (100 * n / p.length) + "%";
  document.getElementById("st").textContent = "Вивчено " + n + " з " + p.length + " · у черзі " + queue.length + (cur ? " +1" : "") + ". Картка вивчена, коли ви двічі поспіль відповіли «Знаю».";
}

function esc(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function refs(c) {
  const text = [c.t, c.q, c.d, c.m, c.a, c.ex, c.cap].filter(Boolean).join(" ");
  const found = GLOSSARY.filter(g => new RegExp(g[0]).test(text)).slice(0, 6);
  if (!found.length) return "";
  return "<div class='refs'><b>🔗 Що це за слова</b><ul>" + found.map(g => "<li><b>" + g[1] + "</b>: " + g[2] + " <a href='" + g[3] + "' target='_blank' rel='noopener'>документація</a></li>").join("") + "</ul></div>";
}

function body(c) {
  return (c.ic ? "<div class='pic'><span class='big'>" + c.ic + "</span><span class='cap'>" + c.cap + "</span></div>" : "") + (c.d ? "<p class='def'><b>Що це:</b> " + c.d + "</p>" : "") + "<p><b>Відповідь:</b> " + c.m + "</p>" + (c.a ? "<p><b>Ще для іспиту:</b> " + c.a + "</p>" : "") + (c.ex ? "<pre class='ex'>" + esc(c.ex) + "</pre>" : "") + refs(c);
}

function render() {
  const app = document.getElementById("app");
  progress();
  if (!cur) {
    app.innerHTML = "<div class='done'><h2>Усі картки цієї групи вивчено</h2><p>Можна обрати іншу групу або почати спочатку.</p><div class='btns'><button class='small' id='again'>Скинути прогрес групи</button></div></div>";
    document.getElementById("again").onclick = () => { pool().forEach(c => delete store.streak[key(c)]); save(); rebuild(); };
    return;
  }
  let html = "";
  if (!flipped) {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    if (mode === 1) html += "<div class='term q'>" + (cur.q || cur.t) + "</div><div class='hint'>Згадайте відповідь, потім клацніть, щоб перевернути.</div>";
    else html += "<div class='back'>" + body(cur) + "</div><div class='hint'>Яке питання це відповідає? Клацніть, щоб перевернути.</div>";
    html += "</div>";
  } else {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    html += "<div class='term q'>" + (cur.q || cur.t) + "</div>";
    html += "<div class='back'>" + (cur.lit ? "<div class='lit'>Дослівно: " + cur.lit + "</div>" : "") + body(cur);
    if (cur.tip) html += "<div class='tip'>Щоб запам'ятати: " + cur.tip + "</div>";
    html += "</div></div>";
    html += "<div class='btns'><button class='no' id='no'>Ще ні</button><button class='know' id='yes'>Знаю</button></div>";
  }
  app.innerHTML = html;
  document.getElementById("card").onclick = () => { if (!flipped) { flipped = true; render(); } };
  if (flipped) {
    document.getElementById("yes").onclick = () => { store.streak[key(cur)] = streak(cur) + 1; save(); if (!mastered(cur)) queue.push(cur); next(); };
    document.getElementById("no").onclick = () => { store.streak[key(cur)] = 0; save(); queue.splice(Math.min(3, queue.length), 0, cur); next(); };
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (cur && !flipped) { flipped = true; render(); } }
  else if (flipped && e.key === "ArrowRight") document.getElementById("yes").click();
  else if (flipped && e.key === "ArrowLeft") document.getElementById("no").click();
});

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#ffffff");
  tg.setBackgroundColor("#f7f5f0");
  const back = tg.BackButton;
  back.show();
  back.onClick(() => { location.href = "index.html"; });
}

setup();
rebuild();
</script>
</body>
