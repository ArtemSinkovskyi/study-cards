 {"g":"Кешування","t":"Lazy loading vs write-through","lit":"","m":"Lazy loading: заповнення при першому читанні, у кеші лише потрібне. Write-through: заповнення при записі, дані свіжі.","a":"Якщо кеш віддає застаріле, обирають write-through або коротший TTL. Типова пара: lazy loading плюс TTL.","tip":"","q":"Чим lazy loading відрізняється від write-through?","d":"Дві стратегії наповнення кешу. Lazy: кладемо при першому промаху, як @Cacheable. Write-through: пишемо в кеш одночасно з базою.","ex":"@Cacheable(\"users\")\npublic User find(String id) {\n    return repository.findById(id);\n}","ic":"🧠","cap":"Lazy loading: кладемо в кеш лише тоді, коли дані вперше запросили. Write-through: оновлюємо кеш одразу при кожному записі в базу.","why":"Щоб кешувати лише те, що справді запитували, і не тримати зайвого."},
 {"g":"Кешування","t":"DAX","lit":"","m":"Кеш в пам'яті для DynamoDB, мікросекунди, у VPC, мінімальні зміни коду. Добрий для гарячих ключів, hit rate більше 90%.","a":"Не допоможе, якщо потрібні strongly consistent читання, багато записів або мало повторних читань.","tip":"","q":"Що таке DAX і де він не допоможе?","d":"DynamoDB Accelerator: кеш в пам'яті з тим самим API, що в DynamoDB. Стоїть перед таблицею, як кеш над репозиторієм.","ic":"📝🗄️","cap":"Це кеш прямо перед DynamoDB з тим самим API. Повторні читання віддаються з пам'яті набагато швидше.","why":"Щоб читання з DynamoDB стали мікросекундними без переписування коду."},
 {"g":"Кешування","t":"DAX vs ElastiCache","lit":"","m":"DAX лише для DynamoDB, без коду кешування. ElastiCache для решти (сесії, RDS, складні обчислення), логіку пишете самі.","a":"","tip":"","q":"Чим DAX відрізняється від ElastiCache?"},
 {"g":"Кешування","t":"Redis/Valkey vs Memcached","lit":"","m":"Redis/Valkey: до 5 реплік, Multi-AZ, персистентність, sorted sets, pub/sub. Memcached: простий розподілений кеш без реплікації.","a":"Якщо потрібна відмовостійкість або рейтинги (sorted sets), беруть Redis/Valkey.","tip":"","q":"Чим Redis/Valkey відрізняється від Memcached?","d":"Обидва це кеш у пам'яті. Redis/Valkey багатший (структури даних, реплікація, персистентність). Memcached простіший, лише ключ-значення."},
 {"g":"Кешування","t":"CloudFront cache key","lit":"","m":"За замовчуванням домен і шлях. Додавання заголовків, cookie, query знижує hit ratio.","a":"Cache policy задає ключ кешу й TTL. Origin request policy передає дані на origin, не додаючи їх до ключа.","tip":"","q":"Що входить у cache key CloudFront?","d":"Те, за чим CloudFront вирішує, чи це той самий запис кешу (домен, шлях і, за налаштуванням, заголовки/query). Як ключ у @Cacheable."},
 {"g":"Кешування","t":"CloudFront signed URL vs cookie","lit":"","m":"Signed URL: один файл. Signed cookies: багато файлів (розділ сайту). S3 presigned: напряму в S3, не через кеш.","a":"Invalidation кешу після певного ліміту платна, тому краще давати файлам нові імена при зміні (версіоновані).","tip":"","q":"Чим CloudFront signed URL відрізняється від signed cookie?"},
 {"g":"Кешування","t":"API Gateway cache","lit":"","m":"Лише REST, на stage. TTL 300 с (макс 3600), кешує GET. Створення до 4 хв, платно щогодини, без Free Tier.","a":"Щоб різні query-параметри давали різні відповіді, їх треба додати в cache keys. Клієнт може скинути запис заголовком Cache-Control: max-age=0, але лише з правом execute-api:InvalidateCache.","tip":"","q":"Які параметри API Gateway cache?","d":"Кеш відповідей REST API на рівні стадії, за замовчуванням 300 с і лише для GET."},
 {"g":"Кешування","t":"RDS Proxy","lit":"","m":"Пул з'єднань: Lambda масштабується швидко, RDS має обмежені з'єднання. Вхід через IAM, дані в Secrets Manager.","a":"Для розвантаження читань додатково використовують read replicas.","tip":"","q":"Навіщо RDS Proxy?","d":"Керований пул з'єднань перед базою. Як HikariCP, але винесений в окремий сервіс, що спільно обслуговує багато Lambda.","ic":"🏊","cap":"Багато Lambda одночасно відкривають багато з'єднань і можуть перевантажити базу. RDS Proxy тримає спільний пул з'єднань і роздає їх.","why":"Lambda відкриває багато з'єднань одразу, а база витримує їх мало, тому потрібен спільний пул."},
 {"g":"Кешування","t":"Вибір сховища","lit":"","m":"Файли: S3. Ключ-значення: DynamoDB. SQL: RDS/Aurora. Кеш: ElastiCache. Пошук: OpenSearch. SQL по S3: Athena. Спільна ФС: EFS. Диск: EBS.","a":"","tip":"","q":"Яке сховище обрати для файлів, ключ-значення, SQL, кешу, пошуку?"},
 {"g":"Потоки і Step Functions","t":"Kinesis шард","lit":"","m":"Запис 1 МБ/с або 1000 записів/с, читання 2 МБ/с. Запис до 10 МіБ. Retention 24 год - 365 днів.","a":"Помилка ProvisionedThroughputExceededException означає, що вичерпано потужність шарда: повторіть із паузами або додайте шарди (SplitShard).","tip":"","q":"Які ліміти має шард Kinesis?","d":"Шард це одиниця потужності Kinesis, як партиція в Kafka. Він має ліміти на запис і читання.","ex":"aws kinesis put-record --stream-name events \\\n  --partition-key user-42 --data \"aGVsbG8=\""},
 {"g":"Потоки і Step Functions","t":"Kinesis vs SQS","lit":"","m":"Kinesis: повторне читання, порядок у межах шарда, багато незалежних читачів. SQS: один споживач на повідомлення.","a":"Enhanced fan-out дає кожному споживачу власні 2 МБ/с на шард, а не спільні.","tip":"","q":"Чим Kinesis відрізняється від SQS?","d":"Kinesis це журнал, який кілька споживачів читають незалежно й можуть перечитати (як Kafka). SQS це черга, з якої повідомлення забирає й видаляє один споживач.","ic":"🌊📬","cap":"Kinesis це потік даних: записи зберігаються певний час, їх можуть читати кілька незалежних програм, і можна прочитати ще раз. SQS це черга завдань: повідомлення бере одна програма, і воно зникає.","why":"Потік зберігає дані, щоб кілька програм читали його незалежно й могли перечитати. Черга віддає повідомлення одному споживачу."},
 {"g":"Потоки і Step Functions","t":"Kafka → Kinesis","lit":"","m":"topic: stream, partition: shard, key: partition key, offset: sequence number.","a":"Поганий partition key дає hot shard: усе йде в один шард.","tip":"","q":"Як терміни Kafka відповідають Kinesis?"},
 {"g":"Потоки і Step Functions","t":"Firehose","lit":"","m":"Доставка потоку в S3, Redshift, OpenSearch, Snowflake, Splunk, HTTP без коду. Буфер 1-128 МБ або 0-900 с.","a":"Firehose не дає перечитати потік. Lambda-трансформація має повернути для кожного запису recordId, result (Ok, Dropped, ProcessingFailed) і data в base64.","tip":"Логи в S3 без коду: Firehose.","q":"Що таке Firehose?","d":"Керована доставка потоку в сховище (S3, OpenSearch тощо) без коду, з буферизацією. Не зберігає потік для повторного читання."},
 {"g":"Потоки і Step Functions","t":"Athena","lit":"","m":"SQL по файлах у S3 без серверів, платите за просканований обсяг.","a":"Формат Parquet і партиції зменшують обсяг сканування, тож дешевше.","tip":"","q":"Що таке Athena?","d":"SQL-запити по файлах у S3 без своїх серверів. Платите за обсяг просканованого."},
 {"g":"Потоки і Step Functions","t":"Step Functions","lit":"","m":"Оркестратор: процес як машина станів (Amazon States Language). Retry і Catch роблять стійкість декларативною.","a":"Щоб оркеструвати кілька Lambda, беруть Step Functions, а не виклик Lambda з Lambda (платите за очікування).","tip":"","q":"Що таке Step Functions?","d":"Оркестратор: процес описується як машина станів (JSON), і сервіс веде кроки, повтори й помилки. Схоже на Spring Statemachine чи Spring Batch, тільки керований.","ex":"\"Retry\": [{\"ErrorEquals\": [\"States.TaskFailed\"], \"MaxAttempts\": 2, \"BackoffRate\": 2}],\n\"Catch\": [{\"ErrorEquals\": [\"States.ALL\"], \"Next\": \"NotifyFailure\"}]","ic":"🎼","cap":"Сервіс, у якому ви описуєте процес по кроках. Він сам запускає кроки по черзі, повторює невдалі й обробляє помилки.","why":"Щоб кроки, повтори й помилки були описані й видимі в одному місці, а не розкидані по коду."},
 {"g":"Потоки і Step Functions","t":"Standard vs Express","lit":"","m":"Standard: до 1 року, exactly-once, історія в консолі. Express: до 5 хв, дешевше, логи в CloudWatch; асинхронний Express at-least-once, синхронний at-most-once.","a":"Для 100 000 коротких подій за секунду підходить Express.","tip":"","q":"Чим Standard відрізняється від Express у Step Functions?","d":"Два режими Step Functions. Standard для довгих процесів (до року) з історією, Express для великої кількості коротких (до 5 хв), дешевший."},
 {"g":"Потоки і Step Functions","t":"Стійкість","lit":"","m":"Retry з exponential backoff і jitter, circuit breaker, graceful degradation, DLQ, idempotency.","a":"Для ручного кроку (людське підтвердження) використовують .waitForTaskToken: процес чекає зовнішньої події.","tip":"","q":"Які прийоми підвищують стійкість?"},
 {"g":"Контейнери","t":"Task role vs execution role","lit":"","m":"Task role: права вашого коду (S3, DynamoDB). Execution role: права агента ECS (образ з ECR, логи, секрети для запуску).","a":"CannotPullContainerError означає проблему з execution role. AccessDenied у вашому коді означає проблему з task role.","tip":"","q":"Чим task role відрізняється від execution role в ECS?","d":"В ECS дві ролі: task role використовує ваш код (читати S3), execution role використовує агент ECS (тягнути образ, писати логи).","ex":"{\n  \"family\": \"video\",\n  \"taskRoleArn\": \"arn:aws:iam::111122223333:role/video-task\",\n  \"executionRoleArn\": \"arn:aws:iam::111122223333:role/ecsTaskExecutionRole\"\n}","ic":"🚚🧑‍🍳","cap":"В ECS ролей дві. Execution role потрібна самій платформі: завантажити образ і писати логи. Task role потрібна вашому коду, наприклад щоб читати S3.","why":"Платформа й ваш код мають різні права, тому їх розділили."},
 {"g":"Контейнери","t":"ECS ієрархія","lit":"","m":"Cluster, service (desired count, ALB), task, контейнери з task definition.","a":"Fargate вимагає мережевий режим awsvpc.","tip":"","q":"З чого складається ECS?","d":"Cluster містить services, service тримає потрібну кількість tasks, task це запущені контейнери за task definition. Task definition схожий на service у docker-compose."},
 {"g":"Контейнери","t":"Fargate vs EC2","lit":"","m":"Fargate: без серверів, оплата за vCPU і пам'ять (мінімум 1 хв), своя VM на задачу. EC2: GPU, контроль.","a":"Lambda до 15 хв. Довші задачі чи спеціальні бінарники: ECS/Fargate.","tip":"","q":"Чим Fargate відрізняється від EC2?","d":"Два способи запустити контейнери в ECS. Fargate: без серверів, платите за ресурси задачі. EC2: ви керуєте інстансами."},
 {"g":"Контейнери","t":"ECR","lit":"","m":"Приватний реєстр образів: IAM, image scanning (Inspector), реплікація, lifecycle policy, tag immutability.","a":"У проді не використовують тег latest, а версію чи git SHA.","tip":"","q":"Що вміє ECR?","d":"Приватний реєстр образів AWS, як Docker Hub чи GHCR."},
 {"g":"Контейнери","t":"Деплой ECS","lit":"","m":"Rolling update за замовчуванням (minimumHealthyPercent, maximumPercent). Blue/green через CodeDeploy. Circuit breaker.","a":"Масштабування: target tracking за CPU, пам'яттю чи ALBRequestCountPerTarget (кількість запитів на ціль).","tip":"","q":"Як ECS розгортає нову версію і масштабується?"},
 {"g":"Контейнери","t":"EKS","lit":"","m":"Kubernetes: manifests, kubectl apply. IRSA / Pod Identity як task role для подів.","a":"EKS обирають, якщо вже є Kubernetes або потрібна портативність між хмарами.","tip":"","q":"Що таке EKS?","d":"Керований Kubernetes від AWS."},
 {"g":"CI/CD","t":"CodePipeline","lit":"","m":"Stages з actions, мінімум 2 stages, artifacts в S3, Release change, manual approval, transition можна вимкнути.","a":"Помилка в дії зупиняє весь pipeline. Про неї можна отримати сповіщення через EventBridge.","tip":"","q":"Як влаштований CodePipeline?","d":"Оркестратор CI/CD, що з'єднує етапи (source, build, deploy). Як pipeline в Jenkins."},
 {"g":"CI/CD","t":"buildspec.yml","lit":"","m":"У корені. Фази: install, pre_build, build, post_build. env: parameter-store, secrets-manager (маскуються), variables (не для секретів).","a":"Блок finally виконується, навіть якщо команда впала. Параметр on-failure приймає ABORT (зупинити), CONTINUE (продовжити), RETRY (повторити).","tip":"","q":"Що в buildspec.yml?","d":"Файл-рецепт збірки для CodeBuild: фази, змінні, артефакти. Як Jenkinsfile або крок збірки в Maven.","ex":"version: 0.2\nphases:\n  install:\n    commands: [npm ci]\n  build:\n    commands: [npm test, sam build]"},
 {"g":"CI/CD","t":"CodeDeploy: що деплоїть","lit":"","m":"EC2/on-premises, Lambda, ECS. Файл appspec.yml.","a":"На EC2 потрібен встановлений CodeDeploy agent.","tip":"","q":"Що деплоїть CodeDeploy і що потрібно на EC2?"},
 {"g":"CI/CD","t":"CodeDeploy hooks (Lambda)","lit":"","m":"BeforeAllowTraffic і AfterAllowTraffic: Lambda-функції перевірки до і після зсуву трафіку. Якщо перевірка не відповіла за годину, деплой невдалий. У SAM це PreTraffic і PostTraffic.","a":"","tip":"","q":"Які hooks CodeDeploy для Lambda?"},
 {"g":"CI/CD","t":"CodeDeploy hooks (EC2)","lit":"","m":"ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, ValidateService (за сторонніми описами). Для DownloadBundle власних скриптів нема: його виконує агент.","a":"","tip":"","q":"Які hooks CodeDeploy для EC2?"},
 {"g":"CI/CD","t":"Стратегії деплою","lit":"","m":"All at once (простій), Rolling, Rolling with extra batch, Immutable (швидкий відкат), Blue/Green (миттєвий), Canary, Linear.","a":"Canary разом із alarm дає автоматичний відкат, якщо нова версія почала видавати помилки.","tip":"","q":"Які є стратегії деплою?","d":"Способи викочувати нову версію: все одразу, частинами, нові інстанси, дві копії з перемиканням трафіку, canary (малий відсоток спочатку), linear (рівними кроками).","ic":"🐤⛏️","cap":"Canary означає, що нову версію спершу показують лише малій частині користувачів, наприклад 10%. Якщо все гаразд, переходять на всіх, а якщо ні, відкочуються. Назва з шахт: канарка першою відчувала небезпеку.","why":"Щоб помилка в новій версії зачепила мало користувачів і її можна було швидко відкотити."},
 {"g":"CI/CD","t":"AppConfig","lit":"","m":"Feature flags і динамічна конфігурація без деплою. Поступове розгортання, відкат за CloudWatch alarm.","a":"Секрет, який треба ротувати: Secrets Manager. Просте значення: Parameter Store.","tip":"","q":"Що таке AppConfig?","d":"Сервіс для конфігурації та feature flags, яку змінюють без деплою коду, поступово і з відкатом за alarm. Схоже на Spring Cloud Config із refresh.","ic":"🎛️","cap":"Сервіс для налаштувань і перемикачів функцій (feature flags). Їх змінюють без нового деплою, поступово, і можна відкотити, якщо щось пішло не так.","why":"Щоб міняти поведінку без нового деплою й відкотити за секунди."},
 {"g":"CI/CD","t":"CDK / CloudFormation / SAM","lit":"","m":"CloudFormation: стеки. SAM: скорочення для serverless. CDK: код, cdk synth/diff/deploy/bootstrap.","a":"Корисні поняття CloudFormation: change set (перегляд змін до застосування), drift detection (чи змінили ресурс вручну), функції !Ref, !GetAtt, !Sub.","tip":"","q":"Чим відрізняються CDK, CloudFormation і SAM?","d":"CloudFormation описує інфраструктуру в YAML/JSON. SAM це скорочений синтаксис для serverless. CDK дозволяє писати те саме на звичайній мові програмування."},
 {"g":"CI/CD","t":"CodeArtifact / Amplify / CloudShell","lit":"","m":"CodeArtifact: приватні npm, Maven, PyPI. Amplify: фронтенд, гілка це середовище. CloudShell: термінал у браузері.","a":"","tip":"","q":"Що таке CodeArtifact, Amplify і CloudShell?"},
 {"g":"SAM і CloudFormation","t":"Transform SAM","lit":"","m":"Transform: AWS::Serverless-2016-10-31 розгортає SAM у CloudFormation. Деплой: change set потім стек.","a":"Основні типи SAM: Function, Api, HttpApi, SimpleTable, LayerVersion, StateMachine, Application, Connector.","tip":"","q":"Що робить Transform у SAM?","d":"Рядок у шаблоні, який каже CloudFormation розгорнути скорочені типи SAM у звичайні ресурси."},
 {"g":"SAM і CloudFormation","t":"AutoPublishAlias і DeploymentPreference","lit":"","m":"AutoPublishAlias публікує версію й веде alias. DeploymentPreference зсуває трафік через CodeDeploy (Canary10Percent5Minutes, Linear10PercentEvery1Minute, AllAtOnce).","a":"Alarms дають автовідкат при спрацюванні. Hooks PreTraffic і PostTraffic це функції перевірки до й після зсуву трафіку.","tip":"","q":"Чим AutoPublishAlias відрізняється від DeploymentPreference?","d":"AutoPublishAlias при кожній зміні коду публікує версію функції й веде alias. DeploymentPreference каже, як поступово зсунути трафік на нову версію.","ex":"AutoPublishAlias: live\nDeploymentPreference:\n  Type: Canary10Percent5Minutes\n  Alarms:\n    - !Ref ErrorsAlarm"},
 {"g":"SAM і CloudFormation","t":"CAPABILITY_IAM","lit":"","m":"Явна згода на створення IAM-ресурсів. CAPABILITY_NAMED_IAM для іменованих ролей.","a":"Без цього прапорця CloudFormation відмовиться створювати IAM-ресурси.","tip":"","q":"Навіщо CAPABILITY_IAM?","d":"Прапорець, яким ви підтверджуєте, що шаблон створює IAM-ресурси. Без згоди CloudFormation відмовить."},
 {"g":"SAM і CloudFormation","t":"Change set без виконання","lit":"","m":"sam deploy --no-execute-changeset створює change set і показує зміни, але не виконує їх. Аналог terraform plan.","a":"Звичайний sam deploy теж сам створює change set і питає підтвердження.","tip":"","q":"Як у SAM побачити зміни без виконання?","ex":"sam deploy --stack-name app --no-execute-changeset"},
 {"g":"SAM і CloudFormation","t":"Edge-optimized REST API","lit":"","m":"Типовий тип REST API (EDGE): вбудований CloudFront, керований AWS. Типи: EDGE, REGIONAL, PRIVATE.","a":"Щоб мати власний CloudFront, роблять API REGIONAL і ставлять свій розподіл. Сертифікат для нього в us-east-1.","tip":"","q":"Який тип endpoint у REST API за замовчуванням?"},
 {"g":"SAM і CloudFormation","t":"Циклічна залежність","lit":"","m":"Функція посилається на alarm, alarm на функцію: !Ref створює цикл. Ім'я функції задають рядком.","a":"","tip":"","q":"Чому ім'я функції в alarm задають рядком?"},
 {"g":"SAM і CloudFormation","t":"Тригер на alias","lit":"","m":"SAM вішає правило EventBridge і дозвіл на alias, а не на $LATEST. Тригер на $LATEST обходив би canary.","a":"Команда get-policy без вказання alias (qualifier) поверне ResourceNotFoundException, бо політика висить на alias, а не на функції.","tip":"","q":"Чому тригер SAM висить на alias?"},
 {"g":"CI, OIDC, секрети","t":"OIDC для CI","lit":"","m":"id-token: write, configure-aws-credentials, AssumeRoleWithWebIdentity. Тимчасові ключі, довгих ключів нема.","a":"У trust policy задають aud = sts.amazonaws.com і sub = repo:ORG/REPO:ref:refs/heads/main (лише цей репозиторій і гілка).","tip":"","q":"Як налаштувати OIDC для CI?","d":"GitHub видає короткоживучий токен, AWS обмінює його на тимчасові ключі ролі. Довгих ключів у CI немає.","ex":"permissions:\n  id-token: write\n\n- uses: aws-actions/configure-aws-credentials@v4\n  with:\n    role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}","ic":"🎫","cap":"Замість збереженого пароля GitHub видає короткочасний токен. AWS перевіряє його й дає тимчасові ключі, тож довгих секретів у CI нема.","why":"Замість довгого пароля один раз довіряють провайдеру і щоразу отримують короткі ключі."},
 {"g":"CI, OIDC, секрети","t":"Умова на sub","lit":"","m":"Без неї будь-який репозиторій GitHub міг би взяти роль. sub змінюється для tag, pull_request, environment.","a":"Якщо в репозиторії ввімкнено імутабельний sub, він містить числові ID, і звичайна форма не збігається. Тоді помилка: Not authorized to perform sts:AssumeRoleWithWebIdentity.","tip":"","q":"Навіщо умова на sub у trust policy?","d":"sub це поле токена, що каже, який репозиторій і гілка просять роль. Умова в trust policy дозволяє лише потрібний.","ex":"\"Condition\": {\n  \"StringEquals\": {\n    \"token.actions.githubusercontent.com:aud\": \"sts.amazonaws.com\",\n    \"token.actions.githubusercontent.com:sub\": \"repo:ORG/REPO:ref:refs/heads/main\"\n  }\n}","ic":"🪪","cap":"У правилі довіри ви вказуєте, який саме репозиторій і гілка можуть брати роль. Без цього її міг би взяти будь-який репозиторій на GitHub."},
 {"g":"CI, OIDC, секрети","t":"Що в CI секрет, а що ні","lit":"","m":"Не секрет: ARN ролі, назва бакета, ID акаунта, регіон. Вони самі нічого не дають: роль можна взяти лише з токеном, що проходить trust policy. Секрет: пароль, API-токен, access key, бо хто їх побачить, отримає доступ.","a":"Тест: уявіть значення в публічному репозиторії. Якщо наслідок нульовий, це змінна (Variable), а не Secret.","tip":"З OIDC у CI секретів AWS немає взагалі.","q":"Що в CI секрет, а що ні?"},
 {"g":"CI, OIDC, секрети","t":"GitHub Variable vs Secret","lit":"","m":"Variable: видно, vars.NAME. Secret: зашифрований, маскується *** (лише точний збіг), не передається у fork-PR.","a":"Значення можна задати на рівні environment, repository чи organization. Діє найвужчий рівень.","tip":"","q":"Чим GitHub Variable відрізняється від Secret?"},
 {"g":"CI, OIDC, секрети","t":"Секрет у змінній Lambda","lit":"","m":"KMS-шифрування захищає на диску, але користувач із lambda:GetFunctionConfiguration бачить значення.","a":"Краще Secrets Manager чи SecureString: читайте їх в Init і кешуйте.","tip":"","q":"Чому секрет у змінній Lambda небезпечний?","ex":"secret = secrets.get_secret_value(SecretId=\"prod/db\")[\"SecretString\"]"},
 {"g":"CI, OIDC, секрети","t":"dry_run","lit":"","m":"Створює лише change set і не перевіряє права на створення ресурсів: AccessDenied може вилізти на справжньому деплої (ROLLBACK_COMPLETE).","a":"Причину провалу шукають командою describe-stack-events з фільтром FAILED. Стек у стані ROLLBACK_COMPLETE оновити не можна, його лише видаляють.","tip":"","q":"Чому dry_run не гарантує успішного деплою?"},
 {"g":"CI, OIDC, секрети","t":"Dynamic references","lit":"","m":"{{resolve:ssm:...}} (звичайні значення), {{resolve:ssm-secure:...}} (SecureString) і {{resolve:secretsmanager:id:SecretString:key}}: значення підставляється під час деплою.","a":"Значення потрапляє в конфігурацію ресурсу, тож його видно тому, хто може читати цю конфігурацію.","tip":"","q":"Що таке dynamic references у CloudFormation?","d":"Синтаксис у шаблоні CloudFormation, що підставляє значення з Parameter Store чи Secrets Manager під час деплою.","ex":"DbPassword: \"{{resolve:secretsmanager:prod/db:SecretString:password}}\""},
 {"g":"CloudWatch і CloudTrail","t":"Метрики Lambda","lit":"","m":"Invocations, Errors, Throttles, Duration, ConcurrentExecutions, AsyncEventAge, IteratorAge, DeadLetterErrors.","a":"Throttles не входять в Errors. Метрик пам'яті нема: використання пам'яті дивіться в рядку REPORT логу.","tip":"","q":"Які метрики дає Lambda?","d":"Метрики, які Lambda публікує сама в CloudWatch. Аналог метрик Micrometer, які Spring Boot Actuator віддає в Prometheus."},
 {"g":"CloudWatch і CloudTrail","t":"Стани alarm","lit":"","m":"OK, ALARM, INSUFFICIENT_DATA. TreatMissingData: breaching, notBreaching, ignore, missing.","a":"Для рідких подій ставлять notBreaching. Один alarm стежить лише за однією метрикою.","tip":"","q":"Які стани має alarm і що таке TreatMissingData?","d":"Alarm CloudWatch стежить за метрикою й має три стани. TreatMissingData каже, що вважати за відсутності даних.","ex":"aws cloudwatch put-metric-alarm --alarm-name errors \\\n  --namespace AWS/Lambda --metric-name Errors \\\n  --dimensions Name=FunctionName,Value=my-func \\\n  --statistic Sum --period 60 --evaluation-periods 1 \\\n  --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \\\n  --treat-missing-data notBreaching"},
 {"g":"CloudWatch і CloudTrail","t":"Alarm не листує","lit":"","m":"Підписка SNS не підтверджена (PendingConfirmation), нема AlarmActions або топік під alias/aws/sns.","a":"Перевірити ланцюг alarm → SNS → пошта можна командою set-alarm-state, яка примусово ставить стан.","tip":"","q":"Чому alarm у ALARM не надсилає листа?"},
 {"g":"CloudWatch і CloudTrail","t":"Ціни CloudWatch","lit":"","m":"Перші 10 стандартних alarm безкоштовно (рахується кількість). Дашборди 3 безкоштовно. Логи 5 ГБ. Власні метрики 10 безкоштовно.","a":"Alarm з високою роздільністю коштує 0,30 USD, composite 0,50 USD на місяць (понад безкоштовні).","tip":"","q":"Що з CloudWatch безкоштовне?"},
 {"g":"CloudWatch і CloudTrail","t":"Retention логів","lit":"","m":"Лог-групи, які AWS створює сам, мають Never expire. Видалення після retention до 72 годин.","a":"Описуйте лог-групу в шаблоні й задавайте retention, інакше логи зберігатимуться вічно.","tip":"","q":"Яке retention у лог-груп Lambda?"},
 {"g":"CloudWatch і CloudTrail","t":"Зберігання метрик","lit":"","m":"Менше 60 с: 3 години. 1 хв: 15 днів. 5 хв: 63 дні. 1 год: 455 днів.","a":"Метрики з роздільністю до 1 с (StorageResolution=1) називають high-resolution.","tip":"3 год / 15 / 63 / 455.","q":"Як довго зберігаються метрики CloudWatch?"},
 {"g":"CloudWatch і CloudTrail","t":"Logs Insights / metric filter / subscription filter","lit":"","m":"Insights: запити над логами. Metric filter: патерн у логах як метрика. Subscription filter: пересилає логи в Kinesis, Firehose, Lambda.","a":"","tip":"","q":"Чим Logs Insights, metric filter і subscription filter відрізняються?","d":"Три інструменти над логами. Insights це запити (як Kibana), metric filter робить метрику з патерну, subscription filter пересилає логи далі."},
 {"g":"CloudWatch і CloudTrail","t":"CloudTrail","lit":"","m":"Хто викликав API. Event history 90 днів безкоштовно. Trail: перша копія management-подій безкоштовно. Data events платні й вимкнені.","a":"Щоб зберігати довше за 90 днів, створюють trail. Для запитів до журналу використовують Athena чи CloudTrail Lake.","tip":"CloudWatch як працює, CloudTrail хто.","q":"Що показує CloudTrail?","d":"Журнал аудиту: кожен виклик API акаунта (хто, що, коли). Не про продуктивність, а про дії.","ic":"📹","cap":"CloudTrail записує, хто і що робив в акаунті (виклики API). CloudWatch показує, як працює система (метрики й логи). Це різні питання.","why":"Моніторинг каже, як працює система, а аудит каже, хто що зробив. Це різні питання."},
 {"g":"CloudWatch і CloudTrail","t":"EC2 метрики","lit":"","m":"За замовчуванням раз на 5 хв (detailed monitoring раз на хвилину, платно). Пам'ять і диск лише через CloudWatch Agent.","a":"","tip":"","q":"Як часто EC2 шле метрики і чого немає без агента?"},
 {"g":"X-Ray","t":"Annotations vs metadata","lit":"","m":"Annotations індексовані: пошук (до 50 на трейс). Metadata не індексовані: будь-які об'єкти.","a":"Щоб знайти трейси конкретного користувача, треба annotation, бо лише вони індексуються.","tip":"","q":"Чим annotations відрізняються від metadata в X-Ray?","d":"Обидва додатковий контекст у трейсі X-Ray. Annotations індексуються, тому за ними шукають. Metadata ні, це для довільних даних. Схоже на tags проти baggage в Zipkin/Sleuth.","ex":"tracer.put_annotation(key=\"userId\", value=\"u42\")\ntracer.put_metadata(key=\"payload\", value=body)","ic":"🏷️📝","cap":"Обидва додають дані до запису трасування. Annotation індексується, тому за нею можна шукати. Metadata не індексується, це просто додаткові дані."},
 {"g":"X-Ray","t":"Sampling X-Ray","lit":"","m":"За замовчуванням перший запит кожної секунди плюс 5% решти. Правила можна змінити.","a":"Дані X-Ray зберігаються 30 днів, один сегмент до 64 КБ.","tip":"","q":"Яка в X-Ray вибірка (sampling) за замовчуванням?","d":"X-Ray трейсить не кожен запит, а вибірку, щоб не платити за все.","ic":"🧳","cap":"X-Ray фіксує не всі запити, а вибірку, щоб це не коштувало надто дорого. За замовчуванням перший запит кожної секунди й 5% решти."},
 {"g":"X-Ray","t":"Увімкнення X-Ray","lit":"","m":"Lambda: Tracing Active і xray:PutTraceSegments, PutTelemetryRecords. API Gateway: лише REST. EC2 і контейнери: daemon на UDP 2000 або ADOT.","a":"Заголовок X-Amzn-Trace-Id передає контекст трейсу між сервісами.","tip":"","q":"Як увімкнути X-Ray для Lambda, API Gateway, EC2?","ex":"MyFunction:\n  Type: AWS::Serverless::Function\n  Properties:\n    Tracing: Active"},
 {"g":"X-Ray","t":"Error / Fault / Throttle","lit":"","m":"Error: 4xx. Fault: 5xx. Throttle: 429.","a":"Inferred segment це вузол сервісу (наприклад DynamoDB), який сам не шле даних, але X-Ray виводить його з викликів.","tip":"","q":"Що означають Error, Fault, Throttle в X-Ray?"},
 {"g":"X-Ray","t":"Liveness vs readiness","lit":"","m":"Liveness: процес живий (ні: перезапустити). Readiness: готовий приймати трафік (ні: не слати трафік, але не вбивати).","a":"ALB health check виводить поганий target, ECS замінює task, Route 53 health check перемикає DNS.","tip":"","q":"Чим liveness відрізняється від readiness?","d":"Liveness: чи живий процес (ні, значить перезапустити). Readiness: чи готовий приймати трафік (ні, значить не слати трафік). Як /actuator/health/liveness і /readiness.","ic":"🫀🚦","cap":"Liveness: чи програма жива. Якщо ні, її перезапускають. Readiness: чи готова приймати запити. Якщо ні, їй тимчасово не шлють трафік, але не вбивають.","why":"Живий не означає готовий: програма може ще прогріватись і поки не приймати трафік."},
 {"g":"CloudWatch і CloudTrail","t":"Dimensions","lit":"","m":"Кожна нова комбінація dimensions це нова метрика.","a":"Не кладіть у dimension змінні значення на кшталт userId: вийдуть тисячі метрик і великий рахунок.","tip":"","q":"Чому не можна класти userId у dimension?","d":"Dimensions це мітки метрики CloudWatch (як tags у Micrometer). Кожна унікальна комбінація стає окремою метрикою."},
 {"g":"X-Ray","t":"Куди дивитись при проблемі","lit":"","m":"Що впало: логи. Скільки: метрики. Де затримка: X-Ray. Хто зробив виклик API: CloudTrail. Деплой не пройшов: CloudFormation events, CodeDeploy.","a":"","tip":"","q":"Який інструмент для якої проблеми: що впало, скільки, де затримка, хто?"},
 {"g":"Різне (лекція 22)","t":"Серіалізація","lit":"","m":"API Gateway proxy: body рядок. Kinesis data в base64. DynamoDB низького рівня з типами {S}, {N}. SQS Body рядок. S3 Body потік.","a":"Бінарні дані в JSON передають через base64, це збільшує розмір приблизно на третину.","tip":"","q":"Як серіалізуються дані в Lambda, API Gateway, Kinesis, DynamoDB, SQS, S3?","d":"Сервіси AWS обмінюються текстом і байтами, тому дані перетворюють на вході й виході. Як Jackson: об'єкт у JSON і назад.","ex":"payload = base64.b64decode(record[\"kinesis\"][\"data\"]).decode()"},
 {"g":"Різне (лекція 22)","t":"Beanstalk: політики деплою","lit":"","m":"All at once (простій, найшвидше), Rolling, Rolling with additional batch (без втрати потужності), Immutable (найбезпечніше), Traffic splitting (canary), Blue/green (swap URL, зміна DNS).","a":"Несумісна нова версія: Blue/green (нове середовище, а потім обмін адресами).","tip":"","q":"Яку політику деплою Beanstalk обрати за вимогою?"},
 {"g":"Різне (лекція 22)","t":"Auto Scaling group","lit":"","m":"Охоплює кілька AZ, не регіони. Політики: target tracking, step, scheduled, predictive. Замінює інстанс без health check.","a":"","tip":"","q":"Що таке Auto Scaling group?","d":"Група EC2-інстансів, якою керують разом: сама додає й прибирає за навантаженням і замінює нездорові."},
 {"g":"Різне (лекція 22)","t":"Multi-AZ vs read replica","lit":"","m":"Multi-AZ: доступність (синхронний резерв). Read replica: масштабування читань, асинхронна. Aurora до 15 реплік.","a":"","tip":"","q":"Чим Multi-AZ відрізняється від read replica?","d":"Multi-AZ це резервна копія бази в іншій зоні для відмовостійкості. Read replica це копія для розвантаження читань.","ic":"🛟👯","cap":"Multi-AZ це запасна копія бази в іншій зоні, на випадок збою. Read replica це копія, з якої читають, щоб розвантажити основну базу."},
 {"g":"Різне (лекція 22)","t":"EBS / EFS / S3","lit":"","m":"EBS: блочний диск одного EC2. EFS: NFS для багатьох EC2, контейнерів, Lambda. S3: об'єкти по HTTP.","a":"","tip":"","q":"Чим відрізняються EBS, EFS і S3?","d":"Три види сховища. EBS це диск одного EC2, EFS це спільна мережева файлова система, S3 це об'єкти по HTTP."},
 {"g":"Різне (лекція 22)","t":"Приватний доступ до сервісів","lit":"","m":"S3 і DynamoDB: gateway endpoint. Інші сервіси (наприклад Bedrock): interface endpoint (PrivateLink).","a":"","tip":"","q":"Як приватно звертатися до S3, DynamoDB та інших сервісів?"},
 {"g":"Різне (лекція 22)","t":"ALB / NLB / Route 53 / WAF","lit":"","m":"ALB: L7, шляхи. NLB: L4, TCP, статичний IP. Route 53: DNS. WAF: SQL injection і XSS на CloudFront, ALB, API Gateway, AppSync.","a":"Rate-based rule у WAF обмежує кількість запитів з однієї IP за 5 хв. Shield поза іспитом.","tip":"","q":"Що таке ALB, NLB, Route 53 і WAF?"},
 {"g":"Різне (лекція 22)","t":"Нове в C03","lit":"","m":"Завдання 2.3 про AI-безпеку, AI-навички, presigned URL, образи контейнерів, деплой контейнерів. Вага Troubleshooting 22%.","a":"Ваги доменів: Development 30%, Security 26%, Deployment 22%, Troubleshooting 22%.","tip":"","q":"Що нового в C03 і які ваги доменів?"},
 {"g": "EC2 і диски", "t": "Сімейства інстансів EC2", "lit": "", "q": "Яке сімейство EC2 обрати за типом навантаження?", "m": "General Purpose: баланс. Compute Optimized: сильний CPU. Memory Optimized: великі дані в пам'яті. Storage Optimized: великі дані на локальному диску. Accelerated Computing: графіка, стрімінг, ML. Є також HPC.", "a": "Ім'я типу складається із сімейства, покоління й розміру, наприклад m4.large. Старі типи працюють на Xen, нові на Nitro.", "tip": "Баланс: General. Сильний CPU: Compute. Пам'ять: Memory. Локальний диск: Storage. GPU: Accelerated.", "d": "EC2 це віртуальний сервер. Сімейство це вид сервера: з великим процесором, пам'яттю чи диском.", "ic": "🖥️🧩", "cap": "Різні сервери для різних задач: одному потрібен потужний процесор, іншому багато пам'яті.", "why": "Різні навантаження впираються в різні ресурси, тож AWS продає окремі сімейства й ви не платите за непотрібне."},
 {"g": "EC2 і диски", "t": "On-Demand проти Reserved", "lit": "", "q": "Чим On-Demand відрізняється від Reserved Instance?", "m": "On-Demand: плата за секунди в стані running, мінімум 60 с, без зобов'язань. Reserved: 1 або 3 роки, знижка за фіксовану конфігурацію.", "a": "Reserved Instance це не фізичний сервер, а знижка в рахунку. Його не скасувати, і він не поновлюється автоматично: після терміну платите як за On-Demand.", "tip": "On-Demand: «за хвилину». Reserved: «за договором».", "d": "On-Demand це оренда на потрібний час. Reserved це договір на рік чи три за нижчою ціною.", "ic": "📆💸", "cap": "Короткий найм дорожчий, довгий контракт дешевший.", "why": "Знижка за передбачуваність: AWS планує потужності, а ви платите менше."},
 {"g": "EC2 і диски", "t": "Reserved: Standard і Convertible", "lit": "", "q": "Чим Standard Reserved Instance відрізняється від Convertible?", "m": "Standard: найбільша знижка, можна лише змінювати (modify). Convertible: менша знижка, можна обміняти на інший Convertible з іншими атрибутами.", "a": "Режими оплати: All Upfront, Partial Upfront, No Upfront. Більший аванс дає більшу знижку. Ціна залежить від типу, регіону, tenancy й платформи.", "tip": "Convertible: Convert, тобто обмін.", "d": "Вибір між максимальною знижкою й можливістю змінити конфігурацію.", "ic": "🔁🏷️", "cap": "Standard дешевший, Convertible гнучкіший.", "why": "Гнучкість коштує частини знижки."},
 {"g": "EC2 і диски", "t": "Savings Plans", "lit": "", "q": "Чим Savings Plans відрізняються від Reserved Instances?", "m": "Зобов'язання на суму USD за годину на 1 або 3 роки, знижка до 72%. Compute Savings Plans діють на EC2 будь-якого сімейства, розміру, ОС і регіону, а також на Fargate і Lambda.", "a": "Документація радить Savings Plans замість Reserved Instances. У питанні про гнучкість за типом і регіоном відповідь Savings Plans.", "tip": "RI: зобов'язання на сервер. SP: зобов'язання на гроші.", "d": "Ви обіцяєте витрачати певну суму щогодини, а не користуватися конкретним сервером.", "ic": "💰🎟️", "cap": "Обіцяєш суму, а не конкретний сервер.", "why": "Менше прив'язки до конфігурації, знижка того самого порядку."},
 {"g": "EC2 і диски", "t": "Spot Instances", "lit": "", "q": "Що таке Spot Instance і що буде при перерві?", "m": "Вільна потужність зі знижкою. EC2 може відібрати інстанс: terminate, stop або hibernate. Попередження за 2 хвилини через EventBridge і instance metadata.", "a": "Перевіряти повідомлення радять кожні 5 секунд. Для hibernate 2-хвилинного попередження нема. Підходить для big data, HPC і задач, що переживають перерву.", "tip": "Spot: можуть забрати, попередять за 2 хвилини.", "d": "Сервер напрокат, який можуть забрати, коли він знадобиться комусь іншому.", "ic": "⚡🎲", "cap": "Дешево, але ненадійно.", "why": "AWS продає невикористану потужність дешево, але лишає право забрати її."},
 {"g": "EC2 і диски", "t": "Dedicated Host проти Dedicated Instance", "lit": "", "q": "Чим Dedicated Host відрізняється від Dedicated Instance?", "m": "Dedicated Host: фізичний сервер повністю ваш, ви керуєте розміщенням, для ліцензій per-socket, per-core, per-VM. Dedicated Instance: інстанси на обладнанні одного клієнта, оплата за годину.", "a": "Capacity Reservation резервує місце в конкретній AZ і враховується в квоті On-Demand, навіть якщо не використовується.", "tip": "Host: ви хазяїн сервера. Instance: окреме залізо без керування.", "d": "Один варіант дає цілий сервер і керування, інший лише гарантує, що сусідів нема.", "ic": "🏢🔑", "cap": "Цілий сервер для ліцензій чи просто окреме залізо.", "why": "Деякі ліцензії прив'язані до фізичного сервера."},
 {"g": "EC2 і диски", "t": "Типи томів EBS", "lit": "", "q": "Які бувають типи EBS-томів і для чого?", "m": "gp3 і gp2: SSD загального призначення. io2 і io1: Provisioned IOPS SSD для критичних баз. st1: HDD для великих потоків даних. sc1: HDD найдешевший, для архівів.", "a": "Межі: gp3 до 80 000 IOPS, gp2 до 16 000, io1 до 64 000, io2 Block Express до 256 000 IOPS і 4 000 МіБ/с. SSD для IOPS, HDD для throughput.", "tip": "SSD: малі випадкові операції. HDD: великі потоки.", "d": "EBS це диск для EC2 через мережу. Тип визначає швидкість і ціну.", "ic": "💽📊", "cap": "Швидкий диск для бази, повільний дешевий для архіву.", "why": "Різні задачі потребують різного співвідношення ціни й швидкості."},
 {"g": "EC2 і диски", "t": "HDD не може бути boot", "lit": "", "q": "Які EBS-томи не можуть бути boot-томом?", "m": "st1 і sc1 (HDD). Boot підтримують gp2, gp3, io1, io2.", "a": "Томи з увімкненим Multi-Attach теж не можуть бути boot.", "tip": "HDD не завантажують систему.", "d": "Диск, з якого стартує ОС, має бути SSD (чи старий Magnetic).", "ic": "🚫🥾", "cap": "Повільний HDD не підходить для запуску системи.", "why": "HDD оптимізований під великі потоки, а не під випадкові читання."},
 {"g": "EC2 і диски", "t": "EBS Multi-Attach", "lit": "", "q": "Що таке EBS Multi-Attach і які в нього обмеження?", "m": "Один том io1 або io2 підключається до кількох інстансів (до 16) в одній AZ. Кожен має повне читання й запис.", "a": "Лише Nitro-інстанси, не boot, не вмикається під час запуску й поки том підключено. Потрібна кластерна файлова система. gp2, gp3, st1, sc1 не підтримують.", "tip": "Multi-Attach: io, одна AZ, до 16.", "d": "Один диск, у який одночасно пишуть кілька серверів.", "ic": "🔗💽", "cap": "Спільний диск лише для кластерних застосунків.", "why": "Для кластерів потрібен спільний блоковий пристрій."},
 {"g": "EC2 і диски", "t": "Відновлення видаленого snapshot", "lit": "", "q": "Як повернути випадково видалений EBS snapshot?", "m": "З Recycle Bin: видалені томи, snapshots і EBS-backed AMI зберігаються протягом retention period, потім видаляються остаточно.", "a": "Потрібне правило retention: без нього видалене не повернути. Додаткової плати за Recycle Bin нема, ресурси в кошику тарифікуються як звичайні.", "tip": "Кошик має термін, у нього треба вкластися.", "d": "Recycle Bin працює як кошик у комп'ютері.", "ic": "🗑️♻️", "cap": "Видалене лежить у кошику, поки не мине термін.", "why": "Захист від помилкового видалення."},
 {"g": "EC2 і диски", "t": "Перенесення EBS в іншу AZ", "lit": "", "q": "Як перенести EBS-том в іншу AZ?", "m": "Том прив'язаний до однієї AZ. Роблять snapshot і створюють із нього новий том в іншій AZ чи регіоні.", "a": "Один том зазвичай підключений до одного інстансу, окрім Multi-Attach.", "tip": "Snapshot це міст між зонами.", "d": "Диск живе в одній зоні, а знімок можна відновити де завгодно.", "ic": "🌉💽", "cap": "Знімок як фото диска, з якого роблять нову копію деінде.", "why": "Том не може вийти за межі AZ, тому потрібен посередник."},
 {"g": "EC2 і диски", "t": "Instance Store", "lit": "", "q": "Що буде з Instance Store при reboot, stop і terminate?", "m": "Reboot: дані лишаються. Stop, hibernate, terminate і відмова диска: дані втрачаються.", "a": "Підключається лише під час запуску, не переноситься на інший інстанс. Безкоштовний у складі інстансу. Для буферів, кешів, тимчасових даних.", "tip": "Instance Store живе, поки інстанс не зупинили.", "d": "Диск, вбудований у фізичний сервер.", "ic": "⚡🧻", "cap": "Найшвидший диск, але одноразовий.", "why": "Диск усередині хоста не може пережити інстанс."},
 {"g": "EC2 і диски", "t": "EFS", "lit": "", "q": "Що таке EFS і чим відрізняється від EBS?", "m": "Спільна файлова система NFS для багатьох інстансів. Regional: кілька AZ. Росте автоматично. Доступна з EC2, ECS, EKS, Lambda, Fargate. Windows не підтримується.", "a": "One Zone зберігає в одній AZ. Дорожча за EBS, але має рівні зберігання (не звірено). Число «100 інстансів» з нотаток документація не підтверджує.", "tip": "EBS: один. EFS: багато.", "d": "Спільна папка, до якої одночасно підключається багато серверів.", "ic": "📂👥", "cap": "Один диск не годиться, коли файли потрібні багатьом серверам.", "why": "Спільний доступ до файлів без власного файлового сервера."},
 {"g": "EC2 і диски", "t": "Порти SSH, FTP, SFTP, HTTP, HTTPS, RDP", "lit": "", "q": "Які порти потрібно знати для EC2?", "m": "22: SSH (вхід на Linux) і SFTP (файли поверх SSH). 21: FTP. 80: HTTP. 443: HTTPS. 3389: RDP (вхід на Windows).", "a": "SFTP ділить порт 22 із SSH, бо працює поверх нього. Порти відкривають у security group.", "tip": "22: SSH і SFTP. 21: FTP. 3389: RDP, Windows.", "d": "Порт це номер дверей, за яким слухає сервіс.", "ic": "🚪🔢", "cap": "Різні сервіси слухають різні двері.", "why": "Фаєрвол відкриває лише потрібні порти."},
 {"g": "ELB і Auto Scaling", "t": "Чотири види ELB", "lit": "", "q": "Який балансувальник обрати: ALB, NLB, GWLB чи CLB?", "m": "ALB: L7, HTTP, HTTPS, WebSocket, мікросервіси й контейнери. NLB: L4, TCP, UDP, TLS, мільйони запитів, статичний IP. GWLB: L3, віртуальні пристрої (фаєрволи, IDS/IPS). CLB: застарілий.", "a": "ALB потребує двох AZ. NLB має статичний IP на AZ і можливість Elastic IP. GWLB використовує GENEVE на порту 6081.", "tip": "A: застосунок. N: мережа. G: шлюз до пристроїв.", "d": "Балансувальник розподіляє запити між серверами й не шле їх на зламані.", "ic": "⚖️🚦", "cap": "Різні балансувальники для різних протоколів і задач.", "why": "Різні протоколи й рівні мережі потребують різних вузлів."},
 {"g": "ELB і Auto Scaling", "t": "CLB застарілий", "lit": "", "q": "Яка позиція AWS щодо Classic Load Balancer?", "m": "CLB це попереднє покоління (v1). Документація радить мігрувати на ALB чи NLB. CLB працює з HTTP, HTTPS, TCP, SSL.", "a": "Роки виходу з нотаток: CLB 2009, ALB 2016, NLB 2017 (не звірено).", "tip": "CLB: старий v1.", "d": "Класичний балансувальник працює, але нові функції з'являються в сучасних.", "ic": "📼➡️", "cap": "Стара модель, яку не радять.", "why": "AWS розвиває ALB і NLB."},
 {"g": "ELB і Auto Scaling", "t": "Cross-zone load balancing", "lit": "", "q": "Що таке cross-zone і які типові значення?", "m": "Увімкнено: кожен вузол розподіляє між цілями всіх AZ. Вимкнено: лише своєї AZ. ALB: завжди ввімкнено, на target group можна вимкнути. NLB і GWLB: вимкнено.", "a": "Приклад: 2 цілі в A, 8 в B. Увімкнено: по 10%. Вимкнено: по 25% і по 6,25%. Для NLB і GWLB міжзонний трафік платний (не звірено). CLB: API і CLI вимкнено, консоль вмикає.", "tip": "ALB завжди cross.", "d": "Розподіл між усіма зонами рівномірно чи лише у своїй.", "ic": "🔀🌐", "cap": "Увімкнено: рівне навантаження на цілі. Вимкнено: рівне по зонах.", "why": "Рівний розподіл проти ізоляції зон."},
 {"g": "ELB і Auto Scaling", "t": "Sticky sessions", "lit": "", "q": "Як працюють sticky sessions в ALB?", "m": "Клієнт прив'язується до однієї цілі через cookie. Duration-based: cookie AWSALB, від 1 с до 7 днів. Application-based: ваша cookie, ім'я задається в target group.", "a": "Не працюють при вимкненому cross-zone. Імена AWSALB, AWSALBAPP, AWSALBTG зарезервовані. Вмикається на target group. WebSocket липкий за природою.", "tip": "Липкий: cookie.", "d": "Корисно, коли стан клієнта лежить на сервері.", "ic": "🍪🍯", "cap": "Клієнт повертається до свого сервера.", "why": "Стан у пам'яті сервера не губиться між запитами."},
 {"g": "ELB і Auto Scaling", "t": "Connection draining і deregistration delay", "lit": "", "q": "Що відбувається, коли інстанс видаляють із балансувальника?", "m": "Нові запити припиняються, активні дообробляються. CLB: connection draining. ALB і NLB: deregistration delay. Типово 300 с.", "a": "Для CLB діапазон 1-3600 с. Ціль у стані draining, потім unused. Без активних з'єднань відключення одразу.", "tip": "Draining: дай дописати.", "d": "Сервер дообробляє поточні запити перед відключенням.", "ic": "🚰⏳", "cap": "Користувач, що заповнює форму, не втрачає її.", "why": "Плавне відключення без розриву з'єднань."},
 {"g": "ELB і Auto Scaling", "t": "SNI", "lit": "", "q": "Що вирішує SNI?", "m": "Дозволяє тримати кілька SSL/TLS сертифікатів на одному listener, щоб обслуговувати кілька сайтів. Сертифікат обирається за іменем хоста.", "a": "ALB має default certificate і список сертифікатів. Сертифікати з ACM у тому ж регіоні.", "tip": "SNI: Server Name, ім'я сайту.", "d": "Одна адреса, кілька сайтів, кожен із власним сертифікатом.", "ic": "🔐🌐", "cap": "Один балансувальник для кількох доменів.", "why": "Менше балансувальників."},
 {"g": "ELB і Auto Scaling", "t": "Launch template проти launch configuration", "lit": "", "q": "Чим launch template відрізняється від launch configuration?", "m": "Launch template: сучасний, дозволяє кілька типів і режимів купівлі (On-Demand і Spot). Launch configuration застарів: акаунти, створені після 1.10.2024, не можуть їх створювати.", "a": "Launch configuration не можна змінити після створення.", "tip": "Template нове, configuration старе.", "d": "Це шаблон, як запускати новий інстанс (AMI, тип, SG).", "ic": "📝🧱", "cap": "Опис рецепта нового сервера.", "why": "Шаблон гнучкіший і підтримується."},
 {"g": "ELB і Auto Scaling", "t": "Метрики для target tracking", "lit": "", "q": "Як працює target tracking і які метрики підходять?", "m": "Тримає метрику на цільовому значенні, як термостат. ASG сам створює alarm. Метрики: ASGAverageCPUUtilization, ASGAverageNetworkIn, ASGAverageNetworkOut, ALBRequestCountPerTarget.", "a": "Не підходять RequestCount, Latency і ApproximateNumberOfMessagesVisible SQS. Метрика має змінюватися пропорційно кількості інстансів. Для черги потрібна власна метрика «повідомлень на інстанс».", "tip": "Термостат.", "d": "Ви задаєте ціль, ASG сам додає й прибирає.", "ic": "🌡️📈", "cap": "CPU 50%: більше навантаження, більше серверів.", "why": "Найпростіша політика."},
 {"g": "ELB і Auto Scaling", "t": "Політики ASG: step, simple, scheduled", "lit": "", "q": "Чим step, simple і scheduled відрізняються від target tracking?", "m": "Step: сходинки за порогами alarm. Simple: одна дія за одним alarm. Scheduled: за розкладом (наприклад о 9:00).", "a": "Predictive: прогноз заздалегідь. Кілька політик target tracking: scale out, якщо хоч одна просить, scale in, лише коли всі згодні.", "tip": "Step: сходинки. Scheduled: календар.", "d": "Різні способи вирішити, коли додавати й прибирати.", "ic": "📅🪜", "cap": "Scheduled для передбачуваного піку.", "why": "Різні профілі навантаження."},
 {"g": "ELB і Auto Scaling", "t": "Health check в ASG і заміна", "lit": "", "q": "Як ASG реагує на нездоровий інстанс?", "m": "Завершує його й запускає новий за launch template. Джерела здоров'я: EC2, ELB, VPC Lattice, EBS, custom. Після запуску діє grace period.", "a": "Інстанси з ASG автоматично реєструються в ELB і відключаються при видаленні. Якщо Spot відібрано, ASG запускає заміну.", "tip": "Нездоровий: замінити.", "d": "Група сама лікує себе.", "ic": "🩺🔄", "cap": "Збій одного сервера не зупиняє застосунок.", "why": "Підтримка бажаної кількості."},
 {"g": "ELB і Auto Scaling", "t": "ASG: min, desired, max", "lit": "", "q": "Що таке minimum, desired і maximum capacity в ASG?", "m": "Desired: скільки інстансів ASG прагне мати. Minimum і maximum: межі, в яких політики змінюють desired.", "a": "Мінімум 0 дозволяє scale in до нуля, якщо метрика реально дорівнює 0. Інстанси розподіляються по вказаних AZ.", "tip": "Min не більше Desired, Desired не більше Max.", "d": "Три числа: скільки хочу, не менше, не більше.", "ic": "🔢📏", "cap": "Межі масштабування.", "why": "Захист від нуля й від зайвих витрат."},
 {"g": "VPC", "t": "Складові VPC", "lit": "", "q": "З чого складається VPC?", "m": "Subnet (публічні й приватні зони), Route Table, Internet Gateway, NAT Gateway, Security Group, Network ACL.", "a": "Приватні підмережі ізолюють шари: web, застосунок, база. Lambda потрапляє у VPC лише якщо ви це налаштували.", "tip": "VPC: власна кімната в офісі AWS.", "d": "Ваша ізольована віртуальна мережа.", "ic": "🏠🌐", "cap": "Ви вирішуєте, хто заходить і виходить.", "why": "Ізоляція ресурсів."},
 {"g": "VPC", "t": "Security group проти NACL", "lit": "", "q": "Чим security group відрізняється від network ACL?", "m": "SG: інстанс, лише allow, stateful. NACL: підмережа, allow і deny, stateless, правила за номером до першого збігу.", "a": "Заблокувати конкретну IP можна лише в NACL. Стандартний NACL дозволяє все (не звірено). Порядок шарів: IGW, route table, NACL, SG.", "tip": "SG: двері квартири. NACL: ворота будинку.", "d": "SG пам'ятає з'єднання, NACL ні.", "ic": "🛡️🚧", "cap": "SG для сервера, NACL для всієї підмережі.", "why": "Два шари захисту."},
 {"g": "VPC", "t": "NAT Gateway", "lit": "", "q": "Для чого NAT Gateway і де він живе?", "m": "Дає інстансам приватних підмереж вихід в інтернет, не пускаючи вхідні з'єднання. Створюється в публічній підмережі з Elastic IP.", "a": "Є public і private. Для IPv6 є NAT64, альтернатива це egress-only internet gateway. З'єднання завжди починаються зсередини VPC.", "tip": "NAT: лише назовні.", "d": "Приватний сервер може скачати оновлення, а ззовні його не видно.", "ic": "🚪➡️", "cap": "Односторонні двері.", "why": "Безпека приватних підмереж."},
 {"g": "VPC", "t": "VPC Peering", "lit": "", "q": "Що таке VPC Peering і чого він не підтримує?", "m": "З'єднання двох VPC (у різних регіонах чи акаунтах) приватними IP. Point-to-point. Не підтримує транзитний трафік: A і B, B і C з'єднані, а A і C ні.", "a": "Не шлюз і не VPN. Трафік між регіонами шифрується. Створення безкоштовне, трафік у межах AZ безкоштовний, між AZ і регіонами платний.", "tip": "Peering: пряма лінія, а не вузол.", "d": "Тунель між двома мережами.", "ic": "🔗🏠", "cap": "A з B, B з C, але A з C ні.", "why": "Просте з'єднання без шлюзу."},
 {"g": "VPC", "t": "Gateway і interface endpoint", "lit": "", "q": "Чим gateway endpoint відрізняється від interface endpoint?", "m": "Gateway: для S3 і DynamoDB, через route table, не PrivateLink. Interface (PrivateLink): для інших сервісів, створює ENI у підмережі, TCP чи UDP.", "a": "Трафік не виходить в інтернет. Нижчу затримку документація не обіцяє (не звірено).", "tip": "Gateway: двоє (S3, DynamoDB). Interface: решта.", "d": "Приватний шлях до сервісів AWS без інтернету.", "ic": "🔐🛤️", "cap": "Не потрібні NAT чи IGW.", "why": "Безпека й простота."},
 {"g": "VPC", "t": "Site-to-Site VPN", "lit": "", "q": "Що таке Site-to-Site VPN і скільки в ньому тунелів?", "m": "Зашифроване IPsec-з'єднання вашої мережі з AWS через інтернет. Кожне з'єднання має два тунелі. З боку AWS: virtual private gateway (одна VPC) або transit gateway.", "a": "Customer gateway описує ваш пристрій. Якщо виділений канал не потрібен, VPN швидкий спосіб з'єднати офіс.", "tip": "VPN: через інтернет, два тунелі.", "d": "Зашифрований тунель між офісом і AWS.", "ic": "🔒🌍", "cap": "Два тунелі для надійності.", "why": "Швидко, без фізичного каналу."},
 {"g": "VPC", "t": "Direct Connect", "lit": "", "q": "Чим Direct Connect відрізняється від VPN?", "m": "Виділений фізичний канал між офісом чи дата-центром і AWS, без інтернету. Надійніший і швидший, для високої пропускної здатності й малої затримки.", "a": "Потрібне фізичне підключення. Шифрування типово нема (не звірено).", "tip": "DX: dedicated, окремий кабель.", "d": "Окремий кабель до AWS.", "ic": "🔌🏢", "cap": "Стабільніше за інтернет.", "why": "Передбачувана якість зв'язку."},
 {"g": "VPC", "t": "VPC Flow Logs", "lit": "", "q": "Що таке VPC Flow Logs і куди їх надсилають?", "m": "Журнал IP-трафіку мережевих інтерфейсів. Рівні: VPC, підмережа, ENI. Призначення: CloudWatch Logs, S3, Amazon Data Firehose.", "a": "Не впливають на пропускну здатність і затримку. Допомагають знайти надто суворі правила SG. У нотатках «Kinesis Data» виправлено на Firehose.", "tip": "Flow: потік.", "d": "Хто з ким говорив у мережі.", "ic": "📜🌊", "cap": "Діагностика зв'язності.", "why": "Видимість мережі."},
 {"g": "Route 53", "t": "Alias проти CNAME", "lit": "", "q": "Чим Alias відрізняється від CNAME?", "m": "Alias: розширення Route 53 на ресурс AWS, можна на корені домену, запити безкоштовні, TTL не задається. CNAME: ім'я на ім'я, не на корені домену, запити платні, будь-який домен.", "a": "Цілі Alias: CloudFront, ELB, S3-сайт, API Gateway, Beanstalk, Global Accelerator та ін. Не EC2 і не довільний IP. Lambda в списку нема.", "tip": "Корінь домену: Alias.", "d": "Alias це розумний CNAME для ресурсів AWS.", "ic": "🏷️🔗", "cap": "Для example.com на ELB потрібен Alias.", "why": "Стандарт DNS не дозволяє CNAME на корені."},
 {"g": "Route 53", "t": "Типи DNS-записів", "lit": "", "q": "Які типи записів і що вони роблять?", "m": "A: ім'я на IPv4. AAAA: на IPv6. CNAME: ім'я на інше ім'я (не IP, не корінь). NS: сервери імен зони. Alias: ресурс AWS.", "a": "Ціль CNAME має мати A чи AAAA. Для зовнішнього домену використовують CNAME.", "tip": "AAAA: чотири A, IPv6.", "d": "DNS як телефонна книга: ім'я до адреси.", "ic": "📖📞", "cap": "За іменем знаходимо адресу.", "why": "Імена запам'ятати легше за адреси."},
 {"g": "Route 53", "t": "Simple і Weighted routing", "lit": "", "q": "Чим Simple відрізняється від Weighted?", "m": "Simple: один ресурс, можливо кілька значень, балансування нема, клієнт обирає. Weighted: частка за вагою, наприклад 70 і 30.", "a": "Вага 0 припиняє трафік. Ваги 1 і 255 дають 1/256 і 255/256. Підходить для поступового розгортання.", "tip": "Weighted: ваги.", "d": "Simple віддає все, Weighted розподіляє.", "ic": "⚖️🎯", "cap": "Канарка на 5%.", "why": "Контроль частки трафіку."},
 {"g": "Route 53", "t": "Latency routing", "lit": "", "q": "Що робить Latency routing?", "m": "Віддає користувачу ресурс у регіоні AWS з найкращою затримкою. Користувач з Європи піде на європейський сервер.", "a": "Підходить, коли сервери в кількох регіонах.", "tip": "Latency: швидкість відгуку.", "d": "Швидкість важливіша за відстань.", "ic": "⏱️🌍", "cap": "Найшвидший регіон.", "why": "Краща швидкість для користувача."},
 {"g": "Route 53", "t": "Failover routing", "lit": "", "q": "Як працює Failover routing?", "m": "Активний-пасивний: primary і secondary записи. Route 53 перевіряє health check primary й перемикає на secondary, коли він нездоровий.", "a": "Потрібен health check на primary. Працює також у private hosted zones.", "tip": "Failover: запасний.", "d": "Основний сервер падає, трафік іде на запасний.", "ic": "🛟🔁", "cap": "Автоматичний перехід.", "why": "Висока доступність."},
 {"g": "Route 53", "t": "Geolocation routing", "lit": "", "q": "Що таке Geolocation routing і що таке default record?", "m": "За країною, континентом чи штатом США. Перемагає найменша область. Default record обробляє нерозпізнані IP і місця без правил.", "a": "Без default record відповідь «no answer». Використовують для мови й прав на контент.", "tip": "Geo: країна користувача.", "d": "Вибір за країною, звідки запит.", "ic": "🗺️🇵🇱", "cap": "З Польщі на сервер у Німеччині.", "why": "Мова й ліцензії."},
 {"g": "Route 53", "t": "Geoproximity routing і bias", "lit": "", "q": "Що таке Geoproximity і bias?", "m": "Маршрутизація за відстанню між користувачем і ресурсом. Bias від -99 до +99: позитивне розширює область ресурсу, від'ємне звужує.", "a": "Bias змінюють малими кроками. Карти лише з Traffic Flow. Формула: відстань × (1 - bias/100).", "tip": "Geoproximity: близькість плюс bias.", "d": "Розширити зону сервера, наприклад Німеччина обслуговує ще й Польщу.", "ic": "📍🎚️", "cap": "Тонке налаштування кордонів.", "why": "Гнучкіше за Geolocation."},
 {"g": "Route 53", "t": "Multivalue answer", "lit": "", "q": "Що таке Multivalue answer?", "m": "Route 53 повертає до 8 здорових записів, різним резолверам різні. Health check приховує нездорові.", "a": "Не заміна балансувальника. Без health check запис завжди здоровий. Якщо всі нездорові, віддає до 8 нездорових.", "tip": "Multi: до 8.", "d": "Клієнт обирає з кількох адрес.", "ic": "🎰8️⃣", "cap": "Простий спосіб покращити доступність.", "why": "Дешевий DNS-розподіл."},
 {"g": "Route 53", "t": "Типи health check у Route 53", "lit": "", "q": "Які бувають health checks у Route 53?", "m": "Endpoint: IP чи домен, HTTP, HTTPS, TCP; HTTP(S) чекає 2xx чи 3xx. CloudWatch alarm: дані метрики. Calculated: об'єднання кількох перевірок.", "a": "Calculated до 256 дочірніх, calculated у calculated не вкладається. Приватні IP endpoint-перевірка не бачить. Інтервал 30 с, швидкий 10 с платний. Протокол після створення не змінити.", "tip": "Endpoint, Alarm, Calculated.", "d": "Автоматична перевірка здоров'я ресурсу.", "ic": "🩺🔎", "cap": "CPU вище 90% означає нездоровий.", "why": "Основа для failover."},
 {"g": "Route 53", "t": "Домен і DNS окремо", "lit": "", "q": "Чим реєстрація домену відрізняється від DNS-сервісу?", "m": "Реєстрація: купівля домену. DNS-сервіс: куди йдуть запити. Купити можна в одному місці, а DNS вести в Route 53.", "a": "Для передачі DNS у Route 53 реєстратору вказують NS hosted zone (не звірено).", "tip": "Купівля й керування окремо.", "d": "Домен і DNS це різні дії.", "ic": "🛒🌐", "cap": "Купили тут, керуємо там.", "why": "Незалежність."},
 {"g": "CloudFront", "t": "Як працює CloudFront", "lit": "", "q": "Що відбувається при запиті до CloudFront?", "m": "Запит іде на найближчий edge. Є в кеші: віддають одразу. Немає: CloudFront бере з origin, кладе в кеш і повертає.", "a": "Origins: S3, EC2, будь-який HTTP. Інтеграція зі Shield і WAF для захисту від DDoS.", "tip": "Hit: з кешу. Miss: з origin.", "d": "CDN тримає копії ближче до користувача.", "ic": "🛰️📦", "cap": "Швидше й дешевше для origin.", "why": "Менша затримка."},
 {"g": "CloudFront", "t": "Типи origin у CloudFront", "lit": "", "q": "Які origins підтримує CloudFront?", "m": "S3 bucket (OAC). VPC origin (ALB, NLB, EC2 у приватних підмережах, деталі не звірено). Custom origin (HTTP, S3 website, будь-який публічний бекенд).", "a": "S3 website endpoint це custom origin, OAC для нього не працює. Різні origins за path pattern: /images/*, /api/*, /*.", "tip": "Website: custom.", "d": "Різні джерела для різного контенту.", "ic": "🧭🗃️", "cap": "Шлях визначає origin.", "why": "Гнучкість."},
 {"g": "CloudFront", "t": "OAC проти OAI", "lit": "", "q": "Чим OAC краще за OAI?", "m": "OAC підтримує всі S3-бакети в усіх регіонах, SSE-KMS і PUT/DELETE. OAI застарів.", "a": "Для SSE-KMS потрібна політика ключа для CloudFront. Потрібен Object Ownership: Bucket owner enforced. Режим підпису Sign requests рекомендовано.", "tip": "OAC: новий Origin Access Control.", "d": "Спосіб підписувати запити CloudFront до приватного S3.", "ic": "🔏🪣", "cap": "OAI не вміє SSE-KMS.", "why": "Сучасніший і функціональніший."},
 {"g": "CloudFront", "t": "TTL у CloudFront", "lit": "", "q": "Як обчислюється TTL у CloudFront?", "m": "Min, Default (24 год) і Max разом із max-age, s-maxage чи Expires origin. Результат обмежують Min знизу й Max зверху. Без заголовків береться Default.", "a": "Приклад: Min 60, Max 3600, max-age 86400 дає 3600. Якщо Min TTL більший за 0, no-cache, no-store і private ігноруються. Cache-Control із запиту глядача ігнорується.", "tip": "Спочатку заголовок, потім межі.", "d": "Скільки об'єкт живе в кеші.", "ic": "⏳📦", "cap": "Min і Max як огорожа.", "why": "Контроль свіжості."},
 {"g": "CloudFront", "t": "Origin request policy", "lit": "", "q": "Чим origin request policy відрізняється від cache policy?", "m": "Cache policy: що входить у cache key і TTL. Origin request policy: що передати на origin, не додаючи до ключа.", "a": "Менше в ключі: вищий hit ratio. Політики свої або managed.", "tip": "Request: передати, не кешувати за цим.", "d": "Передати cookie на origin без дублювання кешу.", "ic": "📨🚫", "cap": "Не множити копії.", "why": "Вищий hit ratio."},
 {"g": "CloudFront", "t": "Geo restriction", "lit": "", "q": "Як працює Geo restriction у CloudFront?", "m": "Allowlist: лише з країн зі списку. Blocklist: не пускати з країн зі списку. Заборонені отримують 403.", "a": "Сторонній GeoIP, точність близько 99,8%. Якщо країну не визначено, контент віддається. Діє на весь distribution.", "tip": "Allow або Block.", "d": "Гео-обмеження для прав на контент.", "ic": "🌍🚫", "cap": "За країною користувача.", "why": "Права на контент."},
 {"g": "CloudFront", "t": "Trusted key groups", "lit": "", "q": "Чому trusted key group, а не root key pair?", "m": "Рекомендація документації: trusted key groups, ними керує API й IAM, root не потрібен. Root key pairs застарілі: не більше двох активних і лише через консоль.", "a": "Підпис містить термін, діапазон IP і signers. Ключ RSA 2048 чи ECDSA 256. До 4 key groups на distribution і 5 ключів у групі.", "tip": "Група ключів: без root.", "d": "Хто може підписувати посилання.", "ic": "🗝️👥", "cap": "Автоматизація ротації.", "why": "Безпека й гнучкість."},
 {"g": "CloudFront", "t": "Signed URL проти S3 presigned URL", "lit": "", "q": "Чим CloudFront signed URL відрізняється від S3 presigned URL?", "m": "CloudFront signed URL: доступ до шляху незалежно від origin, з IP, шляхом, датою й терміном, працює з кешем. S3 presigned: запит від імені підписанта, напряму в S3, повз кеш.", "a": "Ключі: trusted key group проти IAM-ключа.", "tip": "Signed: через CDN. Presigned: напряму.", "d": "Два різні підписи для двох шляхів.", "ic": "🔗🔑", "cap": "Платний контент: CloudFront. Завантаження: presigned.", "why": "Різні сценарії."},
 {"g": "CloudFront", "t": "Origin Groups", "lit": "", "q": "Як працює origin failover у CloudFront?", "m": "Origin group: primary і secondary. Коли primary недоступний чи повертає вибрані коди (400, 403, 404, 416, 429, 500, 502, 503, 504), CloudFront йде на secondary.", "a": "Лише GET, HEAD, OPTIONS. Типово чекає primary до 30 с (3 спроби по 10 с). З Lambda@Edge origin request-тригер може спрацювати двічі.", "tip": "Primary, потім secondary.", "d": "Запасний origin.", "ic": "🛟📡", "cap": "Відмовостійкість.", "why": "Висока доступність."},
 {"g": "CloudFront", "t": "Real-time logs", "lit": "", "q": "Що таке CloudFront real-time logs?", "m": "Журнали запитів за секунди в Kinesis Data Streams. Налаштування: sampling rate, поля (до 40), cache behaviors.", "a": "Платно, best effort, не повний облік. Порядок полів фіксований. Далі через Firehose в S3, Redshift, OpenSearch.", "tip": "Real-time: Kinesis.", "d": "Живий потік запитів.", "ic": "📡📝", "cap": "Моніторинг на льоту.", "why": "Швидкі дії."},
 {"g": "CloudFront", "t": "CloudFront проти S3 CRR", "lit": "", "q": "Чим CloudFront відрізняється від S3 Cross-Region Replication?", "m": "CloudFront: глобальна мережа на краю, кеш на TTL (типово доба), для статичного контенту. S3 CRR: кожен регіон налаштовується окремо, оновлення майже реальне, для динамічного контенту з малою затримкою в кількох регіонах.", "a": "Порівняння з нотаток, не звірено окремо.", "tip": "CDN: кеш. CRR: копія.", "d": "Два способи наблизити дані.", "ic": "🌍📦", "cap": "Кеш чи копія.", "why": "Різні цілі."},
 {"g": "S3 доступ і шифрування", "t": "Access Points", "lit": "«точки доступу»", "q": "Що таке S3 Access Point і як він взаємодіє з bucket policy?", "m": "Окрема точка входу в той самий бакет з власною політикою. Працює разом із bucket policy: обидві мають дозволити запит.", "a": "Можна обмежити лише з певної VPC, мати власний Block Public Access. Через точку виконують операції над об'єктами (GetObject, PutObject), а не над самим бакетом.", "tip": "Багато дверей в одну кімнату, і біля кожних свій охоронець.", "d": "Замість однієї гігантської bucket policy на багато команд ви створюєте для кожної команди окрему точку входу з простою політикою.", "ic": "🚪🪣", "cap": "Один бакет, але кілька вхідних дверей. Біля кожних дверей свої правила: хто заходить і куди.", "why": "Одна велика політика на всіх швидко стає непідйомною (ліміт 20 КБ), а окремі точки простіші й безпечніші."},
 {"g": "S3 доступ і шифрування", "t": "Access Point: приклад із VPC", "lit": "", "q": "Команда аналітики має лише читати analytics/, а застосунок у VPC лише писати в upload/. Як це зробити в одному бакеті?", "m": "Дві Access Points: analytics (read-only префікс analytics/) і upload (запис лише в upload/, доступ лише з VPC).", "a": "Кожна точка має власну політику. Доступ лише з VPC задається в самій точці доступу.", "tip": "Одна точка на одну роль.", "d": "Приклад з нотаток: Company Data Bucket. Аналітики отримують точку лише для читання свого префікса, а застосунок у приватній мережі отримує точку лише для запису.", "ex": "analytics -> read only prefix analytics/\nupload -> write only prefix upload/, VPC only", "ic": "🧑‍💻📥", "cap": "Аналітики бачать лише свою теку й лише читають. Застосунок лише кладе файли у свою теку і лише зі своєї мережі.", "why": "Права ділять за ролями, а не вантажать усе в одну політику."},
 {"g": "S3 доступ і шифрування", "t": "Заголовки SSE-S3 і SSE-KMS", "lit": "", "q": "Який заголовок вказує SSE-S3 і який SSE-KMS?", "m": "Той самий x-amz-server-side-encryption: AES256 для SSE-S3 і aws:kms для SSE-KMS.", "a": "SSE-S3 (AES-256) за замовчуванням увімкнено для нових бакетів і об'єктів. SSE-KMS дає контроль ключа й аудит використання через CloudTrail, але на нього діють ліміти KMS.", "tip": "Заголовок один, значення два: AES256 або aws:kms.", "d": "Заголовок запиту каже S3, як шифрувати об'єкт. Змінюється лише значення.", "ex": "x-amz-server-side-encryption: AES256\nx-amz-server-side-encryption: aws:kms", "ic": "🏷️🔐", "cap": "На конверті пишете, яким ключем запечатати: «AES256» (ключ від S3) або «aws:kms» (ключ від KMS).", "why": "Один заголовок із двома значеннями простіше, ніж два різні."},
 {"g": "S3 доступ і шифрування", "t": "SSE-C: HTTPS і ключ у кожному запиті", "lit": "", "q": "Що вимагає SSE-C від клієнта і чи зберігає S3 його ключ?", "m": "Лише HTTPS і ключ у HTTP-заголовках кожного запиту. S3 ключ не зберігає.", "a": "У консолі SSE-C не вмикається, лише CLI чи API. Загубили ключ: дані не відновити.", "tip": "Ключ носите з собою і показуєте щоразу.", "d": "Ви самі тримаєте ключ поза AWS і передаєте його разом із кожним запитом, S3 лише шифрує й розшифровує, а потім забуває ключ.", "ic": "🗝️🌐", "cap": "Ключ від сейфа лише у вас: щоразу показуєте його, S3 відкриває сейф і одразу забуває ключ.", "why": "Для тих, хто не довіряє зберігання ключів нікому, окрім себе."},
 {"g": "S3 детально", "t": "Класи: приклади використання", "lit": "", "q": "Які дані класти в Standard, Intelligent-Tiering, Standard-IA, One Zone-IA і Glacier Flexible?", "m": "Standard: часті (сайт, фото, логи, аналітика). Intelligent-Tiering: непередбачуваний доступ. Standard-IA: рідко, але швидко. One Zone-IA: нестрашно втратити. Glacier Flexible: архів за хвилини чи години.", "a": "Intelligent-Tiering бере невелику плату за моніторинг. Standard-IA дешевше зберігати, але дорожче діставати.", "tip": "Часто, невідомо, рідко, дешево в одній зоні, архів.", "d": "Клас вибирають за трьома питаннями: скільки платите за зберігання, як швидко отримуєте об'єкт, як часто звертаєтесь.", "ic": "🗃️🧊", "cap": "Що частіше беремо, то ближче до дверей кладемо. Рідкісне відправляємо в архів: дешевше, але діставати довше.", "why": "Клас дає компроміс між ціною зберігання, ціною читання і швидкістю."},
 {"g": "S3 детально", "t": "Lifecycle: Transition і Expiration", "lit": "", "q": "Чим відрізняються Transition Actions і Expiration Actions у lifecycle?", "m": "Transition переносить об'єкти в інший клас. Expiration видаляє їх.", "a": "Приклади з нотаток: в Standard-IA через 60 днів, в Glacier через 6 місяців, логи видалити через 365 днів, видалити старі версії. Перенесення в IA можливе не раніше 30 днів.", "tip": "Перенести чи видалити.", "d": "Lifecycle це правила економії: коли перемістити об'єкт у дешевший клас, а коли стерти.", "ic": "♻️📆", "cap": "Спершу файл «живе» в дорогому швидкому класі, потім переїжджає в дешевший, а в кінці його стирають.", "why": "Старі дані рідко потрібні, тож їх переносять і видаляють автоматично, щоб не платити зайве."},
 {"g": "S3 детально", "t": "Події S3: типи і дозвіл цілі", "lit": "", "q": "Які основні типи подій S3 і що потрібно, щоб S3 міг викликати Lambda, SQS чи SNS?", "m": "Object Created, Object Removed, Object Restored, Replication. S3 може викликати ціль лише якщо ціль дозволила це в своїй політиці.", "a": "Цілі: Lambda, SQS, SNS, EventBridge. SQS FIFO напряму не підтримується, потрібен EventBridge. Доставка щонайменше раз.", "tip": "Подію шле S3, але дозвіл видає отримувач.", "d": "Сервіс S3 має право постукати в Lambda, чергу чи тему тільки тоді, коли вони самі пустили S3 у свою політику.", "ic": "📬🔔", "cap": "S3 дзвонить у двері Lambda. Двері відчиняться лише якщо власник дозволив цьому гостеві дзвонити.", "why": "Ресурс сам вирішує, кому дозволяти себе викликати."},
 {"g": "S3 детально", "t": "Сценарій: CSV в S3, Lambda, RDS", "lit": "", "q": "Завантажили CSV-звіт в S3, потрібно записати дані в базу. Як це організувати?", "m": "Подія Object Created на бакеті викликає Lambda, яка читає файл і записує дані в RDS.", "a": "Lambda у VPC потребує доступу до RDS. Подію налаштовують на бакеті, дозвіл на виклик дає ресурс-ціль.", "tip": "Файл, подія, Lambda, база.", "d": "Типовий серверлес-конвеєр: ніхто не опитує бакет, подія сама запускає обробку.", "ic": "📄⚡🗄️", "cap": "Поклали файл, S3 сама гукнула Lambda, та прочитала файл і занесла рядки в базу.", "why": "Подія запускає код лише тоді, коли є що робити, тож немає зайвих витрат на опитування."},
 {"g": "S3 детально", "t": "Multipart, byte-range, Transfer Acceleration: напрям", "lit": "", "q": "Який із механізмів для завантаження, а який для читання: multipart upload, byte-range fetch, Transfer Acceleration?", "m": "Multipart upload і Transfer Acceleration це завантаження в S3. Byte-range fetch це читання частини об'єкта.", "a": "Multipart: рекомендовано від 100 МБ, обов'язково понад 5 ГБ, частини йдуть паралельно. Acceleration: через найближчий edge-вузол AWS. Byte-range: частину файла беруть Range-запитом.", "tip": "Дві «вгору», одна «вниз».", "d": "Нотатки плутали byte-range з multipart. Насправді byte-range читає шматок файла, а не завантажує файл частинами.", "ic": "⬆️⬇️", "cap": "Multipart і Acceleration пришвидшують відправку вгору. Byte-range пришвидшує або обрізає читання вниз.", "why": "Три різні проблеми, три різні інструменти."},
 {"g": "S3 детально", "t": "Replication: що копіюється", "lit": "", "q": "Чи копіює S3 Replication об'єкти, що були в бакеті до налаштування, і що потрібно для реплікації?", "m": "Ні: live replication копіює нове й змінене після налаштування. Старі об'єкти копіює S3 Batch Replication. Потрібні версіонування й IAM-роль.", "a": "S3 Replication Time Control: 99,99% нових об'єктів за 15 хвилин (за SLA). CRR для різних регіонів, SRR для одного. Реплікація асинхронна.", "tip": "Нове само, старе окремою роботою.", "d": "Реплікація дзеркалить лише те, що з'явилось після її ввімкнення. Для історії запускають окрему Batch-задачу.", "ic": "🪞🪣", "cap": "Дзеркало вмикаєте сьогодні: воно показує все нове. Усе, що було до цього, треба перенести окремо.", "why": "Реплікація працює на подіях запису, тож історії не знає."},
 {"g": "RDS і Aurora", "t": "RDS: рушії", "lit": "", "q": "Які рушії бази підтримує RDS і чи це SQL?", "m": "MySQL, PostgreSQL, MariaDB, SQL Server, Oracle, Db2 та Aurora. Усі реляційні (SQL).", "a": "У старих нотатках шість рушіїв, зараз є ще Db2. Для не-SQL це DynamoDB.", "tip": "Усе, що з SQL, це RDS.", "d": "RDS це керована реляційна база: патчі, бекапи й заміну сервера робить AWS.", "ic": "🏢🗄️", "cap": "Орендований офіс із прибиральником: стіни не переставите, зате самі нічого не миєте.", "why": "Керована база знімає рутину з вас: оновлення, копії, заміну сервера."},
 {"g": "RDS і Aurora", "t": "Multi-AZ: два види", "lit": "", "q": "Чим Multi-AZ DB instance deployment відрізняється від Multi-AZ DB cluster?", "m": "Instance має один standby, який не читається. Cluster має два standby в трьох зонах, і вони обслуговують читання.", "a": "Реплікація на standby синхронна. Мета Multi-AZ: доступність, автоматичний failover.", "tip": "Один мовчить, двоє ще й читають.", "d": "Класичний Multi-AZ це лише запасна база, що чекає на збій. Cluster-варіант додає читання з резервів.", "ic": "🛞🛞", "cap": "Одне запасне колесо лежить без діла, а в кластерному варіанті два запасних ще й підстраховують на ходу.", "why": "Усунути простій при збої зони без втручання людини."},
 {"g": "RDS і Aurora", "t": "Read replica: правила", "lit": "", "q": "Які головні правила read replica в RDS?", "m": "Лише читання (SELECT), реплікація асинхронна, створюється вручну, може бути в іншому регіоні.", "a": "Репліку можна зробити Multi-AZ. Автомасштабування реплік нема. Видалили основну: репліки в тому ж регіоні стають окремими базами. Репліку можна підвищити до самостійної бази.", "tip": "Другий касир, що відстає.", "d": "Репліка розвантажує читання, але трохи відстає, бо оновлення йдуть до неї з запізненням.", "ic": "📖🧾", "cap": "Копія бази лише для читання: розвантажує основну, але може показувати трохи старі дані.", "why": "Читань зазвичай багато більше, ніж записів, тож їх виносять на копії."},
 {"g": "RDS і Aurora", "t": "Aurora: цифри", "lit": "", "q": "Які ключові цифри й особливості Aurora?", "m": "Сумісна з MySQL і PostgreSQL, дані в трьох зонах, сховище росте до 256 ТіБ, до 15 реплік для читання.", "a": "AWS заявляє 5x швидше за MySQL і 3x швидше за PostgreSQL на RDS (цифра маркетингова, не звірена). Є Aurora Serverless v2.", "tip": "15 реплік, три зони.", "d": "Aurora це база AWS із розподіленим сховищем, яка вдає із себе MySQL чи PostgreSQL для вашого коду.", "ic": "🚀🗄️", "cap": "Знайома база з потужнішим двигуном: драйвери ті самі, швидкість і кількість реплік більші.", "why": "Розподілене сховище дає швидкість і відмовостійкість, а сумісність не вимагає змінювати код."},
 {"g": "RDS і Aurora", "t": "RDS чи Aurora", "lit": "", "q": "Який сервіс обрати для Oracle, SQL Server, MariaDB і який для швидшого MySQL або PostgreSQL з багатьма репліками?", "m": "Oracle, SQL Server, MariaDB, Db2: RDS. MySQL чи PostgreSQL з вищою швидкістю й до 15 реплік: Aurora.", "a": "Для не-SQL це DynamoDB. Для кешу ElastiCache, для довговічної бази в пам'яті MemoryDB.", "tip": "Aurora лише MySQL і PostgreSQL.", "d": "Aurora підтримує лише два сімейства рушіїв, тому все інше залишається на звичайному RDS.", "ic": "⚖️🗄️", "cap": "Aurora як спортивна версія двох моделей. Якщо потрібна інша модель, брати треба звичайну RDS.", "why": "Aurora побудована під два рушії, а інші мають свою архітектуру."},
 {"g": "RDS і Aurora", "t": "MemoryDB проти ElastiCache", "lit": "", "q": "Чим MemoryDB відрізняється від ElastiCache?", "m": "ElastiCache це кеш. MemoryDB це база даних у пам'яті з Redis-сумісним API, дані зберігаються в Multi-AZ журналі.", "a": "Обидві сумісні з Valkey і Redis OSS (ElastiCache ще й Memcached). У нотатках MemoryDB понад 160 млн запитів за секунду (не звірено).", "tip": "Кеш чи база.", "d": "Якщо дані не можна втратити, а швидкість потрібна як у кеша, береться MemoryDB.", "ic": "🧠💾", "cap": "Кеш забуває при збої, MemoryDB записує у журнал, тому нічого не губить.", "why": "Щоб не тримати окремо кеш і базу."},
 {"g": "RDS і Aurora", "t": "Redis проти Memcached: HA і persistence", "lit": "", "q": "Який із рушіїв ElastiCache має Multi-AZ failover і read replicas, а який лише multi-node?", "m": "Redis/Valkey: Multi-AZ з автоматичним failover і read replicas. Memcached: multi-node без HA, без збереження.", "a": "AOF з нотаток застаріло: довговічності в Redis/Valkey ElastiCache нема (виняток Valkey 9.0). Redis ще message broker (pub/sub). Memcached багатопотоковий, backup лише в serverless.", "tip": "Redis виживає, Memcached просто швидкий.", "d": "Redis ближче до бази: копії, перемикання, структури даних. Memcached простий кеш із багатьох вузлів.", "ic": "🔴🟢", "cap": "Redis має запасних і журнал. Memcached просто швидкий склад, якщо вузол впав, дані втрачено.", "why": "Різні задачі: надійність і структури проти простоти."},
 {"g": "DynamoDB", "t": "NoSQL: без агрегацій", "lit": "", "q": "Чого не вміють NoSQL-бази на кшталт DynamoDB і як вони масштабуються?", "m": "Не виконують агрегацій SUM, AVG. Масштабуються горизонтально.", "a": "Немає «правильного чи неправильного» вибору між SQL і NoSQL: інакше моделюють дані й інакше думають про запити.", "tip": "Не рахує, але росте вшир.", "d": "NoSQL швидко читає за ключем, але суму чи середнє рахує вже застосунок.", "ic": "🧮🚫", "cap": "Шафа з підписаними шухлядами швидко віддає шухляду, але не складе суму за вас.", "why": "Агрегації вимагають проходу по всіх даних, а DynamoDB створена для швидкого доступу за ключем."},
 {"g": "DynamoDB", "t": "Типи даних", "lit": "", "q": "Які групи типів даних підтримує DynamoDB?", "m": "Scalar: String, Number, Binary, Boolean, Null. Document: List, Map. Set: String Set, Number Set, Binary Set.", "a": "Item до 400 КБ. Усі атрибути, крім ключа, необов'язкові.", "tip": "Скаляр, документ, набір.", "d": "Атрибут може бути простим значенням, вкладеним документом або набором однотипних значень.", "ic": "🧩", "cap": "Прості значення, вкладені структури й набори. З цього складаються всі дані.", "why": "Гнучкі типи дають змогу зберігати вкладені дані без схеми."},
 {"g": "DynamoDB", "t": "Тротлінг: burst і причини", "lit": "", "q": "Що відбувається, коли перевищено RCU чи WCU, і чому так стається?", "m": "Спершу тимчасово витримує burst capacity, потім ProvisionedThroughputExceededException. Рішення: exponential backoff.", "a": "Причини: hot keys, hot partitions, дуже великі items. Рішення ще: розподілити partition keys, для читань DAX.", "tip": "Burst вичерпався, чекаємо довше з кожною спробою.", "d": "Запас на піки є, але він закінчується. Тоді треба чекати й повторювати з паузою, що росте.", "ic": "🚦⏳", "cap": "Невеликий запас на піки є, а коли він закінчився, треба зачекати й спробувати знову.", "why": "Це захищає таблицю від перевантаження."},
 {"g": "DynamoDB", "t": "On-demand: RRU, WRU, перемикання", "lit": "", "q": "Як в on-demand називаються одиниці і як часто можна перемикати режим?", "m": "RRU (читання) і WRU (запис), рахуються як RCU і WCU. З provisioned на on-demand до 4 разів за 24 години, назад будь-коли.", "a": "On-demand це режим за замовчуванням і рекомендований. У нотатках «раз на 24 год» і «2,5x дорожче»: перше застаріло, друге не звірено.", "tip": "Чотири рази на добу в одну сторону.", "d": "On-demand платить за кожен запит і не потребує планування потужності.", "ic": "🔀💳", "cap": "Платите за кожну поїздку, а не за оренду авто на місяць.", "why": "Непередбачуване навантаження не змушує вгадувати потужність."},
