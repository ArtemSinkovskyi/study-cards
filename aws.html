  .q { font:600 1.2rem/1.4 system-ui, Segoe UI, Roboto, sans-serif; }
  .term { font:600 1.7rem/1.3 ui-monospace, Consolas, monospace; word-break:break-word; }
  .hint { color:var(--mut); font-size:.85rem; margin-top:1rem; }
  .group { color:var(--acc); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.8rem; }
  .back { text-align:left; }
  .back .lit { color:var(--mut); font-size:.95rem; }
  .back p { margin:.7rem 0 0; }
  .back b { color:var(--acc); }
  .def { background:#f1f6ee; border-radius:.5rem; padding:.5rem .7rem; }
  .ex { background:#1d1d1f; color:#f4f1ea; border-radius:.5rem; padding:.6rem .8rem; font:.82rem/1.45 ui-monospace, Consolas, monospace; overflow-x:auto; white-space:pre; margin:.7rem 0 0; }
  .pic { display:flex; align-items:center; gap:.8rem; background:#fff7e6; border:1px dashed #e3c987; border-radius:.6rem; padding:.5rem .8rem; margin:.2rem 0 .6rem; }
  .pic .big { font-size:2rem; line-height:1; }
  .pic .cap { font-size:.92rem; color:#5a4a1f; }
  .refs { margin-top:.8rem; padding-top:.6rem; border-top:1px dashed var(--line); font-size:.85rem; color:var(--mut); }
  .refs ul { margin:.3rem 0 0; padding-left:1.1rem; }
  .refs a { color:var(--acc); }
  .tip { margin-top:.9rem; padding:.55rem .7rem; background:#eef3f9; border-radius:.5rem; font-size:.92rem; }
  .btns { display:flex; gap:.7rem; margin-top:1rem; }
  .btns button { flex:1; padding:.8rem; font:inherit; border-radius:.6rem; border:0; cursor:pointer; color:#fff; }
  .know { background:var(--ok); }
  .no { background:var(--bad); }
  .small { background:#fff !important; color:var(--acc) !important; border:1px solid var(--acc) !important; flex:none !important; padding:.5rem .8rem !important; }
  .done { text-align:center; padding:2rem 1rem; background:var(--card); border:1px solid var(--line); border-radius:.9rem; }

const GLOSSARY = [["\\bBedrock\\b","Amazon Bedrock","керований сервіс AWS, через який викликають готові AI-моделі (Claude та інші) без власних серверів.","https://aws.amazon.com/bedrock/"],["\\bAgentCore\\b","Bedrock AgentCore","набір сервісів AWS для запуску AI-агентів у продакшні: рантайм, пам'ять, шлюз до інструментів, ідентичність.","https://aws.amazon.com/bedrock/agentcore/"],["\\bKiro\\b","Kiro","AI-середовище розробки з агентом, яке працює за специфікаціями.","https://kiro.dev/"],["\\bLambda\\b","AWS Lambda","код, який запускається у відповідь на подію, без керування серверами; платите за час виконання.","https://docs.aws.amazon.com/lambda/"],["\\bS3\\b","Amazon S3","об'єктне сховище: файли в бакетах за ключем.","https://docs.aws.amazon.com/s3/"],["\\bIAM\\b","AWS IAM","сервіс прав доступу: хто (користувач, роль) що може робити з ресурсами AWS.","https://docs.aws.amazon.com/iam/"],["\\bSTS\\b|AssumeRole","AWS STS","сервіс, що видає тимчасові облікові дані, коли хтось «приймає» роль.","https://docs.aws.amazon.com/STS/latest/APIReference/welcome.html"],["\\bKMS\\b","AWS KMS","керування ключами шифрування: ключі лишаються в AWS, використання пишеться в журнал.","https://docs.aws.amazon.com/kms/"],["\\bDynamoDB\\b","Amazon DynamoDB","керована NoSQL-база «ключ-значення» зі швидким доступом за ключем.","https://docs.aws.amazon.com/dynamodb/"],["\\bSQS\\b","Amazon SQS","керована черга повідомлень: один споживач забирає й видаляє.","https://docs.aws.amazon.com/sqs/"],["\\bSNS\\b","Amazon SNS","розсилка: одне повідомлення йде всім підписникам топіка.","https://docs.aws.amazon.com/sns/"],["\\bEventBridge\\b","Amazon EventBridge","шина подій: правила вирішують, яку подію до якої цілі доставити, є й розклади.","https://docs.aws.amazon.com/eventbridge/"],["\\bCognito\\b","Amazon Cognito","вхід і користувачі застосунку (user pool) та видача тимчасових ключів AWS (identity pool).","https://docs.aws.amazon.com/cognito/"],["API Gateway","Amazon API Gateway","керований вхід для API: авторизація, ліміти, кеш, маршрутизація до Lambda чи бекенду.","https://docs.aws.amazon.com/apigateway/"],["\\bCloudFront\\b","Amazon CloudFront","CDN: копії контенту ближче до користувача по всьому світу.","https://docs.aws.amazon.com/cloudfront/"],["\\bCloudWatch\\b","Amazon CloudWatch","метрики, логи й alarm-и для моніторингу.","https://docs.aws.amazon.com/cloudwatch/"],["\\bCloudTrail\\b","AWS CloudTrail","журнал аудиту: хто який виклик API зробив.","https://docs.aws.amazon.com/awscloudtrail/"],["X-Ray","AWS X-Ray","розподілений трейсинг: шлях одного запиту через кілька сервісів.","https://docs.aws.amazon.com/xray/"],["Step Functions","AWS Step Functions","оркестратор: процес як машина станів із повторами й обробкою помилок.","https://docs.aws.amazon.com/step-functions/"],["\\bECS\\b","Amazon ECS","оркестратор контейнерів від AWS.","https://docs.aws.amazon.com/AmazonECS/latest/developerguide/"],["\\bFargate\\b","AWS Fargate","запуск контейнерів без керування серверами.","https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html"],["\\bEKS\\b","Amazon EKS","керований Kubernetes.","https://docs.aws.amazon.com/eks/"],["\\bECR\\b","Amazon ECR","приватний реєстр Docker-образів.","https://docs.aws.amazon.com/AmazonECR/latest/userguide/"],["CodeDeploy","AWS CodeDeploy","розгортання нової версії (EC2, Lambda, ECS) із поступовим зсувом трафіку та відкатом.","https://docs.aws.amazon.com/codedeploy/"],["CodePipeline","AWS CodePipeline","оркестратор CI/CD: етапи source, build, deploy.","https://docs.aws.amazon.com/codepipeline/"],["CodeBuild|buildspec","AWS CodeBuild","керована збірка за файлом buildspec.yml.","https://docs.aws.amazon.com/codebuild/"],["\\bSAM\\b","AWS SAM","скорочений синтаксис CloudFormation для serverless плюс CLI.","https://docs.aws.amazon.com/serverless-application-model/"],["CloudFormation","AWS CloudFormation","інфраструктура як код: ресурси описують шаблоном, а AWS створює їх як стек.","https://docs.aws.amazon.com/cloudformation/"],["Secrets Manager","AWS Secrets Manager","сховище секретів з автоматичною ротацією.","https://docs.aws.amazon.com/secretsmanager/"],["Parameter Store","SSM Parameter Store","сховище конфігурації та простих секретів (String, SecureString).","https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"],["\\bKinesis\\b","Amazon Kinesis","потік даних у реальному часі, який можуть читати багато споживачів.","https://docs.aws.amazon.com/kinesis/"],["Firehose","Amazon Data Firehose","доставка потоку в сховище (S3 та інші) без коду.","https://docs.aws.amazon.com/firehose/"],["\\bAthena\\b","Amazon Athena","SQL-запити по файлах у S3 без своїх серверів.","https://docs.aws.amazon.com/athena/"],["ElastiCache|Valkey|Redis|Memcached","Amazon ElastiCache","керований кеш у пам'яті (Valkey, Redis OSS, Memcached).","https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/"],["\\bDAX\\b","DynamoDB Accelerator (DAX)","кеш у пам'яті перед DynamoDB з тим самим API.","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html"],["\\bRDS\\b","Amazon RDS","керовані реляційні бази (PostgreSQL, MySQL тощо).","https://docs.aws.amazon.com/rds/"],["\\bAurora\\b","Amazon Aurora","реляційна база, сумісна з MySQL і PostgreSQL, швидша й з репліками.","https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/"],["OpenSearch","Amazon OpenSearch","повнотекстовий пошук і аналіз логів.","https://docs.aws.amazon.com/opensearch-service/"],["\\bACM\\b","AWS Certificate Manager","видає й оновлює TLS-сертифікати.","https://docs.aws.amazon.com/acm/"],["AppConfig","AWS AppConfig","конфігурація та feature flags, які змінюють без деплою, поступово й з відкатом.","https://docs.aws.amazon.com/appconfig/"],["\\bWAF\\b","AWS WAF","веб-фаєрвол: захист від SQL injection, XSS, надлишку запитів.","https://docs.aws.amazon.com/waf/"],["Beanstalk","AWS Elastic Beanstalk","завантажили код, а AWS сама налаштує сервери, балансувальник і масштабування.","https://docs.aws.amazon.com/elasticbeanstalk/"],["\\bMacie\\b","Amazon Macie","шукає персональні дані (PII) у S3.","https://docs.aws.amazon.com/macie/"],["Organizations|\\bSCP\\b","AWS Organizations","керування кількома акаунтами; SCP задає стелю прав для них.","https://docs.aws.amazon.com/organizations/"],["Powertools","Powertools for AWS Lambda","бібліотека для Lambda: логер, метрики, трейсинг, ідемпотентність, перевірка подій.","https://docs.powertools.aws.dev/lambda/"],["\\bVPC\\b|PrivateLink","Amazon VPC","ваша приватна мережа в AWS; endpoints дозволяють ходити до сервісів без інтернету.","https://docs.aws.amazon.com/vpc/"],["\\bOIDC\\b","OpenID Connect","стандарт входу: сервіс (GitHub, Google) видає підписаний токен, за яким можна довіряти особі.","https://openid.net/developers/how-connect-works/"],["\\bJWT\\b","JSON Web Token","підписаний токен із даними про користувача.","https://jwt.io/introduction"],["GitHub Actions","GitHub Actions","CI/CD від GitHub: workflow у YAML запускається на подіях.","https://docs.github.com/en/actions"],["\\bKafka\\b","Apache Kafka","розподілений журнал подій; Kinesis це його аналог в AWS.","https://kafka.apache.org/"]];

const CARDS = [
 {"g":"IAM","t":"Default deny","lit":"","m":"Усе заборонено за замовчуванням. Явний Deny сильніший за будь-який Allow.","a":"Щоб дія спрацювала, потрібне хоча б одне правило Allow і жодного правила Deny.","tip":"Три слова: заборонено, Deny сильніший, Allow потрібен.","q":"Що відбувається, якщо жодна політика явно не дозволяє дію, і що, якщо одна дозволяє, а інша забороняє?","d":"IAM рішення про доступ працює як білий список: якщо жодне правило явно не дозволяє, дію відхилено. Це схоже на Spring Security з denyAll() за замовчуванням і окремими permitAll() для дозволеного.","ic":"🔒","cap":"Спершу все заборонено. Щоб щось дозволити, треба явне правило «можна». А якщо десь є правило «не можна», воно виграє навіть у кількох «можна»."},
 {"g":"IAM","t":"Роль замість access key","lit":"","m":"Програмі всередині AWS (Lambda, EC2, ECS) дають роль, а не ключ.","a":"Людям у кількох акаунтах дають вхід через IAM Identity Center. CI (наприклад GitHub Actions) отримує роль через OIDC, тобто без збереженого ключа.","tip":"Ключ у коді це антипатерн.","q":"Що давати програмі всередині AWS замість access key і як входити людям та CI?","d":"IAM-роль це набір прав без пароля й ключа: сервіс сам отримує тимчасові ключі. Access key це як логін-пароль, зашитий у конфіг, і його легко витекти.","ic":"🎭","cap":"Access key це як пароль, що живе вічно: його легко витекти. Роль видає тимчасові ключі, які самі закінчуються, тож красти нічого."},
 {"g":"IAM","t":"Principal","lit":"«суб'єкт»","m":"Елемент політики: кому дозволено. Є лише в resource-based політиках.","a":"В identity-based політиці Principal не пишуть: вона й так прикріплена до конкретного користувача чи ролі, тож «кому» вже відомо.","tip":"Хто? Лише там, де не відомо хто.","q":"Що таке Principal у політиці і де він є, а де нема?","d":"Principal це «кому» належить правило: користувач, роль, сервіс чи акаунт. Як Principal у Spring Security, тільки в AWS його вказують лише в політиках, прикріплених до ресурсу.","ex":"{\n  \"Effect\": \"Allow\",\n  \"Principal\": {\"AWS\": \"arn:aws:iam::111122223333:role/app\"},\n  \"Action\": \"s3:GetObject\",\n  \"Resource\": \"arn:aws:s3:::my-bucket/*\"\n}","ic":"🧑‍💼","cap":"Це той, про кого правило: конкретний користувач, роль або сервіс. Тобто відповідь на питання «кому дозволяємо?»."},
 {"g":"IAM","t":"Version 2012-10-17","lit":"","m":"Це не дата вашої політики, а версія мови, якою вона написана. Для сучасних політик завжди значення 2012-10-17.","a":"Пишіть її в кожній політиці. Без неї діє старіша версія мови (2008-10-17), де не працюють policy variables на кшталт ${aws:username} (не звірено).","tip":"Дата-ярлик мови, а не політики.","q":"Що означає Version 2012-10-17 у політиці і чому її завжди пишуть?","d":"Рядок на початку JSON-політики, що каже, за якою версією мови політик її читати. Це як версія схеми XML, а не дата створення політики.","ex":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [ ... ]\n}"},
 {"g":"IAM","t":"ListBucket vs GetObject (ARN)","lit":"","m":"s3:ListBucket діє на ARN бакета, а GetObject і PutObject на ARN із /*.","a":"Помилка ListBucket на bucket/* дає AccessDenied.","tip":"Бакет без зірочки, об'єкти із зірочкою.","q":"На який ARN діють s3:ListBucket і s3:GetObject та що буде, якщо їх переплутати?","d":"ARN це повна адреса ресурсу в AWS. Бакет і об'єкти в ньому мають різні адреси, тому права на «список» і на «читання файла» вказують на різні ARN.","ex":"{\"Action\": \"s3:ListBucket\",\n \"Resource\": \"arn:aws:s3:::my-bucket\"}\n\n{\"Action\": \"s3:GetObject\",\n \"Resource\": \"arn:aws:s3:::my-bucket/*\"}"},
 {"g":"IAM","t":"Identity-based vs resource-based","lit":"","m":"Один акаунт: достатньо будь-якого Allow. Різні акаунти: Allow з обох боків.","a":"Resource-based політика обов'язково має Principal (кому дозволяємо), а identity-based його не має.","tip":"","q":"Скільки Allow потрібно в одному акаунті і скільки між акаунтами, і чим відрізняються identity-based та resource-based політики?","d":"Identity-based політика прикріплена до того, хто діє (користувач, роль). Resource-based прикріплена до ресурсу (бакет, функція) і каже, хто до нього може. Це як права «в користувача» проти ACL «на самому об'єкті»."},
 {"g":"IAM","t":"Trust policy vs permissions policy","lit":"","m":"Роль має дві політики: trust каже хто може її прийняти, permissions що можна робити.","a":"Trust policy це різновид resource-based політики, яка висить на самій ролі й каже, хто її може прийняти.","tip":"Хто входить, що може.","q":"З яких двох політик складається роль і за що відповідає кожна?","d":"Роль має дві частини: trust policy каже, хто може в роль «зайти», а permissions policy каже, що можна робити, коли зайшов. Як дозвіл на вхід у кімнату і правила в самій кімнаті.","ex":"{\n  \"Effect\": \"Allow\",\n  \"Principal\": {\"Service\": \"lambda.amazonaws.com\"},\n  \"Action\": \"sts:AssumeRole\"\n}","ic":"🪪🚪","cap":"У ролі дві окремі речі. Trust policy каже, хто взагалі може цю роль взяти. Permissions policy каже, що можна робити, коли роль уже взято."},

 {"g":"IAM","t":"AssumeRole / WithWebIdentity / WithSAML","lit":"","m":"AssumeRole для користувачів і сервісів AWS, WithWebIdentity для OIDC (Google, GitHub), WithSAML для SAML.","a":"Якщо застосунок (мобільний чи веб) дає користувачам вхід через Google чи Apple, AWS радить для цього Cognito, а не викликати AssumeRoleWithWebIdentity самому.","tip":"","q":"Який виклик STS обрати для користувача чи сервісу, для OIDC і для SAML?"},
 {"g":"IAM","t":"Порядок пошуку облікових даних SDK","lit":"","m":"Код, змінні середовища, ~/.aws, ECS task role, EC2 instance profile.","a":"SDK бере перші знайдені дані й далі не шукає. Lambda отримує ключі своєї execution role зі змінних середовища, які сама ж і виставляє.","tip":"Від найближчого до найдальшого.","q":"У якому порядку SDK шукає облікові дані?"},
 {"g":"IAM","t":"ABAC","lit":"Attribute-Based Access Control","m":"Права за тегами: aws:PrincipalTag і aws:ResourceTag.","a":"Замість окремої ролі на кожен проєкт ви даєте однакову політику, яка порівнює теги користувача й ресурсу. Новий проєкт це лише новий тег, а не нова роль.","tip":"","q":"Що таке ABAC і чим кращий за окрему роль на кожен проєкт?","ex":"\"Condition\": {\n  \"StringEquals\": {\n    \"aws:ResourceTag/project\": \"${aws:PrincipalTag/project}\"\n  }\n}"},
 {"g":"IAM","t":"Permissions boundary","lit":"«межа прав»","m":"Стеля для користувача чи ролі. Ефективні права це перетин identity policy і boundary.","a":"Це дозволяє адміністратору довірити іншому створювати ролі: ті не зможуть дати собі більше прав, ніж дозволяє межа.","tip":"Не дає прав, лише обмежує.","q":"Що таке permissions boundary і які права в підсумку матиме користувач?","d":"Стеля прав для користувача чи ролі: навіть якщо їм видали більше, діє лише перетин. Як глобальний ліміт, що обрізає ролі в Spring Security.","ic":"🛏️","cap":"Це верхня межа прав. Навіть якщо людині видали багато прав, вона зможе лише те, що дозволяє межа."},
 {"g":"IAM","t":"SCP","lit":"Service Control Policy","m":"Політика AWS Organizations: стеля прав для акаунта чи OU. Прав не надає.","a":"SCP не діє на сам management-акаунт організації та на service-linked ролі. Щоб SCP працювали, в Organizations мають бути увімкнені all features.","tip":"За замовчуванням FullAWSAccess.","q":"Що таке SCP, чи дає вона права і на кого не діє?","d":"Service Control Policy обмежує, що взагалі можливо в акаунті чи групі акаунтів організації. Вона нічого не дозволяє сама, лише відсікає зайве зверху.","ex":"{\n  \"Effect\": \"Deny\",\n  \"NotAction\": [\"iam:*\", \"sts:*\"],\n  \"Resource\": \"*\",\n  \"Condition\": {\"StringNotEquals\": {\"aws:RequestedRegion\": \"eu-north-1\"}}\n}","ic":"👮","cap":"Це правила на рівні всієї компанії в AWS: що взагалі заборонено в акаунтах. Навіть адміністратор акаунта їх не обійде."},
 {"g":"IAM","t":"iam:PassRole","lit":"«передати роль»","m":"Право передати роль сервісу (Lambda, CloudFormation, CodeDeploy).","a":"Якщо дозволити PassRole на всі ролі (Resource *), можна передати сервісу адмінську роль і так отримати собі більше прав. Тому дозволяють лише на конкретні ролі.","tip":"","q":"Навіщо потрібен iam:PassRole і чому його звужують?","d":"Право «призначити цю роль сервісу». Без нього можна створити Lambda лише з тією роллю, яку вам дозволили передати. Захищає від того, щоб зробити собі більше прав через чужу роль.","ex":"{\n  \"Effect\": \"Allow\",\n  \"Action\": \"iam:PassRole\",\n  \"Resource\": \"arn:aws:iam::111122223333:role/my-func-role\"\n}","ic":"🎁🔑","cap":"Щоб створити Lambda з певною роллю, треба мати право «передати цю роль». Видавайте його лише на конкретну роль, інакше можна передати чужу, надто потужну."},
 {"g":"IAM","t":"External ID","lit":"","m":"Захист від confused deputy, коли сторонній сервіс отримує доступ до вашого акаунта.","a":"Його додають в умову trust policy: сторонній сервіс має передати цей рядок, коли приймає вашу роль.","tip":"","q":"Навіщо потрібен External ID?","d":"Додатковий секретний рядок в умові trust policy, коли стороннє SaaS приймає вашу роль. Не дає йому випадково (або зловмисно) зайти в ваш акаунт від імені іншого клієнта.","ic":"🤫","cap":"Коли ви даєте стороннім сервісам доступ до свого акаунта, він має передати ще й секретний рядок. Так інший клієнт цього сервісу не зможе піти у ваш акаунт під чужою ролею."},
 {"g":"IAM","t":"Ротація access keys","lit":"","m":"На користувача максимум два ключі.","a":"Спочатку створіть другий ключ, переключіть на нього застосунок, потім видаліть старий. Так не буде простою.","tip":"Два ключі, без простою.","q":"Скільки access keys має IAM-користувач і як без простою замінити ключ?","ex":"aws iam create-access-key --user-name app\naws iam delete-access-key --user-name app --access-key-id AKIAOLD"},
 {"g":"IAM","t":"aws:MultiFactorAuthPresent","lit":"","m":"Умова в політиці: дія дозволена лише після входу з MFA.","a":"","tip":"","q":"Як вимагати MFA для дії в політиці?","ex":"\"Condition\": {\n  \"BoolIfExists\": {\"aws:MultiFactorAuthPresent\": \"false\"}\n}"},
 {"g":"IAM","t":"Access Analyzer","lit":"","m":"Знаходить ресурси, доступні ззовні, і невикористані права.","a":"Credential report і Access Advisor теж для аудиту: перший показує стан ключів і паролів усіх користувачів, другий які сервіси користувач реально використовував.","tip":"","q":"Що показує IAM Access Analyzer і які ще інструменти аудиту ключів є?"},
 {"g":"S3 доступ і шифрування","t":"Block Public Access (4 вимикачі)","lit":"","m":"block_public_acls, ignore_public_acls, block_public_policy, restrict_public_buckets.","a":"Навіть правильна публічна політика не діє, поки BPA її блокує. Тому якщо бакет має публічну політику, але об'єкт не відкривається, перевіряйте BPA.","tip":"Публічна політика є, а об'єкт не відкривається: перевірте BPA.","q":"Які чотири вимикачі має Block Public Access і чому BPA сильніший за політику?","d":"Запобіжник S3 на рівні акаунта чи бакета: навіть якщо хтось випадково напише публічну політику чи ACL, воно не спрацює. Як глобальний вимикач, що стоїть перед усіма правилами.","ex":"aws s3api put-public-access-block --bucket my-bucket \\\n  --public-access-block-configuration \\\n  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true","ic":"🧯","cap":"Це страховка: навіть якщо хтось помилково напише політику, що відкриває бакет усьому інтернету, ці вимикачі її заблокують."},
 {"g":"S3 доступ і шифрування","t":"Presigned URL","lit":"","m":"Тимчасове посилання: власник посилання діє від імені підписанта.","a":"Для IAM-користувача посилання живе до 7 діб, для ролі до кінця її сеансу. Права посилання не більші за права того, хто його підписав.","tip":"Втратив право підписант, посилання мертве.","q":"Що таке presigned URL і чиї права він має?","d":"Посилання на об'єкт з вбудованим підписом, яке діє від імені того, хто його створив, до закінчення терміну. Дає тимчасовий доступ, не показуючи ключів.","ex":"url = s3.generate_presigned_url(\n    \"get_object\",\n    Params={\"Bucket\": \"my-bucket\", \"Key\": \"a.pdf\"},\n    ExpiresIn=900,\n)","ic":"🎟️","cap":"Посилання на файл, яке ви підписали своїми правами. Хто його має, може завантажити чи відправити файл, поки не мине термін. Прав більше, ніж у вас, воно не дає."},
 {"g":"S3 доступ і шифрування","t":"Bucket policy: ліміт","lit":"","m":"Розмір bucket policy не більше 20 КБ.","a":"Коли одним бакетом користуються десятки команд, замість однієї величезної політики кожній дають свою Access Point з окремою політикою.","tip":"","q":"Який ліміт розміру bucket policy і що робити, якщо команд десятки?"},
 {"g":"S3 доступ і шифрування","t":"CloudFront + OAC","lit":"Origin Access Control","m":"Приватний бакет за CDN. Principal cloudfront.amazonaws.com з AWS:SourceArn.","a":"OAI це старий спосіб того самого, він застарів. Якщо питання про «приватний S3 за CDN», відповідь CloudFront з OAC.","tip":"","q":"Як віддавати приватний S3-бакет лише через CDN?","d":"CloudFront це CDN, а OAC (Origin Access Control) це спосіб, яким CDN підписує запити до приватного бакета. Бакет відкритий лише для нього, а не для всіх.","ex":"\"Principal\": {\"Service\": \"cloudfront.amazonaws.com\"},\n\"Condition\": {\n  \"StringEquals\": {\"AWS:SourceArn\": \"arn:aws:cloudfront::111122223333:distribution/E123\"}\n}","ic":"🍕🛵","cap":"Бакет закритий для всіх. Дістати файли з нього може тільки CloudFront, а люди отримують їх уже від CloudFront."},
 {"g":"S3 доступ і шифрування","t":"VPC gateway endpoint для S3","lit":"","m":"Безкоштовний приватний шлях до S3 з VPC.","a":"Додавши в bucket policy умову на endpoint (aws:SourceVpce), можна дозволити доступ лише з вашої VPC.","tip":"","q":"Для чого VPC gateway endpoint для S3 і як обмежити доступ лише з нашої VPC?","d":"Приватний «тунель» з вашої VPC до S3 і DynamoDB без виходу в інтернет і без NAT. Працює через маршрутну таблицю, платити за нього не треба.","ex":"\"Condition\": {\n  \"StringEquals\": {\"aws:SourceVpce\": \"vpce-0abc123\"}\n}"},
 {"g":"S3 доступ і шифрування","t":"SSE-S3","lit":"AES256","m":"S3 керує ключем. Типово для нових об'єктів з січня 2023, безкоштовно.","a":"SSE-S3 захищає диски в дата-центрі, але не від користувача, який має право GetObject: S3 розшифрує файл йому прозоро.","tip":"AWS мовчки.","q":"Що таке SSE-S3 і чи захищає від користувача з GetObject?","d":"Server-Side Encryption: S3 сам шифрує об'єкти на диску ключем, яким керує AWS. Ви нічого не налаштовуєте."},
 {"g":"S3 доступ і шифрування","t":"SSE-KMS","lit":"aws:kms","m":"Ключ у KMS: аудит у CloudTrail, політика ключа.","a":"Для читання потрібні обидва права: s3:GetObject і kms:Decrypt. Для запису потрібне kms:GenerateDataKey. Якщо GetObject є, а доступ відмовлено, бракує kms:Decrypt.","tip":"AccessDenied при дозволеному GetObject: бракує kms:Decrypt.","q":"Що додає SSE-KMS і які права потрібні для читання та запису?","d":"Те саме шифрування на стороні S3, але ключ лежить у KMS. Є журнал використання ключа в CloudTrail і окрема політика ключа, тому для читання потрібен дозвіл ще й на ключ.","ex":"aws s3api put-object --bucket my-bucket --key a.txt --body a.txt \\\n  --server-side-encryption aws:kms \\\n  --ssekms-key-id alias/my-key","ic":"🏦📦","cap":"S3 шифрує файли, а ключ зберігається в окремому сервісі KMS. Є журнал, хто використовував ключ, і для читання потрібне право і на файл, і на ключ."},
 {"g":"S3 доступ і шифрування","t":"S3 Bucket Key","lit":"","m":"Зменшує кількість викликів KMS до 99% і витрати.","a":"Вмикайте, коли з SSE-KMS багато запитів: це зменшує і кількість викликів KMS, і рахунок.","tip":"","q":"Для чого S3 Bucket Key?","d":"Дрібна оптимізація SSE-KMS: замість окремого запиту до KMS на кожен об'єкт S3 бере один ключ на бакет. Менше викликів і менше грошей."},
 {"g":"S3 доступ і шифрування","t":"aws/s3 ключ cross-account","lit":"","m":"AWS-managed ключ aws/s3 не можна ділити між акаунтами.","a":"Для доступу з іншого акаунта створіть власний (customer managed) ключ і в його key policy дозвольте той акаунт.","tip":"","q":"Чому aws/s3 ключ не підходить для cross-account і що обрати?"},
 {"g":"S3 доступ і шифрування","t":"SSE-C vs client-side","lit":"","m":"SSE-C: клієнт передає ключ у кожному запиті (лише HTTPS), AWS ключ не зберігає. Client-side: клієнт шифрує до відправки.","a":"З квітня 2026 запити з SSE-C за замовчуванням відхиляються, їх треба дозволити окремим налаштуванням (BlockedEncryptionTypes).","tip":"Загубили ключ, дані втрачені.","q":"Чим SSE-C відрізняється від client-side шифрування?","d":"SSE-C: S3 шифрує, але ключ ви передаєте в кожному запиті, а S3 його не зберігає. Client-side: ви шифруєте файл ще до відправки, і S3 бачить лише шифротекст."},
 {"g":"S3 доступ і шифрування","t":"Envelope encryption: 4 КБ","lit":"","m":"KMS шифрує напряму лише до 4 КБ. Для більшого GenerateDataKey і шифрування даних data key.","a":"Зашифрований data key зберігають поруч із даними. Щоб розшифрувати, спершу просять KMS розшифрувати data key.","tip":"","q":"Скільки даних KMS шифрує напряму і як шифрувати великі файли?","d":"Схема «ключ у ключі»: KMS генерує одноразовий data key, ним шифрують дані (будь-якого розміру), а сам data key шифрують головним ключем KMS і зберігають поруч. Напряму KMS шифрує лише до 4 КБ.","ex":"aws kms generate-data-key --key-id alias/my-key --key-spec AES_256","ic":"🪆","cap":"KMS сам шифрує лише до 4 КБ. Для великих файлів KMS дає одноразовий ключ, яким ви шифруєте файл, а цей ключ KMS шифрує ще раз і ви зберігаєте його поруч."},
 {"g":"S3 доступ і шифрування","t":"Примусити HTTPS","lit":"","m":"Deny на s3:* з умовою aws:SecureTransport рівним false.","a":"Окрема умова для шифрування: Deny на PutObject, якщо заголовок x-amz-server-side-encryption не дорівнює aws:kms. Тоді завантажити без SSE-KMS не вийде.","tip":"","q":"Як політикою примусити HTTPS і SSE-KMS?","ex":"{\n  \"Effect\": \"Deny\",\n  \"Principal\": \"*\",\n  \"Action\": \"s3:*\",\n  \"Resource\": [\"arn:aws:s3:::my-bucket\", \"arn:aws:s3:::my-bucket/*\"],\n  \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"false\"}}\n}"},
 {"g":"S3 доступ і шифрування","t":"Object Lock","lit":"WORM","m":"Режими governance і compliance, плюс legal hold без терміну. Працює лише з увімкненим версіонуванням.","a":"Окремо існує MFA Delete: щоб видалити версію об'єкта, треба підтвердити MFA.","tip":"","q":"Що таке S3 Object Lock і що потрібно для нього?","d":"Режим WORM (write once, read many): об'єкт не можна змінити чи видалити до заданої дати. Вимагає версіонування.","ic":"🗿","cap":"Після запису файл не можна змінити чи видалити до вказаної дати. Навіть адміністратор не зможе."},
 {"g":"S3 детально","t":"Ключ і префікс","lit":"","m":"S3 плоский. Ключ до 1024 байт, / лише символ, «теки» це префікси.","a":"Префікси корисні як межі: за ними видають права, фільтрують події та налаштовують lifecycle.","tip":"","q":"Чи є в S3 справжні теки і що таке ключ та префікс?","d":"S3 не має справжніх тек. Ключ це довге ім'я файла (`a/b/c.jpg`), а «тека» це лише спільний початок імен, префікс. Як Map<String, byte[]>."},
 {"g":"S3 детально","t":"Розмір об'єкта","lit":"","m":"До 48,8 ТіБ. Одним PUT до 5 ГБ.","a":"Файл понад 5 ГБ одним запитом завантажити не можна: тільки частинами (multipart).","tip":"","q":"Який максимальний розмір об'єкта в S3 і одного PUT?"},
 {"g":"S3 детально","t":"Консистентність S3","lit":"","m":"Сильна read-after-write для всіх операцій з грудня 2020.","a":"Раніше S3 міг віддати застаріле після перезапису. Тепер після успішного запису будь-яке читання одразу бачить новий стан.","tip":"","q":"Яка консистентність S3?"},
 {"g":"S3 детально","t":"Метадані vs теги","lit":"","m":"Метадані задаються при завантаженні й не змінюються. Теги (до 10) можна змінювати.","a":"Теги зручні для прав і для lifecycle: наприклад, видалити все з тегом status=temp через 7 днів.","tip":"","q":"Чим метадані відрізняються від тегів об'єкта?"},
 {"g":"S3 детально","t":"Класи зберігання: вибір","lit":"","m":"Часто: Standard. Невідомо: Intelligent-Tiering. Рідко, але швидко: Standard-IA. Архів з мс: Glacier Instant. Години: Flexible. Роки: Deep Archive.","a":"One Zone-IA тримає дані лише в одній зоні, тому підходить для даних, які легко відтворити.","tip":"","q":"Який клас зберігання обрати: часто, невідомо, рідко, архів?","d":"Клас зберігання задає компроміс між ціною зберігання, ціною читання і швидкістю доступу. Чим дешевше зберігати, тим дорожче й повільніше читати.","ic":"🧊","cap":"Що дешевше зберігати, то дорожче й довше читати. Часто потрібне кладіть у Standard, рідко потрібне в Infrequent Access, а архів у Glacier."},
 {"g":"S3 детально","t":"Мінімальні терміни класів","lit":"","m":"IA 30 днів, Glacier Instant і Flexible 90 днів, Deep Archive 180 днів. IA і Instant мають мінімум 128 КБ.","a":"Якщо видалити чи перенести об'єкт раніше мінімального терміну, ви все одно платите за решту днів (early deletion charge).","tip":"30 / 90 / 180.","q":"Які мінімальні терміни зберігання класів і що буде, якщо видалити раніше?"},
 {"g":"S3 детально","t":"Restore (Flexible, Deep Archive)","lit":"","m":"GetObject дає InvalidObjectState. Потрібен RestoreObject: тимчасова копія в Standard.","a":"Швидкість відновлення: Expedited дає хвилини, Standard і Bulk години. Для Deep Archive Standard до 12 год, Bulk до 48 год.","tip":"","q":"Що робити, якщо GetObject на об'єкті з Glacier Flexible чи Deep Archive дає InvalidObjectState?"},
 {"g":"S3 детально","t":"Lifecycle: напрямок","lit":"","m":"Рухає лише вниз (Standard, IA, Glacier, Deep Archive). Перехід в IA не раніше ніж через 30 днів.","a":"Додайте правило AbortIncompleteMultipartUpload: недозавантажені частини коштують грошей, поки лежать.","tip":"","q":"В якому напрямку lifecycle переміщає об'єкти і що не забути для multipart?","d":"Lifecycle-правила автоматично переносять чи видаляють об'єкти за віком чи тегом. Як scheduled-job, що чистить старі файли.","ex":"{\n  \"ID\": \"temp-cleanup\",\n  \"Status\": \"Enabled\",\n  \"Filter\": {\"Tag\": {\"Key\": \"status\", \"Value\": \"temp\"}},\n  \"Expiration\": {\"Days\": 7}\n}","ic":"🧹","cap":"Це правила, що самі переносять або видаляють старі файли за розкладом. Переносити можна лише у дешевші й повільніші класи, а назад вони автоматично не повертаються."},
 {"g":"S3 детально","t":"Версіонування","lit":"","m":"Можна лише призупинити, не вимкнути. DELETE без versionId ставить delete marker.","a":"Видалення з номером версії (versionId) стирає версію назавжди.","tip":"","q":"Що станеться з версійованим об'єктом після звичайного DELETE і чи можна вимкнути версіонування?","d":"S3 зберігає кожну версію об'єкта окремо. Видалення без номера версії лише ставить мітку (delete marker). Як історія змін в git, але на файли.","ic":"📚","cap":"S3 зберігає кожну версію файла. Якщо видалити файл звичайним способом, лишається позначка «видалено», а попередня версія жива, її можна повернути."},
 {"g":"S3 детально","t":"S3 події: куди","lit":"","m":"Lambda, SQS, SNS напряму або EventBridge прапорцем на бакеті.","a":"Якщо слати події напряму в Lambda/SQS/SNS, не можна мати кілька правил з перетинними префіксами для однієї події. Через EventBridge такого обмеження нема.","tip":"","q":"Куди S3 може слати події і чим EventBridge кращий?"},
 {"g":"S3 детально","t":"Multipart upload","lit":"","m":"Рекомендовано від 100 МБ, обов'язково понад 5 ГБ. Частини 5 МБ - 5 ГБ, до 10 000 частин.","a":"Якщо одна частина не дійшла, повторюють лише її, а не весь файл.","tip":"","q":"Коли обов'язковий multipart upload і які його ліміти?","d":"Завантаження великого файла частинами, які йдуть паралельно й повторюються окремо. Фінально S3 склеює їх в один об'єкт.","ex":"aws s3api create-multipart-upload --bucket my-bucket --key big.zip"},
 {"g":"S3 детально","t":"Продуктивність S3","lit":"","m":"Щонайменше 3500 запитів на запис і 5500 на читання на секунду на префікс.","a":"Скільки б не було префіксів, ліміт рахується на кожен окремо, тож більше префіксів дає більшу сумарну швидкість.","tip":"","q":"Яка продуктивність S3 на префікс?"},
 {"g":"S3 детально","t":"Transfer Acceleration","lit":"","m":"Вхід у бакет через найближчий edge-вузол CloudFront. Платна опція.","a":"Корисно, коли клієнти далеко від регіону бакета.","tip":"","q":"Що таке Transfer Acceleration?"},
 {"g":"S3 детально","t":"Byte-range fetch","lit":"","m":"Читання частини об'єкта заголовком Range, можна завантажувати частини паралельно.","a":"","tip":"","q":"Що таке byte-range fetch?"},
 {"g":"S3 детально","t":"Replication (CRR, SRR)","lit":"","m":"Асинхронне копіювання нових об'єктів в інший бакет: між регіонами (CRR) чи в межах регіону (SRR).","a":"Потребує увімкненого версіонування на бакетах.","tip":"","q":"Що таке реплікація S3 (CRR, SRR) і що для неї потрібно?"},
 {"g":"S3 детально","t":"CORS","lit":"","m":"Потрібен, коли браузер ходить у S3 з іншого домену.","a":"Правила CORS задаються на бакеті: які домени (AllowedOrigins), методи (AllowedMethods) і заголовки (AllowedHeaders) дозволені.","tip":"","q":"Коли потрібен CORS на S3?","d":"Правило браузера, що забороняє JS на одному домені ходити на інший без дозволу. У S3 цей дозвіл налаштовується на бакеті."},
 {"g":"Cognito","t":"User pool vs identity pool","lit":"","m":"User pool: хто ти, видає JWT. Identity pool: що можна в AWS, видає тимчасові ключі.","a":"Гості (без входу) можливі лише через identity pool. Якщо потрібен лише захист власного API логіном, достатньо user pool.","tip":"Хто / що можна.","q":"Чим user pool відрізняється від identity pool і що вибрати для API, а що для прямого доступу до S3?","d":"User pool це каталог користувачів і вхід (як Keycloak): видає JWT. Identity pool обмінює такий токен на тимчасові ключі AWS, щоб клієнт сам ходив у S3 чи DynamoDB.","ic":"🛂🎢","cap":"User pool це база користувачів: реєстрація й вхід, на виході токен. Identity pool міняє такий токен на тимчасові ключі AWS, щоб додаток сам ходив у S3 чи DynamoDB."},
 {"g":"Cognito","t":"ID token / access token / refresh token","lit":"","m":"ID: дані про користувача (claims), для Cognito authorizer REST. Access: права (scopes). Refresh: оновлення.","a":"Щоб перевірити JWT, беруть публічні ключі пулу (JWKS), перевіряють підпис, потім поля iss (хто видав), aud (для кого), exp (коли спливає).","tip":"","q":"Чим відрізняються ID, access і refresh токени Cognito і як перевіряють JWT?","d":"Три JWT від Cognito: ID token каже, хто користувач, access token каже, що йому можна (scopes), refresh token потрібен лише щоб отримати нові два."},
 {"g":"Cognito","t":"Cognito Lambda triggers","lit":"","m":"Pre sign-up, post confirmation, pre/post authentication, кастомізація повідомлень.","a":"Приклад: у trigger «post confirmation» після підтвердження реєстрації створюють запис користувача в DynamoDB.","tip":"","q":"Які Lambda triggers є у Cognito user pool і що можна зробити в post confirmation?","d":"Хуки на події реєстрації й входу, куди підключають Lambda. Як @EventListener на подію AuthenticationSuccess у Spring Security."},
 {"g":"Cognito","t":"${cognito-identity.amazonaws.com:sub}","lit":"","m":"Policy variable: у політиці ролі дає доступ «лише своє» (папка в S3).","a":"Для DynamoDB те саме робить умова dynamodb:LeadingKeys: дозволяє лише рядки зі своїм partition key.","tip":"","q":"Як обмежити користувача його папкою в S3 через identity pool?","ex":"\"Resource\": \"arn:aws:s3:::my-bucket/${cognito-identity.amazonaws.com:sub}/*\""},
 {"g":"Cognito","t":"GitHub Actions у AWS","lit":"","m":"OIDC і AssumeRoleWithWebIdentity, не Cognito.","a":"Для входу співробітників компанії використовують SAML (AssumeRoleWithSAML) або IAM Identity Center.","tip":"Ніяких довгих ключів.","q":"Як GitHub Actions входить в AWS і як корпоративний SAML?"},
 {"g":"Cognito","t":"Авторизація в API Gateway","lit":"","m":"Cognito authorizer (токен user pool), Lambda authorizer (своя логіка), IAM SigV4.","a":"Коли використано Cognito authorizer, дані користувача (claims) функція бачить у event.requestContext.authorizer.claims.","tip":"","q":"Які способи авторизації в API Gateway пов'язані з Cognito та IAM і де claims у функції?"},
 {"g":"AI: безпека","t":"Converse vs InvokeModel","lit":"","m":"Converse: єдиний формат для моделей. InvokeModel: формат конкретної моделі.","a":"Lambda потрібне право bedrock:InvokeModel. Якщо Bedrock повертає ThrottlingException (забагато запитів), повторюйте з наростаючими паузами (backoff).","tip":"","q":"Чим Converse відрізняється від InvokeModel і що потрібно Lambda?","d":"Два способи викликати модель у Bedrock. Converse має єдиний формат для всіх моделей, як спільний інтерфейс. InvokeModel приймає специфічний JSON конкретної моделі.","ex":"response = bedrock.converse(\n    modelId=\"anthropic.claude-haiku-5-5\",\n    messages=[{\"role\": \"user\", \"content\": [{\"text\": \"Привіт\"}]}],\n)"},
 {"g":"AI: безпека","t":"Приватність даних Bedrock","lit":"","m":"Вхід і вихід не використовуються для покращення базових моделей і не передаються провайдерам.","a":"Щоб трафік не йшов через публічний інтернет, створюють interface VPC endpoint (PrivateLink).","tip":"","q":"Чи вчиться Bedrock на моїх даних і як не йти через інтернет?"},
 {"g":"AI: безпека","t":"Guardrails: фільтри","lit":"","m":"Content (включно Prompt Attack), denied topics, word, sensitive information (mask/block), contextual grounding, Automated Reasoning.","a":"Guardrail перевіряє і запит користувача, і відповідь моделі. Його спершу редагують як чернетку (draft), потім випускають версію (version).","tip":"","q":"Які фільтри є у Bedrock Guardrails і що вони перевіряють?","d":"Bedrock Guardrails це шар перевірки перед моделлю і після неї: блокує чи маскує шкідливе, заборонене, приватне. Як фільтр у ланцюжку servlet filters, що перевіряє і запит, і відповідь.","ic":"🛃","cap":"Це фільтри, які дивляться і на запит до моделі, і на її відповідь. Вони блокують небажане: теми, слова, персональні дані."},
 {"g":"AI: безпека","t":"Потреба → фільтр","lit":"","m":"PII: sensitive information. Prompt injection: Prompt Attack. Галюцинації в RAG: contextual grounding. Заборонена тема: denied topic.","a":"","tip":"","q":"Який фільтр Guardrails обрати для PII, prompt injection, галюцинацій і заборонених тем?"},
 {"g":"AI: безпека","t":"ApplyGuardrail","lit":"","m":"Застосувати guardrail без виклику моделі, у тому числі до сторонніх моделей.","a":"","tip":"","q":"Для чого ApplyGuardrail?","d":"API, що застосовує guardrail до довільного тексту без виклику моделі. Корисно, коли модель не в Bedrock.","ex":"bedrock.apply_guardrail(\n    guardrailIdentifier=\"gr-123\",\n    guardrailVersion=\"1\",\n    source=\"INPUT\",\n    content=[{\"text\": {\"text\": user_text}}],\n)"},
 {"g":"AI: безпека","t":"Безпека агентів","lit":"","m":"Tool-use authorization (мінімум прав), session isolation, human-in-the-loop, вміст інструмента це дані.","a":"Guardrail фільтрує текст, але не замінює авторизацію: права агента однаково мають бути мінімальними.","tip":"","q":"Як захистити AI-агента від зайвих дій?","d":"AI-агент сам вирішує, які інструменти викликати, тому йому дають мінімум прав і людське підтвердження для небезпечного. Guardrail фільтрує текст, але не замінює авторизацію.","ic":"🤖🔪","cap":"AI-агент сам вирішує, що робити. Тому дайте йому мінімум прав і підтверджуйте вручну все небезпечне."},
 {"g":"AI: безпека","t":"AgentCore","lit":"","m":"Runtime (ізоляція сесій), Memory, Gateway (MCP), Identity, Policy, Observability, Code Interpreter, Browser.","a":"Bedrock Agents простіший керований варіант. Компонент Policy в AgentCore відповідає за те, які інструменти агенту можна викликати.","tip":"","q":"З яких компонентів складається AgentCore і чим відрізняється від Bedrock Agents?","d":"Набір керованих сервісів AWS для запуску AI-агентів у продакшні: рантайм, пам'ять, шлюз до інструментів, ідентичність, політики, спостереження."},
 {"g":"AI: безпека","t":"Поза межами іспиту","lit":"","m":"Rekognition, Polly, SageMaker AI, Strands Agents, Quick Sight, Connect, Shield, Transfer Family. Вибір моделей і prompt engineering.","a":"Quick Sight (дашборди) поза іспитом, а Amazon Quick (інший сервіс) у списку іспиту. Це різні сервіси.","tip":"","q":"Що поза межами іспиту DVA-C03?"},
 {"g":"AI: безпека","t":"Логи Bedrock","lit":"","m":"Логи промптів можуть містити PII: логуйте метадані, маскуйте, мінімум прав, KMS, короткий retention.","a":"Логування викликів моделей (model invocation logging) в Bedrock вмикається окремо й не діє само.","tip":"","q":"Як безпечно логувати виклики Bedrock?"},
 {"g":"AI: безпека","t":"Kiro","lit":"","m":"AI-середовище розробки з агентом. Specs (requirements, design, tasks), steering (правила проєкту), hooks (автодії), MCP (зовнішні інструменти).","a":"Код, згенерований AI, перевіряють так само, як будь-який інший: тести, огляд, сканування.","tip":"","q":"Що таке Kiro і з чого складається?"},
 {"g":"Lambda","t":"Ліміти Lambda","lit":"","m":"Timeout 3 с (макс 15 хв). Пам'ять 128 МБ - 10 ГБ. /tmp 512 МБ - 10 ГБ. Env 4 КБ. Payload sync 6 МБ, async 1 МБ.","a":"Якщо обробка довша за 15 хв, Lambda не підходить: беруть Step Functions, ECS/Fargate чи Batch.","tip":"3 с / 15 хв / 6 МБ.","q":"Які ключові ліміти Lambda?"},
 {"g":"Lambda","t":"Розмір пакета Lambda","lit":"","m":"Zip напряму 50 МБ. Розпаковано з layers 250 МБ. Container image 10 ГБ. Layers до 5.","a":"Пакет 70 МБ: завантажують через S3. Понад 250 МБ: container image з ECR. Layers для функцій у вигляді container image не підтримуються.","tip":"50 / 250 / 10 ГБ.","q":"Які ліміти розміру пакета Lambda і як розгортати великі?"},
 {"g":"Lambda","t":"1769 МБ","lit":"","m":"Пам'ять, при якій функція отримує 1 vCPU. CPU росте разом з пам'яттю.","a":"Більше пам'яті часто означає швидший виклик і не обов'язково дорожчий. Підібрати значення допомагає AWS Lambda Power Tuning.","tip":"","q":"Що означає 1769 МБ у Lambda?"},
 {"g":"Lambda","t":"Init поза handler","lit":"","m":"Код поза handler виконується раз на середовище (Init, ліміт 10 с). Клієнти SDK, з'єднання з БД, секрети.","a":"Дані конкретного запиту не кладіть у глобальні змінні: наступний запит у тому ж середовищі побачить чужі.","tip":"","q":"Що виносять за межі handler і чого там не можна тримати?","d":"Код поза handler виконується один раз, коли створюється середовище, і лишається для наступних викликів. Як singleton `@Bean`, створений при старті контексту, а handler це метод, що викликають на кожен запит.","ex":"public class Handler implements RequestHandler<S3Event, String> {\n    private static final S3Client S3 = S3Client.create();\n\n    public String handleRequest(S3Event event, Context context) {\n        return S3.getObject(...).toString();\n    }\n}","ic":"👨‍🍳","cap":"Те, що створюється один раз (клієнт бази, SDK), виносьте за межі функції. Тоді при наступних викликах воно вже готове й не створюється заново."},
 {"g":"Lambda","t":"Зменшити cold start","lit":"","m":"Менший пакет, менше залежностей, більше пам'яті, SnapStart, provisioned concurrency.","a":"SnapStart дешевий спосіб для Java. Provisioned concurrency підходить для синхронних API, де важлива затримка.","tip":"","q":"Як зменшити cold start?","ic":"🍳🥶","cap":"Перший запуск функції довший, бо треба підготувати середовище. Це зменшують меншим пакетом, більшою пам'яттю, SnapStart або заздалегідь прогрітими екземплярами."},
 {"g":"Lambda","t":"Три моделі виклику","lit":"","m":"Sync (API Gateway, ALB, SDK): повторює клієнт. Async (S3, SNS, EventBridge): Lambda 2 повтори. Poll (SQS, Kinesis, DynamoDB Streams): event source mapping.","a":"Для poll-джерел (SQS, Kinesis) права на читання даються в execution role. Для push-джерел (S3, SNS, EventBridge) дозвіл на виклик дається в resource-based policy функції.","tip":"","q":"Які три моделі виклику Lambda і чиї права потрібні для кожної?","d":"Спосіб виклику визначає, хто повторює спробу. Sync: клієнт чекає й повторює сам. Async: Lambda кладе подію в свою чергу й повторює сама. Poll: Lambda сама опитує джерело, як `@SqsListener` чи `@KafkaListener`.","ic":"📞✉️🔔","cap":"Sync: клієнт чекає відповідь. Async: подія стає в чергу, і Lambda сама повторює при помилці. Poll: Lambda сама періодично дивиться в чергу чи потік."},
 {"g":"Lambda","t":"Async: повтори","lit":"","m":"Усього 3 спроби (паузи близько 1 і 2 хв). MaximumRetryAttempts 0-2. MaximumEventAgeInSeconds 60 с - 6 год.","a":"Без DLQ чи destination подія після всіх невдалих спроб зникає безслідно.","tip":"","q":"Скільки повторів має async-виклик Lambda і що буде без DLQ?","d":"Коли подію кидає S3 чи EventBridge, Lambda ставить її у внутрішню чергу. Якщо функція падає, Lambda ще двічі повторює спробу, а потім відкидає подію або віддає в DLQ.","ex":"EventInvokeConfig:\n  MaximumRetryAttempts: 2\n  MaximumEventAgeInSeconds: 3600"},
 {"g":"Lambda","t":"DLQ vs destinations","lit":"","m":"DLQ: лише невдача, SQS чи SNS. Destinations: успіх і невдача, SQS, SNS, Lambda, EventBridge, з контекстом помилки.","a":"AWS рекомендує destinations: вони новіші й дають більше інформації про збій.","tip":"","q":"Чим DLQ відрізняється від destinations?","d":"DLQ це куди відкладають подію після вичерпання спроб, як dead-letter topic у Spring Kafka. Destinations роблять те саме, але ще й для успіху й з деталями помилки.","ic":"🗑️📮","cap":"Це місце, куди потрапляють події, які так і не вдалось обробити. Destinations нові, вміють ще й успіх і дають більше подробиць про помилку."},
 {"g":"Lambda","t":"Execution role vs resource-based policy","lit":"","m":"Execution role: що функція може робити. Resource-based policy: хто може викликати функцію.","a":"Якщо функцію має викликати інший акаунт, дозвіл дається саме в resource-based policy.","tip":"","q":"Чим execution role відрізняється від resource-based policy?","d":"Execution role це права самої функції на інші сервіси (вихідні). Resource-based policy це дозвіл на те, хто може викликати функцію (вхідні)."},
 {"g":"Lambda","t":"Reserved vs provisioned concurrency","lit":"","m":"Reserved: гарантована і обмежена зверху частина ліміту, безкоштовно, 0 вимикає. Provisioned: прогріті середовища, платно, лише версія чи alias.","a":"AWS не дозволяє зарезервувати стільки, щоб для решти функцій лишилося менше 100 одночасних виконань.","tip":"","q":"Чим reserved concurrency відрізняється від provisioned?","d":"Concurrency це кількість одночасних виконань. Reserved гарантує функції частку й обмежує зверху (безкоштовно). Provisioned тримає середовища заздалегідь прогрітими (платно).","ex":"aws lambda put-function-concurrency \\\n  --function-name my-func \\\n  --reserved-concurrent-executions 20","ic":"🪑🔥","cap":"Reserved гарантує функції певну кількість одночасних запусків і водночас обмежує її зверху, безкоштовно. Provisioned тримає екземпляри вже готовими, тому швидкий старт, але платно."},
 {"g":"Lambda","t":"Throttling Lambda","lit":"","m":"Sync: 429 TooManyRequestsException, клієнт повторює. Async: Lambda повторює. SQS: повідомлення повертаються.","a":"Метрика Throttles (відмови через ліміт) не входить у Errors (помилки функції), тому дивіться обидві.","tip":"","q":"Що відбувається при throttling Lambda для sync, async і SQS?"},
 {"g":"Lambda","t":"Версія і alias","lit":"","m":"Версія: незмінний знімок коду і конфігурації. $LATEST змінний. Alias: вказівник, може ділити трафік між двома версіями.","a":"Відкат це переставити alias на попередню версію. Alias не може вказувати на інший alias.","tip":"","q":"Чим версія Lambda відрізняється від alias і як відкотитися?","d":"Версія це незмінний знімок функції, як тег релізу. Alias це рухомий вказівник на версію, як `prod`, який можна переставити (відкат) або розділити між двома версіями.","ex":"aws lambda create-alias --function-name my-func --name prod \\\n  --function-version 3 \\\n  --routing-config AdditionalVersionWeights={\"4\"=0.1}","ic":"🏷️","cap":"Версія це незмінна копія функції. Alias це ім'я на кшталт prod, яке вказує на якусь версію, і його можна переставити, наприклад для відкату."},
 {"g":"Lambda","t":"Layers","lit":"","m":"До 5 на функцію, розпаковуються в /opt, входять у 250 МБ, не підтримуються для container image.","a":"Для Node.js бібліотеки кладуть у /opt/nodejs/node_modules, тоді вони підхоплюються автоматично.","tip":"","q":"Скільки layers має функція, куди вони розпаковуються і що з container image?","d":"Окремий архів з бібліотеками, який підключається до функції. Як спільний jar у кількох сервісах.","ic":"🧰","cap":"Це окремий архів із бібліотеками, який можна підключити до кількох функцій, щоб не пакувати їх у кожну."},
 {"g":"Lambda","t":"Lambda у VPC","lit":"","m":"Втрачає інтернет, навіть у публічній підмережі.","a":"Виправлення: NAT Gateway в приватній підмережі або VPC endpoint (gateway endpoint для S3 і DynamoDB).","tip":"","q":"Що стається з Lambda у VPC і як це виправити?","d":"Щоб Lambda дістала приватний ресурс (RDS), її підключають до вашої VPC. Побічний ефект: вона втрачає інтернет, поки не додати NAT чи endpoint.","ic":"🏝️","cap":"Коли функцію підключають до вашої мережі (VPC), вона втрачає вихід в інтернет. Його повертають через NAT або через VPC endpoint."},
 {"g":"Lambda","t":"Відповідь proxy і коди помилок","lit":"","m":"body це рядок. 502: неправильний формат. 504: timeout інтеграції (29 с). 429: throttling. 403: немає права. 413: завеликий payload.","a":"Детально про помилки API Gateway дивіться в групі API Gateway.","tip":"","q":"Яка відповідь потрібна для proxy-інтеграції і що означають 502, 504, 429, 403, 413?","ex":"{\n  \"statusCode\": 200,\n  \"headers\": {\"Content-Type\": \"application/json\"},\n  \"body\": \"{\\\"ok\\\":true}\"\n}"},
 {"g":"Lambda","t":"Function URL","lit":"","m":"Вбудована HTTPS-адреса функції без API Gateway. Auth: AWS_IAM або NONE (публічно). Є CORS.","a":"Простіше й дешевше за API Gateway, але без його можливостей (кеш, usage plans тощо).","tip":"","q":"Що таке Function URL?","ex":"MyFunction:\n  Properties:\n    FunctionUrlConfig:\n      AuthType: AWS_IAM"},
 {"g":"Lambda","t":"EMF","lit":"Embedded Metric Format","m":"Спеціальний JSON у лог, з якого CloudWatch сам робить метрику без PutMetricData.","a":"Powertools Metrics робить це за вас. Це рекомендований спосіб власних метрик у Lambda.","tip":"","q":"Що таке EMF і навіщо?","d":"Embedded Metric Format: ви пишете спеціальний JSON у лог, і CloudWatch сам перетворює його на метрику. Не треба окремого виклику API.","ex":"{\n  \"_aws\": {\"CloudWatchMetrics\": [{\"Namespace\": \"App\", \"Dimensions\": [[\"service\"]],\n    \"Metrics\": [{\"Name\": \"Orders\", \"Unit\": \"Count\"}]}]},\n  \"service\": \"shop\",\n  \"Orders\": 1\n}"},
 {"g":"Lambda","t":"Lambda@Edge vs CloudFront Functions","lit":"","m":"Lambda@Edge: us-east-1, лише версія, без env і VPC, 30 с. CloudFront Functions: 10 КБ, JS, дешево, прості заголовки й URL.","a":"Якщо логіка важча або потрібна мережа, обирайте Lambda@Edge.","tip":"","q":"Чим Lambda@Edge відрізняється від CloudFront Functions?","d":"Обидві виконують код на краю CDN, щоб міняти запит чи відповідь. CloudFront Functions це дуже легкі JS-скрипти, Lambda@Edge це повноцінні Lambda з більшими можливостями."},
 {"g":"Lambda","t":"Powertools","lit":"","m":"Logger (JSON, cold_start), Parser (перевірка події), Idempotency (DynamoDB), Metrics (EMF), Tracer (X-Ray).","a":"Тип із @types/aws-lambda лише підказує редактору форму події і під час роботи нічого не перевіряє. Parser у Powertools перевіряє подію насправді.","tip":"","q":"Які модулі має Powertools і чим Parser відрізняється від типів?","d":"Офіційна бібліотека AWS для Lambda: структурований лог (як SLF4J із JSON та MDC), метрики, трейсинг, перевірка подій, ідемпотентність."},
 {"g":"SQS","t":"Параметри SQS","lit":"","m":"Retention 60 с - 14 днів (типово 4). Visibility 0 - 12 год (типово 30 с). Long polling до 20 с. Delay до 15 хв. Розмір 1 МіБ.","a":"Повідомлення більше 1 МіБ: Extended Client Library кладе тіло в S3, а в чергу йде посилання.","tip":"","q":"Які ключові параметри черги SQS?"},
 {"g":"SQS","t":"Standard vs FIFO","lit":"","m":"Standard: at-least-once, best-effort порядок. FIFO: .fifo, порядок у межах MessageGroupId, дедуплікація 5 хв.","a":"FIFO обробляє 300 запитів на секунду на дію, або 3000 повідомлень на секунду, якщо слати пачками по 10.","tip":"","q":"Чим Standard черга відрізняється від FIFO?"},
 {"g":"SQS","t":"MessageGroupId","lit":"","m":"Лінія порядку у FIFO: повідомлення групи йдуть по одному, різні групи паралельно.","a":"Схоже на ключ повідомлення в Kafka (він визначає партицію), а не на group.id консьюмера.","tip":"","q":"Що таке MessageGroupId?","d":"У FIFO-черзі повідомлення однієї групи йдуть строго по порядку. Схоже на ключ повідомлення в Kafka, який визначає партицію.","ic":"🛒","cap":"У FIFO-черзі повідомлення з однаковим ключем групи обробляються по порядку. Різні групи можуть оброблятися паралельно."},
 {"g":"SQS","t":"Вартість SQS","lit":"","m":"Платять за запити, не за зберігання. Кожні 64 КБ це окремий запит. 1 млн запитів на місяць безкоштовно.","a":"Long polling (очікування до 20 с) дешевший за short: менше порожніх відповідей, а кожна відповідь це запит.","tip":"","q":"За що платять у SQS?"},
 {"g":"SQS","t":"SSE-SQS vs SSE-KMS","lit":"","m":"Шифрується лише тіло, лише нові повідомлення. Ключ alias/aws/sqs не дає викликати Lambda в іншому акаунті.","a":"До зашифрованої черги можна звертатися лише по HTTPS і з підписом SigV4.","tip":"","q":"Що шифрується в SQS і яке обмеження ключа alias/aws/sqs?"},
 {"g":"SQS","t":"DLQ: де ставити","lit":"","m":"SQS-джерело: RedrivePolicy на черзі (maxReceiveCount). Lambda async: DeadLetterConfig на функції. SNS: RedrivePolicy на підписці. EventBridge: DLQ цілі.","a":"Для SQS-тригера DLQ на функції не працює: її треба ставити на саму чергу.","tip":"Тригер SQS: DLQ на чергу.","q":"Де налаштовується DLQ у SQS, Lambda async, SNS і EventBridge?","d":"Dead-letter queue налаштовується в різних місцях залежно від джерела: для SQS на самій черзі, для асинхронної Lambda на функції, для SNS на підписці.","ex":"{\n  \"deadLetterTargetArn\": \"arn:aws:sqs:eu-north-1:111122223333:orders-dlq\",\n  \"maxReceiveCount\": 5\n}"},
 {"g":"SQS","t":"Visibility timeout ≥ 6 × timeout функції","lit":"","m":"Правило для Lambda з SQS. З вікном пачки: 6 × timeout плюс MaximumBatchingWindowInSeconds.","a":"У redrive policy черги maxReceiveCount ставлять не менше 5, щоб Lambda встигла кілька разів повторити спробу, перш ніж повідомлення піде в DLQ.","tip":"","q":"Яким має бути visibility timeout відносно timeout функції?","ic":"🙈⏱️","cap":"Коли Lambda бере повідомлення з SQS, воно на якийсь час ховається. Якщо його не видалили за цей час, воно знову з'являється, тому цей час має бути достатньо довгим."},
 {"g":"SQS","t":"ReportBatchItemFailures","lit":"","m":"Функція повертає batchItemFailures з itemIdentifier: повертаються лише невдалі повідомлення, а не вся пачка.","a":"Без цього режиму одна помилка повертає в чергу всю пачку. У FIFO функція має зупинитися після першої помилки, щоб не порушити порядок.","tip":"","q":"Що робить ReportBatchItemFailures?","d":"Режим, коли функція повертає список лише невдалих повідомлень пачки, і в чергу повертаються лише вони. Без цього при помилці вся пачка обробляється знову.","ex":"def handler(event, context):\n    failed = []\n    for r in event[\"Records\"]:\n        if not process(r):\n            failed.append({\"itemIdentifier\": r[\"messageId\"]})\n    return {\"batchItemFailures\": failed}"},
 {"g":"SQS","t":"Розмір пачки Lambda з SQS","lit":"","m":"Standard до 10 000 (понад 10 потрібне вікно не менше 1 с), FIFO до 10. Вікно лише для Standard, до 5 хв.","a":"Maximum concurrency обмежує, скільки одночасних викликів дозволено, щоб Lambda не перевантажила базу.","tip":"","q":"Який розмір пачки Lambda з SQS і навіщо Maximum concurrency?"},
 {"g":"SQS","t":"Redrive DLQ","lit":"","m":"StartMessageMoveTask працює лише для DLQ, джерело якої SQS. Для DLQ від Lambda чи SNS не працює.","a":"Для DLQ від Lambda чи SNS беруть тіло повідомлення й викликають функцію знову вручну (aws lambda invoke).","tip":"","q":"Чи можна зробити redrive з DLQ і коли?"},
 {"g":"SQS","t":"Retention DLQ","lit":"","m":"Має бути довшим за retention джерельної черги: у Standard відлік від початкового часу.","a":"Для моніторингу ставлять alarm на метрику ApproximateNumberOfMessagesVisible зі значенням не менше 1: в DLQ щось з'явилося.","tip":"","q":"Яким має бути retention DLQ і який alarm на неї?"},
 {"g":"SNS","t":"SNS FIFO","lit":"","m":"Доставка лише в SQS (FIFO і Standard). Не email, SMS, HTTP, mobile. Lambda лише через чергу.","a":"Якщо на підписці є filter policy, FIFO-топік гарантує «не більше одного разу» (at-most-once), бо частина повідомлень відфільтровується.","tip":"","q":"Які обмеження має SNS FIFO топік?","d":"Різновид SNS-топіка зі строгим порядком і дедуплікацією. Доставляє лише в черги SQS."},
 {"g":"SNS","t":"Підтвердження підписки","lit":"","m":"Потрібне для HTTP(S), email і ресурсів в іншому акаунті. Email у PendingConfirmation, доки не натиснути посилання.","a":"Якщо власник SQS-черги сам створює підписку, вона підтверджується автоматично.","tip":"","q":"Для яких протоколів SNS потрібне підтвердження підписки?"},
 {"g":"SNS","t":"Raw message delivery","lit":"","m":"Прибирає JSON-конверт SNS. Лише SQS, HTTP/S, Firehose. Для SQS максимум 10 атрибутів.","a":"Якщо в коді споживача двічі викликається JSON.parse (конверт, потім повідомлення), це ознака, що raw delivery вимкнено.","tip":"","q":"Що робить raw message delivery?","d":"Типово SNS огортає ваше повідомлення в JSON-конверт. Raw delivery прибирає конверт, і споживач бачить лише ваше повідомлення."},
 {"g":"SNS","t":"Filter policy","lit":"","m":"Живе на підписці. AND між ключами, OR між значеннями. 5 ключів, 150 комбінацій, до 15 хв на зміну.","a":"Типово фільтр працює за атрибутами повідомлення (MessageAttributes). Щоб фільтрувати за тілом, треба scope MessageBody, і тіло має бути коректним JSON.","tip":"5 / 150 / 15 хв.","q":"Де живе SNS filter policy і які в неї ліміти?","d":"Правило на підписці SNS, яке пропускає лише потрібні повідомлення за атрибутами. Як селектор повідомлень у JMS.","ex":"{\n  \"eventType\": [\"order.paid\"],\n  \"amount\": [{\"numeric\": [\">\", 100]}]\n}","ic":"🧲","cap":"Підписка SNS може отримувати не все, а лише повідомлення з потрібними атрибутами. Решту SNS відкидає сам."},
 {"g":"SNS","t":"Queue policy для SNS → SQS","lit":"","m":"sqs:SendMessage для sns.amazonaws.com з умовою aws:SourceArn (проти confused deputy).","a":"Якщо черга зашифрована ключем KMS, у key policy цього ключа треба дозволити SNS. Ключ alias/aws/sqs не підходить, потрібен свій.","tip":"","q":"Яка політика потрібна черзі, щоб SNS міг у неї писати?","ex":"{\n  \"Effect\": \"Allow\",\n  \"Principal\": {\"Service\": \"sns.amazonaws.com\"},\n  \"Action\": \"sqs:SendMessage\",\n  \"Resource\": \"arn:aws:sqs:eu-north-1:111122223333:orders\",\n  \"Condition\": {\"ArnEquals\": {\"aws:SourceArn\": \"arn:aws:sns:eu-north-1:111122223333:orders-topic\"}}\n}"},
 {"g":"SNS","t":"Fan-out","lit":"","m":"Один топік, у кожного споживача своя SQS-черга. Буфер, повтори й DLQ кожному окремо.","a":"Якщо потрібно, щоб одна подія S3 запускала дві різні обробки: S3 → SNS → дві черги SQS, або S3 → EventBridge → два правила.","tip":"","q":"Що таке fan-out SNS → SQS і як запустити дві обробки на подію S3?","d":"Одна подія розходиться на кількох незалежних споживачів: топік SNS і по черзі SQS на кожного. Як Kafka topic, який читають кілька consumer-груп.","ic":"📢","cap":"Одне повідомлення надсилають в SNS, а воно розкладається по кількох чергах SQS. Кожен споживач бере зі своєї черги й не заважає іншим."},
 {"g":"SNS","t":"Повтори доставки SNS","lit":"","m":"Помилка клієнта: без повторів. SQS чи Lambda: до 100 015 повторів за 23 дні. Email, SMS, push: 50 за 6 год.","a":"DLQ для підписки SNS це лише SQS-черга того ж акаунта й регіону.","tip":"","q":"Як SNS повторює доставку при помилках?"},
 {"g":"EventBridge","t":"Event pattern: логіка","lit":"","m":"Масив означає АБО в межах поля, кілька полів означає І. Значення в патерні завжди в масиві.","a":"Корисні оператори: prefix (починається з), suffix (закінчується на), anything-but (все, крім), numeric (числа), exists (поле є), equals-ignore-case.","tip":"","q":"Як працює збіг event pattern в EventBridge?","d":"Event pattern це JSON-шаблон, за яким правило EventBridge вирішує, чи брати подію. Усередині поля масив означає «або», а кілька полів означають «і».","ex":"{\n  \"source\": [\"aws.s3\"],\n  \"detail-type\": [\"Object Created\"],\n  \"detail\": {\"object\": {\"key\": [{\"prefix\": \"images/\"}]}}\n}","ic":"🧩","cap":"Правило EventBridge перевіряє подію за шаблоном. Кілька значень в одному полі означає «або», а різні поля мають збігтися всі («і»)."},
 {"g":"EventBridge","t":"Хто дозволяє доставку EventBridge","lit":"","m":"Lambda, SQS, SNS: resource-based policy на цілі. Step Functions, Kinesis, ECS, інша шина: IAM-роль правила.","a":"","tip":"","q":"Хто дозволяє EventBridge викликати ціль: політика чи роль?"},
 {"g":"EventBridge","t":"Два рівні DLQ","lit":"","m":"Ціль правила (доставка): 24 год і до 185 спроб. Lambda async (код): 2 повтори, потім DLQ.","a":"Якщо подія зникла через 24 год, а в DLQ функції порожньо, шукайте проблему в доставці EventBridge → ціль (права чи resource-based policy).","tip":"","q":"Які два рівні DLQ є при EventBridge → Lambda?","d":"Є дві різні проблеми: EventBridge не зміг доставити подію в ціль (DLQ цілі правила) і функція отримала, але впала (DLQ чи destination функції)."},
 {"g":"EventBridge","t":"EventBridge Scheduler / cron","lit":"","m":"Розклад: rate(...), cron(...), разовий at(...), часові пояси. Cron має 6 полів і ? в одному з полів дня.","a":"Приклад: cron(0 3 * * ? *) запускає щодня о 03:00 UTC.","tip":"","q":"Як запустити щось за розкладом в EventBridge?","ex":"cron(0 3 * * ? *)\nrate(5 minutes)"},
 {"g":"EventBridge","t":"Archive & Replay","lit":"","m":"Архів подій шини і повторна відправка за вибраний період.","a":"Корисно, щоб відтворити збій або перевірити нову ціль на старих подіях.","tip":"","q":"Що таке Archive & Replay?","d":"Archive зберігає події шини, а Replay відправляє їх знову за обраний період. Корисно, щоб відтворити збій чи протестувати нову ціль."},
 {"g":"EventBridge","t":"Pipes","lit":"","m":"З'єднання «джерело → фільтр → збагачення → ціль» для SQS, Kinesis, DynamoDB Streams.","a":"Замінює код-клей між джерелом і ціллю.","tip":"","q":"Що таке EventBridge Pipes?","d":"Керована труба від джерела (SQS, Kinesis, DynamoDB Streams) до цілі, з необов'язковим фільтром і збагаченням. Замінює код-клей."},
 {"g":"EventBridge","t":"EventBridge vs SNS vs SQS","lit":"","m":"EventBridge: події AWS, потужний фільтр. SNS: розсилка багатьом. SQS: буфер, власний темп.","a":"Для запуску за розкладом без сервера використовують EventBridge Scheduler.","tip":"","q":"Коли EventBridge, коли SNS, а коли SQS?","d":"Три способи передати подію. EventBridge маршрутизує за правилами. SNS розсилає всім підписникам. SQS це буфер, з якого споживач бере у власному темпі.","ic":"🚌📣📬","cap":"EventBridge вирішує за правилами, куди доставити подію. SNS розсилає всім підписникам. SQS зберігає повідомлення, доки споживач сам не забере."},
 {"g":"DynamoDB","t":"Partition key","lit":"","m":"Має мати багато різних значень. Погано: status. Добре: userId.","a":"Hot partition означає, що забагато запитів б'є в один розділ, і він тротлиться, хоч сумарної потужності вистачає.","tip":"","q":"Яким має бути partition key у DynamoDB?","d":"Ключ, за яким DynamoDB розподіляє записи по розділах. Як ключ шардування: з малим набором значень (наприклад, status) всі запити б'ють в один розділ.","ic":"🗃️🔥","cap":"DynamoDB розкладає записи по розділах за цим ключем. Якщо значень мало (наприклад, лише статус), усе піде в кілька розділів, і вони перевантажаться."},
 {"g":"DynamoDB","t":"GetItem / Query / Scan","lit":"","m":"GetItem: один запис за повним ключем. Query: один PK. Scan: усю таблицю.","a":"FilterExpression застосовується після читання, тому за відфільтровані записи ви теж платите.","tip":"","q":"Чим відрізняються GetItem, Query і Scan?","d":"Три способи читання. GetItem бере один запис за повним ключем, Query бере записи одного partition key, Scan проходить усю таблицю й дорогий.","ex":"table.query(\n    KeyConditionExpression=Key(\"userId\").eq(\"u1\")\n)"},
 {"g":"DynamoDB","t":"Пагінація","lit":"","m":"Сторінки по 1 МБ. LastEvaluatedKey передають як ExclusiveStartKey.","a":"","tip":"","q":"Як отримати наступну сторінку в DynamoDB?"},
 {"g":"DynamoDB","t":"RCU і WCU","lit":"","m":"1 RCU: 4 КБ strongly consistent (або 2 eventually). 1 WCU: 1 КБ запису.","a":"Strongly consistent читання вдвічі дорожче й не працює на GSI та Streams. Розмір завжди округлюють вгору до 4 КБ (читання) чи 1 КБ (запис).","tip":"","q":"Скільки даних покриває 1 RCU і 1 WCU?","d":"Одиниці потужності DynamoDB: Read Capacity Unit і Write Capacity Unit. 1 RCU це 4 КБ читання за секунду (strongly), 1 WCU це 1 КБ запису за секунду."},
 {"g":"DynamoDB","t":"Рецепт RCU","lit":"","m":"Розмір ÷ 4 КБ вгору, × читань за секунду, якщо eventually поділити на 2.","a":"Приклад: 5 КБ, 20 читань на секунду, eventually consistent. 5÷4 вгору це 2, ×20 це 40, ÷2 це 20 RCU. Для WCU: розмір ÷ 1 КБ вгору, помножити на кількість записів.","tip":"","q":"Як порахувати RCU?","ex":"5 КБ / 4 КБ = 1,25 → 2\n2 × 20 читань/с = 40\n40 / 2 (eventually) = 20 RCU"},
 {"g":"DynamoDB","t":"On-demand vs provisioned","lit":"","m":"On-demand: непередбачуване, платите за запит. Provisioned: стабільне, auto scaling з ціллю 70%.","a":"З provisioned на on-demand можна перемикатися до 4 разів за 24 години.","tip":"","q":"Коли on-demand, а коли provisioned у DynamoDB?"},
 {"g":"DynamoDB","t":"GSI vs LSI","lit":"","m":"GSI: будь-який ключ, будь-коли, 20, лише eventually, своя потужність. LSI: той самий PK, лише при створенні таблиці, 5, strongly можна.","a":"Запис у таблицю може тротлитися, якщо GSI не має достатньої власної потужності.","tip":"","q":"Чим GSI відрізняється від LSI?","d":"Обидва це додаткові індекси таблиці. GSI (глобальний) має власні ключі й можна створити будь-коли. LSI (локальний) має той самий partition key і створюється лише разом із таблицею.","ic":"📖","cap":"Це додаткові індекси, щоб шукати не лише за основним ключем. GSI можна додати будь-коли й з іншим ключем, а LSI лише при створенні таблиці й з тим самим основним ключем."},
 {"g":"DynamoDB","t":"Умовний запис","lit":"","m":"attribute_not_exists дає «вставити, якщо нема». Версія в умові дає оптимістичне блокування.","a":"Batch-операції не атомарні: частина записів може не пройти (дивіться UnprocessedItems). Транзакція атомарна: або все, або нічого (до 100 записів).","tip":"","q":"Як вставити запис лише якщо його нема і чим batch відрізняється від транзакції?","ex":"table.put_item(\n    Item={\"id\": \"e1\"},\n    ConditionExpression=\"attribute_not_exists(id)\",\n)"},
 {"g":"DynamoDB","t":"TTL","lit":"","m":"Атрибут Number, Unix epoch у секундах. Видалення безкоштовне, протягом кількох днів.","a":"Прострочені записи якийсь час ще читаються, тому їх фільтрують. У DynamoDB Streams таке видалення позначено як service delete, а не дія користувача.","tip":"","q":"Який формат TTL у DynamoDB і коли видаляє?","d":"Time To Live: вказаний атрибут з часом, після якого запис видалить сам DynamoDB, безкоштовно й не одразу.","ex":"table.put_item(Item={\n    \"id\": \"s1\",\n    \"expiration\": int(time.time()) + 3600,\n})","ic":"⏳💥","cap":"Ви вказуєте поле з часом, і DynamoDB сама видаляє застарілі записи. Не одразу, а протягом кількох днів, і безкоштовно."},
 {"g":"DynamoDB","t":"DynamoDB Streams","lit":"","m":"Зберігає зміни 24 години. Типи запису: KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES. Читає Lambda.","a":"Strongly consistent читання тут не підтримуються.","tip":"","q":"Що таке DynamoDB Streams?","d":"Журнал змін таблиці на 24 години. Як CDC/transaction log: кожна зміна запису стає подією, яку може обробити Lambda."},
 {"g":"DynamoDB","t":"PITR","lit":"","m":"Відновлення таблиці на будь-яку мить за останні 35 днів (не звірено).","a":"","tip":"","q":"Що таке PITR у DynamoDB?"},
 {"g":"DynamoDB","t":"Global tables","lit":"","m":"Мультирегіональна multi-active таблиця, 99,999% доступності. Режими MREC (eventual) і MRSC (strong).","a":"","tip":"","q":"Що таке Global tables у DynamoDB?"},
 {"g":"DynamoDB","t":"Idempotency (Powertools)","lit":"","m":"Ключ functionName#hash, TTL-атрибут expiration, запис живе 3600 с. Стани INPROGRESS і COMPLETE.","a":"Функції потрібні права GetItem, PutItem, UpdateItem, DeleteItem на цю таблицю.","tip":"","q":"Як працює Powertools Idempotency?","d":"Powertools запам'ятовує в DynamoDB оброблені події, щоб повтор не виконав роботу двічі. Як idempotent consumer у Kafka чи SQS.","ex":"@idempotent(persistence_store=persistence)\ndef handler(event, context):\n    return charge(event[\"orderId\"])"},
 {"g":"DynamoDB","t":"Розмір item","lit":"","m":"Один запис (item) до 400 КБ.","a":"","tip":"","q":"Який максимальний розмір запису в DynamoDB?"},
 {"g":"KMS і секрети","t":"Типи ключів KMS","lit":"","m":"Customer managed (політика, ротація, ~1 USD на місяць), AWS managed (aws/s3, політику не змінити), AWS owned (не бачите, нема CloudTrail).","a":"","tip":"","q":"Які бувають типи ключів KMS?"},
 {"g":"KMS і секрети","t":"Key policy","lit":"","m":"Обов'язкова. Без неї IAM не діє. Між акаунтами потрібні обидва боки.","a":"Без дозволу в key policy IAM-політика сама ключ не відкриє.","tip":"","q":"Що таке key policy і чим відрізняється від IAM-політики?","d":"Головна політика доступу KMS-ключа: без дозволу в ній IAM-політики не діють. Як ACL, прикріплений прямо до ключа."},
 {"g":"KMS і секрети","t":"Ротація ключа KMS","lit":"","m":"Автоматична для customer managed, період 90-2560 днів. На вимогу RotateKeyOnDemand до 10 разів. Асиметричні й HMAC не ротуються.","a":"Ротація не ламає старі дані: KMS зберігає старі версії матеріалу для розшифрування. Видалення ключа відкладається на 7-30 днів, щоб можна було скасувати.","tip":"","q":"Як ротується ключ KMS?"},
 {"g":"KMS і секрети","t":"Bucket Key: наслідки","lit":"","m":"З Bucket Key запити до KMS робляться на рівні бакета, а не кожного об'єкта. Тому в записах CloudTrail і в encryption context видно ARN бакета, а не об'єкта, і подій менше.","a":"Політики KMS, що фільтрують за ARN об'єкта, перестають спрацьовувати. Уже наявні об'єкти не змінюються: потрібен CopyObject. Не працює з DSSE-KMS.","tip":"Менше викликів, але грубіший слід.","q":"Що змінює Bucket Key в записах CloudTrail і в політиках?"},
 {"g":"KMS і секрети","t":"Дані не бачить навіть AWS","lit":"","m":"Client-side шифрування (Encryption SDK, DynamoDB Encryption Client).","a":"Якщо потрібен аудит, хто використовував ключ, беруть SSE-KMS і дивляться CloudTrail.","tip":"","q":"Що обрати, якщо дані не має бачити навіть AWS?"},
 {"g":"KMS і секрети","t":"Secrets Manager vs Parameter Store","lit":"","m":"Secrets Manager: ротація (RDS, DocumentDB, Redshift), реплікація, платно. Parameter Store: конфіг, SecureString, Standard безкоштовно.","a":"Секрет, який треба автоматично змінювати: Secrets Manager.","tip":"","q":"Чим Secrets Manager відрізняється від Parameter Store?","d":"Обидва зберігають конфіг і секрети. Secrets Manager вміє автоматичну ротацію паролів (як Vault). Parameter Store простіший і дешевший (як Spring Cloud Config)."},
 {"g":"KMS і секрети","t":"ACM сертифікат","lit":"","m":"Публічні безкоштовні для ELB, CloudFront, API Gateway. Автооновлення за 60 днів з DNS-валідацією. Імпортований сам не оновлюється.","a":"Для CloudFront сертифікат створюють лише в us-east-1. Для решти сервісів у тому ж регіоні, що й ресурс.","tip":"","q":"Де створювати сертифікат ACM і чи платний?","d":"AWS Certificate Manager видає і сам оновлює TLS-сертифікати для ELB, CloudFront та API Gateway, безкоштовно для публічних."},
 {"g":"KMS і секрети","t":"Macie / Logs data protection","lit":"","m":"Macie шукає PII у S3. CloudWatch Logs data protection маскує чутливі дані в логах.","a":"У коді не логуйте сирі чутливі дані.","tip":"","q":"Що таке Macie і CloudWatch Logs data protection?"},
 {"g":"API Gateway","t":"HTTP API","lit":"","m":"Дешевший, лише regional, вбудований JWT-авторизатор, автодеплой. Без API keys, кешу, валідації, WAF, X-Ray.","a":"","tip":"","q":"Чим характеризується HTTP API?","d":"Дешевший, швидший і простіший різновид API Gateway з вбудованим JWT-авторизатором, але без багатьох функцій REST API."},
 {"g":"API Gateway","t":"REST API","lit":"","m":"Дорожчий, але має API keys і usage plans, кеш, валідацію, mapping, WAF, X-Ray, resource policy, canary, private endpoint.","a":"Просунуті функції (API keys, кеш, WAF тощо) є лише в REST API.","tip":"","q":"Чим характеризується REST API?","d":"Повніший різновид API Gateway: API keys, usage plans, кеш, валідація, трансформації, WAF. Як повноцінний API-шлюз (на кшталт Spring Cloud Gateway з купою фільтрів)."},
 {"g":"API Gateway","t":"Типи інтеграцій","lit":"","m":"Lambda proxy (AWS_PROXY), Lambda non-proxy (mapping templates), HTTP, AWS service (SQS, DynamoDB без Lambda), Mock.","a":"У proxy-інтеграції функція має повернути statusCode і body як рядок, інакше API Gateway відповість 502.","tip":"","q":"Які типи інтеграцій є в API Gateway?","d":"Інтеграція це те, що API Gateway викликає за маршрутом: Lambda (proxy або з трансформацією), HTTP-бекенд, сервіс AWS напряму чи Mock."},
 {"g":"API Gateway","t":"Request validator","lit":"","m":"Перевіряє тіло за Model (JSON Schema) до виклику Lambda. Невалідне: 400, Lambda не коштує.","a":"Mapping templates (VTL) працюють лише в non-proxy інтеграції.","tip":"","q":"Що робить request validator?","d":"Перевірка запиту на рівні API Gateway до бекенду, за схемою (JSON Schema). Як @Valid, що спрацьовує ще до контролера."},
 {"g":"API Gateway","t":"Коди відповідей API Gateway","lit":"","m":"400 помилка запиту, 401 токен, 403 заборонено, 429 ліміт, 500, 502 відповідь Lambda, 503, 504 timeout.","a":"502 означає, що відповідь Lambda має неправильний формат, 504 означає, що інтеграція не вклалася в таймаут.","tip":"","q":"Що означають коди 400, 401, 403, 429, 500, 502, 503, 504 в API Gateway?"},
 {"g":"API Gateway","t":"Deployment REST API","lit":"","m":"Зміна REST API діє лише після deployment на stage.","a":"","tip":"","q":"Коли зміни REST API набувають чинності?"},
 {"g":"API Gateway","t":"Авторизація API Gateway","lit":"","m":"IAM SigV4, Cognito authorizer, Lambda authorizer, JWT (HTTP API), resource policy (IP, акаунти, VPC), mTLS, WAF.","a":"API key лише ідентифікує клієнта й ділить квоти (usage plan), але не авторизує.","tip":"","q":"Які способи авторизації є в API Gateway?"},
 {"g":"API Gateway","t":"Stage variables","lit":"","m":"Середовища через stage variables і aliases Lambda; дозвіл на виклик alias дається вручну.","a":"Для власного домену потрібен сертифікат у ACM.","tip":"","q":"Для чого stage variables і як з ними aliases Lambda?","d":"Змінні, прив'язані до стадії API (dev, prod), які можна підставити в інтеграції. Як Spring profile для різних середовищ."},
 {"g":"S3 доступ і шифрування","t":"Presigned URL: життя і помилки","lit":"","m":"Консоль дає посилання на 1 хв - 12 год, CLI та SDK до 7 днів. Але якщо посилання створено тимчасовими ключами (наприклад ролі), воно помре разом із ними, навіть якщо ви вказали довший термін.","a":"SignatureDoesNotMatch означає, що підпис у посиланні не збігся з тим, що порахував сервер. Типові причини: годинник комп'ютера йде неправильно, проксі змінив заголовки, або посилання використали з іншим HTTP-методом, ніж при підписі. Термін перевіряється лише на початку запиту: завантаження, що вже йде, не обірветься.","tip":"","q":"Скільки живе presigned URL і що дає SignatureDoesNotMatch?"},
 {"g":"API Gateway","t":"Метрики API Gateway","lit":"","m":"Count, 4XXError, 5XXError, Latency (весь шлях), IntegrationLatency (бекенд). Різниця: час у Gateway.","a":"Execution logs доступні лише для REST API.","tip":"","q":"Які метрики дає API Gateway?"},
 {"g":"Кешування","t":"Lazy loading vs write-through","lit":"","m":"Lazy loading: заповнення при першому читанні, у кеші лише потрібне. Write-through: заповнення при записі, дані свіжі.","a":"Якщо кеш віддає застаріле, обирають write-through або коротший TTL. Типова пара: lazy loading плюс TTL.","tip":"","q":"Чим lazy loading відрізняється від write-through?","d":"Дві стратегії наповнення кешу. Lazy: кладемо при першому промаху, як @Cacheable. Write-through: пишемо в кеш одночасно з базою.","ex":"@Cacheable(\"users\")\npublic User find(String id) {\n    return repository.findById(id);\n}","ic":"🧠","cap":"Lazy loading: кладемо в кеш лише тоді, коли дані вперше запросили. Write-through: оновлюємо кеш одразу при кожному записі в базу."},
 {"g":"Кешування","t":"DAX","lit":"","m":"Кеш в пам'яті для DynamoDB, мікросекунди, у VPC, мінімальні зміни коду. Добрий для гарячих ключів, hit rate більше 90%.","a":"Не допоможе, якщо потрібні strongly consistent читання, багато записів або мало повторних читань.","tip":"","q":"Що таке DAX і де він не допоможе?","d":"DynamoDB Accelerator: кеш в пам'яті з тим самим API, що в DynamoDB. Стоїть перед таблицею, як кеш над репозиторієм.","ic":"📝🗄️","cap":"Це кеш прямо перед DynamoDB з тим самим API. Повторні читання віддаються з пам'яті набагато швидше."},
 {"g":"Кешування","t":"DAX vs ElastiCache","lit":"","m":"DAX лише для DynamoDB, без коду кешування. ElastiCache для решти (сесії, RDS, складні обчислення), логіку пишете самі.","a":"","tip":"","q":"Чим DAX відрізняється від ElastiCache?"},
 {"g":"Кешування","t":"Redis/Valkey vs Memcached","lit":"","m":"Redis/Valkey: до 5 реплік, Multi-AZ, персистентність, sorted sets, pub/sub. Memcached: простий розподілений кеш без реплікації.","a":"Якщо потрібна відмовостійкість або рейтинги (sorted sets), беруть Redis/Valkey.","tip":"","q":"Чим Redis/Valkey відрізняється від Memcached?","d":"Обидва це кеш у пам'яті. Redis/Valkey багатший (структури даних, реплікація, персистентність). Memcached простіший, лише ключ-значення."},
 {"g":"Кешування","t":"CloudFront cache key","lit":"","m":"За замовчуванням домен і шлях. Додавання заголовків, cookie, query знижує hit ratio.","a":"Cache policy задає ключ кешу й TTL. Origin request policy передає дані на origin, не додаючи їх до ключа.","tip":"","q":"Що входить у cache key CloudFront?","d":"Те, за чим CloudFront вирішує, чи це той самий запис кешу (домен, шлях і, за налаштуванням, заголовки/query). Як ключ у @Cacheable."},
 {"g":"Кешування","t":"CloudFront signed URL vs cookie","lit":"","m":"Signed URL: один файл. Signed cookies: багато файлів (розділ сайту). S3 presigned: напряму в S3, не через кеш.","a":"Invalidation кешу після певного ліміту платна, тому краще давати файлам нові імена при зміні (версіоновані).","tip":"","q":"Чим CloudFront signed URL відрізняється від signed cookie?"},
