 {"g": "Контейнери", "t": "EKS томи", "lit": "", "q": "Які сховища підтримує EKS?", "m": "Маніфест StorageClass і драйвер CSI. EBS, EFS (працює з Fargate), FSx for Lustre, FSx for NetApp ONTAP.", "a": "CSI це Container Storage Interface.", "tip": "EFS і Fargate разом.", "d": "Постійні томи для подів.", "ic": "💾", "cap": "Постійні томи для подів.", "why": "Стандарт Kubernetes."},
 {"g": "Контейнери", "t": "ECR публічний", "lit": "", "q": "Які репозиторії є в ECR?", "m": "Приватні й публічні (ECR Public Gallery, gallery.ecr.aws). Інтегрований з ECS, образи зберігаються в S3. Сканування, версіонування, теги, lifecycle.", "a": "", "tip": "Приватні й Public Gallery.", "d": "Склад образів.", "ic": "🏛️", "cap": "Склад образів.", "why": "Єдине місце для образів."},
 {"g": "CI/CD", "t": "CodeCommit", "lit": "", "q": "Що таке CodeCommit і який його статус?", "m": "Приватні Git-репозиторії AWS, без ліміту розміру, керовані, висока доступність, код лишається в акаунті. З 6.06.2024 не приймав нових клієнтів, 24.11.2025 AWS повернув загальну доступність.", "a": "", "tip": "Git всередині AWS.", "d": "Приватний Git у вашому акаунті.", "ic": "📚", "cap": "Git всередині AWS.", "why": "Безпека й відповідність."},
 {"g": "CI/CD", "t": "Категорії дій CodePipeline", "lit": "", "q": "Які категорії дій у CodePipeline і приклади?", "m": "Source (CodeCommit, ECR, S3, Bitbucket, GitHub). Build (CodeBuild, Jenkins, CloudBees, TeamCity). Test (CodeBuild, Device Farm, сторонні). Deploy (CodeDeploy, Beanstalk, CloudFormation, ECS, S3). Invoke (Lambda, Step Functions).", "a": "Артефакти етапів у S3.", "tip": "Source, Build, Test, Deploy, Invoke.", "d": "П'ять типів дій конвеєра.", "ic": "🧭", "cap": "П'ять типів дій конвеєра.", "why": "Один конвеєр поєднує різні інструменти."},
 {"g": "CI/CD", "t": "CodePipeline troubleshooting", "lit": "", "q": "Як отримати сповіщення про збої CodePipeline?", "m": "Зміни стану pipeline/етапу/дії надходять в EventBridge (CloudWatch Events): події для невдалих pipeline чи скасованих етапів. Збій етапу зупиняє pipeline. CloudTrail аудитує виклики API.", "a": "Деталі збою видно в консолі.", "tip": "Збій дає подію в EventBridge.", "d": "Збій конвеєра генерує подію.", "ic": "🚨", "cap": "Збій конвеєра генерує подію.", "why": "Автоматичні сповіщення."},
 {"g": "CI/CD", "t": "CodeBuild як влаштований", "lit": "", "q": "Які особливості CodeBuild?", "m": "Без серверів і черги, оплата за хвилини, Docker під капотом (готовий чи власний образ), buildspec.yml у корені або в консолі, логи в S3 і CloudWatch Logs, артефакти в S3 (KMS), кеш у S3.", "a": "Секції buildspec: env, phases, artifacts, cache.", "tip": "Без серверів, платиш за хвилини.", "d": "Збірка в одноразовому контейнері.", "ic": "🔨", "cap": "Збірка в одноразовому контейнері.", "why": "Не тримати Jenkins."},
 {"g": "CI/CD", "t": "CodeDeploy на EC2: in-place чи blue/green", "lit": "", "q": "Чим in-place відрізняється від blue/green в CodeDeploy на EC2?", "m": "In-place оновлює наявні інстанси (нові інстанси ASG теж отримують деплой). Blue/Green створює нову ASG (налаштування копіюються), потрібен ELB, старі інстанси можна завершити чи залишити.", "a": "Blue/green лише для EC2, on-premises не підтримуються.", "tip": "In-place: ті ж. Blue/green: нова ASG і ELB.", "d": "Оновити на місці чи побудувати поруч нове.", "ic": "🔵🟢", "cap": "Оновити на місці чи побудувати поруч.", "why": "Менший ризик і швидший відкат."},
 {"g": "CI/CD", "t": "CodeDeploy rollback", "lit": "", "q": "Як працює відкат в CodeDeploy?", "m": "Відкат це повторний деплой раніше розгорнутої ревізії. Автоматично (збій деплою чи поріг CloudWatch Alarm), вручну або вимкнений. Розгортається остання робоча ревізія як новий деплой, а не відновлена версія.", "a": "", "tip": "Відкат це новий деплой старої версії.", "d": "Старий код розгортається знову.", "ic": "⏪", "cap": "Відкат це новий деплой старої версії.", "why": "Однакова модель для всіх деплоїв."},
 {"g": "CI/CD", "t": "CodeArtifact resource policy", "lit": "", "q": "Що вміє resource policy в CodeArtifact?", "m": "Дати іншому акаунту доступ. Принципал може читати всі пакети репозиторію або жодного. Підтримує Maven, Gradle, npm, yarn, twine, pip, NuGet.", "a": "", "tip": "Усі пакети або жодного.", "d": "Спільний доступ до пакетів.", "ic": "📦", "cap": "Спільний доступ до пакетів.", "why": "Централізоване сховище залежностей."},
 {"g": "CI/CD", "t": "CodeGuru Reviewer і Profiler", "lit": "", "q": "Чим CodeGuru Reviewer відрізняється від Profiler?", "m": "Reviewer: автоматичне рев'ю коду, статичний аналіз (розробка). Profiler: рекомендації з продуктивності в runtime (прод), напр. зайвий CPU на логуванні, heap summary. Reviewer з 7.11.2025 без нових асоціацій репозиторіїв.", "a": "Статус Profiler не звірено.", "tip": "Reviewer дивиться код, Profiler дивиться роботу.", "d": "Два погляди: код і виконання.", "ic": "🔍", "cap": "Два погляди: код і виконання.", "why": "Різні етапи життя."},
 {"g": "CI/CD", "t": "Параметри агента CodeGuru Profiler", "lit": "", "q": "Які параметри агента CodeGuru Profiler?", "m": "MaxStackDepth (глибина стеків: при 2 і ланцюгу A-B-C-D оцінюються A і B), MemoryUsageLimitPercent, MinimumTimeForReportingInMilliseconds, ReportingIntervalInMilliseconds, SamplingIntervalInMilliseconds.", "a": "", "tip": "П'ять параметрів: глибина, памʼять, мін. час, інтервал, семплювання.", "d": "П'ять ручок профайлера.", "ic": "⚙️", "cap": "П'ять ручок профайлера.", "why": "Контроль накладних витрат."},
 {"g": "KMS і секрети", "t": "In flight, at rest, client-side", "lit": "", "m": "In flight це TLS (захист від MITM). Server-side at rest: сервер шифрує після отримання. Client-side: шифрує клієнт, сервер ніколи не розшифровує.", "a": "Фраза іспиту: слово encryption для сервісу AWS майже завжди означає KMS. При client-side сервер не повинен вміти розшифрувати, може бути envelope encryption.", "tip": "In flight у дорозі, at rest на диску, client-side лише у клієнта.", "q": "Чим відрізняються три способи шифрування: in flight, server-side at rest і client-side?", "d": "Шифрування в дорозі закриває канал, шифрування на сервері закриває диск, а клієнтське закриває навіть від самого сервера. Як лист: конверт, сейф у банку, або лист, який розкриє лише адресат.", "ic": "🔐", "cap": "Три місця, де можна замкнути дані: у дорозі, на сервері, чи ще до відправки.", "why": "Кожен спосіб закриває свою загрозу, тому їх комбінують."},
 {"g": "KMS і секрети", "t": "Симетричний і асиметричний ключ KMS", "lit": "", "m": "Симетричний (AES-256): один ключ для шифрування й розшифрування, його ніколи не отримуєш у відкритому вигляді. Асиметричний (RSA, ECC): пара public і private, підтримує Sign/Verify.", "a": "Сервіси AWS з KMS працюють із симетричними. Public key можна завантажити. Сценарій асиметричного: шифрування поза AWS тими, хто не може викликати KMS API.", "tip": "Усередині AWS симетричний, назовні асиметричний.", "q": "Чим симетричний ключ KMS відрізняється від асиметричного і коли потрібен асиметричний?", "d": "Симетричний це один ключ від замка. Асиметричний це пара: відкритий замок, який можна роздати всім, і закритий ключ, який лишається в сейфі.", "ic": "🗝️", "cap": "Один ключ на все, або пара: замок для всіх і ключ для себе.", "why": "Назовні не можна давати доступ до KMS, тому дають public key."},
 {"g": "KMS і секрети", "t": "API KMS: Encrypt, GenerateDataKey, Decrypt", "lit": "", "m": "Encrypt і Decrypt до 4 КБ. GenerateDataKey дає data key у відкритому і зашифрованому вигляді. GenerateDataKeyWithoutPlaintext лише зашифрований. GenerateRandom дає випадкові байти.", "a": "Усе понад 4 КБ означає envelope encryption через GenerateDataKey. GenerateDataKeyWithoutPlaintext для шифрування пізніше, потім потрібен Decrypt.", "tip": "Понад 4 КБ означає GenerateDataKey.", "q": "Які основні API KMS і що кожне робить?", "d": "Encrypt приймає лише маленький секрет. Для великого файла KMS видає разовий ключ даних, файл шифрують локально.", "ex": "aws kms generate-data-key --key-id alias/app --key-spec AES_256", "ic": "🧰", "cap": "Маленьке йде в KMS, велике шифрують отриманим ключем даних.", "why": "Так дані не їдуть у KMS, швидше й дешевше."},
 {"g": "KMS і секрети", "t": "ThrottlingException в KMS", "lit": "", "m": "Перевищено квоту запитів. Повторити з exponential backoff.", "a": "Криптооперації діляться однією квотою. Для GenerateDataKey використати кеш ключів даних (Encryption SDK). Квоту можна підняти через API чи підтримку.", "tip": "Throttling лікується паузою, а не повтором одразу.", "q": "Що робити, коли KMS повертає ThrottlingException?", "d": "KMS каже: ви звертаєтесь надто часто. Клієнт чекає й пробує знову, щоразу довше.", "ic": "🚦", "cap": "Забагато звернень: зачекай і пробуй із зростаючою паузою.", "why": "Інакше повтори лише додадуть навантаження."},
 {"g": "KMS і секрети", "t": "Копіювання знімка EBS між акаунтами", "lit": "", "m": "Знімок шифрують своїм customer managed ключем, додають key policy для іншого акаунта, діляться знімком; в цільовому акаунті роблять копію і шифрують ключем свого акаунта, потім створюють том.", "a": "Між регіонами знімок перешифровується ключем цільового регіону (ReEncrypt). AWS managed ключ не підходить, бо його політику не змінити.", "tip": "Свій ключ, дозвіл, поділитись, скопіювати своїм ключем.", "q": "Як передати зашифрований знімок EBS іншому акаунту?", "d": "Ключ KMS прив'язаний до регіону й акаунта, тому копія має бути перешифрована ключем одержувача.", "ic": "📦", "cap": "Знімок їде в іншому замку: приймач міняє замок на свій.", "why": "Ключ чужого акаунта в одержувача не діє."},
 {"g": "KMS і секрети", "t": "Key policy: типова і власна", "lit": "", "m": "Типова створюється, якщо власної не дано: повний доступ для root акаунта. Власна задає, хто користується ключем і хто ним адмініструє, потрібна для cross-account.", "a": "Схожа на bucket policy, але без key policy керувати доступом до ключа не можна.", "tip": "Key policy: без неї ніяк.", "q": "Чим типова key policy відрізняється від власної і чим key policy схожа на bucket policy?", "d": "Це паспорт ключа: хто може ним користуватися. Типовий паспорт дає все власнику акаунта.", "ic": "📜", "cap": "Правила ключа: без них IAM не діє.", "why": "KMS не довіряє IAM автоматично."},
 {"g": "KMS і секрети", "t": "AWS Encryption SDK і data key caching", "lit": "", "m": "Реалізує envelope encryption за вас, є й CLI. Data key caching використовує data key повторно.", "a": "Плюс: менше викликів KMS. Мінус: компроміс безпеки. Кеш LocalCryptoMaterialsCache обмежують за віком, байтами й кількістю повідомлень (не звірено).", "tip": "Кеш ключів: швидше, але менш безпечно.", "q": "Що робить AWS Encryption SDK і який компроміс дає data key caching?", "d": "Замість нового ключа на кожен файл беруть один ключ на кілька. Менше звернень до KMS, але один ключ довше в роботі.", "ic": "♻️", "cap": "Один ключ даних на кілька шифрувань.", "why": "Це економить виклики KMS і обходить ліміт."},
 {"g": "KMS і секрети", "t": "Parameter Store: policies", "lit": "", "m": "Лише для advanced параметрів. Expiration видаляє параметр, ExpirationNotification шле подію в EventBridge перед видаленням, NoChangeNotification якщо давно не змінювали.", "a": "До 10 політик на параметр. Сенс: примусити оновити чи видалити пароль.", "tip": "Три політики: видалити, попередити, нагадати.", "q": "Що вміють parameter policies в SSM Parameter Store і де вони доступні?", "d": "Це термін придатності для параметра: коли закінчиться, видалиться або вас попросять оновити.", "ic": "⏳", "cap": "Параметр із датою придатності.", "why": "Старі паролі не повинні жити вічно."},
 {"g": "KMS і секрети", "t": "Ротація: Secrets Manager проти Parameter Store", "lit": "", "m": "Secrets Manager сам запускає Lambda (для RDS, Redshift, DocumentDB вона готова). У Parameter Store ротації нема: власна Lambda за розкладом EventBridge змінює і БД, і параметр.", "a": "KMS у Secrets Manager обов'язковий, у Parameter Store необов'язковий. Parameter Store може читати секрет Secrets Manager.", "tip": "Secrets Manager сам, Parameter Store руками.", "q": "Хто запускає ротацію пароля в Secrets Manager і в Parameter Store?", "d": "Secrets Manager має вбудований таймер ротації, а Parameter Store сховище, яке саме нічого не змінює.", "ic": "🔄", "cap": "Один має годинник ротації, інший ні.", "why": "Ротація секретів це окрема робота, за неї платять більше."},
 {"g": "KMS і секрети", "t": "CloudFormation dynamic references", "lit": "", "m": "ssm для звичайних параметрів, ssm-secure для SecureString, secretsmanager для секретів.", "a": "Значення береться під час створення, оновлення й видалення стека. Приклад: пароль адміна RDS з Secrets Manager.", "tip": "ssm, ssm-secure, secretsmanager.", "q": "Які три види dynamic references у CloudFormation?", "d": "Шаблон не містить пароля, лише посилання на нього.", "ex": "MasterUserPassword: '{{resolve:secretsmanager:MyRDSSecret:SecretString:password}}'", "ic": "🔗", "cap": "У шаблоні лише адреса секрету, а не сам секрет.", "why": "Секрет не потрапляє в репозиторій."},
 {"g": "KMS і секрети", "t": "ManageMasterUserPassword", "lit": "", "m": "RDS сам створює адмінський секрет у Secrets Manager і керує ним та його ротацією.", "a": "Типово ротація кожні 7 днів, пароль 28 символів. ARN секрета: GetAtt Cluster.MasterUserSecret.SecretArn.", "tip": "Прапорець: секрет і ротація від RDS.", "q": "Що робить ManageMasterUserPassword: true для RDS чи Aurora в CloudFormation?", "d": "Не треба вигадувати пароль і писати Lambda для ротації: RDS робить усе сам.", "ex": "MasterUsername: masteruser\nManageMasterUserPassword: true", "ic": "🪄", "cap": "Пароль адміна БД видає і міняє сама RDS.", "why": "Менше ручної роботи й помилок."},
 {"g": "KMS і секрети", "t": "Шифрування CloudWatch Logs", "lit": "", "m": "На рівні log group: CMK прив'язують при створенні групи (create-log-group) або пізніше командою associate-kms-key.", "a": "Нотатки кажуть, що через консоль ключ прив'язати не можна. За замовчуванням логи шифруються самі.", "tip": "Ключ на групі, через API.", "q": "Як зашифрувати CloudWatch Logs власним ключем KMS?", "d": "Шифрування вмикають не на логу, а на їхній групі.", "ex": "aws logs associate-kms-key --log-group-name /app/prod --kms-key-id arn:aws:kms:eu-north-1:111122223333:key/abcd", "ic": "🔏", "cap": "Один ключ на всю групу логів.", "why": "Групу легше обслуговувати за одним ключем."},
 {"g": "KMS і секрети", "t": "CodeBuild і секрети", "lit": "", "m": "Змінна середовища посилається на параметр Parameter Store або секрет Secrets Manager.", "a": "Для доступу до ресурсів у VPC треба VPC-конфігурація CodeBuild.", "tip": "Посилання замість пароля.", "q": "Як у CodeBuild передати секрет, не зберігаючи його відкритим текстом?", "d": "У змінній лежить не пароль, а вказівка, де його взяти.", "ic": "🧱", "cap": "У змінній лише адреса секрету.", "why": "Пароль не видно в логах і налаштуваннях збірки."},
 {"g": "CloudHSM і Nitro Enclaves", "t": "KMS проти CloudHSM", "lit": "", "m": "KMS: AWS керує програмним шифруванням і ключами. CloudHSM: AWS видає виділені апаратні пристрої, ключами керуєте ви повністю.", "a": "CloudHSM single tenant, потрібне CloudHSM Client Software, кластер у кількох зонах, користувачі HSM поза IAM. HSM FIPS 140-2 або 140-3 level 3.", "tip": "Виділене залізо і ключі наші: CloudHSM.", "q": "Чим CloudHSM відрізняється від KMS?", "d": "KMS це спільна комірка в банку з касиром. CloudHSM це ваш власний сейф у вашому приміщенні.", "ic": "🏦", "cap": "Спільна комірка проти власного сейфа.", "why": "Деякі регулятори вимагають, щоб ключі були лише під вашим контролем."},
 {"g": "CloudHSM і Nitro Enclaves", "t": "CloudHSM: що вміє", "lit": "", "m": "Генерувати й зберігати ключі, шифрувати й розшифровувати, підписувати й перевіряти цифрові підписи, керувати сертифікатами.", "a": "Підтримує симетричні й асиметричні ключі, SSL/TLS-ключі. Кластер у Multi-AZ для доступності. Redshift працює з CloudHSM (з нотаток).", "tip": "Ключі, шифрування, підписи, сертифікати.", "q": "Що саме можна робити з CloudHSM?", "d": "Це універсальний криптопристрій, де ви самі обираєте алгоритми.", "ic": "🧮", "cap": "Свій криптосейф з повним набором операцій.", "why": "Гнучкість і контроль коштують більшої відповідальності."},
 {"g": "CloudHSM і Nitro Enclaves", "t": "Nitro Enclaves", "lit": "", "m": "Ізольована зміцнена віртуальна машина з EC2. Без постійного сховища, інтерактивного доступу, зовнішньої мережі; не контейнер.", "a": "Зв'язок лише з батьківським екземпляром через локальний сокет. До 4 enclave на екземпляр. Дані недоступні навіть root батька.", "tip": "Enclave: ні мережі, ні диска, ні SSH.", "q": "Що таке Nitro Enclave і які в нього обмеження?", "d": "Герметична лабораторна камера: дані заносять, обробляють, а власник будівлі не може зазирнути всередину.", "ic": "🧪", "cap": "Камера, куди не зазирне навіть адмін сервера.", "why": "Так мінімізується поверхня атаки для PII й платіжних даних."},
 {"g": "CloudHSM і Nitro Enclaves", "t": "Attestation в Nitro Enclaves", "lit": "", "m": "Підтверджує, що в enclave працює лише авторизований код.", "a": "KMS key policy перевіряє вимір enclave, тож розшифрувати може лише він. Сценарії: приватні ключі, платіжні картки, multi-party computation.", "tip": "Attestation: код підтверджений, тоді KMS розшифрує.", "q": "Для чого потрібна cryptographic attestation і як вона пов'язана з KMS?", "d": "Перепустка з відбитком програми: без правильного відбитка ключ не видадуть.", "ic": "🪪", "cap": "KMS відкриє дані лише тому коду, який перевірений.", "why": "Навіть зламаний сервер не отримає розшифровані дані."},
 {"g": "IAM", "t": "Операції STS", "lit": "", "m": "AssumeRole (роль у своєму чи чужому акаунті), AssumeRoleWithSAML, AssumeRoleWithWebIdentity (OIDC, краще Cognito), GetSessionToken (MFA), GetFederationToken, GetCallerIdentity, DecodeAuthorizationMessage.", "a": "GetCallerIdentity показує, хто робить виклик. DecodeAuthorizationMessage розшифровує повідомлення про відмову.", "tip": "Assume для ролей, Get для сесій і діагностики.", "q": "Які операції STS бувають і для чого кожна?", "d": "STS це видавець тимчасових перепусток, а різні виклики для різних власників.", "ic": "🎫", "cap": "Кілька способів отримати тимчасову перепустку.", "why": "Тимчасові ключі безпечніші за вічні."},
 {"g": "IAM", "t": "Тривалість тимчасових ключів STS", "lit": "", "m": "AssumeRole: від 15 хв до максимуму сесії ролі (до 12 год), типово 1 год. GetSessionToken для користувача IAM: 15 хв - 36 год, типово 12 год. Для root: до 1 год.", "a": "Слайд із цифрою «до 1 години» застарів. Не викликайте GetSessionToken від root.", "tip": "12 і 36 для користувача, 1 для root.", "q": "Скільки живуть тимчасові ключі STS?", "d": "Термін залежить від того, хто питає: людина з IAM живе довше, root коротше, бо це небезпечніше.", "ic": "⏱️", "cap": "Ключі мають термін придатності.", "why": "Короткі ключі менше шкодять при витоку."},
 {"g": "IAM", "t": "MFA через GetSessionToken", "lit": "", "m": "У політиці умова aws:MultiFactorAuthPresent=true. Користувач викликає GetSessionToken із серійним номером MFA-пристрою й кодом і працює з поверненими ключами.", "a": "GetSessionToken повертає Access ID, Secret Key, Session Token, Expiration. З такими ключами недоступні IAM API без MFA й STS API, крім AssumeRole і GetCallerIdentity.", "tip": "Умова в політиці плюс GetSessionToken з кодом.", "q": "Як змусити користувача підтвердити MFA перед небезпечною дією?", "d": "Політика каже: без MFA не пущу. Користувач спершу отримує сесію з MFA.", "ex": "\"Condition\": {\"Bool\": {\"aws:MultiFactorAuthPresent\": \"true\"}}", "ic": "📲", "cap": "Дія дозволена лише в сесії, де був код.", "why": "Захист від викраденого пароля."},
 {"g": "IAM", "t": "IAM + bucket policy: об'єднання", "lit": "", "m": "Враховується об'єднання IAM-політик суб'єкта і bucket policy. В одному акаунті достатньо Allow в одній з них, у різних потрібен Allow в обох. Явний Deny сильніший.", "a": "Порядок рішення: старт із DENY, явний Deny закінчує відмовою, є Allow то дозволено, інакше відмова.", "tip": "Один акаунт: АБО. Різні акаунти: І.", "q": "Як оцінюються політики, коли суб'єкт і бакет в одному акаунті і в різних?", "d": "Один акаунт це одна будівля: вистачить дозволу охоронця або власника. Різні акаунти це дві компанії, потрібні обидві підписи.", "ic": "⚖️", "cap": "Один акаунт: або, різні: обидва.", "why": "Між акаунтами довіра має бути з обох боків."},
 {"g": "IAM", "t": "${aws:username} у політиці", "lit": "", "m": "Одна динамічна політика зі змінною ${aws:username} у Resource.", "a": "Окрема політика на кожного не масштабується.", "tip": "Змінна замість імені.", "q": "Як дати кожному користувачу доступ лише до його теки /home/<ім'я> в бакеті, не пишучи політику на кожного?", "d": "Політика підставляє ім'я того, хто питає, тому одна політика замінює тисячу.", "ex": "\"Resource\": [\"arn:aws:s3:::my-company/home/${aws:username}/*\"]", "ic": "🏠", "cap": "Одна політика, а теку підставляє змінна.", "why": "Масштабується без нових політик."},
 {"g": "IAM", "t": "Inline, AWS managed, customer managed", "lit": "", "m": "AWS managed підтримує AWS і оновлює. Customer managed ваша, багаторазова, з версіями й відкатом, найкраща практика. Inline вбудована в одного суб'єкта й зникає разом із ним.", "a": "Inline має суворий зв'язок один до одного з суб'єктом.", "tip": "Inline помирає разом із суб'єктом.", "q": "Чим відрізняються inline, AWS managed і customer managed політики?", "d": "Managed це документ у спільній папці, inline це записка, приклеєна до одного користувача.", "ic": "📎", "cap": "Спільний документ чи записка на одному користувачі.", "why": "Багаторазові політики легше супроводжувати."},
 {"g": "IAM", "t": "PassRole і trust policy", "lit": "", "m": "Роль можна передати лише сервісу, якого дозволяє її trust policy. PassRole потрібен при налаштуванні EC2, Lambda, ECS, CodePipeline.", "a": "Часто разом з iam:GetRole. Звужуйте Resource до конкретної ролі.", "tip": "PassRole плюс довіра ролі.", "q": "Чому iam:PassRole не дозволяє передати роль будь-якому сервісу?", "d": "Щоб видати сервісу роль, потрібні два дозволи: у тебе на передачу, у ролі на довіру цьому сервісу.", "ic": "🤝", "cap": "Передати роль можна лише тому, кому вона довіряє.", "why": "Це запобігає ескалації прав."},
 {"g": "IAM", "t": "Практики ролей IAM", "lit": "", "m": "EC2, Lambda, завдання ECS, CodeBuild мають власні ролі. Окрема роль на кожен застосунок чи функцію, без перевикористання. Не зберігати ключі IAM ніде, крім особистого комп'ютера чи on-premise сервера.", "a": "Для ECS на EC2 ECS_ENABLE_TASK_IAM_ROLE=true (не звірено). On-premise: STS або IAM Roles Anywhere. Ніколи не давати * на сервіс.", "tip": "Роль на застосунок, не ключ.", "q": "Які практики ролей перелічено для іспиту?", "d": "Кожен сервіс має свій бейдж, а не один спільний.", "ic": "🪪", "cap": "Один бейдж на одну функцію.", "why": "Менше шкоди при компрометації однієї ролі."},
 {"g": "Directory Service", "t": "Три варіанти Directory Service", "lit": "", "m": "Managed Microsoft AD: справжній AD в AWS, MFA, trust з on-premise. AD Connector: проксі до вашого on-premise AD, користувачі лишаються там. Simple AD: AD-сумісний на Samba 4, без MFA і trust.", "a": "AD Connector підтримує MFA через RADIUS. RDS for SQL Server працює лише з Managed Microsoft AD. Simple AD не з'єднується з on-premise.", "tip": "Свій AD, дверцята, спрощений.", "q": "Чим відрізняються AWS Managed Microsoft AD, AD Connector і Simple AD?", "d": "Managed AD це повний офіс в AWS, AD Connector лише двері до вашого офісу вдома, Simple AD маленька імітація.", "ic": "🏢", "cap": "Повний офіс, двері або імітація.", "why": "Різні компанії мають різні потреби."},
 {"g": "Directory Service", "t": "Коли обрати AD Connector", "lit": "", "m": "AD Connector: проксі, що пересилає запити на ваш on-premise AD.", "a": "Користувачами керуєш там, де й раніше. Політики паролів діють однаково. Працює з WorkSpaces, Amazon Quick, EC2 Windows. Не сумісний з RDS SQL Server.", "tip": "Нічого не копіювати: Connector.", "q": "Компанія має on-premise AD і не хоче копіювати користувачів в AWS. Що обрати?", "d": "Connector нічого не зберігає, лише передає запит додому.", "ic": "🔌", "cap": "Не копія, а перемичка до домашнього AD.", "why": "Не треба синхронізації й подвійного адміністрування."},
 {"g": "Cognito", "t": "Threat protection у Cognito", "lit": "", "m": "Plus feature plan. Cognito дає risk score low, medium, high і може вимагати MFA чи заблокувати вхід. Окремо compromised credentials.", "a": "Compromised credentials працюють для USER_PASSWORD_AUTH, не для SRP і не для федерації. Є audit only і full function. Не рахує обсяг запитів: проти DDoS AWS WAF.", "tip": "Ризик, MFA чи блок, Plus-план.", "q": "Що вміє threat protection user pool і в якому плані воно доступне?", "d": "Охоронець дивиться на місце й пристрій: підозріло, тож просить другий фактор або не пускає.", "ic": "🛡️", "cap": "Підозрілий вхід: просимо MFA або блокуємо.", "why": "Автоматична реакція без ручного нагляду."},
 {"g": "Cognito", "t": "Lambda triggers: етапи", "lit": "", "m": "Pre Authentication (прийняти чи відхилити вхід), Post Authentication (аналітика), Pre Token Generation (змінити claims), Pre Sign-up, Post Confirmation, Migrate User, Custom Message.", "a": "Виклик синхронний, відповідь протягом 5 секунд, змінити не можна. Migrate User переносить користувача зі старого каталогу.", "tip": "Pre, Post, Token, Migrate, Message.", "q": "Які Lambda triggers є в user pool і що кожен робить?", "d": "Це гачки в потоці входу: перед входом, після, при видачі токена, при міграції.", "ic": "🪝", "cap": "Місця, де вставляється ваш код.", "why": "Дає змінити поведінку без форку сервісу."},
 {"g": "Cognito", "t": "ALB і автентифікація", "lit": "", "m": "Правилами authenticate-cognito чи authenticate-oidc на HTTPS listener. OnUnauthenticatedRequest: authenticate (типово), deny (401), allow (без claims).", "a": "OIDC IdP: Client ID, Client Secret, redirect /oauth2/idpresponse. До цілі йдуть claims у x-amzn-oidc-data. Клієнт має завершити вхід за 15 хвилин.", "tip": "HTTPS listener, три режими.", "q": "Як ALB автентифікує користувачів і що таке OnUnauthenticatedRequest?", "d": "Балансувальник сам стає охоронцем: без квитка перенаправляє на вхід.", "ic": "🚪", "cap": "ALB перевіряє вхід замість вашого коду.", "why": "Застосунок не пише логіку входу."},
 {"g": "Cognito", "t": "Identity pool: ролі", "lit": "", "m": "Є ролі за замовчуванням для автентифікованих і гостей, а також правила вибору ролі за ID користувача. Ключі видає STS.", "a": "У trust policy ролі має бути Cognito identity pools. Доступ розділяють змінними політики. Джерела: публічні провайдери, user pool, OIDC, SAML, developer authenticated identities.", "tip": "Дві типові ролі й правила.", "q": "Як identity pool вибирає IAM роль користувачу?", "d": "Кожен вхідний отримує браслет: для гостя, для впізнаного, чи окремий за правилом.", "ic": "🎟️", "cap": "Браслет доступу залежить від того, хто ти.", "why": "Дає різні права без окремих IAM-користувачів."},
 {"g": "Cognito", "t": "Cognito чи IAM", "lit": "", "m": "Сотні користувачів, мобільні користувачі, автентифікація через SAML.", "a": "IAM для користувачів усередині вашого AWS. User pool + identity pool = автентифікація + авторизація.", "tip": "Багато зовнішніх людей: Cognito.", "q": "За якими ключовими словами в питанні обирати Cognito, а не IAM?", "d": "IAM це працівники компанії, Cognito це клієнти магазину.", "ic": "👥", "cap": "Свої працівники проти клієнтів застосунку.", "why": "IAM не створений для мільйонів зовнішніх користувачів."},
 {"g": "CloudWatch і CloudTrail", "t": "CloudTrail, CloudWatch, X-Ray", "lit": "", "m": "CloudTrail: хто і що зробив (аудит API-викликів). CloudWatch: що відбувається зараз (метрики, логи, alarm). X-Ray: чому код повільний (трасування запитів).", "a": "CloudWatch збирає метрики, не API-виклики. X-Ray це рівень застосунку, не системний і не security-лог.", "tip": "Хто, що зараз, чому повільно.", "q": "Чим відрізняються CloudTrail, CloudWatch і X-Ray?", "d": "Це відеореєстратор дій, панель приладів і маршрут посилки.", "ic": "🔎", "cap": "Три запитання: хто, що зараз, де застряг.", "why": "Кожен інструмент відповідає на своє питання."},
 {"g": "CloudWatch і CloudTrail", "t": "Dimensions і часове вікно", "lit": "", "m": "До 30 dimensions на метрику. Точки даних від двох тижнів у минулому до двох годин у майбутньому.", "a": "Detailed monitoring вмикають, щоб ASG масштабувався швидше. Годинник EC2 має бути правильним.", "tip": "30, 2 тижні, 2 години.", "q": "Які ліміти dimensions і яке часове вікно приймає CloudWatch для точок метрик?", "d": "Dimensions розрізняють метрику, а вікно часу захищає від дивних міток.", "ic": "🕰️", "cap": "Метрика приймає час тільки з вузького вікна.", "why": "Хибний годинник зіпсує alarm."},
 {"g": "CloudWatch і CloudTrail", "t": "Експорт логів і підписка", "lit": "", "m": "CreateExportTask експортує пакетом, не в реальному часі. Subscription filter шле логи майже в реальному часі в Kinesis Data Streams, Firehose чи Lambda.", "a": "Cross-account subscription: приймач в іншому акаунті. До п'яти фільтрів на log group (за документацією).", "tip": "Експорт пакетом, підписка потоком.", "q": "Чим експорт логів у S3 відрізняється від subscription filter?", "d": "Експорт це вантажівка раз на день, підписка конвеєр.", "ic": "🚚", "cap": "Вантажівка проти конвеєра.", "why": "Різні задачі: архів чи обробка на льоту."},
 {"g": "CloudWatch і CloudTrail", "t": "Джерела CloudWatch Logs", "lit": "", "m": "SDK, Logs Agent, Unified Agent; Elastic Beanstalk; ECS; Lambda; VPC Flow Logs; API Gateway; CloudTrail за фільтром; Route 53 (DNS-запити).", "a": "Строк зберігання: від 1 дня до 10 років або ніколи. Логи шифруються за замовчуванням.", "tip": "Усе, що пише логи, і Route 53.", "q": "Звідки CloudWatch Logs отримує логи?", "d": "Лог-група це шафа, а потоки це шухляди.", "ic": "📚", "cap": "Багато джерел складаються в одну шафу.", "why": "Централізація полегшує пошук."},
 {"g": "CloudWatch і CloudTrail", "t": "Composite alarm і цілі alarm", "lit": "", "m": "Composite alarm стежить за станами кількох alarm з умовами AND і OR. Alarm може зупинити, термінувати, перезавантажити чи відновити EC2, запустити Auto Scaling, надіслати в SNS.", "a": "Period для high-resolution метрик 10 с, 30 с або кратний 60 с. Period не менший за роздільність метрики.", "tip": "Alarm над alarm.", "q": "Що таке composite alarm і що може зробити alarm?", "d": "Composite це чергова, що дзвонить лише коли тривога на двох датчиках одразу.", "ic": "🚨", "cap": "Дзвонимо, коли спрацювало кілька датчиків.", "why": "Менше фальшивих тривог."},
 {"g": "CloudWatch і CloudTrail", "t": "CloudTrail: типи подій", "lit": "", "m": "Management events (операції над ресурсами) пишуться типово, з розділенням Read і Write. Data events (S3 об'єкти, Invoke Lambda) типово вимкнені.", "a": "Події зберігаються 90 днів; довше це S3 і Athena. Видалили ресурс? Спершу CloudTrail.", "tip": "Керування так, дані ні.", "q": "Які події пише CloudTrail типово і що вмикається окремо?", "d": "Керування це зміни будівлі, дані це кожен відвідувач: їх надто багато.", "ic": "📒", "cap": "Зміни пишемо, відвідувачів не обов'язково.", "why": "Data events великі й платні."},

const KEY = "aws_cards_v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
if (!store.streak) store.streak = {};
let mode = 1, group = "all", flipped = false, queue = [], cur = null;

function save() { localStorage.setItem(KEY, JSON.stringify(store)); }
function key(c) { return c.g + "|" + c.t; }
function streak(c) { return store.streak[key(c)] || 0; }
function pool() { return CARDS.filter(c => group === "all" || c.g === group); }
function mastered(c) { return streak(c) >= 2; }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rebuild() { queue = shuffle(pool().filter(c => !mastered(c))); next(); }
function next() { cur = queue.length ? queue.shift() : null; flipped = false; render(); }

function setup() {
  const sel = document.getElementById("group");
  const groups = ["all"].concat([...new Set(CARDS.map(c => c.g))]);
  sel.innerHTML = groups.map(g => "<option value='" + g + "'>" + (g === "all" ? "Усі групи" : gi(g)) + "</option>").join("");
  sel.onchange = () => { group = sel.value; rebuild(); };
  document.getElementById("m1").onclick = () => setMode(1);
  document.getElementById("m2").onclick = () => setMode(2);
}
function setMode(m) {
  mode = m;
  document.getElementById("m1").classList.toggle("on", m === 1);
  document.getElementById("m2").classList.toggle("on", m === 2);
  flipped = false; render();
}

function progress() {
  const p = pool(), n = p.filter(mastered).length;
  document.getElementById("fill").style.width = (100 * n / p.length) + "%";
  document.getElementById("st").textContent = "Вивчено " + n + " з " + p.length + " · у черзі " + queue.length + (cur ? " +1" : "") + ". Картка вивчена, коли ви двічі поспіль відповіли «Знаю».";
}

function esc(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function refs(c) {
  const text = [c.t, c.q, c.d, c.m, c.a, c.ex, c.cap].filter(Boolean).join(" ");
  const found = GLOSSARY.filter(g => new RegExp(g[0]).test(text)).slice(0, 6);
  if (!found.length) return "";
  return "<div class='refs'><b>🔗 Що це за слова</b><ul>" + found.map(g => "<li><b>" + g[1] + "</b>: " + g[2] + " <a href='" + g[3] + "' target='_blank' rel='noopener'>документація</a></li>").join("") + "</ul></div>";
}

function body(c) {
  return (c.ic ? "<div class='pic'><span class='big'>" + c.ic + "</span><span class='cap'>" + c.cap + "</span></div>" : "") + (c.why ? "<p class='why'><b>Навіщо так зроблено:</b> " + c.why + "</p>" : "") + (c.d ? "<p class='def'><b>Що це:</b> " + c.d + "</p>" : "") + "<p><b>Відповідь:</b> " + c.m + "</p>" + (c.a ? "<p><b>Ще для іспиту:</b> " + c.a + "</p>" : "") + (c.ex ? "<pre class='ex'>" + esc(c.ex) + "</pre>" : "") + refs(c);
}

function render() {
  const app = document.getElementById("app");
  progress();
  if (!cur) {
    app.innerHTML = "<div class='done'><h2>Усі картки цієї групи вивчено</h2><p>Можна обрати іншу групу або почати спочатку.</p><div class='btns'><button class='small' id='again'>Скинути прогрес групи</button></div></div>";
    document.getElementById("again").onclick = () => { pool().forEach(c => delete store.streak[key(c)]); save(); rebuild(); };
    return;
  }
  let html = "";
  if (!flipped) {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    if (mode === 1) html += "<div class='term q'>" + (cur.q || cur.t) + "</div><div class='hint'>Згадайте відповідь, потім клацніть, щоб перевернути.</div>";
    else html += "<div class='back'>" + body(cur) + "</div><div class='hint'>Яке питання це відповідає? Клацніть, щоб перевернути.</div>";
    html += "</div>";
  } else {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    html += "<div class='term q'>" + (cur.q || cur.t) + "</div>";
    html += "<div class='back'>" + (cur.lit ? "<div class='lit'>Дослівно: " + cur.lit + "</div>" : "") + body(cur);
    if (cur.tip) html += "<div class='tip'>Щоб запам'ятати: " + cur.tip + "</div>";
    html += "</div></div>";
    html += "<div class='btns'><button class='no' id='no'>Ще ні</button><button class='know' id='yes'>Знаю</button></div>";
  }
  app.innerHTML = html;
  document.getElementById("card").onclick = () => { if (!flipped) { flipped = true; render(); } };
  if (flipped) {
    document.getElementById("yes").onclick = () => { store.streak[key(cur)] = streak(cur) + 1; save(); if (!mastered(cur)) queue.push(cur); next(); };
    document.getElementById("no").onclick = () => { store.streak[key(cur)] = 0; save(); queue.splice(Math.min(3, queue.length), 0, cur); next(); };
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (cur && !flipped) { flipped = true; render(); } }
  else if (flipped && e.key === "ArrowRight") document.getElementById("yes").click();
  else if (flipped && e.key === "ArrowLeft") document.getElementById("no").click();
});

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#ffffff");
  tg.setBackgroundColor("#f7f5f0");
  tg.BackButton.show();
  tg.BackButton.onClick(() => { location.href = "index.html"; });
}

setup();
rebuild();
</script>
