 {"g": "DynamoDB", "t": "Приклади розрахунку: пастки", "lit": "", "q": "Скільки WCU для 6 записів/с по 4,5 КБ і скільки RCU для 16 eventually читань/с по 12 КБ?", "m": "WCU: 4,5 вгору до 5, 6 × 5 = 30. RCU: (16 ÷ 2) × (12 ÷ 4) = 24.", "a": "120 записів за хвилину по 2 КБ: 120 ÷ 60 × 2 = 4 WCU. Читання 6 КБ strongly: округлюємо до 8 КБ, 10 × 2 = 20 RCU.", "tip": "Вгору, хвилини в секунди, eventually навпіл.", "d": "Усі пастки в трьох діях: округлити розмір вгору, привести час до секунд, для eventually поділити на 2.", "ex": "WCU = ceil(size KB) * writes per second\nRCU = ceil(size / 4) * reads per second, eventually / 2", "ic": "🧮", "cap": "Спершу округліть вгору, потім переведіть у секунди, а для eventually розділіть навпіл.", "why": "AWS рахує цілими блоками, тому розмір округлюється."},
 {"g": "DynamoDB", "t": "Транзакції: ціна 2×", "lit": "", "q": "Скільки WCU для 3 транзакційних записів/с по 5 КБ і RCU для 5 транзакційних читань/с по 5 КБ?", "m": "WCU: 3 × 5 × 2 = 30. RCU: 5 × 2 (5 КБ вгору до 8 КБ) × 2 = 20.", "a": "Подвійна ціна, бо на кожен item є prepare і commit. Одиниці витрачаються навіть при невдалій транзакції. До 100 дій і 4 МБ.", "tip": "Порахуй як звичайно і помнож на 2.", "d": "Транзакція робить дві операції на item: підготовку й підтвердження.", "ic": "🔁✌️", "cap": "Дві дії замість однієї, тому й коштує вдвічі більше.", "why": "Дві фази потрібні, щоб або виконались усі зміни, або жодна."},
 {"g": "DynamoDB", "t": "BatchWriteItem і BatchGetItem", "lit": "", "q": "Які ліміти й особливості мають BatchWriteItem і BatchGetItem?", "m": "BatchWriteItem: до 25 put чи delete, до 16 МБ, item до 400 КБ, не вміє update. BatchGetItem: до 100 items, до 16 МБ.", "a": "Невдале повертається в UnprocessedItems і UnprocessedKeys: повторіть із exponential backoff або додайте WCU чи RCU. Пакет не атомарний. Умов на окремі операції в BatchWriteItem немає.", "tip": "25 пише, 100 читає.", "d": "Пакет економить виклики й затримку, але частина може не пройти, тому невдале треба повторювати.", "ic": "📦", "cap": "Кладете до 25 листів в один конверт, але деякі можуть не дійти й їх відправляють знову.", "why": "Менше мережевих викликів, але без гарантії «все або нічого»."},
 {"g": "DynamoDB", "t": "Condition проти Filter", "lit": "", "q": "Чим відрізняється Condition Expression від Filter Expression і які функції доступні в умові?", "m": "Condition діє на записи (PutItem, UpdateItem, DeleteItem), Filter фільтрує результати читання.", "a": "Функції: attribute_exists, attribute_not_exists, attribute_type, contains, begins_with, IN, between, size. Не перезаписувати: attribute_not_exists(partition_key).", "tip": "Умова на запис, фільтр на читання.", "d": "Умова вирішує, чи виконувати запис. Фільтр відкидає зайве вже після читання.", "ic": "✅🔎", "cap": "Умова це перевірка на вході запису. Фільтр це сито після читання.", "why": "Запис має бути безпечним, а читання лише обрізає вже отримане."},
 {"g": "DynamoDB", "t": "PartiQL", "lit": "", "q": "Що таке PartiQL і звідки його можна запускати?", "m": "SQL-сумісна мова для DynamoDB: select, insert, update, delete. Запуск з консолі, NoSQL Workbench, API, CLI, SDK.", "a": "Це лише синтаксис: JOIN і довільні запити без ключа не з'являються.", "tip": "SQL на вигляд, DynamoDB всередині.", "d": "Зручно писати запити знайомим SQL-синтаксисом.", "ic": "🔤", "cap": "Знайома SQL-мова поверх DynamoDB.", "why": "Дає звичний інтерфейс тим, хто знає SQL."},
 {"g": "DynamoDB", "t": "Write sharding", "lit": "", "q": "Що таке write sharding і коли він потрібен?", "m": "Додавання суфікса до partition key, щоб записи розійшлись по різних розділах. Методи: random suffix і calculated suffix.", "a": "Приклад: голосування з двома кандидатами, partition key Candidate_ID дає лише два розділи і hot partition.", "tip": "Додай суфікс, щоб розкидати.", "d": "Коли значень ключа мало, всі записи б'ють в одні й ті самі розділи. Суфікс створює штучно більше значень.", "ic": "🎲🧩", "cap": "Замість однієї каси відкриваємо кілька: покупців розводять по різних.", "why": "Розподіл записів між розділами усуває hot partition."},
 {"g": "DynamoDB", "t": "Large Objects Pattern", "lit": "", "q": "Що робити з даними, більшими за 400 КБ на item?", "m": "Зберігати об'єкт у S3, а в DynamoDB лише метадані й посилання на нього.", "a": "Підходить для картинок, документів, JSON-файлів. Додатково: метадані файлів S3 можна індексувати в DynamoDB для швидкого пошуку.", "tip": "У таблиці адреса, в S3 вантаж.", "d": "DynamoDB тримає легкі дані й посилання, а важкі файли віддає дешевшому S3.", "ic": "🏋️🪣", "cap": "У таблиці лише етикетка з адресою, а сам важкий предмет лежить на складі S3.", "why": "S3 призначений для великих об'єктів, DynamoDB для швидкого доступу за ключем."},
 {"g": "DynamoDB", "t": "Індекс метаданих S3", "lit": "", "q": "Як шукати файли в S3 за атрибутами, яких S3 не індексує?", "m": "Записувати метадані файлів у DynamoDB і шукати там.", "a": "S3 не вміє запитів за власними атрибутами. Схему подія S3 → Lambda → DynamoDB складено з двох фактів нотаток (не звірено).", "tip": "S3 зберігає, DynamoDB шукає.", "d": "Індекс у DynamoDB дає швидкий пошук за клієнтом чи датою, а сам файл лишається в S3.", "ic": "🔎🪣", "cap": "Окремий каталог файлів: у ньому шукаємо, а за адресою беремо сам файл.", "why": "S3 швидкий для зберігання, але не для складних запитів."},
 {"g": "DynamoDB", "t": "Streams: що ще знати", "lit": "", "q": "Що з Streams варто знати понад 24 години й типи образів?", "m": "Шарди виділяються автоматично, записи не з'являються заднім числом після ввімкнення, Lambda читає через event source mapping синхронно.", "a": "Читати можна Lambda, KCL-застосунками або надіслати в Kinesis Data Streams. Є образи до і після. Використання: реакція в реальному часі, OpenSearch, міжрегіональна реплікація.", "tip": "Лише після ввімкнення.", "d": "Стрім показує лише майбутні зміни, а не історію таблиці.", "ic": "🌊📜", "cap": "Журнал починає писатися з моменту ввімкнення. Те, що було раніше, не відновити.", "why": "Це журнал змін, а не знімок таблиці."},
 {"g": "DynamoDB", "t": "Прямий доступ користувачів", "lit": "", "q": "Як веб чи мобільний клієнт може звертатися до DynamoDB без власного бекенду?", "m": "Входить через identity provider (Cognito User Pools, Google, Facebook, OIDC, SAML), отримує тимчасові AWS-ключі й IAM-роль і працює з таблицею напряму.", "a": "Права визначає IAM-роль. Звуження до рядків користувача в нотатках не описано (не звірено).", "tip": "Логін, тимчасові ключі, роль.", "d": "Клієнт обмінює вхід через Google чи Cognito на тимчасові ключі й сам ходить у таблицю.", "ic": "🙋🔑", "cap": "Показав перепустку (вхід через провайдера), отримав тимчасовий ключ і зайшов у таблицю.", "why": "Менше серверного коду й коротші шляхи."},
 {"g": "DynamoDB", "t": "DynamoDB CLI: пагінація", "lit": "", "q": "Що роблять --projection-expression, --filter-expression, --page-size і --max-items?", "m": "projection: які атрибути повернути. filter: відфільтрувати перед поверненням. page-size: розмір сторінки одного виклику (за замовчуванням 1000). max-items: скільки показати, повертає NextToken.", "a": "Фільтр застосовується після читання: платите за все прочитане. Пагінаційні параметри спільні для CLI (DynamoDB, S3 тощо).", "tip": "Page-size більше викликів, max-items менше результатів.", "d": "Перші два керують змістом відповіді, другі два керують розбиттям на сторінки.", "ex": "aws dynamodb scan --table-name T --max-items 10 --page-size 5", "ic": "📑", "cap": "Одні параметри обирають, що показати, інші як нарізати показ на сторінки.", "why": "Великі результати отримують частинами."},
 {"g": "Кешування", "t": "DAX: TTL, вузли, write-through", "lit": "", "q": "Який TTL кешу DAX, скільки вузлів у кластері й що рекомендовано для production?", "m": "TTL 5 хвилин за замовчуванням. До 11 вузлів (primary плюс до 10 реплік). Для production мінімум 3 вузли в різних зонах.", "a": "Запис write-through: спершу таблиця, потім кеш. Strongly consistent читання проксуються в DynamoDB без кешу. Є окремий кеш items і кеш запитів. У нотатках «до 10 вузлів».", "tip": "П'ять хвилин, три вузли.", "d": "DAX кешує окремі items і результати Query і Scan, а код застосунку не змінюється.", "ic": "⚡🗄️", "cap": "Швидка прохідна перед сховищем: частіше беруть з неї, до складу ходять рідко.", "why": "Кеш пришвидшує читання й знімає навантаження з гарячих ключів."},
 {"g": "Кешування", "t": "DAX чи ElastiCache: агрегації", "lit": "", "q": "Що кешувати в DAX, а що в ElastiCache?", "m": "DAX: окремі items і результати Query та Scan DynamoDB. ElastiCache: результат агрегації й будь-які власні обчислення.", "a": "DAX прозорий, ElastiCache вимагає коду кешування. Їх можна поєднувати.", "tip": "Items у DAX, суми в ElastiCache.", "d": "DynamoDB не рахує агрегацій, тож їх результат кешують у ElastiCache.", "ic": "⚖️🗄️", "cap": "DAX автоматично запам'ятовує відповіді DynamoDB. ElastiCache це шафа, куди ви самі кладете готові підрахунки.", "why": "Кожен кеш підходить для свого виду даних."},
 {"g": "Кешування", "t": "Де тримати сесії", "lit": "", "q": "Чому для сесій обирають DynamoDB або ElastiCache, а не EFS, EBS чи S3?", "m": "EFS потрібно підключати до EC2, EBS і Instance Store лише локальні, S3 має більшу затримку й не для дрібних об'єктів.", "a": "ElastiCache у пам'яті, DynamoDB serverless, обидва key/value.", "tip": "Спільне й швидке.", "d": "Сесія має бути видна всім серверам і швидко читатись.", "ic": "🍪", "cap": "Сесія має лежати там, куди дістануться всі сервери: у спільній швидкій базі.", "why": "Локальний диск одного сервера не бачать інші."},
 {"g": "Інші сервіси", "t": "Athena: як здешевити", "lit": "", "q": "Як зменшити вартість запитів Athena?", "m": "Колонкові формати (Parquet, ORC), стиснення, partitioning, великі файли (понад 128 МБ).", "a": "Athena платить за просканований обсяг. Формати: CSV, JSON, ORC, Avro, Parquet. Логи VPC Flow, ELB, CloudTrail аналізують цим сервісом. У нотатках «zlip», правильно zlib.", "tip": "Скануй менше.", "d": "Athena читає файли напряму з S3, тому все, що зменшує прочитане, зменшує рахунок.", "ic": "📉🔍", "cap": "Чим менше сторінок прочитано, тим дешевше. Тож беріть тільки потрібні колонки й теки.", "why": "Оплата за просканований обсяг."},
 {"g": "Інші сервіси", "t": "Athena Federated Query", "lit": "", "q": "Як Athena запитує дані поза S3 і куди кладе результат?", "m": "Через Data Source Connectors, що працюють на AWS Lambda. Результат можна зберегти в S3.", "a": "Джерела: CloudWatch Logs, DynamoDB, RDS та інші, у AWS чи on-premises.", "tip": "Lambda посередник.", "d": "Federated Query дозволяє одним SQL опитати різні сховища.", "ic": "🧵🌐", "cap": "Між Athena і чужим сховищем сидить Lambda-перекладач.", "why": "Дані лишаються на місці, їх не треба переносити."},
 {"g": "Інші сервіси", "t": "OpenSearch проти DynamoDB", "lit": "", "q": "Коли замість DynamoDB потрібен OpenSearch?", "m": "Коли треба шукати за будь-яким полем і за частковим збігом, повнотекстовий пошук, аналіз логів.", "a": "OpenSearch наступник Elasticsearch, режими: керований кластер і serverless. Безпека: Cognito, IAM, KMS, TLS. DynamoDB шукає лише за ключем та індексами.", "tip": "Будь-яке поле, частина слова.", "d": "DynamoDB швидка за ключем, OpenSearch для вільного пошуку.", "ic": "🔎✨", "cap": "DynamoDB знаходить за адресою, OpenSearch за описом і навіть за уривком слова.", "why": "Різні моделі доступу: за ключем і за змістом."},
 {"g": "Інші сервіси", "t": "MSK проти Kinesis", "lit": "", "q": "Чим MSK відрізняється від Kinesis Data Streams за структурою і шифруванням?", "m": "Kinesis: шарди, split і merge, TLS і KMS. MSK: теми з розділами (partitions), розділи лише додають, PLAINTEXT або TLS, KMS у спокої.", "a": "Розмір повідомлення: Kinesis 1 МБ, MSK 1 МБ за замовчуванням, але можна більше. MSK Serverless: Kafka без керування потужністю. У новіших кластерах KRaft замість ZooKeeper.", "tip": "Шарди чи розділи.", "d": "MSK це Apache Kafka, керований AWS. Kinesis це власний потік AWS.", "ic": "🌊🅺", "cap": "Одна й та сама ідея потоку, але різні двигуни й слова: шарди проти розділів.", "why": "Kafka має велику екосистему, тому AWS запропонував її в керованому вигляді."},
 {"g": "Інші сервіси", "t": "SES", "lit": "", "q": "Що вміє Amazon SES?", "m": "Надсилати й отримувати листи безпечно й у масштабі.", "a": "Панель репутації, показники доставки, зворотний зв'язок про спам. Сповіщення про bounce і скарги через SNS, автентифікація Easy DKIM, вхідні листи можна класти в S3 і запускати Lambda.", "tip": "Пошта у два боки.", "d": "Керований поштовий сервіс для транзакційних і масових листів.", "ic": "✉️", "cap": "Своя поштова служба в хмарі: і відправляє, і приймає листи.", "why": "Не треба піклуватися про поштові сервери й репутацію IP."},
 {"g": "Інші сервіси", "t": "ACM проти Private CA", "lit": "", "q": "Чим публічний сертифікат ACM відрізняється від AWS Private CA?", "m": "ACM: безкоштовні публічні TLS-сертифікати для HTTPS на ELB, CloudFront, API Gateway. Private CA: приватні сертифікати, яким довіряє лише ваша організація.", "a": "Private CA: root і підлеглі CA, X.509, TLS-зв'язок, підпис коду, автентифікація користувачів, комп'ютерів, API, IoT, PKI. Платний.", "tip": "Публічно безкоштовно, приватно платно.", "d": "Для сайтів у інтернеті достатньо ACM. Для внутрішніх сервісів потрібен власний центр сертифікації.", "ic": "📜🏛️", "cap": "ACM видає довідку, яку шанує весь світ. Private CA видає перепустки лише для вашого офісу.", "why": "Внутрішнім сервісам не потрібна довіра всього інтернету."},
 {"g": "Інші сервіси", "t": "Macie", "lit": "", "q": "Який сервіс шукає персональні дані в S3?", "m": "Amazon Macie: машинне навчання й шаблони знаходять чутливі дані (PII) і сповіщають.", "a": "Керований сервіс безпеки й приватності даних.", "tip": "PII в S3 означає Macie.", "d": "Macie проходить по даних і підсвічує, де лежать персональні дані.", "ic": "🕵️🪣", "cap": "Нишпорка, що переглядає склад і показує, де лежать паспорти й картки.", "why": "Знати, де лежать чутливі дані, треба для їх захисту."},
 {"g": "Інші сервіси", "t": "AppConfig: валідатори", "lit": "", "q": "Як AppConfig перевіряє конфігурацію перед розгортанням?", "m": "JSON Schema (синтаксична перевірка) або Lambda (семантична перевірка).", "a": "До двох валідаторів на профіль. Lambda має викинути виняток при помилці, ліміт 15 секунд. Призначення: feature flags, налаштування, allow і block списки без нового деплою.", "tip": "Форма схемою, зміст Lambda.", "d": "Схема перевіряє форму, а ваш код у Lambda перевіряє зміст.", "ic": "🛡️⚙️", "cap": "Спершу перевіряють, чи правильно заповнено форму, а потім чи має сенс її зміст.", "why": "Погана конфігурація може зламати застосунок і без зміни коду."},
 {"g": "Lambda", "t": "Event і Context", "lit": "", "q": "Де функція бачить дані події, а де свій RequestId і назву?", "m": "Дані події в event (JSON, у Python dict), інформація про виклик у context.", "a": "Приклади context: aws_request_id, function_name, memory_limit_in_mb. Context передає сама Lambda як другий аргумент handler.", "tip": "Event це «що робити», context це «хто я і як мене викликали».", "d": "Event це вхідний документ від того, хто викликав. Context це довідка про сам виклик і функцію.", "ic": "📨", "cap": "Event це лист із завданням, context це бейджик працівника з його номером і лімітами.", "why": "Розділення потрібне, щоб дані подій різних джерел не змішувались з метаданими середовища."},
 {"g": "Lambda", "t": "Хто викликає Lambda синхронно", "lit": "", "q": "Назвіть джерела, що викликають Lambda синхронно, і хто тоді робить retry.", "m": "Синхронно: ALB, API Gateway, CloudFront (Lambda@Edge), S3 Batch, Cognito, Step Functions, Lex, Alexa, Data Firehose. Retry робить клієнт.", "a": "Асинхронно: S3, SNS, EventBridge. Результат синхронного виклику повертається одразу.", "tip": "Хто чекає відповідь, той і повторює.", "d": "Синхронний виклик це телефонна розмова: ви чекаєте на лінії. Асинхронний це лист у скриньку.", "ic": "📞", "cap": "Синхронно означає, що викликач чекає, тому помилку бачить саме він і сам вирішує, чи повторювати.", "why": "Так простіше: сервіс, що чекає результат, знає контекст і сам керує повторами."},
 {"g": "Lambda", "t": "Lambda за ALB", "lit": "", "q": "Як віддати Lambda як HTTP(S) endpoint через Application Load Balancer?", "m": "Функцію реєструють у target group балансувальника ALB (або ставлять API Gateway).", "a": "Три шляхи до функції через HTTP: ALB, API Gateway, Function URL.", "tip": "ALB: Lambda в target group.", "d": "ALB може віддавати запити не лише на сервери, а й на функцію, якщо її додано як ціль.", "ic": "⚖️", "cap": "Балансувальник приймає запит і передає його функції так, ніби це звичайна ціль.", "why": "ALB вже є в багатьох системах, тож функцію просто додають до нього як ще одну ціль."},
 {"g": "Lambda", "t": "S3 події: нюанси", "lit": "", "q": "Чому дві одночасні операції запису в S3 можуть дати лише одну подію для Lambda і як це виправити?", "m": "У бакеті без версіонування два одночасні записи в один об'єкт можуть дати одну подію. Увімкніть versioning.", "a": "Події зазвичай за секунди, іноді за хвилину й більше. Повтор async-виклику дає дубльовані рядки в CloudWatch Logs.", "tip": "Подія на кожен запис: versioning.", "d": "Без версій обидва записи йдуть в один ключ, і S3 може злити їх в одне сповіщення.", "ic": "🪣", "cap": "Дві людини одночасно кладуть листа в один конверт: дзвінок у двері лунає один раз.", "why": "S3 гарантує сповіщення про зміну об'єкта, а не про кожен окремий запис в один ключ."},
 {"g": "Lambda", "t": "ESM: потоки проти черг", "lit": "", "q": "Чим відрізняється поведінка event source mapping для Kinesis і для SQS при помилці?", "m": "Потоки: весь батч повторюється, шард стоїть. SQS: повідомлення повертається після visibility timeout.", "a": "Потоки: один ітератор на шард, дані не видаляються, до 10 батчів на шард (parallelization factor), невдалі в on-failure destination. SQS: Lambda видаляє після успіху, DLQ на черзі.", "tip": "Потік стоїть на помилці, черга повертає.", "d": "Потік це журнал: читач просто рухає курсор, тому помилка зупиняє курсор. Черга видає повідомлення, і воно просто повертається.", "ic": "🛤️", "cap": "У потоці зламаний запис зупиняє весь шард, у черзі він лише повертається до скриньки.", "why": "Потоки гарантують порядок, тому не можуть пропустити зламаний запис без втрати порядку."},
 {"g": "Lambda", "t": "Масштабування SQS-тригера", "lit": "", "q": "Як швидко Lambda масштабується на SQS Standard, і що застаріло в старих конспектах?", "m": "Старт 5 паралельних викликів, далі до 300 на хвилину, максимум 1250.", "a": "Старі конспекти: +60 на хвилину, до 1000 батчів, це застаріло. FIFO масштабується до кількості активних message group.", "tip": "5, потім +300 на хвилину, стеля 1250.", "d": "Event source mapping сам нарощує кількість паралельних викликів залежно від черги.", "ic": "📈", "cap": "Спочатку п'ять робітників, потім щохвилини ще три сотні, але не більше 1250.", "why": "Поступове зростання захищає бекенди від раптового навантаження."},
 {"g": "Lambda", "t": "Керовані політики execution role", "lit": "", "q": "Яка політика потрібна Lambda для логів, для читання Kinesis, DynamoDB Streams, SQS і для VPC?", "m": "AWSLambdaBasicExecutionRole (логи), AWSLambdaKinesisExecutionRole, AWSLambdaDynamoDBExecutionRole, AWSLambdaSQSQueueExecutionRole, AWSLambdaVPCAccessExecutionRole, AWSXRayDaemonWriteAccess.", "a": "Event source mapping читає джерело правами execution role. Практика: одна роль на функцію.", "tip": "Назва політики каже, що вона дає.", "d": "Це готові набори прав, щоб не писати політики вручну.", "ic": "🎟️", "cap": "Готові перепустки: одна для журналу, інша для Kinesis, третя для VPC.", "why": "Окрема роль на функцію обмежує шкоду, якщо одну функцію скомпрометують."},
 {"g": "Lambda", "t": "PassThrough і Active tracing", "lit": "", "q": "Що буде з X-Ray трасуванням Lambda, якщо Active tracing не ввімкнено?", "m": "За замовчуванням діє PassThrough: Lambda лише передає заголовок трасування далі, трейси сама не шле.", "a": "Active: Lambda сама створює сегменти й шле. Змінні: _X_AMZN_TRACE_ID, AWS_XRAY_DAEMON_ADDRESS. Семплінг 1 запит на секунду плюс 5%.", "tip": "Без Active трейсів не буде.", "d": "Раніше Lambda слала трейси, коли upstream додавав заголовок. Тепер потрібно ввімкнути Active явно.", "ic": "🔭", "cap": "PassThrough передає естафету, але сам не бігає.", "why": "Так користувач сам вирішує, які функції трасувати, і не платить за зайве."},
 {"g": "Lambda", "t": "Edge: сценарії вибору", "lit": "", "q": "Коли CloudFront Functions, а коли Lambda@Edge?", "m": "Легка масова логіка (cache key, заголовки, rewrite, redirect, проста перевірка запиту): CloudFront Functions (JavaScript, під-мілісекунда, мільйони запитів на секунду).", "a": "Потрібні бібліотеки, мережа, диск чи тіло запиту, довший час: Lambda@Edge (Node.js, Python, тисячі запитів на секунду).", "tip": "Легке: CF Functions; важке чи з мережею: Lambda@Edge.", "d": "Обидва виконують код на краю CloudFront, ближче до користувача.", "ic": "🌍", "cap": "Легкий швидкий кур'єр проти повноцінного працівника з інструментами.", "why": "Дві опції існують, бо нескладні перетворення запиту потрібні масово й дуже дешево, а складні випадки рідші."},
 {"g": "Lambda", "t": "Lambda у VPC: інтернет", "lit": "", "q": "Чому Lambda в публічній підмережі не має інтернету і що робити?", "m": "Функція у VPC не має інтернету. Публічна підмережа не дає ні інтернету, ні публічної IP.", "a": "Приватна підмережа з NAT Gateway чи NAT Instance дає інтернет. VPC endpoints дають AWS-сервіси без NAT. Без VPC функція живе у VPC, яким володіє AWS.", "tip": "NAT або VPC endpoint.", "d": "ENI функції має лише приватну адресу, тож публічна підмережа сама інтернет не дає.", "ic": "🚪", "cap": "Двері в публічній підмережі не відчиняють самі: потрібен NAT як воротар.", "why": "У VPC функція отримує приватну мережеву картку, що не має публічної адреси."},
 {"g": "Lambda", "t": "EFS у Lambda", "lit": "", "q": "Що потрібно, щоб Lambda змонтувала EFS?", "m": "Функція має бути у VPC, і треба використовувати EFS Access Points.", "a": "Lambda монтує EFS в каталог під час ініціалізації. /tmp (до 10 ГБ) не гарантує збереження, EFS постійне й спільне.", "tip": "EFS: VPC плюс Access Point.", "d": "EFS це мережевий диск, який кілька функцій можуть бачити одночасно.", "ic": "🗄️", "cap": "Спільний мережевий диск, до якого треба мати ключ (Access Point) і бути в тій самій мережі.", "why": "Access Point обмежує функцію до потрібного каталогу й користувача, тому доступ безпечніший."},
 {"g": "Lambda", "t": "Function URL: AuthType", "lit": "", "q": "Як працює авторизація Function URL при AuthType NONE і AWS_IAM?", "m": "NONE: без IAM, але resource-based policy все одно діє й має дозволяти публічний доступ. AWS_IAM: той самий акаунт потребує Allow в identity-based АБО resource-based, різні акаунти потребують обох.", "a": "Потрібні lambda:InvokeFunctionUrl і (з жовтня 2025 для нових URL) lambda:InvokeFunction. Без політики 403. PrivateLink не підтримується. Ліміт запитів 10 разів reserved concurrency, понад це 429.", "tip": "Той самий акаунт: АБО. Різні акаунти: І.", "d": "Function URL це власна HTTPS-адреса функції, яка не змінюється.", "ic": "🔗", "cap": "Ворота без охоронця (NONE) все одно потребують дозволу в політиці функції.", "why": "Політика функції завжди діє, щоб навіть публічний URL не обходив авторизацію."},
 {"g": "Lambda", "t": "CloudFormation: код Lambda", "lit": "", "q": "Чому CloudFormation не оновив функцію, хоча я змінив zip у S3?", "m": "Якщо не змінити S3Bucket, S3Key чи S3ObjectVersion, CloudFormation не бачить зміни і функцію не оновить.", "a": "Inline-код через Code.ZipFile не може мати залежностей. З S3 потрібні S3Bucket, S3Key (повний шлях), S3ObjectVersion (для версійованого бакета).", "tip": "Змінюйте ключ чи версію, а не лише вміст.", "d": "CloudFormation порівнює значення в шаблоні, а не вміст файла в S3.", "ex": "Code:\n  S3Bucket: my-code-bucket\n  S3Key: builds/function-v2.zip\n  S3ObjectVersion: 3Lg9x", "ic": "📦", "cap": "Ви поміняли начинку коробки, а етикетка та сама: перевіряльник бачить ту саму етикетку.", "why": "Так CloudFormation лишається декларативним: оновлює лише те, що змінилось у шаблоні."},
 {"g": "Lambda", "t": "Container image практики", "lit": "", "q": "Які найкращі практики Lambda container images?", "m": "Базові образи AWS, multi-stage builds, від стабільного до змінного (часто змінюване якомога пізніше в Dockerfile), один репозиторій для функцій із великими шарами.", "a": "Образ до 10 ГБ з ECR, має реалізувати Lambda Runtime API, локально тестується через Runtime Interface Emulator.", "tip": "Стабільне зверху, змінне знизу.", "d": "Кеш шарів Docker перебудовує все, що нижче першої зміненої інструкції.", "ic": "🐳", "cap": "Щоб не збирати все наново, найчастіше змінюване кладуть у кінець.", "why": "Так збірки й завантаження швидші."},
 {"g": "Lambda", "t": "AppSpec для Lambda", "lit": "", "q": "Які поля appspec.yml для розгортання Lambda через CodeDeploy?", "m": "Name (функція), Alias, CurrentVersion (де трафік зараз), TargetVersion (куди зміщується).", "a": "Інтегровано в SAM. CodeDeploy автоматизує зміщення трафіку між версіями alias.", "tip": "Name, Alias, Current, Target.", "d": "AppSpec це інструкція CodeDeploy, яку функцію, який alias і з якої версії на яку перемикати.", "ic": "📋", "cap": "Чотири поля: що, де вказівник, звідки, куди.", "why": "Явні версії дозволяють відкотитись на попередню."},
 {"g": "Lambda", "t": "Правила Lambda: не рекурсуй", "lit": "", "q": "Чого ніколи не слід робити в коді Lambda?", "m": "Не писати рекурсивний код і не змушувати функцію викликати саму себе.", "a": "Інші практики: важке (БД, SDK, залежності) поза handler, налаштування в змінних середовища, секрети шифрувати KMS, мінімальний пакет, layers.", "tip": "Ніколи сама себе.", "d": "Рекурсія може розкрутитись і витратити весь ліміт паралельності та гроші.", "ic": "♻️", "cap": "Функція, яка кличе себе, як дзеркала навпроти одне одного.", "why": "Lambda платна за виклики й час, а безкінечна рекурсія швидко з'їсть ліміти."},
 {"g": "SQS", "t": "Основні API SQS", "lit": "", "q": "Які API SQS треба знати і які в них параметри та пастки?", "m": "CreateQueue (MessageRetentionPeriod), DeleteQueue, PurgeQueue (усі повідомлення, до 60 с), SendMessage (DelaySeconds), ReceiveMessage (MaxNumberOfMessages 1-10, за замовчуванням 1), DeleteMessage, ChangeMessageVisibility.", "a": "Batch-версії SendMessageBatch, DeleteMessageBatch, ChangeMessageVisibilityBatch зменшують вартість. Повторний PurgeQueue раніше 60 с дає PurgeQueueInProgress.", "tip": "Batch дешевше, Purge до 60 с.", "d": "Це набір дій над чергою: створити, надіслати, отримати, видалити, продовжити час.", "ic": "🧰", "cap": "Інструменти поштової скриньки: покласти, забрати, викинути, продовжити час.", "why": "Batch API групують повідомлення, тож менше запитів, а SQS платить за запити."},
 {"g": "SQS", "t": "Visibility timeout: два шляхи", "lit": "", "q": "Що буде, якщо споживач не встиг обробити повідомлення за visibility timeout?", "m": "Повідомлення знову стає видимим, його візьме інший споживач і буде дубль. Запізнілий DeleteMessage дає помилку.", "a": "Продовжити час можна ChangeMessageVisibility. Занадто великий таймаут: повторна обробка чекає. Занадто малий: дублі. Повідомлення без Delete лічиться невдалим отриманням.", "tip": "Довго обробляєш: ChangeMessageVisibility.", "d": "Після отримання повідомлення стає невидимим на 30 с (за замовчуванням).", "ic": "⏳", "cap": "Книжку взяли з полиці: поки читач не повернув, інші її не бачать, але якщо він затримався, її видадуть іншому.", "why": "Невидимість запобігає тому, щоб два споживачі одночасно брали одне повідомлення."},
 {"g": "SQS", "t": "Long polling: WaitTimeSeconds", "lit": "", "q": "Як ввімкнути long polling і як це називається в API?", "m": "Атрибут черги ReceiveMessageWaitTimeSeconds або параметр виклику ReceiveMessage WaitTimeSeconds, 1-20 с (найкраще 20).", "a": "Зменшує кількість порожніх відповідей і затримку. Short polling питає вибірку серверів і при малій черзі може повернути порожньо.", "tip": "Черга: Receive...; виклик: WaitTimeSeconds.", "d": "Споживач чекає, поки повідомлення з'явиться, а не питає знову й знову.", "ic": "🪑", "cap": "Не бігати до скриньки щохвилини, а посидіти біля неї, поки прийде лист.", "why": "Менше порожніх викликів, тож дешевше і швидше."},
 {"g": "SQS", "t": "FIFO: групи й споживачі", "lit": "", "q": "Скільки споживачів і який порядок при одному MessageGroupId і при різних?", "m": "Один MessageGroupId: один споживач і повний порядок. Різні групи: порядок усередині групи, у кожної групи може бути свій споживач, між групами порядку нема.", "a": "Дедуплікація 5 хв: content-based (SHA-256 тіла) або явний Deduplication ID. DLQ FIFO-черги має бути FIFO, Standard: Standard.", "tip": "Одна група: один споживач.", "d": "Група це лінія порядку.", "ic": "🛒", "cap": "Каси магазину: кожен покупець у своїй черзі, порядок лише в ній.", "why": "Порядок усередині групи дозволяє паралельність між групами."},
 {"g": "SNS", "t": "SNS: ліміти й публікація", "lit": "", "q": "Які ліміти SNS Standard і як публікують у топік і напряму в мобільні?", "m": "Standard: 12 500 000 підписок на топік і 100 000 топіків на акаунт.", "a": "Topic Publish: створити топік, підписку, опублікувати. Direct Publish: platform application, platform endpoint, publish у endpoint (Google, Apple APNs, Amazon ADM). Підписники: SQS, Lambda, Firehose, HTTP(S), SMS, email.", "tip": "Топік для багатьох, endpoint для одного пристрою.", "d": "Топік розсилає всім підписникам, direct publish адресує одному пристрою.", "ic": "📣", "cap": "Гучномовець для всіх або лист конкретному адресату.", "why": "Два режими, бо розсилка й адресна доставка вирішують різні задачі."},
 {"g": "SNS", "t": "SQS і SNS: політики доступу", "lit": "", "q": "Для чого потрібні access policies SQS і SNS?", "m": "Для доступу з іншого акаунта і щоб дозволити іншим сервісам (SNS, S3) писати в чергу чи топік.", "a": "IAM policies керують доступом до API. Шифрування: HTTPS в дорозі, KMS у спокої, клієнтське за бажанням.", "tip": "Інший акаунт чи сервіс: access policy.", "d": "Access policy це політика на самому ресурсі, як bucket policy в S3.", "ic": "🛂", "cap": "Табличка на дверях скриньки: хто ще може в неї класти.", "why": "Ресурс сам вирішує, хто з зовнішнього світу може його використовувати."},
 {"g": "SNS", "t": "S3 події в кілька черг", "lit": "", "q": "Як відправити одну S3 подію в багато черг, якщо S3 дозволяє лише одне правило на тип події й префікс?", "m": "Fan-out: S3 надсилає в SNS топік, а топік розсилає в кілька SQS (і Lambda).", "a": "Для тієї самої комбінації типу події і префікса може бути лише одне правило S3 Event.", "tip": "S3 → SNS → багато SQS.", "d": "Через обмеження S3 розгалуження робить SNS.", "ic": "🔀", "cap": "S3 дзвонить один раз, а SNS обдзвонює всіх.", "why": "Так продюсер не знає про споживачів."},
 {"g": "SQS", "t": "SQS, SNS, Kinesis: pull чи push", "lit": "", "q": "Чим SQS, SNS і Kinesis Data Streams відрізняються за моделлю й зберіганням?", "m": "SQS: споживач забирає, повідомлення видаляється. SNS: штовхає багатьом, не зберігає. Kinesis: стандартно pull, enhanced fan-out push, зберігає, можна перечитати.", "a": "Kinesis має provisioned або on-demand режим, порядок на рівні шарда. SQS і SNS потужність не резервують. SQS має DelaySeconds, SNS FIFO працює з SQS FIFO.", "tip": "Видаляє, не зберігає, перечитується.", "d": "Три шаблони доставки: черга, розсилка, журнал.", "ic": "🧭", "cap": "Поштова скринька, гучномовець і журнал, який можна перечитати.", "why": "Кожен розв'язує свою задачу, тому на іспиті питають, який обрати."},
 {"g": "Потоки і Step Functions", "t": "Kinesis: режими ємності", "lit": "", "q": "Чим on-demand відрізняється від provisioned у Kinesis Data Streams?", "m": "Provisioned: ви обираєте шарди (1 МБ/с запис, 2 МБ/с читання на шард), масштаб вручну, оплата за шард-годину. On-demand: без планування, до подвійного піка запису за 30 днів.", "a": "On-demand платить за потік на годину й за ГБ. Різке зростання більш ніж удвічі за 15 хв може дати throttling. Режими можна перемикати двічі на добу. Формула шардів: ceil(max(запис КіБ/с / 1024, читання КіБ/с / 2048)).", "tip": "Provisioned: шарди; on-demand: сам.", "d": "On-demand сам додає шарди, коли піки зростають.", "ic": "🚦", "cap": "Фіксовані смуги дороги проти дороги, що сама розширюється.", "why": "Provisioned дає контроль і дешевший при передбачуваному навантаженні."},
 {"g": "Потоки і Step Functions", "t": "KPL, KCL, Kinesis Agent", "lit": "", "q": "Які бібліотеки допомагають писати й читати Kinesis?", "m": "KPL (Producer Library) для продюсера, KCL (Client Library) для споживача, Kinesis Agent для логів і файлів.", "a": "KCL керує шардами й чекпойнтами. Запис у Kinesis: у конспекті 1 МБ, за документацією до 10 МіБ.", "tip": "P пише, C читає.", "d": "KPL і KCL це оптимізовані бібліотеки замість ручного використання API.", "ic": "📚", "cap": "Готові інструменти для запису й читання потоку.", "why": "Бібліотеки самі роблять батчинг і повтори, які важко написати вручну."},
 {"g": "Потоки і Step Functions", "t": "Firehose: що це і чого нема", "lit": "", "q": "Що Data Firehose вміє і чого не вміє порівняно з Kinesis Data Streams?", "m": "Керований, майже реальний час, доставляє в S3, Redshift, OpenSearch, Splunk, партнерів, HTTP; Lambda-трансформація; не зберігає дані і не має replay.", "a": "Раніше називався Kinesis Data Firehose. Запис до 1000 КБ. Сценарії: аналітика кліків, логи, IoT, BI. Backup усіх чи невдалих даних у S3.", "tip": "Firehose: без коду, без replay.", "d": "Firehose буферизує й доставляє пакетами, а не тримає потік.", "ic": "🚒", "cap": "Труба в басейн: вода надходить, але її не перечитаєш.", "why": "Буфер за розміром чи часом економить запити до сховища."},
 {"g": "Потоки і Step Functions", "t": "Managed Service for Apache Flink", "lit": "", "q": "Що таке Managed Service for Apache Flink і з чого він не читає?", "m": "Керований сервіс для Apache Flink (раніше Kinesis Data Analytics for Apache Flink): Java, Scala, Python, SQL.", "a": "Сам виділяє ресурси, паралелить, масштабується, робить checkpoints і snapshots. Flink не читає з Amazon Data Firehose (за конспектом, не звірено).", "tip": "Старе ім'я: Kinesis Data Analytics.", "d": "Flink це фреймворк обробки потоків.", "ic": "🌊", "cap": "Кластер, який безперервно рахує по потоку даних.", "why": "Керована версія знімає операційну роботу з кластером."},
 {"g": "Потоки і Step Functions", "t": "Step Functions: стани", "lit": "", "q": "Які типи станів у Step Functions і що робить Pass, Wait, Map, Parallel?", "m": "Task, Choice, Succeed, Fail, Pass (передає вхід на вихід без роботи), Wait (затримка), Map (динамічна ітерація), Parallel (паралельні гілки).", "a": "Task викликає Lambda, Batch, ECS, DynamoDB, SNS, SQS, інший workflow, Activity. Запуск: SDK, API Gateway, EventBridge.", "tip": "Pass нічого не робить.", "d": "State machine це схема кроків у JSON.", "ic": "🔢", "cap": "Блок-схема з різними типами блоків.", "why": "Різні типи дають розгалуження, цикли й паралелізм без коду."},
 {"g": "Потоки і Step Functions", "t": "Retry і Catch", "lit": "", "q": "Як працюють Retry і Catch, які поля і значення за замовчуванням?", "m": "Retry: ErrorEquals, IntervalSeconds, BackoffRate, MaxAttempts (за замовчуванням 3, 0 без повторів). Коли спроби скінчились, вмикається Catch.", "a": "Правила зверху вниз. Catch: ErrorEquals, Next, ResultPath. Коди: States.ALL, States.Timeout, States.TaskFailed, States.Permissions.", "tip": "Retry повторює, Catch переходить.", "d": "Retry це кілька спроб, Catch це план Б.", "ex": "\"Retry\": [{ \"ErrorEquals\": [\"States.TaskFailed\"], \"IntervalSeconds\": 30, \"MaxAttempts\": 2, \"BackoffRate\": 2.0 }],\n\"Catch\": [{ \"ErrorEquals\": [\"States.ALL\"], \"Next\": \"NextTask\", \"ResultPath\": \"$.error\" }]", "ic": "🔁", "cap": "Спробуй знову, а коли не вийшло, іди запасним шляхом.", "why": "Помилки обробляються в state machine, а не в коді застосунку."},
 {"g": "Потоки і Step Functions", "t": "ResultPath $.error", "lit": "", "q": "Що робить ResultPath у Catch?", "m": "Визначає, що піде на вхід стану Next. З $.error початкові дані лишаються і до них дописується помилка.", "a": "Без ResultPath входом наступного стану була б лише помилка.", "tip": "$.error дописує, а не заміняє.", "d": "ResultPath це «куди покласти результат у вхід».", "ic": "📝", "cap": "Нотатка про помилку на полях початкового листа, а не замість листа.", "why": "Наступний крок може використати і початкові дані, і причину помилки."},
 {"g": "Потоки і Step Functions", "t": "waitForTaskToken", "lit": "", "q": "Як призупинити Step Functions до зовнішньої події?", "m": "Додати .waitForTaskToken до Resource: крок чекає, доки хтось викличе SendTaskSuccess чи SendTaskFailure з Task Token.", "a": "Для людського схвалення, сторонніх і старих систем. Токен кладуть, наприклад, у повідомлення SQS. Express workflow цього не підтримує.", "tip": "Токен вернувся, продовжуємо.", "d": "Callback-патерн: залишити токен і чекати.", "ic": "🎫", "cap": "Талончик у черзі: стоїш, доки не викличуть за номером.", "why": "Дозволяє довго чекати без ресурсів."},
 {"g": "Потоки і Step Functions", "t": "Activity Tasks", "lit": "", "q": "Як працює Activity Task і скільки може чекати?", "m": "Воркер (EC2, Lambda, мобільний пристрій) сам питає завдання через GetActivityTask, потім SendTaskSuccess чи SendTaskFailure.", "a": "З довгим TimeoutSeconds і heartbeat крок може чекати до 1 року. Express Activities не підтримує.", "tip": "Воркер питає (poll).", "d": "Activity це завдання, яке виконує зовнішній воркер, не сам Step Functions.", "ic": "👷", "cap": "Робітник сам приходить за завданням і потім звітує.", "why": "Так воркер може бути де завгодно, навіть на своєму сервері."},
 {"g": "Потоки і Step Functions", "t": "Express: async і sync", "lit": "", "q": "Чим асинхронний Express відрізняється від синхронного?", "m": "Async Express: at-least-once, не чекає завершення, результат у CloudWatch Logs, потрібна ідемпотентність. Sync Express: at-most-once, чекає і повертає відповідь, викликається з API Gateway чи Lambda.", "a": "Standard: exactly-once, до 1 року, історія до 90 днів, оплата за state transitions. Express: до 5 хв, оплата за виконання, тривалість і пам'ять.", "tip": "Async: at-least-once, sync: at-most-once.", "d": "Express має два режими виклику.", "ic": "⚡", "cap": "Надіслати лист без відповіді чи зателефонувати й дочекатись.", "why": "Різні потреби: потокова обробка чи оркестрація мікросервісів."},
 {"g": "AppSync і Amplify", "t": "AppSync: що це", "lit": "", "q": "Що таке AppSync і яку проблему REST він розв'язує?", "m": "Керований GraphQL: клієнт обирає потрібні поля й отримує їх одним запитом, навіть з кількох джерел.", "a": "Джерела: DynamoDB, Aurora, OpenSearch, Lambda, HTTP. Real-time через WebSocket, офлайн-синхронізація для мобільних. Все починається із завантаження схеми.", "tip": "GraphQL: рівно ті поля.", "d": "Resolvers з'єднують поля схеми з джерелами даних.", "ic": "🕸️", "cap": "Замовляєте окремі страви, а не комплексний обід.", "why": "Менше запитів і менше зайвих даних для мобільних клієнтів."},
 {"g": "AppSync і Amplify", "t": "Авторизація AppSync", "lit": "", "q": "Які способи авторизації підтримує AppSync?", "m": "API_KEY, AWS_IAM, OPENID_CONNECT, AMAZON_COGNITO_USER_POOLS і AWS_LAMBDA (у конспекті було чотири).", "a": "API key до 365 днів, заголовок x-api-key. IAM: дія appsync:GraphQL. Окремі поля: директиви @aws_api_key, @aws_iam, @aws_oidc, @aws_cognito_user_pools, @aws_lambda.", "tip": "П'ять, а не чотири.", "d": "Один режим основний, інші додаткові.", "ic": "🔐", "cap": "П'ять різних перепусток до одного будинку.", "why": "Різні клієнти (публічні, внутрішні, користувачі) потребують різної автентифікації."},
 {"g": "AppSync і Amplify", "t": "AppSync проти API Gateway", "lit": "", "q": "Коли AppSync, а коли API Gateway?", "m": "AppSync: гнучкі GraphQL-запити з кількох джерел, real-time, офлайн для мобільних. API Gateway: REST, usage plans, API keys, кеш.", "a": "WAF працює перед AppSync (лекція 22).", "tip": "Поля на вибір: AppSync.", "d": "Різні моделі: GraphQL проти REST.", "ic": "⚔️", "cap": "Меню з вибором страв проти фіксованого комбо.", "why": "Тип API залежить від того, як клієнт хоче запитувати дані."},
 {"g": "AppSync і Amplify", "t": "Amplify: що це", "lit": "", "q": "Що таке AWS Amplify і з чим його порівнюють?", "m": "Набір інструментів для веб- і мобільних застосунків; «Elastic Beanstalk для мобільних і веб».", "a": "Готові автентифікація, дані, сховище, ML; бібліотеки для React, Vue, JavaScript, iOS, Android, Flutter. Amplify CLI/Studio це Gen 1, Gen 2 це code-first на TypeScript.", "tip": "Beanstalk для фронтенду.", "d": "Amplify розгортає ресурси за описом, не вручну.", "ic": "🧩", "cap": "Конструктор для застосунку: обираєш модулі, AWS їх розгортає.", "why": "Скорочує шлях від ідеї до працюючого застосунку."},
 {"g": "AppSync і Amplify", "t": "amplify add auth і api", "lit": "", "q": "Що розгортають команди amplify add auth і amplify add api?", "m": "auth: Amazon Cognito (реєстрація, вхід, MFA, social sign-in, UI-компоненти). api: AppSync і DynamoDB (локальні дані з автосинхронізацією, GraphQL).", "a": "DataStore дає офлайн і real-time. Чи DataStore лишається актуальним, не звірено.", "tip": "auth: Cognito, api: AppSync + DynamoDB.", "d": "Команди CLI за лаштунками створюють сервіси AWS.", "ic": "⌨️", "cap": "Одна команда: і вхід користувачів, і база готові.", "why": "Не треба вручну налаштовувати кілька сервісів."},
 {"g": "AppSync і Amplify", "t": "Amplify Hosting: можливості", "lit": "", "q": "Що вміє Amplify Hosting?", "m": "CI/CD, preview для pull request, custom domains, моніторинг, E2E-тести, feature branches, password protected branches, redirects і rewrites, atomic deployments.", "a": "Репозиторій: GitHub, Bitbucket, GitLab, CodeCommit. Підтримує SSR, SPA, генератори статичних сайтів.", "tip": "Гілка дає середовище.", "d": "Git-based хостинг на CDN з безперервним розгортанням.", "ic": "🚀", "cap": "Пушиш у гілку, а сайт сам збирається й публікується.", "why": "Автоматизація знімає ручне розгортання."},
 {"g": "AppSync і Amplify", "t": "E2E тести в Amplify", "lit": "", "q": "Де й чим запускають E2E-тести в Amplify Hosting?", "m": "У фазі test файла amplify.yml; інтегровано з Cypress, який формує UI-звіт.", "a": "Фази preTest, test, postTest та artifacts (звіти, png, mp4). Ловить регресії до продакшену.", "tip": "test у amplify.yml плюс Cypress.", "d": "Тести виконуються під час збірки, до розгортання.", "ic": "🧪", "cap": "Контроль якості на конвеєрі перед відправкою.", "why": "Помилку зупиняють до того, як вона потрапить користувачам."},
 {"g": "API Gateway", "t": "Типи endpoint", "lit": "", "q": "Чим Edge-optimized, Regional і Private endpoint відрізняються?", "m": "Edge-optimized (за замовчуванням): глобальні клієнти, через edge CloudFront, але API в одному регіоні. Regional: клієнти в регіоні, можна вручну поєднати з CloudFront. Private: лише з VPC через interface VPC endpoint (ENI), resource policy.", "a": "Custom domain: HTTPS через ACM; для Edge сертифікат у us-east-1, для Regional у регіоні API (не звірено в цій сесії); запис CNAME або A-alias.", "tip": "Edge: CloudFront, API в одному регіоні.", "d": "Тип endpoint вирішує, звідки і як клієнти потрапляють до API.", "ic": "🛣️", "cap": "Три входи в будівлю: глобальний, місцевий і службовий із VPC.", "why": "Різні клієнти мають різні вимоги до затримки й приватності."},
 {"g": "API Gateway", "t": "Stages і rollback", "lit": "", "q": "Чому зміни в API Gateway не діють і як їх відкотити?", "m": "Зміни діють лише після deployment на stage. Stages довільні (dev, test, prod), у кожної свої параметри. Історія deployment дозволяє відкотити stage.", "a": "Stage variables: Lambda ARN, HTTP endpoint, parameter mapping templates; формат ${stageVariables.variableName}.", "tip": "Без deployment нічого.", "d": "Deployment це знімок конфігурації, який публікується на stage.", "ic": "📸", "cap": "Чернетка не видна, доки не опублікуєш.", "why": "Це захищає клієнтів від напівготових змін."},
 {"g": "API Gateway", "t": "Stage variable і alias", "lit": "", "q": "Як одна інтеграція викликає різні alias Lambda залежно від stage?", "m": "Stage variable містить назву alias, у Lambda ARN стоїть ${stageVariables.alias}. API Gateway сам викликає потрібну функцію.", "a": "Для кожної функції чи alias треба вручну дати дозвіл apigateway.amazonaws.com (lambda add-permission). Canary на stage: окремі метрики й логи, можна перевизначити stage variables.", "tip": "stage dev: alias dev, prod: live.", "d": "Змінна стадії підставляється під час виклику.", "ex": "arn:aws:lambda:eu-north-1:111122223333:function:api:${stageVariables.alias}", "ic": "🔀", "cap": "Одна адреса, а ззаду перемикач на dev чи live.", "why": "Один API обслуговує багато середовищ."},
 {"g": "API Gateway", "t": "Canary на stage", "lit": "", "q": "Що дає canary deployment у API Gateway?", "m": "Вмикається на будь-якій stage (зазвичай prod), ви обираєте відсоток трафіку на canary-канал.", "a": "Метрики й логи canary окремі, можна перевизначити stage variables для canary.", "tip": "Окремі метрики.", "d": "Частина запитів іде на нову версію, решта на стару.", "ic": "🐤", "cap": "Канарка в шахті: випробовуємо на малій частині.", "why": "Ризик нової версії обмежений малим трафіком."},
 {"g": "API Gateway", "t": "MOCK, HTTP, AWS, proxy", "lit": "", "q": "Які типи інтеграції в API Gateway і де є mapping template?", "m": "MOCK: відповідь без бекенду. HTTP і AWS: потрібні integration request і integration response з mapping templates. AWS_PROXY: запит клієнта цілком у Lambda, без шаблонів. HTTP_PROXY: запит як є на бекенд, можна додати заголовки.", "a": "У proxy-режимах функція (чи бекенд) відповідає за логіку запиту й відповіді.", "tip": "Proxy: без шаблонів.", "d": "Шаблони потрібні лише коли API Gateway сам перетворює дані.", "ic": "🔌", "cap": "Або ви перекладач (HTTP/AWS), або прозора труба (proxy).", "why": "Proxy простіший, а шаблони дають гнучкість."},
 {"g": "API Gateway", "t": "Mapping template: SOAP", "lit": "", "q": "Як API Gateway перетворює REST JSON на SOAP XML?", "m": "Витягає дані із запиту (шлях, тіло, заголовок), будує SOAP-повідомлення за mapping template, викликає SOAP-сервіс, перетворює XML у потрібний формат і відповідає.", "a": "Mapping templates працюють лише в HTTP і AWS (не proxy): перейменувати query-параметри, змінити тіло, додати заголовки, Content-Type application/json чи xml.", "tip": "JSON ↔ XML через шаблони.", "d": "SOAP на XML, REST на JSON, шаблони з'єднують два світи.", "ic": "🔄", "cap": "Перекладач між двома мовами.", "why": "Нові клієнти можуть працювати зі старими SOAP-сервісами без змін на боці сервісу."},
 {"g": "API Gateway", "t": "API Gateway: навіщо з Lambda", "lit": "", "q": "Що дає зв'язка API Gateway і Lambda?", "m": "Нема інфраструктури; WebSocket; версіонування (v1, v2); середовища (dev, test, prod); безпека; API keys і throttling.", "a": "Підтримує автентифікацію й авторизацію (IAM, Cognito, custom authorizer).", "tip": "Без серверів.", "d": "Керований вхід до безсерверного бекенду.", "ic": "🏨", "cap": "Рецепція, що обслуговує кімнати без вашого персоналу.", "why": "Менше операційної роботи."},
 {"g": "API Gateway", "t": "Кеш API Gateway", "lit": "", "q": "Що треба знати про кеш відповідей API Gateway?", "m": "TTL за замовчуванням 300 с (0-3600, 0 вимикає). Кеш на stage, можна перевизначити для методу. Дорогий (оплата щогодини), має сенс у production.", "a": "Після вмикання кешуються лише GET. Ємність від 0,5 ГБ (верхню межу 237 ГБ не звірено). Метрики CacheHitCount і CacheMissCount.", "tip": "300 с, stage, платно.", "d": "Кеш зберігає відповіді бекенду, щоб не викликати його щоразу.", "ic": "🗃️", "cap": "Склад готових відповідей на вході: без походу в цех.", "why": "Зменшує навантаження на бекенд і затримку, але коштує грошей щогодини."},
 {"g": "API Gateway", "t": "Інвалідація кешу", "lit": "", "q": "Як клієнт скидає запис кешу API Gateway і чому потрібна авторизація?", "m": "Заголовок Cache-Control: max-age=0 від клієнта з правом execute-api:InvalidateCache.", "a": "Без політики будь-хто може інвалідувати кеш і підняти затримку. Неавторизовані: 403 або ігнорування заголовка. Cross-account не підтримується.", "tip": "max-age=0 плюс IAM.", "d": "Клієнт просить свіжу відповідь замість кешованої.", "ic": "🧹", "cap": "Прохання перевірити склад наново: дозволено лише своїм.", "why": "Інакше зловмисник знецінить кеш."},
 {"g": "API Gateway", "t": "Usage plan проти API key", "lit": "", "q": "Чим usage plan відрізняється від API key і чи авторизує ключ?", "m": "Usage plan: хто користується stages і методами, скільки і як швидко; throttling і квоти на клієнта. API key: рядок для ідентифікації клієнта.", "a": "Ключ ідентифікує й вимірює, але не авторизує. Потрібні для продажу API як послуги.", "tip": "Ключ це хто, план це скільки.", "d": "Тарифний план і картка клієнта.", "ic": "💳", "cap": "Картка клієнта і тариф, за яким йому дають доступ.", "why": "Так можна брати гроші й обмежувати кожного клієнта окремо."},
 {"g": "API Gateway", "t": "CORS preflight", "lit": "", "q": "Що має повернути API на OPTIONS preflight, щоб браузер пустив запит з іншого домену?", "m": "Заголовки Access-Control-Allow-Origin, Access-Control-Allow-Methods, Access-Control-Allow-Headers.", "a": "CORS потрібен, коли API викликають з іншого домену (наприклад сайт на S3). У proxy-режимі заголовки додає функція.", "tip": "Три Access-Control.", "d": "Браузер спершу питає дозволу OPTIONS-запитом.", "ic": "🛃", "cap": "Браузер перед поїздкою питає, чи пустять його з цього сайту.", "why": "Це захист користувача: чужий сайт не може вільно читати відповіді API."},
 {"g": "API Gateway", "t": "Безпека: IAM, Cognito, Lambda", "lit": "", "q": "Яку авторизацію API Gateway обрати: IAM, Cognito User Pool чи Lambda authorizer?", "m": "IAM: користувачі й ролі акаунта (Sig v4), resource policy для cross-account. Cognito: власний user pool, без коду, авторизація в бекенді. Lambda authorizer: сторонні токени.", "a": "Lambda authorizer повертає IAM-політику, результат кешується, платите за виклики. Бувають token-based і request parameter-based.", "tip": "Свої: IAM, користувачі: Cognito, чужі токени: Lambda.", "d": "Три способи пустити клієнта в API.", "ic": "🔑", "cap": "Три двері: службова, для гостей готелю і для гостей з чужою перепусткою.", "why": "Різні клієнти мають різні системи автентифікації."},
 {"g": "API Gateway", "t": "WebSocket: маршрути", "lit": "", "q": "Як WebSocket API Gateway вибирає бекенд для повідомлення?", "m": "Route selection expression (наприклад $request.body.action) бере поле JSON і порівнює з route keys; без збігу йде $default.", "a": "Готові ключі: $connect, $disconnect, $default; власні, наприклад join, quit. З'єднання закривається після 10 хв бездіяльності чи 2 год.", "tip": "Поле action обирає маршрут.", "d": "Маршрутизація за змістом повідомлення.", "ic": "🧭", "cap": "Сортувальник пошти за написом на листі.", "why": "Один WebSocket-ендпоінт обслуговує багато дій."},
 {"g": "API Gateway", "t": "WebSocket: @connections", "lit": "", "q": "Як сервер надсилає повідомлення клієнтові WebSocket?", "m": "HTTP-запит на Connection URL .../@connections/connectionId з підписом IAM Sig v4: POST надсилає, GET дає статус, DELETE відключає.", "a": "connectionId зазвичай зберігають, наприклад у DynamoDB, щоб Lambda знала, кому писати.", "tip": "POST, GET, DELETE.", "d": "Сервер пише клієнту через спеціальну адресу з'єднання.", "ic": "📡", "cap": "Адреса конкретної лінії: сказати, перевірити чи відрізати.", "why": "WebSocket двосторонній, тож серверу потрібен спосіб ініціювати повідомлення."},
 {"g": "API Gateway", "t": "Логи API Gateway", "lit": "", "q": "Які типи логування є в API Gateway і що для них потрібно?", "m": "Execution logging (дії обробки запиту) і access logging (хто й як звертався); вмикаються незалежно, на рівні stage.", "a": "Потрібна роль з політикою AmazonAPIGatewayPushToCloudWatchLogs, заданою на рівні акаунта в кожному регіоні. Рівні ERROR/DEBUG/INFO з конспекту не звірено. X-Ray разом з Lambda дає повну картину.", "tip": "Два типи, роль у регіоні.", "d": "Логи допомагають зрозуміти, що сталося із запитом.", "ic": "📜", "cap": "Журнал дій і журнал відвідувачів.", "why": "Роздільні логи дають і налагодження, і аудит."},
 {"g": "SAM і CloudFormation", "t": "sam sync і --code", "lit": "", "q": "Що робить sam sync --code і чим відрізняється від sam deploy?", "m": "Синхронізує лише код викликами API сервісів, в обхід CloudFormation (секунди), без оновлення інфраструктури.", "a": "sam sync: код і інфраструктура. --resource AWS::Serverless::Function: усі функції. --resource-id: один ресурс. --watch: стежить і синхронізує; зміна конфігурації через sam sync, лише код через --code. Для розробки.", "tip": "--code оминає CloudFormation.", "d": "SAM Accelerate скорочує час розгортання під час розробки.", "ex": "sam sync --code --resource-id HelloWorldLambdaFunction\nsam sync --watch", "ic": "⚡", "cap": "Швидка заміна деталі без повної перебудови.", "why": "Розробник отримує зворотний зв'язок за секунди."},
 {"g": "SAM і CloudFormation", "t": "SAM policy templates", "lit": "", "q": "Що таке SAM policy templates і які варто знати?", "m": "Готові шаблони прав для Lambda: S3ReadPolicy (читання об'єктів S3), SQSPollerPolicy (опитування SQS), DynamoDBCrudPolicy (CRUD в таблиці DynamoDB).", "a": "Підключаються в Policies функції з параметрами, наприклад QueueName: !GetAtt MyQueue.QueueName.", "tip": "Назва каже що дозволено.", "d": "Шаблон це скорочений набір прав замість довгої IAM-політики.", "ex": "Policies:\n  - SQSPollerPolicy:\n      QueueName: !GetAtt MyQueue.QueueName", "ic": "🎫", "cap": "Готовий набір ключів замість виготовлення свого.", "why": "Менше помилок і найменші привілеї."},
 {"g": "SAM і CloudFormation", "t": "sam local: чотири команди", "lit": "", "q": "Які чотири команди sam local і що робить кожна?", "m": "start-lambda: локальний endpoint, що емулює Lambda, для автотестів. invoke: один виклик з payload і вихід. start-api: локальний HTTP-сервер з усіма функціями, автоперезавантаження. generate-event: зразки payload для S3, API Gateway, SNS, Kinesis, DynamoDB.", "a": "Якщо функція викликає API AWS, перевірте опцію --profile.", "tip": "Lambda, invoke, api, event.", "d": "Локальні команди дозволяють тестувати без розгортання.", "ic": "💻", "cap": "Репетиція вистави до прем'єри.", "why": "Швидше й дешевше, ніж деплоїти кожну зміну."},
 {"g": "SAM і CloudFormation", "t": "samconfig.toml: середовища", "lit": "", "q": "Як у SAM розгортати dev і prod одним шаблоном?", "m": "Файл samconfig.toml з блоками [dev.deploy.parameters] і [prod.deploy.parameters] (stack_name, s3_bucket, s3_prefix, region, capabilities, parameter_overrides); вибір через sam deploy --config-env dev.", "a": "Є також [dev.sync.parameters] з watch = true і [prod.sync.parameters] з watch = false.", "tip": "--config-env обирає блок.", "d": "Один шаблон, кілька конфігурацій.", "ex": "[dev.deploy.parameters]\nstack_name = \"my-dev-stack\"\nparameter_overrides = \"Environment=Development\"\n\n[prod.deploy.parameters]\nstack_name = \"my-prod-stack\"\nparameter_overrides = \"Environment=Production\"", "ic": "🗂️", "cap": "Одна кулінарна книга, різні налаштування для кухонь.", "why": "Однаковий шаблон дає однакові стеки для різних середовищ."},
 {"g": "SAM і CloudFormation", "t": "SAM і CodeDeploy", "lit": "", "q": "Які ключі SAM керують безпечним розгортанням Lambda?", "m": "AutoPublishAlias (публікує версію й переставляє alias), DeploymentPreference (Canary, Linear, AllAtOnce), Alarms (відкат), Hooks (PreTraffic і PostTraffic перевірки).", "a": "SAM нативно використовує CodeDeploy: traffic shifting, pre/post hooks, автоматичний відкат за CloudWatch alarms.", "tip": "Alias, режим, alarms, hooks.", "d": "SAM описує те, що CodeDeploy виконує.", "ic": "🕹️", "cap": "Пульт, що поступово перемикає трафік і готовий відкотити.", "why": "Безпечні розгортання без ручної роботи."},
 {"g": "SAM і CloudFormation", "t": "SAM: від шаблону до стека", "lit": "", "q": "Як SAM-шаблон перетворюється на ресурси?", "m": "sam build (transform у CloudFormation і збирання коду), sam deploy (zip і upload в S3, create і execute ChangeSet), CloudFormation створює стек (Lambda, API Gateway, DynamoDB).", "a": "Рядок Transform: AWS::Serverless-2016-10-31. Типи: AWS::Serverless::Function, Api, SimpleTable. Сучасний sam deploy пакує сам (не звірено).", "tip": "Build, deploy, change set, stack.", "d": "SAM розгортається в звичайний CloudFormation.", "ic": "🏗️", "cap": "Короткий креслення перетворюється на повний будівельний план.", "why": "Простота SAM плюс потужність CloudFormation."},
 {"g": "CloudFormation", "t": "Rollback при збої", "lit": "", "q": "Що робить CloudFormation, коли створення чи оновлення стеку падає?", "m": "Створення впало: усе видаляється (можна вимкнути відкат). Оновлення впало: автовідкат до останнього робочого стану. Відкат теж впав: виправити вручну й ContinueUpdateRollback.", "a": "Стек у ROLLBACK_COMPLETE після невдалого створення лише видаляють і створюють заново.", "tip": "Створення: все геть. Оновлення: назад. Відкат: дотиснути.", "d": "Невдалу спробу CloudFormation відміняє сам. Якщо навіть відміна зламалась, треба полагодити вручну й попросити продовжити.", "ic": "↩️", "cap": "Три різні ситуації й три різні реакції CloudFormation.", "why": "Стек не має лишатися в напівстані."},
 {"g": "CloudFormation", "t": "Service role", "lit": "", "q": "Як дозволити користувачу керувати стеком, не давши йому прав на ресурси стеку?", "m": "Service role: IAM-роль, від імені якої CloudFormation створює, оновлює й видаляє ресурси. Користувачу потрібне iam:PassRole.", "a": "Мета: принцип найменших привілеїв.", "tip": "Роль працює замість людини, людині лише PassRole.", "d": "Користувач передає роль CloudFormation, і сервіс сам діє з її правами.", "ic": "🎭", "cap": "CloudFormation надягає роль і працює з її правами, а людині достатньо дозволу передати цю роль.", "why": "Не треба давати всім усі права на всі ресурси стеку."},
 {"g": "CloudFormation", "t": "CAPABILITY_IAM, NAMED_IAM, AUTO_EXPAND", "lit": "", "q": "Які capabilities потрібні шаблону з IAM, з іменованими IAM-ресурсами, з макросами чи вкладеними стеками?", "m": "CAPABILITY_IAM для IAM-ресурсів. CAPABILITY_NAMED_IAM, якщо вони мають власні імена. CAPABILITY_AUTO_EXPAND для макросів і вкладених стеків.", "a": "Без згоди: InsufficientCapabilitiesException.", "tip": "IAM, NAMED, AUTO_EXPAND: від простого до динамічного.", "d": "Це явні підтвердження, що ви усвідомлюєте наслідки: ставите галочку «так, я знаю, що цей шаблон створює права чи може змінитися».", "ic": "✅", "cap": "Без цієї галочки CloudFormation відмовиться розгортати шаблон.", "why": "Захист від випадкового створення прав доступу."},
 {"g": "CloudFormation", "t": "DeletionPolicy", "lit": "", "q": "Що робить DeletionPolicy і яке значення за замовчуванням?", "m": "Delete (за замовчуванням), Retain (залишити, для будь-якого ресурсу), Snapshot (фінальний знімок), RetainExceptOnCreate. Виняток: для RDS DBCluster і DBInstance без кластера типово Snapshot.", "a": "Delete не видалить непорожній S3 bucket. Політика діє при видаленні стеку чи ресурсу з шаблону, а не при заміні.", "tip": "Delete, Retain, Snapshot: видалити, залишити, зберегти знімок.", "d": "Перед знесенням стеку ви кажете, що саме робити з важливим ресурсом.", "ic": "🗑️", "cap": "Політика вирішує долю ресурсу, коли стек видаляють.", "why": "Страховка від втрати даних.", "ex": "Resources:\n  Data:\n    Type: AWS::S3::Bucket\n    DeletionPolicy: Retain"},
 {"g": "CloudFormation", "t": "Stack Policy", "lit": "", "q": "Що таке Stack Policy і як вона працює?", "m": "JSON, що визначає, які дії оновлення дозволені на яких ресурсах. Після її задання всі ресурси захищені за замовчуванням, потрібен явний Allow. Deny сильніший за Allow.", "a": "Політику не видалити, лише змінити. Для оновлення захищеного ресурсу задають тимчасову override-політику.", "tip": "Без політики дозволено все, з політикою заборонено все, крім Allow.", "d": "Замок на окремих ресурсах стеку, що діє лише під час оновлення.", "ic": "🛡️", "cap": "Захищає ресурси від змін під час оновлення стеку.", "why": "Щоб випадкове оновлення не замінило базу даних."},
 {"g": "CloudFormation", "t": "Termination Protection", "lit": "", "q": "Чим Termination Protection відрізняється від Stack Policy?", "m": "Termination Protection захищає від випадкового видалення стеку. Stack Policy захищає ресурси від змін під час оновлення. DeletionPolicy керує долею ресурсу при видаленні.", "a": "Це три різні рівні захисту, їх часто плутають на іспиті.", "tip": "Стек, оновлення, ресурс: три рівні захисту.", "d": "Прапорець на стеку, який не дає натиснути «видалити» помилково.", "ic": "🔒", "cap": "Захист від видалення самого стеку.", "why": "Один клік не має знищити весь стек."},
 {"g": "CloudFormation", "t": "Intrinsic functions: Ref, GetAtt, FindInMap, ImportValue, Base64", "lit": "", "q": "Що повертають Ref, GetAtt, FindInMap, ImportValue, Base64?", "m": "Ref: значення параметра чи physical ID ресурсу. GetAtt: атрибут ресурсу. FindInMap [Map, Ключ1, Ключ2]: значення з mapping. ImportValue: експорт іншого стеку. Base64: рядок у Base64 (напр. для UserData).", "a": "Умови: Fn::And, Equals, If, Not, Or.", "tip": "Ref це ID, GetAtt це властивість, ImportValue це чужий вихід.", "d": "Маленькі підказки, що підставляють у шаблон потрібні значення.", "ic": "🧩", "cap": "Вбудовані функції працюють усередині шаблону.", "why": "Шаблон статичний, функції роблять його гнучким.", "ex": "AvailabilityZone: !GetAtt Web.AvailabilityZone\nSubnetId: !ImportValue NetworkSubnetId"},
 {"g": "CloudFormation", "t": "Outputs і Export", "lit": "", "q": "Як передати значення з одного стеку в інший?", "m": "Оголосити Outputs з Export у першому стеку, а в другому Fn::ImportValue. Приклад: мережевий стек віддає VPC ID і Subnet IDs.", "a": "Найкращий спосіб співпраці між стеками.", "tip": "Output, Export, ImportValue: три слова для передачі.", "d": "Один стек кладе значення на загальну полицю, інший його бере.", "ic": "🔗", "cap": "Кожну частину (мережа, застосунок) веде окремий стек і експерт.", "why": "Розділення відповідальності між шарами."},
 {"g": "CloudFormation", "t": "Mappings і Conditions", "lit": "", "q": "Для чого Mappings і Conditions у шаблоні?", "m": "Mappings: фіксовані значення в шаблоні (середовище, регіон, AMI), читаються FindInMap. Conditions: чи створювати ресурс чи вихід залежно від середовища, регіону, параметра.", "a": "Умова може посилатися на іншу умову, параметр чи mapping.", "tip": "Mapping це таблиця, Condition це «якщо».", "d": "Mapping як довідник, Condition як вимикач ресурсу.", "ic": "📋", "cap": "Один шаблон працює і для dev, і для prod.", "why": "Не дублювати шаблони."},
 {"g": "CloudFormation", "t": "Custom resource", "lit": "", "q": "Коли потрібен Custom Resource в CloudFormation?", "m": "Для ресурсів, яких CloudFormation ще не підтримує, і для власної логіки на create/update/delete через Lambda. ServiceToken (ARN Lambda чи SNS) обовʼязковий, у тому ж регіоні.", "a": "Приклад: очистити S3 bucket перед видаленням стеку. Відповідь провайдера до 4096 байтів.", "tip": "ServiceToken: куди слати запит.", "d": "Ви підключаєте власний скрипт до життєвого циклу стеку.", "ic": "🔧", "cap": "CloudFormation викликає вашу Lambda на кожну подію ресурсу.", "why": "CloudFormation не вміє всього."},
 {"g": "CloudFormation", "t": "Видалення непорожнього S3 bucket", "lit": "", "q": "Чому стек не видаляється, коли в ньому S3 bucket з об'єктами?", "m": "DeletionPolicy Delete не видаляє непорожній bucket: спершу треба видалити всі об'єкти. Рішення: custom resource з Lambda очищує bucket на подію Delete.", "a": "Або поставити Retain.", "tip": "Порожній bucket: видалиться. З файлами: ні.", "d": "Не можна викинути відро, поки в ньому є речі.", "ic": "🪣", "cap": "Типова пастка на іспиті.", "why": "Захист від випадкової втрати об'єктів."},
 {"g": "CloudFormation", "t": "StackSets", "lit": "", "q": "Що таке StackSets і хто їх створює?", "m": "Створює, оновлює, видаляє стеки в багатьох акаунтах і регіонах однією операцією з одного шаблону. Можна на всі акаунти AWS Organization. Створювати може лише адмін-акаунт чи delegated administrator.", "a": "Оновлення StackSet оновлює всі stack instances.", "tip": "Багато акаунтів, один шаблон, адмін-акаунт.", "d": "Один шаблон розкладається по всіх акаунтах і регіонах.", "ic": "🌍", "cap": "Централізоване розгортання.", "why": "Централізована база безпеки й логування."},
 {"g": "CloudFormation", "t": "Розмір шаблону", "lit": "", "q": "Як передати шаблон у CloudFormation і які ліміти?", "m": "Напряму до 51 200 байт чи через S3 URL до 1 МБ. До 500 ресурсів, 200 parameters, 200 mappings, 200 outputs на шаблон. Більше: вкладені стеки.", "a": "У нотатках стверджувалось, що шаблон мусить бути в S3: для малих це не так.", "tip": "51 200 байт напряму, 1 МБ через S3.", "d": "Малий шаблон можна передати як текст, великий кладуть в S3.", "ic": "📏", "cap": "Два способи передачі шаблону.", "why": "Ліміт запиту API."},
 {"g": "CDK", "t": "CDK: що це", "lit": "", "q": "Що таке AWS CDK і як воно розгортає?", "m": "Інфраструктура мовою програмування (TypeScript, JavaScript, Python, Java, .NET). Код синтезується в шаблон CloudFormation (cdk synth), розгортає CloudFormation.", "a": "Можна розгортати інфраструктуру й код застосунку разом (Lambda, контейнери ECS/EKS).", "tip": "CDK = код, що стає CloudFormation.", "d": "Ви пишете інфраструктуру як програму, а CDK робить з неї шаблон.", "ic": "💻", "cap": "Код стає шаблоном CloudFormation.", "why": "Цикли, функції й повторне використання."},
 {"g": "CDK", "t": "CDK чи SAM", "lit": "", "q": "Чим CDK відрізняється від SAM?", "m": "SAM: лише serverless, JSON чи YAML, швидкий старт з Lambda. CDK: усі сервіси AWS, мова програмування. Обидва через CloudFormation.", "a": "SAM CLI може локально тестувати застосунок CDK після cdk synth.", "tip": "SAM це скорочений YAML, CDK це код.", "d": "SAM для швидкої Lambda, CDK для всього й на мові програмування.", "ic": "⚖️", "cap": "Різні інструменти для різних потреб.", "why": "Обидва ведуть до CloudFormation."},
 {"g": "CDK", "t": "Рівні constructs L1 L2 L3", "lit": "", "q": "Що таке constructs L1, L2, L3 в CDK?", "m": "L1 (CFN Resources, імена з Cfn, напр. CfnBucket): 1:1 з CloudFormation, усі властивості вручну. L2: ресурс з розумними типовими значеннями й методами (bucket.addLifecycleRule()). L3 (patterns): кілька повʼязаних ресурсів (LambdaRestApi, ApplicationLoadBalancerFargateService).", "a": "Construct Hub: додаткові constructs від AWS, третіх сторін, спільноти.", "tip": "L1 сирий, L2 зручний, L3 готова архітектура.", "d": "Три рівні абстракції: цеглина, стіна, готова кімната.", "ic": "🧱", "cap": "Рівень абстракції обирають за потребою контролю.", "why": "Баланс контролю й зручності."},
 {"g": "CDK", "t": "cdk bootstrap", "lit": "", "q": "Що робить cdk bootstrap і коли його потрібно запускати?", "m": "Готує environment (акаунт + регіон): стек CDKToolkit із S3 bucket, ECR repository та IAM-ролями. Запускати для кожного нового environment: cdk bootstrap aws://акаунт/регіон.", "a": "Без цього помилка Policy contains a statement with one or more invalid principal.", "tip": "Новий акаунт чи регіон: спершу bootstrap.", "d": "Одноразова підготовка перед першим розгортанням.", "ic": "🥾", "cap": "CDK потрібне місце для файлів і ролі для розгортань.", "why": "Файли й ролі для розгортань."},
 {"g": "CDK", "t": "Команди CDK", "lit": "", "q": "Які основні команди CDK CLI?", "m": "npm install -g aws-cdk (CLI), cdk init app, cdk synth (вивести шаблон), cdk bootstrap, cdk deploy, cdk diff (різниця з розгорнутим), cdk destroy.", "a": "aws-cdk-lib це бібліотека constructs, CLI це пакет aws-cdk.", "tip": "init, synth, bootstrap, deploy, diff, destroy.", "d": "Шість команд на весь життєвий цикл.", "ic": "⌨️", "cap": "Команди життєвого циклу.", "why": "Єдиний інструмент від проєкту до видалення."},
 {"g": "CDK", "t": "Тести CDK", "lit": "", "q": "Які види тестів у CDK?", "m": "CDK Assertions із Jest чи Pytest. Fine-grained assertions (поширені): окремі властивості, кількість ресурсів. Snapshot tests: шаблон проти збереженого еталона. Template.fromStack чи Template.fromString.", "a": "fromStack для стеків з CDK, fromString для стеків поза CDK.", "tip": "Fine-grained: конкретне. Snapshot: усе.", "d": "Один тест перевіряє деталь, інший порівнює весь шаблон з еталоном.", "ic": "🧪", "cap": "Два способи перевірити синтезований шаблон.", "why": "Швидко ловити зміни шаблону.", "ex": "template.hasResourceProperties(\"AWS::Lambda::Function\", { Handler: \"handler\" });\ntemplate.resourceCountIs(\"AWS::SNS::Subscription\", 1);\nexpect(template.toJSON()).toMatchSnapshot();"},
 {"g": "Elastic Beanstalk", "t": "Beanstalk: що це", "lit": "", "q": "Що таке Elastic Beanstalk і за що платити?", "m": "PaaS: завантажуєте код, сервіс створює EC2, ASG, ELB, RDS, моніторинг. Повний контроль конфігурації. Сам Beanstalk безкоштовний, платите за ресурси під ним.", "a": "Під капотом CloudFormation. Компоненти: Application, Application Version, Environment, Tier (Web Server, Worker).", "tip": "PaaS над EC2, ASG, ELB.", "d": "Ви віддаєте код, а інфраструктуру збирає Beanstalk.", "ic": "🌱", "cap": "Платформа над знайомими сервісами.", "why": "Швидкий запуск веб-застосунку без ручної інфраструктури."},
 {"g": "Elastic Beanstalk", "t": "Політики деплою Beanstalk", "lit": "", "q": "Які політики деплою є в Beanstalk і чим вони відрізняються?", "m": "All at once (простій, найшвидше). Rolling (пачками, потужність знижена, обидві версії). Rolling with additional batch (додаткова пачка, повна потужність). Immutable (нова ASG, висока вартість, швидкий відкат). Traffic splitting (канарка на відсоток трафіку). Blue/Green (нове середовище, swap URL).", "a": "Blue/Green в офіційному списку політик нема: це обмін URL середовищ.", "tip": "Простій, знижена, повна, нова ASG, канарка, swap.", "d": "Шість шляхів оновлення від найшвидшого до найбезпечнішого.", "ic": "🚦", "cap": "Шість шляхів оновлення.", "why": "Баланс швидкості, вартості й ризику."},
 {"g": "Elastic Beanstalk", "t": "All at once чи Rolling", "lit": "", "q": "Яка політика Beanstalk найшвидша, а яка не має простою без додаткової вартості?", "m": "All at once: найшвидше, короткий простій, без додаткової вартості, добре для dev. Rolling: без простою й без додаткової вартості, але потужність знижена й деплой тривалий.", "a": "За замовчуванням All at once; EB CLI для масштабованого середовища Rolling.", "tip": "All at once швидко, Rolling повільно, але без простою.", "d": "Усе одразу чи пачками.", "ic": "🏃", "cap": "Швидкість проти доступності.", "why": "Dev і прод мають різні потреби."},
 {"g": "Elastic Beanstalk", "t": "Rolling with additional batch", "lit": "", "q": "Яка політика Beanstalk зберігає повну потужність під час деплою?", "m": "Rolling with additional batch: спершу додаткова пачка нових інстансів, повна потужність, обидві версії одночасно, додаткова пачка видаляється наприкінці, трохи дорожче, добре для прод.", "a": "Порівняйте з Rolling, де потужність знижена.", "tip": "Додаткова пачка = повна потужність.", "d": "Перед заміною запасна пачка інстансів.", "ic": "➕", "cap": "Запасна пачка тримає потужність.", "why": "Не втрачати потужність."},
 {"g": "Elastic Beanstalk", "t": "Immutable і Traffic splitting", "lit": "", "q": "Чим Immutable відрізняється від Traffic splitting?", "m": "Обидва створюють нову тимчасову ASG з новими інстансами. Immutable: після здоровʼя нові замінюють усі старі, відкат швидкий (нові видаляються). Traffic splitting: спершу малий відсоток трафіку протягом evaluation time, потім усе. Потребує ALB.", "a": "Обидва дорогі (подвійна потужність) і найдовші.", "tip": "Immutable заміна, Traffic splitting канарка.", "d": "Ту саму нову групу або одразу вводять, або спершу пробують на малій частці.", "ic": "🐤", "cap": "Нова група інстансів у двох режимах.", "why": "Безпечне розгортання без простою."},
 {"g": "Elastic Beanstalk", "t": "Beanstalk Blue/Green", "lit": "", "q": "Як у Beanstalk робиться blue/green?", "m": "Створюють нове окреме середовище (green), перевіряють незалежно, потім міняють URL (swap environment URLs). Можна Route 53 weighted для малої частки трафіку на stage. Відкат: поміняти назад.", "a": "Єдиний варіант зі зміною DNS/CNAME.", "tip": "Нове середовище, swap URL.", "d": "Два повних середовища й перемикач між ними.", "ic": "🔄", "cap": "Два середовища й обмін URL.", "why": "Нульовий простій і зручний відкат."},
 {"g": "Elastic Beanstalk", "t": "Lifecycle policy версій", "lit": "", "q": "Навіщо lifecycle policy у Beanstalk?", "m": "Квота 1000 версій застосунків на регіон. Якщо не чистити, нову версію не створити. Lifecycle policy видаляє старі за віком чи за кількістю. Версії, що зараз використовуються, не видаляються.", "a": "За замовчуванням source bundle лишається в S3.", "tip": "1000 версій: чисти за віком чи кількістю.", "d": "Автоматичне прибирання старих версій.", "ic": "🧹", "cap": "Прибирання старих версій.", "why": "Не вперитися в ліміт."},
 {"g": "Elastic Beanstalk", "t": ".ebextensions", "lit": "", "q": "Як налаштувати Beanstalk кодом?", "m": "Каталог .ebextensions/ у корені коду, файли .config у YAML чи JSON. option_settings змінює типові налаштування, розділ Resources додає ресурси (RDS, ElastiCache, DynamoDB).", "a": "Beanstalk використовує CloudFormation, тому ресурси описують як у CloudFormation.", "tip": "Корінь, .ebextensions, .config.", "d": "Налаштування з консолі в коді.", "ic": "📁", "cap": "Налаштування у файлах поруч із кодом.", "why": "Відтворюваність конфігурації.", "ex": "option_settings:\n  aws:elasticbeanstalk:command:\n    DeploymentPolicy: Rolling\n    BatchSizeType: Percentage\n    BatchSize: 25"},
 {"g": "Контейнери", "t": "ECS EC2 launch type", "lit": "", "q": "Що потрібно для EC2 launch type в ECS?", "m": "Ви створюєте й ведете EC2-інстанси, на кожному ECS Agent, що реєструє інстанс у кластері. AWS стартує й зупиняє контейнери.", "a": "Fargate: інстансів нема, потрібні лише task definitions, масштабуєте кількістю tasks.", "tip": "Agent на інстансі.", "d": "Ви тримаєте сервери, AWS запускає контейнери.", "ic": "🖥️", "cap": "Ваші сервери під контейнерами.", "why": "Контроль над інфраструктурою."},
 {"g": "Контейнери", "t": "EC2 Instance Profile в ECS", "lit": "", "q": "Для чого EC2 Instance Profile в ECS і чим він відрізняється від Task Role?", "m": "Лише EC2 launch type. Використовує ECS agent: API ECS, логи в CloudWatch, образ з ECR, посилання на секрети Secrets Manager чи SSM. Task Role: окрема роль задачі, задається в task definition.", "a": "Для різних сервісів ECS використовують різні Task Roles.", "tip": "Profile для агента, Task Role для задачі.", "d": "Роль інстансу й роль кожної задачі різні.", "ic": "🏷️", "cap": "Дві ролі для різних виконавців.", "why": "Розділення прав."},
 {"g": "Контейнери", "t": "ECS Service Auto Scaling", "lit": "", "q": "Як масштабується ECS сервіс?", "m": "Application Auto Scaling змінює бажану кількість tasks за CPU, памʼяттю чи ALBRequestCountPerTarget. Політики: Target Tracking (цільове значення метрики), Step Scaling (CloudWatch alarm), Scheduled (за часом).", "a": "ECS Service Auto Scaling (tasks) не те саме, що EC2 Auto Scaling (інстанси). Fargate налаштувати легше.", "tip": "Tasks окремо, інстанси окремо.", "d": "Дві різні драбини масштабування.", "ic": "📈", "cap": "Масштабування рівня tasks.", "why": "Задачі й інстанси масштабуються окремо."},
 {"g": "Контейнери", "t": "Capacity Provider", "lit": "", "q": "Як додавати EC2 для ECS tasks автоматично?", "m": "Два способи: Auto Scaling Group Scaling (за CPU) чи ECS Cluster Capacity Provider, що автоматично створює й масштабує інфраструктуру і додає EC2, коли бракує CPU чи RAM.", "a": "Це масштабування інстансів, а не tasks.", "tip": "Capacity Provider додає EC2, коли нема місця.", "d": "Кластер сам просить більше серверів.", "ic": "🔋", "cap": "Автоматично додає EC2 для tasks.", "why": "Не гадати кількість інстансів."},
 {"g": "Контейнери", "t": "Task definition: вміст", "lit": "", "q": "Що містить task definition?", "m": "JSON-метадані: імʼя образу, port binding контейнера й хоста, CPU і памʼять, змінні середовища, мережа, IAM-роль, логування (CloudWatch). До 10 контейнерів в одній (не звірено).", "a": "Fargate вимагає awsvpc.", "tip": "Образ, порти, CPU, памʼять, ролі, логи.", "d": "Рецепт запуску контейнера.", "ic": "📝", "cap": "Опис, як запускати контейнер.", "why": "Опис окремо від запуску."},
 {"g": "Контейнери", "t": "Dynamic Host Port Mapping", "lit": "", "q": "Як ALB знаходить порт задачі на EC2 і що у Fargate?", "m": "EC2: у task definition лише порт контейнера, ECS дає динамічний host port, ALB знаходить його; SG інстанса дозволяє будь-який порт від SG ALB. Fargate: кожна task має унікальний приватний IP, host port не застосовується, на ENI дозволяють порт від ALB.", "a": "Fargate: SG ENI дозволяє порт 80 від ALB, SG ALB приймає 80/443 з вебу.", "tip": "EC2 динамічний порт, Fargate свій IP.", "d": "На одному EC2 кілька копій на різних портах.", "ic": "🔌", "cap": "Різна адресація задач.", "why": "Кілька tasks одного сервісу на одному інстансі."},
 {"g": "Контейнери", "t": "Змінні середовища ECS", "lit": "", "q": "Звідки контейнер ECS бере змінні й секрети?", "m": "Hardcoded (URL), SSM Parameter Store (API keys, спільні конфіги), Secrets Manager (паролі БД), environment files в S3 (багато змінних одразу).", "a": "Секрети не вшивають в образ.", "tip": "Parameter Store для ключів, Secrets Manager для паролів, S3 для файлу змінних.", "d": "Різні джерела для різної чутливості.", "ic": "🔑", "cap": "Звідки беруться змінні.", "why": "Секрети не в образі."},
 {"g": "Контейнери", "t": "Bind mounts і sidecar", "lit": "", "q": "Що таке bind mounts в ECS?", "m": "Спільні дані між кількома контейнерами однієї task definition, в EC2 і Fargate. Використання: ефемерні дані й шаблон sidecar (допоміжний контейнер шле метрики чи логи кудись).", "a": "Дані ефемерні.", "tip": "Спільна папка контейнерів однієї задачі.", "d": "Допоміжний контейнер читає логи основного.", "ic": "📂", "cap": "Спільна папка контейнерів задачі.", "why": "Розділення відповідальності."},
 {"g": "Контейнери", "t": "Task placement strategies", "lit": "", "q": "Які стратегії розміщення tasks в ECS і де вони діють?", "m": "Лише EC2 launch type. Binpack (найменше вільних CPU/памʼяті, економія), Random, Spread (рівномірно за instanceId чи attribute:ecs.availability-zone). Можна комбінувати.", "a": "Fargate не підтримує.", "tip": "Binpack економить, Spread розсіює.", "d": "Де поставити нову task.", "ic": "🧮", "cap": "Куди поставити нову task.", "why": "Вартість чи відмовостійкість."},
 {"g": "Контейнери", "t": "Task placement constraints", "lit": "", "q": "Які обмеження розміщення tasks є в ECS?", "m": "distinctInstance: кожна task на іншому EC2. memberOf: лише на інстансах, що відповідають виразу Cluster Query Language.", "a": "Лише EC2 launch type.", "tip": "distinctInstance: різні інстанси, memberOf: за виразом.", "d": "Жорсткі правила розміщення.", "ic": "📍", "cap": "Жорсткі правила поверх стратегій.", "why": "Додатково до стратегій."},
 {"g": "Контейнери", "t": "EKS вузли", "lit": "", "q": "Які типи вузлів в EKS?", "m": "Managed Node Groups (EKS створює й веде вузли в ASG; On-Demand чи Spot). Self-Managed Nodes (ви створюєте, ведете через ASG, EKS Optimized AMI). AWS Fargate (без вузлів).", "a": "По одному кластеру на регіон. Логи й метрики: Container Insights.", "tip": "Managed, Self-Managed, Fargate.", "d": "Хто тримає вузли Kubernetes.", "ic": "☸️", "cap": "Три варіанти вузлів.", "why": "Баланс контролю й зручності."},
