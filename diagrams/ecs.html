<script>
const wrap = document.getElementById("wrap");
const box = document.getElementById("box");
const pct = document.getElementById("pct");
let natural = 0;
let scale = 1;
function apply(next) {
  scale = Math.max(0.1, Math.min(2.5, next));
  box.style.zoom = scale;
  pct.textContent = Math.round(scale * 100) + "%";
}
function fitWidth() {
  apply(Math.min(1, (wrap.clientWidth - 8) / natural));
}
const timer = setInterval(() => {
  const svg = box.querySelector("svg");
  if (!svg) return;
  const width = parseFloat(svg.getAttribute("width")) || svg.getBoundingClientRect().width;
  if (!width) return;
  natural = width;
  clearInterval(timer);
  fitWidth();
}, 300);
document.getElementById("minus").onclick = () => apply(scale / 1.35);
document.getElementById("plus").onclick = () => apply(scale * 1.35);
document.getElementById("fit").onclick = fitWidth;
document.getElementById("full").onclick = () => apply(1);
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.BackButton.show();
  tg.BackButton.onClick(() => { location.href = "index.html"; });
}
</script>
