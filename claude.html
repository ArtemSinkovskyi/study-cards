<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#1d1d1f; --mut:#6b6b70; --line:#e3dfd6; --acc:#24466b; --ok:#1e7a46; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, Segoe UI, Roboto, sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:.75rem 1rem; }
  .wrap { max-width:40rem; margin:0 auto; padding:0 1rem; }
  header .wrap { padding:0; }
  h1 { font-size:1.05rem; margin:0 0 .5rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  select, .chip { font:inherit; padding:.35rem .6rem; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); }
  .chip { cursor:pointer; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .bar { height:.4rem; background:var(--line); border-radius:1rem; margin-top:.6rem; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .st { font-size:.85rem; color:var(--mut); margin-top:.3rem; }
  main { padding:1.2rem 0 3rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:.9rem; min-height:15rem; padding:1.4rem; cursor:pointer; display:flex; flex-direction:column; justify-content:center; text-align:center; user-select:none; }
  .term.q { font:600 1.2rem/1.4 system-ui, Segoe UI, Roboto, sans-serif; }
  .def { background:#f1f6ee; border-radius:.5rem; padding:.5rem .7rem; }
  .term { font:600 1.7rem/1.3 ui-monospace, Consolas, monospace; word-break:break-word; }
  .hint { color:var(--mut); font-size:.85rem; margin-top:1rem; }
  .group { color:var(--acc); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.8rem; }
  .back { text-align:left; }
  .back .lit { color:var(--mut); font-size:.95rem; }
  .back p { margin:.7rem 0 0; }
  .back b { color:var(--acc); }
  .ex { background:#1d1d1f; color:#f4f1ea; border-radius:.5rem; padding:.6rem .8rem; font:.82rem/1.45 ui-monospace, Consolas, monospace; overflow-x:auto; white-space:pre; margin:.7rem 0 0; }
  .pic { display:flex; align-items:center; gap:.8rem; background:#fff7e6; border:1px dashed #e3c987; border-radius:.6rem; padding:.5rem .8rem; margin:.2rem 0 .6rem; }
  .pic .big { font-size:2rem; line-height:1; }
  .pic .cap { font-size:.92rem; color:#5a4a1f; }
  .refs { margin-top:.8rem; padding-top:.6rem; border-top:1px dashed var(--line); font-size:.85rem; color:var(--mut); }
  .refs ul { margin:.3rem 0 0; padding-left:1.1rem; }
  .refs a { color:var(--acc); }
  .why { background:#fff6e0; border-radius:.5rem; padding:.5rem .7rem; }
  .tip { margin-top:.9rem; padding:.55rem .7rem; background:#eef3f9; border-radius:.5rem; font-size:.92rem; }
  .btns { display:flex; gap:.7rem; margin-top:1rem; }
  .btns button { flex:1; padding:.8rem; font:inherit; border-radius:.6rem; border:0; cursor:pointer; color:#fff; }
  .know { background:var(--ok); }
  .no { background:var(--bad); }
  .small { background:#fff !important; color:var(--acc) !important; border:1px solid var(--acc) !important; flex:none !important; padding:.5rem .8rem !important; }
  .done { text-align:center; padding:2rem 1rem; background:var(--card); border:1px solid var(--line); border-radius:.9rem; }
</style>

const GLOSSARY = [["\\bMCP\\b","MCP (Model Context Protocol)","відкритий стандарт підключення інструментів і даних до моделі, як JDBC для баз.","https://code.claude.com/docs/en/mcp.md"],["Claude Code","Claude Code","агент Anthropic для розробки в терміналі й IDE.","https://code.claude.com/docs/en/overview"],["\\bhooks?\\b|\\bHook\\b|PreToolUse|PostToolUse","Hooks","ваші скрипти, які Claude Code запускає на подію (до чи після інструмента, на зупинку тощо).","https://code.claude.com/docs/en/hooks.md"],["[Ss]ubagent|субагент","Subagent","помічник зі своїм вікном контексту; до основної розмови повертається лише підсумок.","https://code.claude.com/docs/en/sub-agents.md"],["\\bSKILL\\.md|\\bskill\\b","Skills","папка з інструкціями, яку Claude підвантажує, коли це потрібно.","https://code.claude.com/docs/en/skills.md"],["sandbox","Sandbox","ізоляція на рівні ОС навколо shell-команд.","https://code.claude.com/docs/en/sandboxing.md"],["CLAUDE\\.md|AGENTS\\.md|auto memory","Пам'ять Claude Code","файли інструкцій (CLAUDE.md, AGENTS.md) і нотатки, які Claude читає на початку сесії.","https://code.claude.com/docs/en/memory.md"],["permissions|deny|allow|bypassPermissions|acceptEdits|dontAsk|plan mode","Дозволи","правила allow, ask, deny та режими, що вирішують, що Claude Code може робити.","https://code.claude.com/docs/en/permissions.md"],["managed settings|settings\\.json|settings\\.local","Налаштування","рівні налаштувань Claude Code та їх пріоритет.","https://code.claude.com/docs/en/settings.md"],["prompt caching|cache_control|cache_read|cache_creation|кеш","Prompt caching","повторне використання незмінного початку промпта, дешевше й швидше.","https://platform.claude.com/docs/en/build-with-claude/prompt-caching.md"],["compaction|ущільнен","Compaction","стиснення старої частини розмови в підсумок, коли контекст наповнюється.","https://platform.claude.com/docs/en/build-with-claude/compaction.md"],["thinking|роздум","Extended / adaptive thinking","блоки «роздумів» моделі перед відповіддю.","https://platform.claude.com/docs/en/build-with-claude/thinking.md"],["\\beffort\\b","Effort","параметр, що керує обсягом зусиль моделі (low... max).","https://platform.claude.com/docs/en/build-with-claude/effort.md"],["task_budget|task budget","Task budgets","дорадчий бюджет токенів на весь цикл агента.","https://platform.claude.com/docs/en/build-with-claude/task-budgets.md"],["context window|вікно контексту|context rot","Вікно контексту","скільки токенів модель бачить за раз: промпт плюс відповідь.","https://platform.claude.com/docs/en/build-with-claude/context-windows.md"],["context_management|clear_tool_uses|clear_thinking","Context editing","автоматичне очищення старих результатів інструментів та роздумів.","https://platform.claude.com/docs/en/build-with-claude/context-editing.md"],["stop_reason|end_turn|tool_use|max_tokens|pause_turn|refusal","stop_reason","поле відповіді API з причиною, чому модель зупинилась.","https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons.md"],["tool_use|tool_result|tool_choice|is_error|strict|input_schema","Tool use","як модель просить викликати інструмент, а ви повертаєте результат.","https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview.md"],["structured outputs|JSON schema","Structured outputs","відповідь моделі у JSON за заданою схемою.","https://platform.claude.com/docs/en/build-with-claude/structured-outputs"],["memory tool|memory_20250818|/memories","Memory tool","інструмент, через який модель читає й пише файли пам'яті, що їх контролює ваш код.","https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool.md"],["count_tokens","Підрахунок токенів","ендпоінт, що рахує токени запиту без виклику моделі.","https://platform.claude.com/docs/en/build-with-claude/token-counting.md"],["MCP connector|mcp_servers","MCP connector","підключення віддалених MCP-серверів прямо з Messages API.","https://platform.claude.com/docs/en/agents-and-tools/mcp-connector.md"],["few-shot|XML|prefill|prompt chaining","Prompt engineering","техніки написання промптів: приклади, теги, ланцюжки.","https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices.md"],["grading|success criteria|оцінюван","Оцінювання (evals)","як вимірювати якість відповідей моделі.","https://platform.claude.com/docs/en/test-and-evaluate/develop-tests.md"]];

 {"g":"stop_reason","t":"end_turn","lit":"«кінець ходу»","m":"Модель сказала все, що хотіла. Відповідь готова.","a":"Показуйте відповідь користувачу й виходьте з циклу. Нових викликів не потрібно.","tip":"Її черга закінчилась.","q":"Що означає stop_reason end_turn і що робити?","d":"stop_reason це причина, чому модель зупинила відповідь. end_turn означає, що вона природно закінчила.","ex":"while True:\n    r = client.messages.create(**req)\n    if r.stop_reason == \"end_turn\":\n        break","ic":"🎤","cap":"Модель закінчила відповідь і більше нічого не чекає. Можна показувати результат користувачу."},
 {"g":"stop_reason","t":"tool_use","lit":"«використання інструмента»","m":"Модель не закінчила: їй потрібен результат вашого інструмента.","a":"Виконайте інструмент, надішліть результат як tool_result і запитайте модель знову. Це єдине значення, після якого цикл триває.","tip":"Єдине значення, після якого цикл продовжується.","q":"Що означає stop_reason tool_use і що робити?","d":"Модель не закінчила, а просить виконати інструмент. Ваш код виконує функцію й повертає результат, як у циклі «запит, виклик функції, відповідь».","ex":"if r.stop_reason == \"tool_use\":\n    block = next(b for b in r.content if b.type == \"tool_use\")\n    result = run_tool(block.name, block.input)","ic":"🙋","cap":"Модель не закінчила: їй потрібно, щоб ви виконали інструмент. Ви виконуєте його, повертаєте результат, і вона продовжує.","why":"Модель не виконує код сама, вона лише просить: це безпечніше й залишає контроль вам."},
 {"g":"stop_reason","t":"max_tokens","lit":"«максимум токенів»","m":"Відповідь обірвалась, бо закінчився ліміт довжини.","a":"Збільште max_tokens або попросіть модель продовжити. Це не помилка, відповідь просто коротша, ніж мала бути.","tip":"Не помилка: відповідь просто коротша, ніж мала бути.","q":"Що означає stop_reason max_tokens і що робити?","d":"Це ліміт довжини відповіді, який ви задали. Якщо модель його досягла, відповідь обрізається."},
 {"g":"stop_reason","t":"stop_sequence","lit":"«стоп-послідовність»","m":"Модель зупинилась, бо написала один із ваших стоп-рядків.","a":"Дивіться поле stop_sequence у відповіді: воно каже, який саме рядок спрацював.","tip":"Її зупинили ваші слова-стоп.","q":"Що означає stop_reason stop_sequence?","d":"Ви можете передати моделі список рядків-«стоп-слів». Щойно модель їх напише, вона одразу зупиняється."},
 {"g":"stop_reason","t":"pause_turn","lit":"«пауза ходу»","m":"Серверний інструмент досяг ліміту ітерацій, а роботу не закінчено. Це пауза, а не кінець.","a":"Надішліть цю відповідь назад без змін, щоб модель продовжила.","tip":"Пауза, а не кінець.","q":"Що означає stop_reason pause_turn і що робити?","d":"Серверні інструменти (наприклад web_search) працюють у циклі на боці Anthropic. Цей цикл має ліміт у 10 ітерацій."},
 {"g":"stop_reason","t":"refusal","lit":"«відмова»","m":"Модель відмовилась відповісти. Це нормальна відповідь зі статусом 200, а не помилка сервера.","a":"Читайте поле stop_details, щоб побачити причину. Можна повторити запит на запасній моделі.","tip":"Відмова, а не збій.","q":"Що означає stop_reason refusal і чи це помилка?","d":"Модель може відмовитись відповідати, якщо запит порушує політику безпеки."},
 {"g":"stop_reason","t":"model_context_window_exceeded","lit":"«вікно контексту перевищено»","m":"Відповідь дійшла до межі вікна контексту раніше, ніж до вашого max_tokens.","a":"Вважайте відповідь обрізаною, але валідною. Не плутайте з max_tokens: той ліміт ви ставите самі, а це межа моделі.","tip":"Про вікно, не про max_tokens.","q":"Що означає stop_reason model_context_window_exceeded?","d":"Вікно контексту це загальна межа того, що модель може тримати: промпт плюс відповідь."},
 {"g":"Інструменти","t":"tool_use (блок)","lit":"«використання інструмента»","m":"Блок у відповіді моделі: назва інструмента, id і аргументи.","a":"Виконуєте інструмент за цим запитом.","tip":"Це запит моделі до вас.","q":"Що таке блок tool_use у відповіді моделі?","d":"Це JSON-блок усередині відповіді: «викликай інструмент X з такими аргументами». Як виклик методу з іменем і параметрами, лише описаний даними.","ex":"{\n  \"type\": \"tool_use\",\n  \"id\": \"toolu_01\",\n  \"name\": \"get_weather\",\n  \"input\": {\"city\": \"Київ\"}\n}"},
 {"g":"Інструменти","t":"tool_result","lit":"«результат інструмента»","m":"Ваш блок відповіді на tool_use. Має tool_use_id того запиту.","a":"Надсилайте його в user-повідомленні, всі результати разом, перед будь-яким текстом. Він має містити tool_use_id запиту.","tip":"Це ваша відповідь моделі.","q":"Що таке tool_result і як його надсилати?","d":"Ваша відповідь на запит моделі виконати інструмент. Як return value виклику функції.","ex":"{\n  \"role\": \"user\",\n  \"content\": [{\n    \"type\": \"tool_result\",\n    \"tool_use_id\": \"toolu_01\",\n    \"content\": \"+12°C\"\n  }]\n}","ic":"📨","cap":"Це ваша відповідь на запит моделі виконати інструмент: що вийшло в результаті.","why":"Результат повертається в розмову, щоб модель побачила, що вийшло, і вирішила, що далі."},
 {"g":"Інструменти","t":"is_error","lit":"«є помилка»","m":"Прапорець у tool_result, що каже: інструмент завершився помилкою.","a":"Ставте true і пишіть зрозумілий текст, що спробувати далі, щоб модель могла виправитись.","tip":"","q":"Для чого прапорець is_error у tool_result?","d":"Звичайно tool_result містить дані. Якщо інструмент упав, це треба позначити, інакше модель вважатиме помилку відповіддю.","ex":"{\n  \"type\": \"tool_result\",\n  \"tool_use_id\": \"toolu_01\",\n  \"is_error\": true,\n  \"content\": \"Місто не знайдено. Спробуйте повну назву.\"\n}","ic":"🚨","cap":"Прапорець у результаті інструмента, що каже моделі: інструмент завершився помилкою, подивись, що там.","why":"Щоб модель відрізняла помилку від даних і могла виправитись."},
 {"g":"Інструменти","t":"tool_choice: auto","lit":"«авто»","m":"auto: модель сама вирішує, викликати інструмент чи просто відповісти.","a":"Це значення за замовчуванням, коли в запиті є tools.","tip":"","q":"Що робить tool_choice auto?","d":"tool_choice керує тим, чи примушуєте ви модель викликати інструмент.","ex":"\"tool_choice\": {\"type\": \"auto\"}"},
 {"g":"Інструменти","t":"tool_choice: any","lit":"«будь-який»","m":"any: модель мусить викликати якийсь із наданих інструментів.","a":"Не підтримується на Opus 5.5, Sonnet 5.5, Fable 5.1 і Mythos 5.1: там повертається 400.","tip":"","q":"Що робить tool_choice any і де він не працює?","d":"Режим примусу: відповідь без виклику інструмента неможлива.","ex":"\"tool_choice\": {\"type\": \"any\"}","ic":"👉🧰","cap":"Ви вимагаєте, щоб модель обов'язково викликала якийсь інструмент, а не просто відповіла текстом."},

 {"g":"Інструменти","t":"strict: true","lit":"«суворо»","m":"Вхід інструмента гарантовано відповідає його схемі.","a":"Ставте strict у визначенні інструмента, поруч із name і description.","tip":"","q":"Що дає strict: true у визначенні інструмента?","d":"Без strict модель інколи надсилає аргументи, що не збігаються зі схемою. Strict це вимикає, як сувора валідація DTO.","ex":"{\n  \"name\": \"get_weather\",\n  \"description\": \"Погода в місті\",\n  \"strict\": true,\n  \"input_schema\": {...}\n}","ic":"📏","cap":"Гарантує, що аргументи, які модель передає в інструмент, точно відповідають вашій схемі, без відхилень.","why":"Щоб аргументи точно відповідали схемі й ваш код не падав на дивних значеннях."},
 {"g":"Інструменти","t":"disable_parallel_tool_use","lit":"«вимкнути паралельні виклики»","m":"Не більше одного виклику інструмента за відповідь.","a":"Параметр лежить усередині tool_choice.","tip":"","q":"Що робить disable_parallel_tool_use і де він лежить?","d":"Модель може попросити виконати кілька інструментів за одну відповідь. Цей параметр це забороняє.","ex":"\"tool_choice\": {\"type\": \"auto\", \"disable_parallel_tool_use\": true}"},
 {"g":"Інструменти","t":"server tool","lit":"«серверний інструмент»","m":"Інструмент, який виконує Anthropic (web_search, web_fetch, code_execution).","a":"Ви лише вмикаєте його (web_search, web_fetch, code_execution), а tool_result писати не треба.","tip":"Виконує не ви.","q":"Що таке серверний інструмент і чим відрізняється від звичайного?","d":"Інструмент, який запускає сама Anthropic на своєму боці. Ви лише вмикаєте його, а не пишете реалізацію.","ic":"🏭","cap":"Інструмент, який виконує не ваш код, а сама Anthropic. Вам лише треба його ввімкнути.","why":"Щоб ви не писали пошук чи виконання коду самостійно."},
 {"g":"Інструменти","t":"MCP connector","lit":"«MCP-з'єднувач»","m":"Підключає віддалені MCP-сервери з Messages API. Лише інструменти, лише публічний HTTPS.","a":"Підтримує лише інструменти та лише публічний HTTPS. Для приватної мережі потрібне власне MCP-з'єднання.","tip":"","q":"Що таке MCP connector у Messages API і які в нього обмеження?","d":"MCP це відкритий стандарт підключення інструментів до моделі, як JDBC для баз. Connector дає Messages API підключатися до віддалених MCP-серверів.","ex":"\"mcp_servers\": [{\n  \"type\": \"url\",\n  \"url\": \"https://mcp.example.com/sse\",\n  \"name\": \"docs\"\n}]"},
 {"g":"Промпти","t":"prefill","lit":"«заздалегідь заповнене»","m":"Початок відповіді асистента, який ви пишете самі, щоб модель продовжила.","a":"На Claude 4.6 і новіших дає 400. Замість нього використовують structured outputs або інструкції.","tip":"","q":"Що таке prefill і чому його більше не використовують?","d":"Раніше можна було дописати початок відповіді асистента й змусити модель продовжити з нього. На нових моделях це більше не працює.","ex":"{\"role\": \"assistant\", \"content\": \"{\"}","ic":"✏️🚫","cap":"Раніше можна було самому написати початок відповіді моделі. На нових моделях це більше не працює, API повертає помилку.","why":"Підказувати початок відповіді вже не потрібно: для форми відповіді є structured outputs."},
 {"g":"Промпти","t":"few-shot","lit":"«кілька прикладів»","m":"Кілька прикладів у промпті, щоб модель повторила стиль.","a":"Найкраще 3-5 різноманітних прикладів, загорнутих у теги example.","tip":"","q":"Що таке few-shot у промпті і скільки прикладів давати?","d":"Показати моделі кілька готових прикладів «вхід, вихід» у промпті, щоб вона повторила стиль і формат.","ex":"<examples>\n  <example>\n    <input>Бан за спам</input>\n    <output>moderation</output>\n  </example>\n</examples>","ic":"🖼️","cap":"Замість довгого опису покажіть моделі кілька прикладів «вхід і вихід». Так вона швидше зрозуміє стиль і формат.","why":"Приклад показує стиль краще за довгий опис."},
 {"g":"Промпти","t":"budget_tokens","lit":"«бюджет токенів»","m":"Ручний ліміт токенів на роздуми (старий спосіб).","a":"На Claude 4.7 і новіших дає 400. Використовуйте effort або max_tokens.","tip":"","q":"Що таке budget_tokens і чому його замінили?","d":"Старий спосіб явно задати, скільки токенів модель може витратити на роздуми."},
 {"g":"Промпти","t":"adaptive thinking","lit":"«адаптивне мислення»","m":"Модель сама вирішує, думати чи ні і скільки.","a":"Єдиний режим на нових моделях. Вмикається thinking type adaptive.","tip":"","q":"Що таке adaptive thinking?","d":"Модель сама вирішує, чи варто їй думати перед відповіддю і як довго.","ex":"\"thinking\": {\"type\": \"adaptive\"}","ic":"💭","cap":"Модель сама вирішує, чи варто їй спершу подумати над питанням і скільки саме.","why":"Не кожне питання потребує роздумів, тому модель сама обирає, щоб не витрачати токени."},
 {"g":"Промпти","t":"effort","lit":"«зусилля»","m":"Рівні low, medium, high, xhigh, max: скільки роботи вкладає модель.","a":"За замовчуванням high, а на Opus 5.5 і Haiku 5.5 medium. Це сигнал, а не жорсткий бюджет: стеля це max_tokens.","tip":"Сигнал, а не жорсткий бюджет. Стеля це max_tokens.","q":"Що таке effort і які в нього рівні?","d":"Налаштування, скільки зусиль вкладає модель: від low (швидко й дешево) до max (найретельніше).","ex":"\"output_config\": {\"effort\": \"high\"}","ic":"🎚️","cap":"Налаштування, скільки зусиль модель вкладає у відповідь: від швидкої й дешевої до ретельної й дорожчої.","why":"Одна ручка для компромісу між швидкістю, ціною та глибиною відповіді."},
 {"g":"Claude Code","t":"deny, ask, allow","lit":"«заборонити, питати, дозволити»","m":"Три типи правил дозволів. Порядок перевірки саме такий.","a":"Перевіряються у порядку deny, ask, allow. Перший збіг вирішує, і allow не вирізає виняток із deny.","tip":"Спершу заборона.","q":"У якому порядку Claude Code перевіряє правила deny, ask, allow?","d":"Правила дозволів у Claude Code. Схоже на правила в Spring Security, але перший збіг вирішує за суворішим порядком.","ex":"{\n  \"permissions\": {\n    \"deny\": [\"Read(./.env)\"],\n    \"ask\": [\"Bash(git push *)\"],\n    \"allow\": [\"Bash(npm test)\"]\n  }\n}","ic":"🚦","cap":"Правила перевіряються в такому порядку: спершу заборона, потім «спитати», потім дозвіл. Тому заборона завжди сильніша.","why":"Заборона йде першою, бо помилково заборонити безпечніше, ніж помилково дозволити."},
 {"g":"Claude Code","t":"exit code 2","lit":"«код виходу 2»","m":"Hook, що вийшов із кодом 2, блокує дію.","a":"Код 2 блокує дію. Код 1 не блокує: дія триває.","tip":"2 блокує, 1 ні.","q":"Що означає код виходу 2 у hook, а що код 1?","d":"Hook це ваш скрипт, який Claude Code запускає на подію. Код виходу скрипта вирішує, чи зупинити дію.","ex":"#!/bin/sh\necho \"Заборонено змінювати .env\" >&2\nexit 2","ic":"🛑","cap":"Якщо скрипт-hook завершується з кодом 2, Claude Code зупиняє дію. З кодом 1 він лише показує попередження, і дія триває.","why":"Окремий код для «зупини», щоб звичайна помилка скрипта не блокувала роботу."},
 {"g":"Claude Code","t":"PreToolUse","lit":"«перед інструментом»","m":"Hook, що спрацьовує до виклику інструмента й може його заблокувати.","a":"Його deny діє навіть у режимі bypassPermissions.","tip":"Pre: ще можна зупинити.","q":"Що таке PreToolUse hook?","d":"Hook, що запускається перед інструментом. Як Spring interceptor чи AOP @Before, який може скасувати виклик.","ex":"{\n  \"hooks\": {\n    \"PreToolUse\": [{\n      \"matcher\": \"Bash\",\n      \"hooks\": [{\"type\": \"command\", \"command\": \".claude/check.sh\"}]\n    }]\n  }\n}","ic":"🕵️","cap":"Hook, що запускається перед виконанням інструмента. Тому він ще може зупинити або змінити дію.","why":"Це єдине місце, де дію ще можна зупинити чи змінити."},
 {"g":"Claude Code","t":"PostToolUse","lit":"«після інструмента»","m":"Hook, що спрацьовує після виклику.","a":"Скасувати вже нічого не можна, бо інструмент виконано.","tip":"Post: уже пізно.","q":"Що таке PostToolUse hook?","d":"Hook, що запускається після інструмента. Як AOP @After: подію вже не скасувати.","ic":"🧹","cap":"Hook, що запускається після виконання інструмента. Скасувати вже нічого, бо дія виконана."},
 {"g":"Claude Code","t":"dontAsk","lit":"«не питай»","m":"Режим, що автоматично відмовляє у всьому, що вимагало б запиту.","a":"Підходить для CI, де нема кому відповідати на питання.","tip":"","q":"Що робить режим dontAsk?","d":"Режим дозволів: замість того щоб питати, автоматично відмовляє у всьому, що вимагає підтвердження."},
 {"g":"Claude Code","t":"bypassPermissions","lit":"«обійти дозволи»","m":"Режим без запитів. Allow там не діє, а deny діє.","a":"Правила allow тут не діють, а deny діють. Використовуйте лише в ізольованих середовищах.","tip":"","q":"Що робить режим bypassPermissions?","d":"Режим, у якому Claude Code не питає дозволів на дії."},
 {"g":"Claude Code","t":"plan mode","lit":"«режим плану»","m":"Claude читає й досліджує, але не редагує файлів.","a":"Редагування починається лише після того, як ви схвалите план.","tip":"","q":"Що таке plan mode?","d":"Режим «лише подумати»: Claude досліджує код і складає план, але нічого не змінює."},
 {"g":"Claude Code","t":"sandbox","lit":"«пісочниця»","m":"Межа на рівні ОС навколо shell-команд (Bash, PowerShell, Monitor).","a":"Вимкнена за замовчуванням. Покриває shell-команди (Bash, PowerShell, Monitor). Read, Edit, MCP і hooks лишаються поза нею.","tip":"","q":"Що таке sandbox у Claude Code і що він покриває?","d":"Ізоляція на рівні операційної системи навколо команд оболонки, як контейнер для процесу.","ex":"{\n  \"sandbox\": {\"enabled\": true}\n}","ic":"🏖️","cap":"Окреме обмежене середовище для команд: навіть якщо щось піде не так, шкоди системі воно не завдасть.","why":"Обмеження на рівні ОС діє навіть тоді, коли модель помиляється."},
 {"g":"Claude Code","t":"subagent","lit":"«субагент»","m":"Помічник з окремим вікном контексту.","a":"Великий вивід лишається в субагента, а до основної розмови повертається лише підсумок.","tip":"Користь: ізоляція контексту.","q":"Що таке subagent і яка від нього користь?","d":"Окремий помічник зі своїм вікном контексту. Як окремий потік зі своєю пам'яттю, який повертає лише результат.","ex":"---\nname: reviewer\ndescription: Перевіряє зміни перед комітом\ntools: Read, Grep\n---\nТи рецензуєш код. Повертай короткий підсумок.","ic":"🧑‍🔧📋","cap":"Окремий помічник зі своїм контекстом. Вся його проміжна робота лишається в нього, а до вас повертається лише короткий підсумок.","why":"Щоб довгий вивід не засмічував основну розмову."},
 {"g":"Claude Code","t":"skill","lit":"«навичка»","m":"Папка з SKILL.md. Опис завжди в контексті, тіло лише при виклику.","a":"Опис завжди в контексті, а тіло вантажиться лише при виклику. Ключ disable-model-invocation true означає, що викликати може тільки ви.","tip":"","q":"Що таке skill і коли вантажиться його вміст?","d":"Пакет інструкцій у папці з файлом SKILL.md, який Claude підвантажує, коли це потрібно. Схоже на плагін.","ex":"---\nname: deploy\ndescription: Розгорнути сервіс. Використовуйте на запит про деплой.\n---\n\n# Deploy\n1. Запустіть тести\n2. ...","ic":"📘","cap":"Папка з інструкціями для конкретного завдання. Claude підтягує її лише тоді, коли вона потрібна, і не засмічує нею контекст постійно.","why":"Інструкції підвантажуються лише за потреби, щоб не займати контекст постійно."},
 {"g":"Кеш і контекст","t":"cache_control: ephemeral","lit":"«тимчасовий»","m":"Позначка точки кешу. Кеш живе 5 хвилин за замовчуванням.","a":"Кеш живе 5 хвилин за замовчуванням. З ttl 1h живе годину, але запис дорожчий.","tip":"","q":"Що таке cache_control ephemeral і скільки живе кеш?","d":"Позначка в запиті: «закешуй усе до цього місця». Як @Cacheable, але кешується префікс промпта.","ex":"\"system\": [{\n  \"type\": \"text\",\n  \"text\": \"...довга інструкція...\",\n  \"cache_control\": {\"type\": \"ephemeral\"}\n}]","ic":"🥡","cap":"Позначка, що початок промпта треба закешувати. Наступні запити з тим самим початком коштують дешевше й виконуються швидше.","why":"Один і той самий початок промпта не треба обробляти щоразу, і це дешевше."},
 {"g":"Кеш і контекст","t":"cache_read_input_tokens","lit":"«токени, прочитані з кешу»","m":"Скільки токенів узято з кешу.","a":"Токени з кешу коштують лише 0,1 від звичайного входу.","tip":"Read: дешево.","q":"Що означає cache_read_input_tokens і скільки коштує?","d":"Скільки токенів вхідного промпта модель узяла з кешу, а не обробила заново.","ex":"usage = r.usage\nprint(usage.cache_read_input_tokens, usage.cache_creation_input_tokens)"},
 {"g":"Кеш і контекст","t":"cache_creation_input_tokens","lit":"«токени, записані в кеш»","m":"Скільки токенів записано в кеш вперше.","a":"Запис на 5 хвилин коштує 1,25 від звичайного входу, на 1 годину 2.","tip":"Creation: дорожче.","q":"Що означає cache_creation_input_tokens і скільки коштує?","d":"Скільки токенів вхідного промпта записано в кеш уперше."},
 {"g":"Кеш і контекст","t":"cache breakpoint","lit":"«точка кешу»","m":"Місце в промпті, де пишеться кеш.","a":"До 4 на запит. Ставте на останньому незмінному блоці.","tip":"","q":"Що таке cache breakpoint і де його ставити?","d":"Місце, де в промпті закінчується частина, яку треба закешувати."},
 {"g":"Кеш і контекст","t":"порядок кешу","lit":"tools, system, messages","m":"Префікс кешується саме в такому порядку.","a":"Зміна на одному рівні скидає кеш цього рівня й усіх наступних.","tip":"","q":"У якому порядку формується префікс кешу і що скидає кеш?","d":"Кеш будується як префікс: спочатку tools, потім system, потім messages. Зміна на початку інвалідує все, що йде далі.","ex":"tools  →  system  →  messages","ic":"🧱","cap":"Кеш прив'язаний до початку промпта: спочатку tools, потім system, потім messages. Зміните щось на початку і все, що після, доведеться кешувати заново.","why":"Кеш працює як префікс: змінилась початкова частина, змінилося й усе після неї."},
 {"g":"Кеш і контекст","t":"context rot","lit":"«гниття контексту»","m":"Чим довший контекст, тим гірші точність і згадування.","a":"Тому добір того, що лежить у контексті, так само важливий, як наявність місця.","tip":"","q":"Що таке context rot?","d":"Чим довший контекст, тим гірше модель знаходить у ньому потрібне.","ic":"🌫️","cap":"Чим довший контекст, тим гірше модель знаходить у ньому потрібне. Тому не варто тримати в контексті все підряд.","why":"Довгий контекст гірше читається, тому важливо не лише вмістити, а й добрати потрібне."},
 {"g":"Ущільнення й роздуми","t":"compaction block","lit":"«блок ущільнення»","m":"Блок із підсумком старої частини розмови.","a":"При ущільненні за запитом ставте його першим і прибирайте підсумовані повідомлення. Вартість рахується як сума usage.iterations.","tip":"","q":"Що таке блок ущільнення (compaction block)?","d":"Стисла версія старої частини розмови, що замінює її в контексті. Як коли замість всього журналу лишають підсумок.","ex":"\"compaction\": {\"type\": \"summarize\"}","ic":"🗜️","cap":"Замість всієї старої розмови в контексті лишається стислий підсумок. Місце звільняється, а суть зберігається.","why":"Щоб довга розмова не впиралась у ліміт контексту."},
 {"g":"Ущільнення й роздуми","t":"usage.iterations","lit":"«ітерації використання»","m":"Розбивка токенів по кроках, включно з ущільненням.","a":"Для підрахунку вартості сумуйте всі записи, а не лише верхній рівень.","tip":"","q":"Що таке usage.iterations і навіщо?","d":"Одна відповідь API може складатися з кількох внутрішніх кроків (наприклад, ущільнення та сама відповідь). usage.iterations описує кожен."},
 {"g":"Ущільнення й роздуми","t":"display: omitted","lit":"«пропущено»","m":"Блок thinking приходить порожнім, але підпис лишається.","a":"Це зменшує затримку відповіді. Ціна лишається та сама.","tip":"","q":"Що означає display: omitted у thinking?","d":"Блок thinking містить роздуми моделі. Якщо вам не потрібен текст роздумів, його можна не отримувати."},
 {"g":"Ущільнення й роздуми","t":"redacted_thinking","lit":"«відредаговані роздуми»","m":"Зашифрований блок роздумів без читабельного тексту.","a":"Повертайте його без змін. Якщо фільтрувати блоки лише за типом thinking, цей блок загубиться.","tip":"","q":"Що таке redacted_thinking і як з ним поводитись?","d":"Іноді роздуми моделі приховуються з міркувань безпеки, і замість тексту ви отримуєте зашифрований блок.","ic":"🤐","cap":"Роздуми моделі, які прийшли зашифрованими. Прочитати їх не можна, але повертати в наступному запиті треба без змін."},
 {"g":"Ущільнення й роздуми","t":"signature","lit":"«підпис»","m":"Зашифрована копія повних роздумів у блоці thinking.","a":"Повертайте блок thinking без змін: змінений блок дає 400.","tip":"","q":"Що таке signature у блоці thinking?","d":"Підпис підтверджує, що блок роздумів справжній і не підроблений. Як цифровий підпис.","ic":"🔏","cap":"Підпис, яким API підтверджує, що блок роздумів справжній. Якщо змінити блок, підпис не збігається і API повертає помилку.","why":"Щоб блок роздумів не можна було підробити."},
 {"g":"Ущільнення й роздуми","t":"task_budget","lit":"«бюджет завдання»","m":"Дорадчий бюджет токенів на весь цикл агента, мінімум 20 000.","a":"Він лише підказка, а жорстка межа це max_tokens.","tip":"","q":"Що таке task_budget і чим відрізняється від max_tokens?","d":"Агент працює багатьма кроками. Бюджет завдання підказує моделі, скільки токенів загалом їй відведено на весь цикл.","ex":"\"output_config\": {\"task_budget\": {\"remaining\": 100000}}"},
 {"g":"Ущільнення й роздуми","t":"memory tool","lit":"«інструмент пам'яті»","m":"Файли пам'яті у каталозі /memories, якими керує ваш код.","a":"Перевіряйте шляхи від path traversal (../).","tip":"","q":"Що таке memory tool?","d":"Інструмент, через який модель читає й пише файли в каталозі пам'яті. Виконує його ваш код.","ex":"{\"type\": \"memory_20250818\", \"name\": \"memory\"}","ic":"🗒️","cap":"Інструмент, яким модель записує й читає нотатки у файлах. Самі файли зберігає ваш код."},
 {"g":"Ущільнення й роздуми","t":"path traversal","lit":"«обхід шляху»","m":"Вихід за каталог через ../ у шляху.","a":"Приведіть шлях до канонічного вигляду й перевірте, що він усередині /memories.","tip":"","q":"Що таке path traversal і як від нього захиститись?","d":"Атака, коли у шляху вказують ../ щоб вийти за дозволений каталог. Класична вразливість файлових сервісів.","ex":"path = (MEMORY_ROOT / user_path).resolve()\nif not path.is_relative_to(MEMORY_ROOT):\n    raise ValueError(\"outside /memories\")","ic":"🚷","cap":"Атака, коли у шляху пишуть ../, щоб вийти за межі дозволеної папки. Тому шлях перевіряють перед використанням.","why":"Модель може написати шлях до чужого файла, тому шлях завжди перевіряють."},
 {"g":"Claude Code: пам'ять і налаштування","t":"CLAUDE.md","lit":"«файл інструкцій»","m":"Інструкції проєкту, які модель читає на початку сесії. Це контекст, а не примусова конфігурація.","a":"Це порада моделі, а не жорстка конфігурація. Для гарантії використовуйте deny або hook. Тримайте до 200 рядків.","tip":"Порада, не закон.","q":"Що таке CLAUDE.md і чи гарантує він виконання?","d":"Файл з інструкціями проєкту, який Claude читає на початку сесії. Як README для агента.","ex":"# Проєкт\n\nЗапуск тестів: `npm test`\nНе чіпай каталог `generated/`.","ic":"📋","cap":"Файл з інструкціями для Claude про ваш проєкт, який він читає на початку сесії. Це порада, а не жорстке правило.","why":"Щоб не повторювати контекст проєкту в кожній сесії."},
 {"g":"Claude Code: пам'ять і налаштування","t":"AGENTS.md","lit":"«інструкції для агентів»","m":"Загальний формат інструкцій. Claude Code читає його, лише коли нема CLAUDE.md.","a":"Claude Code читає його лише тоді, коли нема CLAUDE.md. Щоб читалися обидва, імпортуйте @AGENTS.md із CLAUDE.md.","tip":"","q":"Що таке AGENTS.md і як його читає Claude Code?","d":"Загальний формат інструкцій для AI-агентів, не прив'язаний до Claude.","ex":"@AGENTS.md"},
 {"g":"Claude Code: пам'ять і налаштування","t":"@import","lit":"«імпорт»","m":"Рядок @path у CLAUDE.md підключає інший файл. До 4 кроків.","a":"Рядок @path підключає інший файл, до 4 кроків вкладеності. Це не зменшує вартість контексту, бо імпортовані файли вантажаться разом.","tip":"","q":"Що робить @import у CLAUDE.md?","d":"Спосіб підключити в CLAUDE.md інший файл, як import чи include.","ex":"@docs/architecture.md\n@~/.claude/my-style.md"},
 {"g":"Claude Code: пам'ять і налаштування","t":"rules з paths","lit":"«правила за шляхами»","m":"Файли в .claude/rules. З paths вантажаться лише коли Claude працює з відповідними файлами.","a":"Так виносять інструкції, що стосуються лише частини коду: вони не засмічують контекст у інших місцях.","tip":"","q":"Для чого файли rules з paths?","d":"Файли інструкцій у .claude/rules, які вантажаться лише для певних шляхів проєкту.","ex":"---\npaths:\n  - \"src/api/**/*.ts\"\n---\nУсі ендпоінти валідують вхід через zod."},
 {"g":"Claude Code: пам'ять і налаштування","t":"auto memory","lit":"«автопам'ять»","m":"Нотатки, які Claude пише собі. Індекс MEMORY.md, на старті перші 200 рядків чи 25 КБ.","a":"Індекс MEMORY.md вантажиться на старті (перші 200 рядків чи 25 КБ). Файли тем читаються лише на вимогу.","tip":"","q":"Що таке auto memory?","d":"Нотатки, які Claude Code сам веде між сесіями.","ic":"🧠📝","cap":"Claude Code сам веде нотатки про проєкт між сесіями, щоб не питати те саме двічі."},
 {"g":"Claude Code: пам'ять і налаштування","t":"settings: пріоритет","lit":"«порядок налаштувань»","m":"Від найсильнішого до найслабшого: 1) managed (задає організація, користувач не змінює), 2) командний рядок (прапорці цього запуску), 3) local (.claude/settings.local.json: лише ваш, не в git), 4) shared project (.claude/settings.json: у git, для всієї команди), 5) user (~/.claude/settings.json: для всіх ваших проєктів).","a":"Звичайні значення (наприклад model) беруться з найвищого рівня, де вони задані. Але списки, як allow і deny у permissions, не перекриваються, а зливаються з усіх рівнів. Приклад: у user дозволено Bash(npm test), у project дозволено Bash(git log *), у підсумку діють обидва. Заборона deny з будь-якого рівня все одно сильніша за allow, а managed перебити не можна.","tip":"Чим ближче до організації, тим сильніше; чим ближче до вас, тим слабше.","q":"У якому порядку Claude Code бере налаштування, якщо одне й те саме задано в кількох місцях?","d":"Claude Code читає налаштування з п'яти місць (рівнів). Якщо одне й те саме задано в кількох, перемагає вищий рівень. Схоже на property sources у Spring Boot: аргумент командного рядка перекриває application.properties.","ex":"~/.claude/settings.json            user\n.claude/settings.json              shared project\n.claude/settings.local.json        local","ic":"🪜","cap":"Налаштування беруться з кількох рівнів, і вищий перемагає нижчий. Найвищий рівень в організації, найнижчий ваші особисті налаштування.","why":"Організація має мати змогу задати обов'язкове, а ви власне зверху."},
 {"g":"Claude Code: пам'ять і налаштування","t":"managed settings","lit":"«керовані налаштування»","m":"Це найвищий рівень налаштувань. Те, що тут задано, діє завжди, незалежно від того, що написано в проєкті чи у вас у user-налаштуваннях.","a":"Використовуйте їх для технічної примусовості: deny, sandbox. CLAUDE.md лише порада моделі, а managed settings жорстке правило.","tip":"","q":"Що таке managed settings і чим вони відрізняються від CLAUDE.md?","d":"Налаштування, які задає організація (адміністратор) для всіх своїх користувачів. Користувач не може їх вимкнути чи перекрити.","ic":"🏛️","cap":"Налаштування, які задає організація. Користувач не може їх змінити чи вимкнути.","why":"Для правил, які не мають залежати від налаштувань користувача."},
 {"g":"Claude Code: пам'ять і налаштування","t":"workspace trust","lit":"«довіра до робочого простору»","m":"allow-правила проєкту діють лише після того, як ви схвалили діалог довіри.","a":"Правила allow проєкту діють лише після вашого схвалення діалогу довіри. Deny й ask діють одразу, бо лише обмежують.","tip":"","q":"Що таке workspace trust і на які правила впливає?","d":"Діалог, де ви підтверджуєте, що довіряєте проєкту, перш ніж його правила allow почнуть діяти.","ic":"🤝","cap":"Спершу Claude Code питає, чи ви довіряєте цій папці. Лише після цього починають діяти дозволи, прописані в проєкті."},
 {"g":"Дозволи","t":"Bash(git log *)","lit":"«лише git log»","m":"Bash(git log *) дозволяє тільки команди, що починаються з git log. Bash(git *) дозволило б усі git-команди.","a":"Пишіть зірочку після підкоманди, тоді правило вузьке.","tip":"","q":"Як звузити дозвіл Bash так, щоб дозволити лише git log?","d":"Правила дозволів пишуться як Інструмент(шаблон). Зірочка стоїть на місці довільного тексту.","ex":"\"allow\": [\"Bash(git log *)\"]"},
 {"g":"Дозволи","t":"Read deny","lit":"«заборона читання»","m":"Правило Read(./.env) у deny блокує читання цього файла, а також Edit і Write на цьому шляху.","a":"Файл .claudeignore не діє: переносьте такі правила в Read deny.","tip":"","q":"Як заборонити читання файла і чи достатньо .claudeignore?","d":"Щоб заборонити Claude читати файл, ставте правило в deny, а не покладайтесь на файли-ігнори.","ex":"\"deny\": [\"Read(./.env)\", \"Read(./secrets/**)\"]"},
 {"g":"Дозволи","t":"Grep(...) і Write(...) із шляхом","lit":"«не діють»","m":"Правила Grep(шлях), Glob(шлях) і Write(шлях) нічого не блокують.","a":"Пишіть Read(...) для читання та Edit(...) для запису.","tip":"","q":"Чи працюють правила Grep(...) і Write(...) зі шляхом?","d":"Не кожне правило з шляхом справді щось блокує. Працюють лише правила для читання та редагування."},
 {"g":"Дозволи","t":"auto mode","lit":"«автоматичний режим»","m":"Окрема модель-класифікатор перевіряє дії перед виконанням.","a":"3 блокування поспіль або 20 загалом призупиняють режим.","tip":"","q":"Що таке auto mode?","d":"Режим, у якому окрема модель-класифікатор вирішує, чи безпечна дія."},
 {"g":"Дозволи","t":"acceptEdits","lit":"«приймати правки»","m":"Автоматично приймає редагування файлів у робочому каталозі.","a":"Решта команд усе ще питає дозволу.","tip":"","q":"Що робить режим acceptEdits?","d":"Режим дозволів: правки файлів приймаються без питань, решта дій усе ще питає."},
 {"g":"Дозволи","t":"protected paths","lit":"«захищені шляхи»","m":"Каталоги на кшталт .git і .claude, запис у які не схвалюється автоматично.","a":"Allow-правила не перевизначають захист цих шляхів.","tip":"","q":"Що таке protected paths?","d":"Каталоги на кшталт .git і .claude, запис у які не схвалюється автоматично."},
 {"g":"Дозволи","t":"critical paths","lit":"«критичні шляхи»","m":"Цілі rm і rmdir: корінь, домівка, робочий каталог і його батьки.","a":"Ні allow-правило, ні hook allow не схвалять видалення цих цілей.","tip":"","q":"Що таке critical paths?","d":"Цілі, видалення яких надто небезпечне: корінь, домашній каталог, робочий каталог і його батьки."},
 {"g":"Дозволи","t":"excludedCommands","lit":"«виключені команди»","m":"Команди, що виконуються поза sandbox без обмежень.","a":"Широкі патерни ризиковані, бо дають командам повну свободу.","tip":"","q":"Що таке excludedCommands у sandbox?","d":"Команди, які sandbox пропускає й запускає без обмежень."},
 {"g":"Дозволи","t":"dangerouslyDisableSandbox","lit":"«небезпечно вимкнути sandbox»","m":"Це параметр, яким команду повторюють без sandbox.","a":"Щоб заборонити такі повтори, вимкніть allowUnsandboxedCommands.","tip":"","q":"Що таке dangerouslyDisableSandbox і як це вимкнути?","d":"Коли команда в sandbox не може щось зробити, Claude може попросити повторити її поза sandbox."},
 {"g":"Дозволи","t":"domain fronting","lit":"«підміна домену»","m":"Обхід списку доменів: проксі sandbox дивиться лише на ім'я хоста й не термінує TLS.","a":"Широкі домени на кшталт github.com відкривають шлях для витоку даних назовні.","tip":"","q":"Що таке domain fronting і чому широкі домени небезпечні?","d":"Спосіб обійти фільтр за доменом: запит іде на дозволений домен, а фактично на інший сервіс за тим самим хостингом.","ic":"🎭","cap":"Спосіб обійти список дозволених доменів: запит іде нібито на дозволений домен, а насправді на інший сервіс на тому ж хостингу."},
 {"g":"Hooks","t":"PermissionRequest","lit":"«запит дозволу»","m":"У цей момент hook може сам вирішити за вас.","a":"Забороняти можна лише command hook з decision.behavior deny. Prompt hook з ok false тут не діє.","tip":"","q":"Що таке hook PermissionRequest і чим можна забороняти?","d":"Hook, який запускається, коли Claude Code збирається показати вам запит дозволу."},
 {"g":"Hooks","t":"UserPromptSubmit","lit":"«промпт надіслано»","m":"Може заблокувати промпт або додати до нього контекст.","a":"Типовий таймаут 30 с: після нього промпт іде без доданого контексту.","tip":"","q":"Що таке hook UserPromptSubmit?","d":"Hook, який запускається, щойно ви надіслали повідомлення, але до того, як його побачить модель."},
 {"g":"Hooks","t":"Stop hook","lit":"«hook зупинки»","m":"Спрацьовує щоразу, коли Claude закінчив відповідати.","a":"Може не дати зупинитись (decision block), але не більше 8 разів поспіль.","tip":"","q":"Що таке Stop hook?","d":"Hook, що запускається, коли Claude вважає, що закінчив. Він може змусити його продовжити.","ic":"🔁","cap":"Hook, що спрацьовує, коли Claude вирішив зупинитись. Він може змусити його продовжити, тому потрібен запобіжник, щоб не було нескінченного циклу.","why":"Щоб змусити Claude довести роботу до кінця, а запобіжник потрібен, щоб не було безкінечної петлі."},
 {"g":"Hooks","t":"stop_hook_active","lit":"«stop hook уже активний»","m":"Поле входу Stop hook, яке дорівнює true, коли Claude вже продовжує через stop hook.","a":"Перевіряйте його у скрипті й виходьте, щоб не зациклитись.","tip":"","q":"Для чого поле stop_hook_active?","d":"Stop hook може змусити Claude продовжити замість зупинки. Тоді hook спрацює знову, і можливий нескінченний цикл.","ex":"import json, sys\nif json.load(sys.stdin).get(\"stop_hook_active\"):\n    sys.exit(0)"},
 {"g":"Hooks","t":"SessionStart (compact)","lit":"«початок сесії»","m":"З matcher compact спрацьовує після ущільнення.","a":"Його stdout іде в контекст, тож так повертають важливе після ущільнення.","tip":"","q":"Що таке SessionStart з matcher compact?","d":"Hook, що запускається на початку сесії. Matcher compact означає запуск після ущільнення."},
 {"g":"Hooks","t":"PreCompact","lit":"«перед ущільненням»","m":"Hook перед ущільненням.","a":"Код виходу 2 або decision block блокує ущільнення.","tip":"","q":"Що таке hook PreCompact?","d":"Hook, що запускається перед ущільненням контексту."},

const KEY = "cca_cards_v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
if (!store.streak) store.streak = {};
let mode = 1, group = "all", flipped = false, queue = [], cur = null;

function save() { localStorage.setItem(KEY, JSON.stringify(store)); }
function key(c) { return c.g + "|" + c.t; }
function streak(c) { return store.streak[key(c)] || 0; }
function pool() { return CARDS.filter(c => group === "all" || c.g === group); }
function mastered(c) { return streak(c) >= 2; }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rebuild() { queue = shuffle(pool().filter(c => !mastered(c))); next(); }
function next() { cur = queue.length ? queue.shift() : null; flipped = false; render(); }

function setup() {
  const sel = document.getElementById("group");
  const groups = ["all"].concat([...new Set(CARDS.map(c => c.g))]);
  sel.innerHTML = groups.map(g => "<option value='" + g + "'>" + (g === "all" ? "Усі групи" : gi(g)) + "</option>").join("");
  sel.onchange = () => { group = sel.value; rebuild(); };
  document.getElementById("m1").onclick = () => setMode(1);
  document.getElementById("m2").onclick = () => setMode(2);
}
function setMode(m) {
  mode = m;
  document.getElementById("m1").classList.toggle("on", m === 1);
  document.getElementById("m2").classList.toggle("on", m === 2);
  flipped = false; render();
}

function progress() {
  const p = pool(), n = p.filter(mastered).length;
  document.getElementById("fill").style.width = (100 * n / p.length) + "%";
  document.getElementById("st").textContent = "Вивчено " + n + " з " + p.length + " · у черзі " + queue.length + (cur ? " +1" : "") + ". Картка вивчена, коли ви двічі поспіль відповіли «Знаю».";
}

function esc(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function refs(c) {
  const text = [c.t, c.q, c.d, c.m, c.a, c.ex, c.cap].filter(Boolean).join(" ");
  const found = GLOSSARY.filter(g => new RegExp(g[0]).test(text)).slice(0, 6);
  if (!found.length) return "";
  return "<div class='refs'><b>🔗 Що це за слова</b><ul>" + found.map(g => "<li><b>" + g[1] + "</b>: " + g[2] + " <a href='" + g[3] + "' target='_blank' rel='noopener'>документація</a></li>").join("") + "</ul></div>";
}

function body(c) {
  return (c.ic ? "<div class='pic'><span class='big'>" + c.ic + "</span><span class='cap'>" + c.cap + "</span></div>" : "") + (c.why ? "<p class='why'><b>Навіщо так зроблено:</b> " + c.why + "</p>" : "") + (c.d ? "<p class='def'><b>Що це:</b> " + c.d + "</p>" : "") + "<p><b>Відповідь:</b> " + c.m + "</p>" + (c.a ? "<p><b>Ще для іспиту:</b> " + c.a + "</p>" : "") + (c.ex ? "<pre class='ex'>" + esc(c.ex) + "</pre>" : "") + refs(c);
}

function render() {
  const app = document.getElementById("app");
  progress();
  if (!cur) {
    app.innerHTML = "<div class='done'><h2>Усі картки цієї групи вивчено</h2><p>Можна обрати іншу групу або почати спочатку.</p><div class='btns'><button class='small' id='again'>Скинути прогрес групи</button></div></div>";
    document.getElementById("again").onclick = () => { pool().forEach(c => delete store.streak[key(c)]); save(); rebuild(); };
    return;
  }
  let html = "";
  if (!flipped) {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    if (mode === 1) html += "<div class='term q'>" + (cur.q || cur.t) + "</div><div class='hint'>Згадайте відповідь, потім клацніть, щоб перевернути.</div>";
    else html += "<div class='back'>" + body(cur) + "</div><div class='hint'>Яке питання це відповідає? Клацніть, щоб перевернути.</div>";
    html += "</div>";
  } else {
    html += "<div class='card' id='card'><div class='group'>" + gi(cur.g) + "</div>";
    html += "<div class='term q'>" + (cur.q || cur.t) + "</div>";
    html += "<div class='back'>" + (cur.lit ? "<div class='lit'>Дослівно: " + cur.lit + "</div>" : "") + body(cur);
    if (cur.tip) html += "<div class='tip'>Щоб запам'ятати: " + cur.tip + "</div>";
    html += "</div></div>";
    html += "<div class='btns'><button class='no' id='no'>Ще ні</button><button class='know' id='yes'>Знаю</button></div>";
  }
  app.innerHTML = html;
  document.getElementById("card").onclick = () => { if (!flipped) { flipped = true; render(); } };
  if (flipped) {
    document.getElementById("yes").onclick = () => { store.streak[key(cur)] = streak(cur) + 1; save(); if (!mastered(cur)) queue.push(cur); next(); };
    document.getElementById("no").onclick = () => { store.streak[key(cur)] = 0; save(); queue.splice(Math.min(3, queue.length), 0, cur); next(); };
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (cur && !flipped) { flipped = true; render(); } }
  else if (flipped && e.key === "ArrowRight") document.getElementById("yes").click();
  else if (flipped && e.key === "ArrowLeft") document.getElementById("no").click();
});

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#ffffff");
  tg.setBackgroundColor("#f7f5f0");
  tg.BackButton.show();
  tg.BackButton.onClick(() => { location.href = "claude-hub.html"; });
}

setup();
rebuild();
</script>
</body>
